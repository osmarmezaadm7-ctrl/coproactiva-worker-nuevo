      { id: 'n-rut',       lbl: 'RUT comunidad',     tipo: 'text',   ph: '76.XXX.XXX-X' },
      { id: 'n-unidades',  lbl: 'Unidades',          tipo: 'number', ph: '0' },
      { id: 'n-honorario', lbl: 'Honorario ($)',     tipo: 'number', ph: '0' },
      { id: 'n-modalidad', lbl: 'Modalidad',         tipo: 'select', opts: ['Integral', 'Nueva', 'Auditoria'] },
      { id: 'n-contacto',  lbl: 'Contacto comit\u00E9', tipo: 'text', ph: 'Nombre completo' },
      { id: 'n-telefono',  lbl: 'Tel\u00E9fono',     tipo: 'tel',    ph: '+56 9...' },
      { id: 'n-inicio',    lbl: 'Inicio contrato',   tipo: 'text',   ph: 'DD/MM/AAAA' },
      { id: 'n-renovacion', lbl: 'Renovaci\u00F3n',  tipo: 'text',   ph: 'DD/MM/AAAA' }
    ];

    campos.forEach(function(c) {
      var fg = document.createElement('div');
      fg.className = 'form-group' + (c.full ? ' form-full' : '');
      var lbl = document.createElement('label');
      lbl.textContent = c.lbl;
      fg.appendChild(lbl);
      var inp;
      if (c.tipo === 'select') {
        inp = document.createElement('select');
        inp.id = c.id;
        c.opts.forEach(function(o) {
          var opt = document.createElement('option');
          opt.value = o; opt.textContent = o;
          inp.appendChild(opt);
        });
      } else {
        inp = document.createElement('input');
        inp.type = c.tipo;
        inp.id = c.id;
        inp.placeholder = c.ph || '';
      }
      fg.appendChild(inp);
      grid.appendChild(fg);
    });
    box.appendChild(grid);

    var errDiv = document.createElement('div');
    errDiv.className = 'form-error';
    errDiv.style.display = 'none';
    box.appendChild(errDiv);

    var btnGuardar = document.createElement('button');
    btnGuardar.className = 'btn-guardar';
    btnGuardar.textContent = 'Crear comunidad';
    box.appendChild(btnGuardar);

    overlay.appendChild(box);
    document.body.appendChild(overlay);

    var cerrar = function() { overlay.remove(); };
    btnCerrar.addEventListener('click', cerrar);
    overlay.addEventListener('click', function(e) { if (e.target === overlay) cerrar(); });

    btnGuardar.addEventListener('click', function() {
      var nombre    = document.getElementById('n-nombre').value.trim();
      var direccion = document.getElementById('n-direccion').value.trim();
      var comuna    = document.getElementById('n-comuna').value.trim();
      if (!nombre || !direccion || !comuna) {
        errDiv.textContent = 'Nombre, direcci\u00F3n y comuna son obligatorios.';
        errDiv.style.display = 'block';
        return;
      }
      btnGuardar.disabled = true;
      btnGuardar.textContent = 'Creando\u2026';
      errDiv.style.display = 'none';

      var datos = {
        action:               'crearComunidad',
        nombre:               nombre,
        direccion:            direccion,
        comuna:               comuna,
        rut:                  document.getElementById('n-rut').value.trim(),
        unidades:             document.getElementById('n-unidades').value || 0,
        honorario:            document.getElementById('n-honorario').value || 0,
        modalidad:            document.getElementById('n-modalidad').value,
        contactoNombre:       document.getElementById('n-contacto').value.trim(),
        contactoTelefono:     document.getElementById('n-telefono').value.trim(),
        fechaInicioContrato:  document.getElementById('n-inicio').value.trim(),
        fechaRenovacion:      document.getElementById('n-renovacion').value.trim()
      };

      api('/comunidades', 'POST', datos).then(function(resp) {
        if (resp.ok && resp.data && resp.data.ok) {
          // Feedback visual de éxito
          btnGuardar.textContent = '\u2713 Comunidad creada';
          btnGuardar.style.background = 'var(--co-green)';
          // Cerrar modal y refrescar listado sin recargar página
          setTimeout(function() {
            overlay.remove();
            _recargarListado();
          }, 900);
        } else {
          errDiv.textContent = (resp.data && resp.data.error) || resp.error || 'Error al crear';
          errDiv.style.display = 'block';
          btnGuardar.disabled = false;
          btnGuardar.textContent = 'Crear comunidad';
        }
      }).catch(function(err) {
        errDiv.textContent = 'Error de conexi\u00F3n: ' + err.message;
        errDiv.style.display = 'block';
        btnGuardar.disabled = false;
        btnGuardar.textContent = 'Crear comunidad';
      });
    });
  }

  // ── MODAL EDITAR ──────────────────────────────────────────────
  function abrirModalEditar(c) {
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    var box = document.createElement('div');
    box.className = 'modal-box';

    var btnCerrar = document.createElement('button');
    btnCerrar.className = 'modal-close';
    btnCerrar.textContent = '\u00D7';
    box.appendChild(btnCerrar);

    var ey = document.createElement('div');
    ey.className = 'modal-eyebrow';
    ey.textContent = 'Editar comunidad';
    box.appendChild(ey);

    var tt = document.createElement('div');
    tt.className = 'modal-titulo';
    tt.textContent = c.nombre || '';
    box.appendChild(tt);

    var st = document.createElement('div');
    st.className = 'modal-subtitulo';
    st.textContent = 'Modifica los datos y guarda los cambios';
    box.appendChild(st);

    var grid = document.createElement('div');
    grid.className = 'form-grid';

    var vals = {
      'e-nombre':     c.nombre || '',
      'e-direccion':  c.direccion || '',
      'e-comuna':     c.comuna || '',
      'e-rut':        c.rut || '',
      'e-unidades':   c.unidades || '',
      'e-honorario':  c.honorario || '',
      'e-modalidad':  c.modalidad || 'Integral',
      'e-contacto':   c.contactoNombre || '',
      'e-telefono':   c.contactoTelefono || '',
      'e-inicio':     c.fechaInicioContrato || '',
      'e-renovacion': c.fechaRenovacion || '',
      'e-estado':     c.estado || 'activo'
    };

    var camposE = [
      { id: 'e-nombre',    lbl: 'Nombre *',           tipo: 'text',   full: true },
      { id: 'e-direccion', lbl: 'Direcci\u00F3n *',    tipo: 'text' },
      { id: 'e-comuna',    lbl: 'Comuna *',            tipo: 'text' },
      { id: 'e-rut',       lbl: 'RUT comunidad',       tipo: 'text' },
      { id: 'e-unidades',  lbl: 'Unidades',            tipo: 'number' },
      { id: 'e-honorario', lbl: 'Honorario ($)',       tipo: 'number' },
      { id: 'e-modalidad', lbl: 'Modalidad',           tipo: 'select', opts: ['Integral', 'Nueva', 'Auditoria'] },
      { id: 'e-contacto',  lbl: 'Contacto comit\u00E9', tipo: 'text' },
      { id: 'e-telefono',  lbl: 'Tel\u00E9fono',       tipo: 'tel' },
      { id: 'e-inicio',    lbl: 'Inicio contrato',     tipo: 'text' },
      { id: 'e-renovacion', lbl: 'Renovaci\u00F3n',    tipo: 'text' },
      { id: 'e-estado',    lbl: 'Estado',              tipo: 'select', opts: ['activo', 'inactivo'] }
    ];

    camposE.forEach(function(campo) {
      var fg = document.createElement('div');
      fg.className = 'form-group' + (campo.full ? ' form-full' : '');
      var lbl = document.createElement('label');
      lbl.textContent = campo.lbl;
      fg.appendChild(lbl);
      var inp;
      if (campo.tipo === 'select') {
        inp = document.createElement('select');
        inp.id = campo.id;
        campo.opts.forEach(function(o) {
          var opt = document.createElement('option');
          opt.value = o;
          opt.textContent = o;
          if (vals[campo.id] === o) opt.selected = true;
          inp.appendChild(opt);
        });
      } else {
        inp = document.createElement('input');
        inp.type = campo.tipo;
        inp.id = campo.id;
        inp.value = vals[campo.id];
      }
      fg.appendChild(inp);
      grid.appendChild(fg);
    });
    box.appendChild(grid);

    var errDiv = document.createElement('div');
    errDiv.className = 'form-error';
    errDiv.style.display = 'none';
    box.appendChild(errDiv);

    var btnGuardar = document.createElement('button');
    btnGuardar.className = 'btn-guardar';
    btnGuardar.textContent = 'Guardar cambios';
    box.appendChild(btnGuardar);

    overlay.appendChild(box);
    document.body.appendChild(overlay);

    var cerrar = function() { overlay.remove(); };
    btnCerrar.addEventListener('click', cerrar);
    overlay.addEventListener('click', function(e) { if (e.target === overlay) cerrar(); });

    btnGuardar.addEventListener('click', function() {
      var nombre    = document.getElementById('e-nombre').value.trim();
      var direccion = document.getElementById('e-direccion').value.trim();
      var comuna    = document.getElementById('e-comuna').value.trim();
      if (!nombre || !direccion || !comuna) {
        errDiv.textContent = 'Nombre, direcci\u00F3n y comuna son obligatorios.';
        errDiv.style.display = 'block';
        return;
      }
      btnGuardar.disabled = true;
      btnGuardar.textContent = 'Guardando\u2026';
      errDiv.style.display = 'none';

      var datos = {
        action:               'editarComunidad',
        id:                   c.id,
        nombre:               nombre,
        direccion:            direccion,
        comuna:               comuna,
        rut:                  document.getElementById('e-rut').value.trim(),
        unidades:             document.getElementById('e-unidades').value || 0,
        honorario:            document.getElementById('e-honorario').value || 0,
        modalidad:            document.getElementById('e-modalidad').value,
        contactoNombre:       document.getElementById('e-contacto').value.trim(),
        contactoTelefono:     document.getElementById('e-telefono').value.trim(),
        fechaInicioContrato:  document.getElementById('e-inicio').value.trim(),
        fechaRenovacion:      document.getElementById('e-renovacion').value.trim(),
        estado:               document.getElementById('e-estado').value
      };

      api('/comunidades', 'POST', datos).then(function(resp) {
        if (resp.ok && resp.data && resp.data.ok) {
          // Actualizar objeto en memoria
          Object.assign(c, datos);
          // Feedback visual de éxito
          btnGuardar.textContent = '\u2713 Cambios guardados';
          btnGuardar.style.background = 'var(--co-green)';
          setTimeout(function() {
            overlay.remove();
            abrirFicha(c);
          }, 900);
        } else {
          errDiv.textContent = (resp.data && resp.data.error) || resp.error || 'Error al guardar';
          errDiv.style.display = 'block';
          btnGuardar.disabled = false;
          btnGuardar.textContent = 'Guardar cambios';
        }
      }).catch(function(err) {
        errDiv.textContent = 'Error de conexi\u00F3n: ' + err.message;
        errDiv.style.display = 'block';
        btnGuardar.disabled = false;
        btnGuardar.textContent = 'Guardar cambios';
      });
    });
  }

  // ── RECARGA LISTADO sin recargar página ─────────────────────
  function _recargarListado() {
    var root = document.getElementById('com-root');
    if (root) {
      root.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--co-mute);font-size:13px;font-weight:600;gap:8px">'
        + '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">'
        + '<path d="M13.5 8A5.5 5.5 0 1 1 8 2.5"/><path d="M13.5 2.5v3h-3"/></svg>'
        + 'Actualizando…</div>';
    }
    api('/comunidades').then(function(resp) {
      var lista = null;
      if (resp.ok) {
        if (Array.isArray(resp.data)) lista = resp.data;
        else if (resp.data && Array.isArray(resp.data.data)) lista = resp.data.data;
        else if (resp.data && resp.data.ok && Array.isArray(resp.data.data)) lista = resp.data.data;
      }
      if (lista === null) { mostrarError('Error al actualizar listado'); return; }
      _comunidades = lista;
      window._comunidadesKpis = {
        activas: _comunidades.filter(function(c) { return c.estado === 'activo'; }).length,
        alertas: 0,
        venc:    0
      };
      if (typeof actualizarKpisComunidades === 'function') actualizarKpisComunidades();
      renderListado();
    }).catch(function(err) {
      mostrarError('Error de conexión: ' + err.message);
    });
  }

  function mostrarError(msg) {
    var root = document.getElementById('com-root');
    root.innerHTML = '';
    var div = document.createElement('div');
    div.className = 'com-error';
    div.textContent = 'Error al cargar Comunidades: ' + msg;
    root.appendChild(div);
  }

  init();

})();
</script>
