    font-weight: 800;

  .com-kpi-val.crit { color: var(--co-red); }

    color: var(--co-mute);
    margin-top: 3px;

    text-transform: uppercase;

    font-size: 11px;
    color: var(--co-orange);
    font-weight: 600;

    font-weight: 600;
    color: var(--co-ink);

  .com-alert-cat {
    font-size: 10px;

  .com-alert-dias {
    font-size: 11px;
    font-weight: 700;

  .dias-r { color: var(--co-red); }
  .dias-a { color: var(--co-amber); }
  .dias-v { color: var(--co-green); }

  /* ── Eventos ── */
  .com-evento-row {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 9px 0;
    border-bottom: 1px solid var(--co-line-soft);
  }
  .com-evento-row:last-child { border-bottom: none; }
  .com-evento-fecha {
    width: 38px;
    text-align: center;
    flex-shrink: 0;
  }
  .com-evento-dia {
    font-size: 17px;
    font-weight: 800;

  .com-evento-mes {
    font-size: 9px;

  .com-evento-nombre {
    font-size: 12px;
    font-weight: 700;
    color: var(--co-ink);

  }
  .com-evento-sub {
    font-size: 11px;
    color: var(--co-mute);
    margin-top: 1px;

  .co-pill {
    font-size: 10px;

  /* ── Documentos ── */
  .com-doc-cat-hdr {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--co-line);
    margin-top: 14px;
    margin-bottom: 4px;
  }
  .com-doc-cat-hdr:first-child { margin-top: 0; }
  .com-doc-cat-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .com-doc-cat-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--co-ink);
    letter-spacing: 0.04em;
    text-transform: uppercase;

  }
  .com-doc-cat-sub {
    font-size: 11px;
    color: var(--co-mute);

  .com-doc-row:hover { background: var(--co-cream); }
  .com-doc-row:last-child { border-bottom: none; }
  .com-doc-nombre {
    font-size: 12px;
    font-weight: 600;
    color: var(--co-ink);
    flex: 1;
    line-height: 1.3;
    min-width: 0;
  }
  .com-doc-fecha {
    font-size: 11px;
    color: var(--co-mute);
    min-width: 80px;
    text-align: right;
  }
  @media (max-width: 600px) {
    .com-doc-fecha { display: none; }
    .com-doc-dias  { display: none; }
    .com-doc-row   { gap: 7px; padding: 8px 12px; }
    .com-doc-nombre { font-size: 12px; }
  }
  .com-doc-link {
    font-size: 11px;
    color: var(--co-orange);
    font-weight: 700;
    cursor: pointer;
    background: none;
    border: none;
    font-family: var(--co-font);
    padding: 0;
    display: flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
  }
  .com-doc-link:hover { opacity: 0.75; }

  /* ── Directorio table ── */
  .com-dir-wrap {
    overflow-x: auto;
    overflow-y: auto;
    max-height: calc(100vh - 320px);
    border: 1px solid var(--co-line);
    border-radius: var(--co-r-lg);
  }
  .com-dir-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 560px;
  }
  .com-dir-table thead { position: sticky; top: 0; z-index: 10; }
  .com-dir-table th {
    font-size: 10px;
    font-weight: 700;
    color: var(--co-mute);
    text-align: left;
    padding: 7px 10px;
    border-bottom: 1px solid var(--co-line);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
    background: var(--co-cream-deep);
  }
  .com-dir-table td {
    font-size: 12px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--co-line-soft);
    color: var(--co-ink);
  }
  .com-dir-table tr:last-child td { border-bottom: none; }
  .com-dir-table tr:hover td { background: var(--co-cream); }

    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 20px;
  }
  .t-dep  { background: var(--co-blue-soft);   color: var(--co-blue); }
  .t-est  { background: var(--co-cream-deep);  color: var(--co-mute); }
  .t-bod  { background: var(--co-amber-soft);  color: var(--co-amber); }
  .t-loc  { background: var(--co-green-soft);  color: var(--co-green); }

  /* ── Contrato ── */
  .com-datos-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border: 1px solid var(--co-line);
    border-radius: var(--co-r-lg);
    overflow: hidden;

  .com-dato {
    padding: 10px 14px;
    border-bottom: 1px solid var(--co-line);
    border-right: 1px solid var(--co-line);
  }
  .com-dato:nth-child(2n) { border-right: none; }
  .com-dato:nth-last-child(-n+2) { border-bottom: none; }
  .com-dato-lbl {
    font-size: 9px;
    color: var(--co-mute);
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .com-dato-val {
    font-size: 13px;
    font-weight: 600;
    color: var(--co-ink);
  }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26,23,20,0.55);
    backdrop-filter: blur(4px);
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-box {
    background: var(--co-surface);
    border-radius: var(--co-r-lg);
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 32px;
    position: relative;
    box-shadow: var(--co-shadow-lg);
  }
  @media (max-width: 767px) {
    .modal-overlay { padding: 0; align-items: flex-end; }
    .modal-box { border-radius: var(--co-r-lg) var(--co-r-lg) 0 0; max-height: 92vh; padding: 24px 20px 36px; }
  }
  .modal-close {
    position: absolute;
    top: 18px; right: 18px;
    background: var(--co-cream);
    border: 1px solid var(--co-line);
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    color: var(--co-ink-2);
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.13s, color 0.13s;
    font-family: var(--co-font);
  }
  .modal-close:hover { background: var(--co-orange-soft); color: var(--co-orange); }
  .modal-eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--co-orange);
    margin-bottom: 4px;
  }
  .modal-titulo {
    font-size: 22px;
    font-weight: 800;
    color: var(--co-ink);
    letter-spacing: -0.025em;
    line-height: 1.15;
    margin-bottom: 6px;
    padding-right: 44px;

  .modal-subtitulo {
    font-size: 13px;
    color: var(--co-ink-3);
    margin-bottom: 24px;
    font-weight: 500;
  }

    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;

    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--co-mute);
    margin-bottom: 6px;
  }
  .form-group input,
  .form-group select {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--co-line);
    border-radius: var(--co-r-md);
    font-family: var(--co-font);
    font-size: 13px;
    font-weight: 500;
    color: var(--co-ink);
    background: var(--co-surface);
    box-sizing: border-box;
    min-height: 44px;
    transition: border-color 0.13s;
  }
  .form-group input:focus,
  .form-group select:focus { outline: none; border-color: var(--co-orange); }
  .form-group input::placeholder { color: var(--co-mute); }
  .form-full { grid-column: 1 / -1; }
  .btn-guardar {
    background: var(--co-orange);
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: var(--co-r-md);
    font-family: var(--co-font);

  // ── Helpers generales ─────────────────────────────────────
  function api(path, method, body) {
    method = method || 'GET';
    var opts = {
      method: method,
      headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' }
    };
    if (body) opts.body = JSON.stringify(body);
    return fetch(WORKER_URL + path, opts).then(function(r) { return r.json(); });
  }

  function formatFecha(f) {
    if (!f) return '\u2014';
    var d = new Date(f);
    if (isNaN(d)) return f;
    return d.getDate() + ' ' + MESES[d.getMonth()] + ' ' + d.getFullYear();
  }

  function formatMiles(n) {
    if (!n && n !== 0) return '\u2014';
    var v = parseFloat(n);
    if (isNaN(v)) return '\u2014';
    if (v >= 1000000) return '$' + (v / 1000000).toFixed(1) + 'M';
    if (v >= 1000)    return '$' + Math.round(v / 1000) + 'k';
    return '$' + v;
  }

  function diasHasta(fecha) {
    if (!fecha) return null;
    var hoy = new Date();
    hoy.setHours(0,0,0,0);
    var d = new Date(fecha);
    d.setHours(0,0,0,0);
    return Math.round((d - hoy) / 86400000);
  }

  function semColorDias(dias) {
    if (dias === null) return 'gris';
    if (dias < 0)   return 'rojo';
    if (dias <= 60) return 'amarillo';
    return 'verde';
  }

  function badgeModalidad(m) {
    if (!m) return '';
    var cls = m === 'Integral' ? 'badge-int' : m === 'Nueva' ? 'badge-nva' : 'badge-aud';
    var span = document.createElement('span');
    span.className = 'com-badge ' + cls;
    span.textContent = m;
    return span;
  }

  function _parsearInstalaciones(raw) {
    if (!raw) return null;
    try { return typeof raw === 'string' ? JSON.parse(raw) : raw; }
    catch (e) { return null; }
  }

  function _parsearCatalogoCustom(raw) {
    if (!raw) return { eliminados: {}, renombrados: {}, extras: [] };
    try {
      var parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
      return {
        eliminados:  parsed.eliminados  || {},
        renombrados: parsed.renombrados || {},
        extras:      parsed.extras      || []
      };
    } catch (e) { return { eliminados: {}, renombrados: {}, extras: [] }; }
  }

  function _catalogoFiltrado(instalaciones, custom) {
    var inst = instalaciones || {};
    var c    = custom || { eliminados: {}, renombrados: {}, extras: [] };
    var excluidos = {};
    Object.keys(DOCS_POR_INSTALACION).forEach(function(key) {
      if (!inst[key]) {
        DOCS_POR_INSTALACION[key].forEach(function(tipo) { excluidos[tipo] = true; });
      }
    });
    Object.keys(c.eliminados).forEach(function(tipo) {
      if (c.eliminados[tipo]) excluidos[tipo] = true;
    });
    var resultado = {};
    Object.keys(CATALOGO_DOCS).forEach(function(cat) {
      var tipos = CATALOGO_DOCS[cat]
        .filter(function(t) { return !excluidos[t]; })
        .map(function(t) { return c.renombrados[t] ? c.renombrados[t] : t; });
      if (tipos.length > 0) resultado[cat] = tipos;
    });
    c.extras.forEach(function(extra) {
      if (!extra.nombre || !extra.categoria) return;
      if (!resultado[extra.categoria]) resultado[extra.categoria] = [];
      resultado[extra.categoria].push(extra.nombre);
      if (extra.vence && DOCS_CON_VENCIMIENTO.indexOf(extra.nombre) === -1) {
        DOCS_CON_VENCIMIENTO.push(extra.nombre);
      }
    });
    return resultado;
  }

    api('/comunidades').then(function(resp) {
      var lista = null;
      if (resp.ok) {
        if (Array.isArray(resp.data)) lista = resp.data;
        else if (resp.data && Array.isArray(resp.data.data)) lista = resp.data.data;
        else if (resp.data && resp.data.ok && Array.isArray(resp.data.data)) lista = resp.data.data;
      }
      if (lista === null) {
        var errMsg = (resp.data && resp.data.error) || resp.error || 'Error al cargar comunidades';
        mostrarError(errMsg);
        return;
      }
      _comunidades = lista;
      window._comunidadesKpis = {
        activas: _comunidades.filter(function(c) { return c.estado === 'activo'; }).length,

        venc:    0

      if (typeof actualizarKpisComunidades === 'function') actualizarKpisComunidades();

  function filtrarYRenderRows(busqueda) {
    var lista = document.getElementById('com-lista');
    if (!lista) return;
    lista.innerHTML = '';

    var filtradas = _comunidades.filter(function(c) {
      if (_filtroActivo !== 'todas') {
        if (_filtroActivo === 'activo' || _filtroActivo === 'inactivo') {
          if (c.estado !== _filtroActivo) return false;
        } else {
          if (c.modalidad !== _filtroActivo) return false;
        }
      }
      if (busqueda) {
        var q = busqueda.toLowerCase();
        var campo = ((c.nombre || '') + ' ' + (c.comuna || '') + ' ' + (c.direccion || '')).toLowerCase();
        if (campo.indexOf(q) === -1) return false;
      }
      return true;
    });

    if (filtradas.length === 0) {
      var vacio = document.createElement('div');
      vacio.className = 'com-vacio';
      vacio.textContent = 'No se encontraron comunidades.';
      lista.appendChild(vacio);

  // ── TAB CONTRATO ──────────────────────────────────────────────
  function renderTabContrato(tc, c) {
    // Scroll wrapper con header sticky del tab
    var scrollWrap = document.createElement('div');
    scrollWrap.style.cssText = 'overflow-y:auto;max-height:calc(100vh - 280px);padding:4px 2px 20px';
    // ── helpers internos ─────────────────────────────────────
    function seccion(titulo, btnLabel, btnFn) {
      var wrap = document.createElement('div');
      wrap.style.marginBottom = '18px';
      var hdr = document.createElement('div');
      hdr.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:10px';
      var lbl = document.createElement('span');
      lbl.style.cssText = 'font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--co-mute)';
      lbl.textContent = titulo;
      hdr.appendChild(lbl);
      if (btnLabel && btnFn) {
        var btn = document.createElement('button');
        btn.className = 'btn-ghost';
        btn.style.fontSize = '11px';
        btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 2.5a1.414 1.414 0 0 1 2 2L5 13H3v-2Z"/></svg> ' + btnLabel;
        btn.addEventListener('click', btnFn);
        hdr.appendChild(btn);
      }
      wrap.appendChild(hdr);
      return wrap;
    }

    function datoGrid(pares) {
      var grid = document.createElement('div');
      grid.className = 'com-datos-grid';
      pares.forEach(function(p) {
        var d = document.createElement('div');
        d.className = 'com-dato';
        if (p.full) d.style.gridColumn = '1 / -1';
        var l = document.createElement('div'); l.className = 'com-dato-lbl'; l.textContent = p.lbl;
        var v = document.createElement('div'); v.className = 'com-dato-val'; v.textContent = p.val || '\u2014';
        if (p.color) v.style.color = p.color;
        d.appendChild(l); d.appendChild(v);
        grid.appendChild(d);
      });
      return grid;
    }

    // ── Sección 1: Datos generales ────────────────────────────
    var s1 = seccion('Datos generales', null, null);
    s1.appendChild(datoGrid([
      { lbl: 'RUT',         val: c.rut || '\u2014' },
      { lbl: 'Estado',      val: c.estado === 'activo' ? 'Activo' : 'Inactivo', color: c.estado === 'activo' ? 'var(--co-green)' : 'var(--co-mute)' },
      { lbl: 'Direcci\u00F3n', val: c.direccion || '\u2014' },
      { lbl: 'Comuna',      val: c.comuna || '\u2014' }
    ]));

    // Contadores de unidades — leídos de _dirData si están disponibles
    var unidades  = (_dirData && _dirData.comunidadId === c.id) ? _dirData.unidades : [];
    var nDeptos   = unidades.filter(function(u) { var t = String(u.tipoUnidad||'').toUpperCase(); return t==='DEPTO'||t==='CASA'; }).length;
    var nEstac    = unidades.filter(function(u) { var t = String(u.tipoUnidad||'').toUpperCase(); return t==='ESTAC'||t==='ESTACIONAMIENTO'; }).length;
    var nBodega   = unidades.filter(function(u) { var t = String(u.tipoUnidad||'').toUpperCase(); return t==='BODEGA'; }).length;
    var setCop    = {}; unidades.forEach(function(u){ if(u.idCopropietario) setCop[u.idCopropietario]=true; });
    var nCoprop   = Object.keys(setCop).length;

    var contWrap = document.createElement('div');
    contWrap.style.cssText = 'border:1px solid var(--co-line);border-radius:var(--co-r-md);overflow:hidden;margin-top:8px';
    var contHdr = document.createElement('div');
    contHdr.style.cssText = 'padding:8px 12px;border-bottom:1px solid var(--co-line);background:var(--co-cream-deep)';
    var contHdrLbl = document.createElement('div');
    contHdrLbl.style.cssText = 'font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--co-mute)';
    contHdrLbl.textContent = 'Unidades registradas';
    contWrap.appendChild(contHdr); contHdr.appendChild(contHdrLbl);

    var contGrid = document.createElement('div');
    contGrid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;';
    // Si _dirData aún no tiene datos de esta comunidad, pedirlos ahora
    function _actualizarContadores(unidades) {
      var nd = unidades.filter(function(u){ var t=String(u.tipoUnidad||'').toUpperCase(); return t==='DEPTO'||t==='CASA'; }).length;
      var ne = unidades.filter(function(u){ var t=String(u.tipoUnidad||'').toUpperCase(); return t==='ESTAC'||t==='ESTACIONAMIENTO'; }).length;
      var nb = unidades.filter(function(u){ var t=String(u.tipoUnidad||'').toUpperCase(); return t==='BODEGA'; }).length;
      var sc = {}; unidades.forEach(function(u){ if(u.idCopropietario) sc[u.idCopropietario]=true; });
      var nc = Object.keys(sc).length;
      var ids = ['ficha-cnt-deptos-'+c.id,'ficha-cnt-estac-'+c.id,'ficha-cnt-bodegas-'+c.id,'ficha-cnt-coprop-'+c.id];
      var vals = [nd, ne, nb, nc];
      ids.forEach(function(id,i){ var el=document.getElementById(id); if(el) el.textContent=vals[i]; });
    }
    if (unidades.length === 0 && c.id) {
      api('/directorio?comunidadId=' + c.id).then(function(resp){
        var u = [];
        if(resp.ok){ if(Array.isArray(resp.data)) u=resp.data; else if(resp.data&&Array.isArray(resp.data.data)) u=resp.data.data; }
        _actualizarContadores(u);
      }).catch(function(){});
    }
    var contadores = [
      { ico: 'ti-building', lbl: 'Deptos / Casas', val: unidades.length > 0 ? nDeptos : '\u2014', id: 'ficha-cnt-deptos-'+c.id },
      { ico: 'ti-car',      lbl: 'Estacionam.',    val: unidades.length > 0 ? nEstac  : '\u2014', id: 'ficha-cnt-estac-'+c.id },
      { ico: 'ti-archive',  lbl: 'Bodegas',        val: unidades.length > 0 ? nBodega : '\u2014', id: 'ficha-cnt-bodegas-'+c.id },
      { ico: 'ti-users',    lbl: 'Copropietarios', val: unidades.length > 0 ? nCoprop : '\u2014', id: 'ficha-cnt-coprop-'+c.id }
    ];
    contadores.forEach(function(ct, i) {
      var cell = document.createElement('div');
      var borderR = (i % 2 === 0) ? 'border-right:1px solid var(--co-line);' : '';
      var borderB = (i < 2)       ? 'border-bottom:1px solid var(--co-line);' : '';
      cell.style.cssText = 'padding:10px 14px;display:flex;align-items:center;gap:10px;' + borderR + borderB;
      var icoEl = document.createElement('i');
      icoEl.className = 'ti ' + ct.ico;
      icoEl.style.cssText = 'font-size:18px;color:var(--co-mute);flex-shrink:0';
      icoEl.setAttribute('aria-hidden','true');
      var info = document.createElement('div');
      var valEl = document.createElement('div');
      valEl.style.cssText = 'font-size:18px;font-weight:700;color:var(--co-ink);letter-spacing:-0.02em;line-height:1';
      valEl.textContent = ct.val;
      if (ct.id) valEl.id = ct.id;
      var lblEl = document.createElement('div');
      lblEl.style.cssText = 'font-size:10px;color:var(--co-mute);font-weight:600;margin-top:2px';
      lblEl.textContent = ct.lbl;
      info.appendChild(valEl); info.appendChild(lblEl);
      cell.appendChild(icoEl); cell.appendChild(info);
      contGrid.appendChild(cell);
    });
    contWrap.appendChild(contGrid);
    s1.appendChild(contWrap);
    scrollWrap.appendChild(s1);

    // ── Sección 2: Contrato ───────────────────────────────────
    var s2 = seccion('Contrato', null, null);
    s2.appendChild(datoGrid([
      { lbl: 'Modalidad',           val: c.modalidad || '\u2014' },
      { lbl: 'Honorario',           val: formatMiles(c.honorario) },
      { lbl: 'Inicio contrato',     val: formatFecha(c.fechaInicioContrato) },
      { lbl: 'Renovaci\u00F3n',    val: formatFecha(c.fechaRenovacion) },
      { lbl: 'Contacto comit\u00E9', val: c.contactoNombre || '\u2014' },
      { lbl: 'Tel\u00E9fono',      val: c.contactoTelefono || '\u2014' }
    ]));
    scrollWrap.appendChild(s2);

    // ── Sección 3: Instalaciones ──────────────────────────────
    var inst = _parsearInstalaciones(c.instalaciones) || {};
    var hayInst = Object.keys(inst).length > 0;

    var s3 = seccion('Instalaciones y equipamientos', null, null);

    if (!hayInst) {
      var aviso = document.createElement('div');
      aviso.style.cssText = 'background:var(--co-amber-soft);border:1px solid var(--co-line);border-radius:var(--co-r-md);padding:12px 14px;font-size:12px;font-weight:600;color:var(--co-amber);display:flex;align-items:center;gap:8px';
      aviso.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 5v4M8 11v1"/><circle cx="8" cy="8" r="6"/></svg>No configuradas a\u00FAn';
      s3.appendChild(aviso);
    } else {
      var instList = document.createElement('div');
      instList.style.cssText = 'display:flex;flex-direction:column;gap:5px';
      INSTALACIONES_OPTS.forEach(function(opt) {
        var tiene = !!inst[opt.key];
        var item = document.createElement('div');
        item.style.cssText = 'display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:var(--co-r-md);font-size:12px;font-weight:' + (tiene ? '600' : '500') + ';'
          + (tiene
            ? 'border:1px solid var(--co-green-soft);background:var(--co-green-soft);color:var(--co-green)'
            : 'border:1px solid var(--co-line);background:var(--co-cream-deep);color:var(--co-mute)');
        var ico = document.createElement('i');
        ico.className = 'ti ' + (tiene ? 'ti-check' : 'ti-minus');
        ico.style.cssText = 'font-size:13px;flex-shrink:0';
        ico.setAttribute('aria-hidden','true');
        item.appendChild(ico);
        item.appendChild(document.createTextNode(opt.label));
        instList.appendChild(item);
      });
      s3.appendChild(instList);
    }
    scrollWrap.appendChild(s3);
    tc.appendChild(scrollWrap);
  }

        + '<span>M\u00F3dulo de incidencias pr\u00F3ximamente</span>';

  // ── TAB DOCUMENTOS ────────────────────────────────────────────
  function cargarDocumentos(comunidadId) {
    api('/documentos?comunidadId=' + comunidadId).then(function(resp) {
      var tc = document.getElementById('tc-documentos');
      if (!tc) return;
      tc.innerHTML = '';

      var docsRegistrados = [];
      if (resp.ok) {
        if (resp.data && Array.isArray(resp.data.data)) docsRegistrados = resp.data.data;
        else if (Array.isArray(resp.data)) docsRegistrados = resp.data;
      }

      // Mapa tipo → último doc registrado
      var mapaRegistrados = {};
      docsRegistrados.forEach(function(d) { mapaRegistrados[d.tipo] = d; });

      // Actualizar panel alertas en dashboard
      var altBody = document.getElementById('alt-body-' + comunidadId);
      if (altBody) {
        altBody.innerHTML = '';
        var vencidos = docsRegistrados
          .filter(function(d) { return d.semaforo === 'rojo' || d.semaforo === 'amarillo'; })
          .slice(0, 4);
        if (vencidos.length === 0) {
          var vv = document.createElement('div');
          vv.className = 'com-vacio';
          vv.style.padding = '16px 0';
          vv.textContent = 'Sin alertas activas';
          altBody.appendChild(vv);
        } else {
          vencidos.forEach(function(d) {
            var dias = diasHasta(d.fechaVencimiento);
            var row = document.createElement('div');
            row.className = 'com-alert-row';
            var icoDiv = document.createElement('div');
            icoDiv.className = 'com-alert-ico alert-ico-' + (d.semaforo === 'rojo' ? 'r' : 'a');
            icoDiv.innerHTML = '<svg viewBox="0 0 16 16"><path d="M8 3v5M8 11v1"/><circle cx="8" cy="8" r="6"/></svg>';
            var txt = document.createElement('div');
            txt.style.flex = '1';
            var n1 = document.createElement('div');
            n1.className = 'com-alert-nombre';
            n1.textContent = d.tipo || '';
            var n2 = document.createElement('div');
            n2.className = 'com-alert-cat';
            n2.textContent = d.categoria || '';
            txt.appendChild(n1); txt.appendChild(n2);
            var diasEl = document.createElement('span');
            diasEl.className = 'com-alert-dias ' + (d.semaforo === 'rojo' ? 'dias-r' : 'dias-a');
            diasEl.textContent = dias === null ? '\u2014' : dias < 0 ? 'Vencido' : dias + ' d\u00EDas';
            row.appendChild(icoDiv); row.appendChild(txt); row.appendChild(diasEl);
            altBody.appendChild(row);
          });
        }
      }

      // Obtener instalaciones de la comunidad activa
      var com = _comunidadActiva || {};
      var instalaciones = _parsearInstalaciones(com.instalaciones);

      // Sin instalaciones → aviso de configuración + preview
      if (!instalaciones) {
        _renderAvisoInstalaciones(tc, mapaRegistrados, com);
        return;
      }

      // Catálogo filtrado y render
      var custom = _parsearCatalogoCustom(com.catalogoCustom);
      var catalogo = _catalogoFiltrado(instalaciones, custom);
      _renderCatalogo(tc, catalogo, mapaRegistrados, com, custom);

    }).catch(function() {
      var tc = document.getElementById('tc-documentos');
      if (tc) {
        tc.innerHTML = '';
        var v = document.createElement('div');
        v.className = 'com-vacio';
        v.textContent = 'Error al cargar documentos.';
        tc.appendChild(v);
      }
    });
  }

  // ── Aviso instalaciones no configuradas ───────────────────────
  function _renderAvisoInstalaciones(tc, mapaRegistrados, com) {
    var aviso = document.createElement('div');
    aviso.style.cssText = 'background:var(--co-amber-soft);border:1px solid var(--co-line);border-radius:var(--co-r-lg);padding:18px 20px;margin-bottom:20px;display:flex;align-items:flex-start;gap:12px';
    var icoAviso = document.createElement('div');
    icoAviso.innerHTML = '<svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="var(--co-amber)" stroke-width="1.8" stroke-linecap="round" style="flex-shrink:0;margin-top:1px"><path d="M8 5v4M8 11v1"/><circle cx="8" cy="8" r="6"/></svg>';
    var txtAviso = document.createElement('div');
    txtAviso.style.flex = '1';
    var t1 = document.createElement('div');
    t1.style.cssText = 'font-size:13px;font-weight:700;color:var(--co-amber);margin-bottom:4px';
    t1.textContent = 'Instalaciones no configuradas';
    var t2 = document.createElement('div');
    t2.style.cssText = 'font-size:12px;color:var(--co-ink-3);margin-bottom:12px;line-height:1.5';
    t2.textContent = 'Indica qué instalaciones y equipamientos tiene esta comunidad para mostrar solo los documentos que corresponden.';
    var btnConf = document.createElement('button');
    btnConf.className = 'btn-nuevo';
    btnConf.style.fontSize = '12px';
    btnConf.textContent = 'Configurar instalaciones';
    btnConf.addEventListener('click', function() { modalInstalaciones(com); });
    txtAviso.appendChild(t1); txtAviso.appendChild(t2); txtAviso.appendChild(btnConf);
    aviso.appendChild(icoAviso); aviso.appendChild(txtAviso);
    tc.appendChild(aviso);

    // Preview del catálogo completo en gris
    var preview = document.createElement('div');
    preview.style.cssText = 'opacity:0.45;pointer-events:none';
    _renderCatalogo(preview, CATALOGO_DOCS, mapaRegistrados, com, { eliminados: {}, renombrados: {}, extras: [] });
    tc.appendChild(preview);
  }

  // ── Render catálogo documentos ────────────────────────────────
  function _renderCatalogo(tc, catalogo, mapaRegistrados, com, custom) {
    custom = custom || { eliminados: {}, renombrados: {}, extras: [] };

    // Toolbar resumen
    var toolbar = document.createElement('div');
    toolbar.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px';

    var vigentes = 0; var porVencer = 0; var vencidos = 0; var pendientes = 0;
    Object.keys(catalogo).forEach(function(cat) {
      catalogo[cat].forEach(function(tipo) {
        var d = mapaRegistrados[tipo];
        if (!d) pendientes++;
        else if (d.semaforo === 'rojo')     vencidos++;
        else if (d.semaforo === 'amarillo') porVencer++;
        else vigentes++;
      });
    });

    var pills = document.createElement('div');
    pills.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;align-items:center';
    function addPill(n, lbl, color) {
      if (n === 0) return;
      var p = document.createElement('span');
      p.style.cssText = 'display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid var(--co-line);background:var(--co-surface);color:var(--co-mute)';
      var dot = document.createElement('span');
      dot.style.cssText = 'width:7px;height:7px;border-radius:50%;background:' + color;
      p.appendChild(dot);
      p.appendChild(document.createTextNode(lbl + ' (' + n + ')'));
      pills.appendChild(p);
    }
    addPill(vigentes,  'Vigente',    'var(--co-green)');
    addPill(porVencer, 'Por vencer', 'var(--co-amber)');
    addPill(vencidos,  'Vencido',    'var(--co-red)');
    addPill(pendientes,'Pendiente',  'var(--co-mute)');

    var btnRow = document.createElement('div');
    btnRow.style.cssText = 'display:flex;gap:6px';

    var btnConf = document.createElement('button');
    btnConf.className = 'btn-ghost';
    btnConf.style.fontSize = '12px';
    btnConf.innerHTML = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2"/></svg> Instalaciones';
    btnConf.addEventListener('click', function() { modalInstalaciones(com); });

    btnRow.appendChild(btnConf);
    toolbar.appendChild(pills);
    toolbar.appendChild(btnRow);
    tc.appendChild(toolbar);

    // Contenedor con scroll — headers de categoría fijos dentro del scroll
    var scrollWrap = document.createElement('div');
    scrollWrap.style.cssText = 'overflow-y:auto;max-height:calc(100vh - 320px);border:1px solid var(--co-line);border-radius:var(--co-r-lg);';

    // Categorías
    Object.keys(catalogo).forEach(function(cat) {
      var tipos = catalogo[cat];
      var catVenc = tipos.filter(function(t) { var d = mapaRegistrados[t]; return d && d.semaforo === 'rojo'; }).length;
      var catProx = tipos.filter(function(t) { var d = mapaRegistrados[t]; return d && d.semaforo === 'amarillo'; }).length;
      var catPend = tipos.filter(function(t) { return !mapaRegistrados[t]; }).length;
      var semCat  = catVenc > 0 ? 'var(--co-red)' : catProx > 0 ? 'var(--co-amber)' : catPend > 0 ? 'var(--co-mute)' : 'var(--co-green)';
      var metaCat = catVenc > 0 ? catVenc + ' vencido(s)' : catProx > 0 ? catProx + ' por vencer' : catPend > 0 ? catPend + ' pendiente(s)' : 'Al d\u00EDa';

      // Header categoría — sticky dentro del scroll
      var catHdr = document.createElement('div');
      catHdr.className = 'com-doc-cat-hdr';
      catHdr.style.cssText = 'position:sticky;top:0;z-index:5;background:var(--co-cream-deep);padding:8px 14px;';
      var dot = document.createElement('div');
      dot.className = 'com-doc-cat-dot';
      dot.style.background = semCat;
      var title = document.createElement('div');
      title.className = 'com-doc-cat-title';
      title.textContent = cat;
      var meta = document.createElement('div');
      meta.className = 'com-doc-cat-sub';
      meta.textContent = metaCat + ' \u00B7 ' + tipos.length + ' tipos';

      // Botón + Agregar tipo
      var btnAdd = document.createElement('button');
      btnAdd.className = 'com-panel-ver';
      btnAdd.textContent = '+ Agregar';
      btnAdd.title = 'Agregar tipo de documento a esta categor\u00EDa';
      btnAdd.addEventListener('click', function(e) {
        e.stopPropagation();
        modalAgregarTipo(cat, com, custom, function() { cargarDocumentos(com.id); });
      });

      catHdr.appendChild(dot); catHdr.appendChild(title); catHdr.appendChild(meta); catHdr.appendChild(btnAdd);
      scrollWrap.appendChild(catHdr);

      // Filas de tipos
      tipos.forEach(function(tipo) {
        // Buscar nombre original (antes de renombrar) para operaciones sobre custom
        var nombreOriginal = tipo;
        Object.keys(custom.renombrados).forEach(function(orig) {
          if (custom.renombrados[orig] === tipo) nombreOriginal = orig;
        });
        var esExtra = custom.extras.some(function(ex) { return ex.nombre === tipo; });

        var d = mapaRegistrados[tipo];
        var row = document.createElement('div');
        row.className = 'com-doc-row';
        row.style.cssText = 'cursor:pointer;padding:7px 14px;';
        row.addEventListener('click', function() { modalDocumento(d || null, cat, com, tipo); });

        // Ícono estado
        var icoWrap = document.createElement('div');
        icoWrap.style.cssText = 'width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0';
        if (!d) {
          icoWrap.style.background = 'var(--co-cream-deep)';
          icoWrap.innerHTML = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="var(--co-mute)" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>';
        } else if (d.semaforo === 'rojo') {
          icoWrap.style.background = 'var(--co-red-soft)';
          icoWrap.innerHTML = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="var(--co-red)" stroke-width="2" stroke-linecap="round"><path d="M8 5v4M8 11v1"/><circle cx="8" cy="8" r="6"/></svg>';
        } else if (d.semaforo === 'amarillo') {
          icoWrap.style.background = 'var(--co-amber-soft)';
          icoWrap.innerHTML = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="var(--co-amber)" stroke-width="2" stroke-linecap="round"><path d="M8 5v3M8 10v1"/><circle cx="8" cy="8" r="6"/></svg>';
        } else {
          icoWrap.style.background = 'var(--co-green-soft)';
          icoWrap.innerHTML = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="var(--co-green)" stroke-width="2" stroke-linecap="round"><path d="M3 8l4 4 6-6"/></svg>';
        }

        var nom = document.createElement('div');
        nom.className = 'com-doc-nombre';
        nom.textContent = tipo;

        var fechaEl = document.createElement('div');
        fechaEl.className = 'com-doc-fecha';
        fechaEl.textContent = d ? formatFecha(d.fechaDocumento) : '\u2014';

        // Días hasta vencimiento
        var diasEl = document.createElement('div');
        diasEl.className = 'com-doc-dias';
        diasEl.className = 'com-doc-dias';
        diasEl.style.cssText = 'font-size:11px;font-weight:600;min-width:72px;text-align:right';
        if (d && d.fechaVencimiento && DOCS_CON_VENCIMIENTO.indexOf(tipo) !== -1) {
          var dias = diasHasta(d.fechaVencimiento);
          if (dias === null)       { diasEl.textContent = '\u2014'; }
          else if (dias < 0)       { diasEl.style.color = 'var(--co-red)';   diasEl.textContent = 'Vencido'; }
          else if (dias <= 60)     { diasEl.style.color = 'var(--co-amber)'; diasEl.textContent = dias + ' d\u00EDas'; }
          else                     { diasEl.style.color = 'var(--co-green)'; diasEl.textContent = dias + ' d\u00EDas'; }
        }

        var pill = document.createElement('span');
        pill.className = 'co-pill';
        if (!d)                             { pill.className += ' pill-pend'; pill.textContent = 'Pendiente'; }
        else if (d.semaforo === 'rojo')     { pill.className += ' pill-crit'; pill.textContent = 'Vencido'; }
        else if (d.semaforo === 'amarillo') { pill.className += ' pill-warn'; pill.textContent = 'Por vencer'; }
        else                                { pill.className += ' pill-ok';   pill.textContent = 'Vigente'; }

        var btnVer = document.createElement('button');
        btnVer.className = 'com-doc-link';
        if (d && d.urlDrive) {
          btnVer.textContent = 'Ver';
          btnVer.innerHTML += ' <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3H3v10h10V9M9 3h4v4M13 3L7 9"/></svg>';
          btnVer.addEventListener('click', function(e) { e.stopPropagation(); window.open(d.urlDrive, '_blank'); });
        } else {
          btnVer.style.color = 'var(--co-mute)';
          btnVer.textContent = '+ Registrar';
          btnVer.addEventListener('click', function(e) { e.stopPropagation(); modalDocumento(null, cat, com, tipo); });
        }

        // Menú ⋯ — Editar y Eliminar tipo
        var btnMenu = document.createElement('button');
        btnMenu.style.cssText = 'background:none;border:none;cursor:pointer;font-size:16px;color:var(--co-mute);padding:2px 6px;border-radius:4px;line-height:1;margin-left:4px;flex-shrink:0';
        btnMenu.textContent = '\u22EF';
        btnMenu.title = 'Opciones';
        btnMenu.addEventListener('click', function(e) {
          e.stopPropagation();
          _menuOpcionesTipo(e, tipo, nombreOriginal, cat, esExtra, com, custom, function() { cargarDocumentos(com.id); });
        });

        row.appendChild(icoWrap); row.appendChild(nom); row.appendChild(fechaEl);
        row.appendChild(diasEl); row.appendChild(pill); row.appendChild(btnVer); row.appendChild(btnMenu);
        scrollWrap.appendChild(row);
      });
    });

    tc.appendChild(scrollWrap);
  }

  // ── Menú contextual opciones de tipo ─────────────────────────
  function _menuOpcionesTipo(e, tipo, nombreOriginal, cat, esExtra, com, custom, onDone) {
    document.querySelectorAll('.doc-tipo-menu').forEach(function(m) { m.remove(); });

    var menu = document.createElement('div');
    menu.className = 'doc-tipo-menu';
    menu.style.cssText = 'position:fixed;background:var(--co-surface);border:1px solid var(--co-line);border-radius:var(--co-r-md);box-shadow:var(--co-shadow-lg);z-index:3000;min-width:170px;padding:4px 0;font-family:var(--co-font)';

    var rect = e.target.getBoundingClientRect();
    menu.style.top  = (rect.bottom + 4) + 'px';
    menu.style.left = Math.min(rect.left, window.innerWidth - 190) + 'px';

    function itemMenu(ico, txt, color, fn) {
      var item = document.createElement('button');
      item.style.cssText = 'display:flex;align-items:center;gap:9px;width:100%;padding:9px 14px;background:none;border:none;font-family:var(--co-font);font-size:12px;font-weight:600;color:' + (color || 'var(--co-ink)') + ';cursor:pointer;text-align:left';
      item.innerHTML = ico + '<span>' + txt + '</span>';
      item.addEventListener('mouseenter', function() { item.style.background = 'var(--co-cream)'; });
      item.addEventListener('mouseleave', function() { item.style.background = 'none'; });
      item.addEventListener('click', function() { menu.remove(); fn(); });
      menu.appendChild(item);
    }

    var icoEdit = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 2.5a1.414 1.414 0 0 1 2 2L5 13H3v-2Z"/></svg>';
    var icoDel  = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h10M5 4V3h6v1M6 7v5M10 7v5"/><rect x="4" y="4" width="8" height="10" rx="1"/></svg>';

    itemMenu(icoEdit, 'Renombrar tipo', '', function() {
      modalRenombrarTipo(tipo, nombreOriginal, esExtra, com, custom, onDone);
    });
    itemMenu(icoDel, 'Eliminar de lista', 'var(--co-red)', function() {
      if (!confirm('\u00BFEliminar "' + tipo + '" del cat\u00E1logo de esta comunidad? Los documentos ya registrados no se borran.')) return;
      _eliminarTipo(nombreOriginal, esExtra, com, custom, onDone);
    });

    document.body.appendChild(menu);
    var cerrar = function(ev) { if (!menu.contains(ev.target)) { menu.remove(); document.removeEventListener('click', cerrar); } };
    setTimeout(function() { document.addEventListener('click', cerrar); }, 50);
  }

  // ── Modal agregar tipo personalizado ─────────────────────────
  function modalAgregarTipo(catPresel, com, custom, onDone) {
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    var box = document.createElement('div');
    box.className = 'modal-box';
    box.style.maxWidth = '460px';

    var btnX = document.createElement('button'); btnX.className = 'modal-close'; btnX.textContent = '\u00D7'; box.appendChild(btnX);
    var ey = document.createElement('div'); ey.className = 'modal-eyebrow'; ey.textContent = 'Documentos'; box.appendChild(ey);
    var tt = document.createElement('div'); tt.className = 'modal-titulo'; tt.textContent = 'Agregar tipo de documento'; box.appendChild(tt);
    var st = document.createElement('div'); st.className = 'modal-subtitulo'; st.textContent = 'Crea un tipo personalizado para esta comunidad.'; box.appendChild(st);

    var grid = document.createElement('div'); grid.className = 'form-grid';

    // Nombre
    var fgNom = document.createElement('div'); fgNom.className = 'form-group form-full';
    var lblNom = document.createElement('label'); lblNom.textContent = 'Nombre del tipo *';
    var inpNom = document.createElement('input'); inpNom.type = 'text'; inpNom.id = 'nt-nombre'; inpNom.placeholder = 'Ej: Certificado SEC especial';
    fgNom.appendChild(lblNom); fgNom.appendChild(inpNom);

    // Categoría
    var fgCat = document.createElement('div'); fgCat.className = 'form-group';
    var lblCat = document.createElement('label'); lblCat.textContent = 'Categor\u00EDa';
    var selCat = document.createElement('select'); selCat.id = 'nt-cat';
    Object.keys(CATALOGO_DOCS).forEach(function(cat) {
      var opt = document.createElement('option'); opt.value = cat; opt.textContent = cat;
      if (cat === catPresel) opt.selected = true;
      selCat.appendChild(opt);
    });
    fgCat.appendChild(lblCat); fgCat.appendChild(selCat);

    // ¿Vence?
    var fgVence = document.createElement('div'); fgVence.className = 'form-group';
    var lblVence = document.createElement('label'); lblVence.textContent = '\u00BFRequiere control de vencimiento?';
    var selVence = document.createElement('select'); selVence.id = 'nt-vence';
    [['NO','No vence'],['SI','S\u00ED, requiere fecha de vencimiento']].forEach(function(o) {
      var opt = document.createElement('option'); opt.value = o[0]; opt.textContent = o[1]; selVence.appendChild(opt);
    });
    fgVence.appendChild(lblVence); fgVence.appendChild(selVence);

    grid.appendChild(fgNom); grid.appendChild(fgCat); grid.appendChild(fgVence);
    box.appendChild(grid);

    var errDiv = document.createElement('div'); errDiv.className = 'form-error'; errDiv.style.display = 'none'; box.appendChild(errDiv);
    var btnGuardar = document.createElement('button'); btnGuardar.className = 'btn-guardar'; btnGuardar.textContent = 'Agregar al cat\u00E1logo'; box.appendChild(btnGuardar);

    overlay.appendChild(box); document.body.appendChild(overlay);
    var cerrar = function() { overlay.remove(); };
    btnX.addEventListener('click', cerrar);
    overlay.addEventListener('click', function(ev) { if (ev.target === overlay) cerrar(); });

    btnGuardar.addEventListener('click', function() {
      var nombre = document.getElementById('nt-nombre').value.trim();
      var cat    = document.getElementById('nt-cat').value;
      var vence  = document.getElementById('nt-vence').value === 'SI';
      if (!nombre) { errDiv.textContent = 'El nombre es obligatorio.'; errDiv.style.display = 'block'; return; }

      // Generar id único
      var nuevoExtra = { id: 'CUSTOM-' + Date.now(), nombre: nombre, categoria: cat, vence: vence };
      custom.extras.push(nuevoExtra);

      btnGuardar.disabled = true; btnGuardar.textContent = 'Guardando\u2026'; errDiv.style.display = 'none';
      _guardarCatalogoCustom(com, custom, function(ok, err) {
        if (ok) {
          btnGuardar.textContent = '\u2713 Agregado';
          btnGuardar.style.background = 'var(--co-green)';
          setTimeout(function() { overlay.remove(); if (onDone) onDone(); }, 700);
        } else {
          custom.extras.pop(); // revertir
          errDiv.textContent = err || 'Error al guardar'; errDiv.style.display = 'block';
          btnGuardar.disabled = false; btnGuardar.textContent = 'Agregar al cat\u00E1logo';
        }
      });
    });
  }

  // ── Modal renombrar tipo ──────────────────────────────────────
  function modalRenombrarTipo(tipoActual, nombreOriginal, esExtra, com, custom, onDone) {
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    var box = document.createElement('div');
    box.className = 'modal-box';
    box.style.maxWidth = '420px';

    var btnX = document.createElement('button'); btnX.className = 'modal-close'; btnX.textContent = '\u00D7'; box.appendChild(btnX);
    var ey = document.createElement('div'); ey.className = 'modal-eyebrow'; ey.textContent = 'Renombrar'; box.appendChild(ey);
    var tt = document.createElement('div'); tt.className = 'modal-titulo'; tt.textContent = tipoActual; box.appendChild(tt);

    var fg = document.createElement('div'); fg.className = 'form-group form-full'; fg.style.marginTop = '20px';
    var lbl = document.createElement('label'); lbl.textContent = 'Nuevo nombre';
    var inp = document.createElement('input'); inp.type = 'text'; inp.id = 'rt-nombre'; inp.value = tipoActual;
    fg.appendChild(lbl); fg.appendChild(inp);
    box.appendChild(fg);

    var errDiv = document.createElement('div'); errDiv.className = 'form-error'; errDiv.style.display = 'none'; box.appendChild(errDiv);
    var btnGuardar = document.createElement('button'); btnGuardar.className = 'btn-guardar'; btnGuardar.textContent = 'Guardar nombre'; box.appendChild(btnGuardar);

    overlay.appendChild(box); document.body.appendChild(overlay);
    var cerrar = function() { overlay.remove(); };
    btnX.addEventListener('click', cerrar);
    overlay.addEventListener('click', function(ev) { if (ev.target === overlay) cerrar(); });

    btnGuardar.addEventListener('click', function() {
      var nuevoNombre = document.getElementById('rt-nombre').value.trim();
      if (!nuevoNombre || nuevoNombre === tipoActual) { cerrar(); return; }

      var previo;
      if (esExtra) {
        var ex = custom.extras.find(function(e) { return e.nombre === tipoActual; });
        if (ex) { previo = ex.nombre; ex.nombre = nuevoNombre; }
      } else {
        previo = custom.renombrados[nombreOriginal];
        custom.renombrados[nombreOriginal] = nuevoNombre;
      }

      btnGuardar.disabled = true; btnGuardar.textContent = 'Guardando\u2026';
      _guardarCatalogoCustom(com, custom, function(ok, err) {
        if (ok) {
          btnGuardar.textContent = '\u2713 Guardado';
          btnGuardar.style.background = 'var(--co-green)';
          setTimeout(function() { overlay.remove(); if (onDone) onDone(); }, 700);
        } else {
          // revertir
          if (esExtra) { var ex2 = custom.extras.find(function(e) { return e.nombre === nuevoNombre; }); if (ex2) ex2.nombre = tipoActual; }
          else { if (previo !== undefined) custom.renombrados[nombreOriginal] = previo; else delete custom.renombrados[nombreOriginal]; }
          errDiv.textContent = err || 'Error al guardar'; errDiv.style.display = 'block';
          btnGuardar.disabled = false; btnGuardar.textContent = 'Guardar nombre';
        }
      });
    });

    setTimeout(function() { inp.focus(); inp.select(); }, 100);
  }

  // ── Eliminar tipo del catálogo ────────────────────────────────
  function _eliminarTipo(nombreOriginal, esExtra, com, custom, onDone) {
    var prevExtras = custom.extras.slice();
    var prevElim   = Object.assign({}, custom.eliminados);

    if (esExtra) {
      custom.extras = custom.extras.filter(function(e) { return e.nombre !== nombreOriginal; });
    } else {
      custom.eliminados[nombreOriginal] = true;
    }

    _guardarCatalogoCustom(com, custom, function(ok, err) {
      if (ok) {
        if (onDone) onDone();
      } else {
        custom.extras     = prevExtras;
        custom.eliminados = prevElim;
        alert('Error al eliminar: ' + (err || 'intenta de nuevo'));
      }
    });
  }

  // ── Guardar catalogoCustom en backend ────────────────────────
  function _guardarCatalogoCustom(com, custom, cb) {
    var payload = JSON.stringify(custom);
    api('/comunidades', 'POST', {
      action: 'editarComunidad',
      id: com.id,
      catalogoCustom: payload
    }).then(function(r) {
      if (r.ok && r.data && r.data.ok) {
        com.catalogoCustom = payload;
        var idx = -1;
        for (var i = 0; i < _comunidades.length; i++) {
          if (_comunidades[i].id === com.id) { idx = i; break; }
        }
        if (idx !== -1) _comunidades[idx].catalogoCustom = payload;
        cb(true);
      } else {
        cb(false, (r.data && r.data.error) || r.error || 'Error desconocido');
      }
    }).catch(function(e) { cb(false, e.message); });
  }

  // ── TAB EVENTOS ───────────────────────────────────────────────
  function cargarEventos(comunidadId) {
    api('/documentos/vencimientos?comunidadId=' + comunidadId).then(function(resp) {
      var tc = document.getElementById('tc-eventos');
      if (!tc) return;
      tc.innerHTML = '';

      var panel = document.createElement('div');
      panel.className = 'com-panel';

      var docs = (resp.ok && resp.data && resp.data.data) ? resp.data.data : [];
      if (docs.length === 0) {
        var v = document.createElement('div');
        v.className = 'com-vacio';
        v.textContent = 'Sin eventos ni alertas pr\u00F3ximas.';
        panel.appendChild(v);
        tc.appendChild(panel);
        return;
      }

      docs.sort(function(a, b) {
        var da = diasHasta(a.fechaVencimiento);
        var db = diasHasta(b.fechaVencimiento);
        return (da === null ? 999 : da) - (db === null ? 999 : db);
      }).slice(0, 10).forEach(function(d) {
        var dias = diasHasta(d.fechaVencimiento);
        var sem  = semColorDias(dias);
        var fv   = d.fechaVencimiento ? new Date(d.fechaVencimiento) : null;

        var row = document.createElement('div');
        row.className = 'com-evento-row';

        var fecha = document.createElement('div');
        fecha.className = 'com-evento-fecha';
        if (fv && !isNaN(fv)) {
          var dia = document.createElement('div');
          dia.className = 'com-evento-dia';
          dia.textContent = fv.getDate();
          var mes = document.createElement('div');
          mes.className = 'com-evento-mes';
          mes.textContent = MESES[fv.getMonth()];
          fecha.appendChild(dia); fecha.appendChild(mes);
        } else {
          fecha.textContent = '\u2014';
        }

        var icoDiv = document.createElement('div');
        icoDiv.className = 'com-alert-ico alert-ico-' + (sem === 'rojo' ? 'r' : sem === 'amarillo' ? 'a' : 'v');
        icoDiv.innerHTML = '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 1"/></svg>';

        var txt = document.createElement('div');
        txt.style.flex = '1';
        var n1 = document.createElement('div');
        n1.className = 'com-evento-nombre';
        n1.textContent = d.tipo || '';
        var n2 = document.createElement('div');
        n2.className = 'com-evento-sub';
        n2.textContent = d.categoria || '';
        txt.appendChild(n1); txt.appendChild(n2);

        var pill = document.createElement('span');
        pill.className = 'co-pill ' + (sem === 'rojo' ? 'pill-crit' : sem === 'amarillo' ? 'pill-warn' : 'pill-ok');
        pill.textContent = dias === null ? '\u2014' : dias < 0 ? 'Vencido' : dias + ' d\u00EDas';

        row.appendChild(fecha); row.appendChild(icoDiv); row.appendChild(txt); row.appendChild(pill);
        panel.appendChild(row);
      });
      tc.appendChild(panel);
    }).catch(function() {

        var v = document.createElement('div');
        v.className = 'com-vacio';

      }
    });
  }

  // ── Guardar documento ─────────────────────────────────────────
  function _guardarDocumento(doc, overlay, btn, errDiv) {
    var cat   = document.getElementById('doc-cat').value;
    var tipo  = document.getElementById('doc-tipo').value;
    var desc  = document.getElementById('doc-desc').value.trim();
    var fecha = document.getElementById('doc-fecha').value;
    var vencGrp = document.getElementById('doc-venc-group');
    var venc  = (vencGrp && vencGrp.style.display !== 'none') ? document.getElementById('doc-venc').value : '';
    var perGrp = document.getElementById('doc-per-group');
    var per   = (perGrp && perGrp.style.display !== 'none') ? document.getElementById('doc-per').value.trim() : '';
    var url   = document.getElementById('doc-url').value.trim();

    if (!tipo) { errDiv.textContent = 'Selecciona un tipo de documento.'; errDiv.style.display = 'block'; return; }

    btn.disabled = true;
    btn.textContent = 'Guardando\u2026';
    errDiv.style.display = 'none';

    var payload = doc
      ? { action: 'editarDocumento', id: doc.id, categoria: cat, tipo: tipo,
          descripcion: desc, fechaDocumento: fecha, fechaVencimiento: venc,
          periodo: per, urlDrive: url }
      : { action: 'crearDocumento', comunidadId: _comunidadActiva.id,
          categoria: cat, tipo: tipo, descripcion: desc,
          fechaDocumento: fecha, fechaVencimiento: venc,
          periodo: per, urlDrive: url };

    api('/documentos', 'POST', payload).then(function(r) {
      if (r.ok && r.data && r.data.ok) {
        btn.textContent = '\u2713 Guardado';
        btn.style.background = 'var(--co-green)';
        setTimeout(function() {
          overlay.remove();
          cargarDocumentos(_comunidadActiva.id);
        }, 800);
      } else {
        errDiv.textContent = (r.data && r.data.error) || r.error || 'Error al guardar';
        errDiv.style.display = 'block';
        btn.disabled = false;
        btn.textContent = doc ? 'Guardar cambios' : 'Guardar documento';
      }
    }).catch(function(e) {
      errDiv.textContent = e.message;
      errDiv.style.display = 'block';
      btn.disabled = false;
      btn.textContent = doc ? 'Guardar cambios' : 'Guardar documento';
    });
  }

  // ── DIRECTORIO ───────────────────────────────────────────────
  var _dirData = { unidades: [], propietarios: [], residentes: [], comunidadId: null };
  var _dirComunidad = {};

  function cargarDirectorio(comunidadId) {
    var tc = document.getElementById('tc-directorio');
    if (!tc) return;
    tc.innerHTML = '<div class="com-vacio">Cargando directorio\u2026</div>';

    api('/directorio?comunidadId=' + comunidadId).then(function(resp) {
      function extraer(r) {
        if (!r.ok) return [];
        if (Array.isArray(r.data)) return r.data;
        if (r.data && Array.isArray(r.data.data)) return r.data.data;
        return [];
      }
      _dirData.unidades    = extraer(resp);
      _dirData.comunidadId = comunidadId;
      _dirComunidad        = window._comunidades ? window._comunidades.find(function(c){ return c.id === comunidadId; }) || {} : {};
      try {
        renderDirectorio(comunidadId);
      } catch(renderErr) {
        console.error('Error en renderDirectorio:', renderErr);
        var tc2 = document.getElementById('tc-directorio');
        if (tc2) { tc2.innerHTML = '<div class="com-vacio">Error al renderizar: ' + renderErr.message + '</div>'; }
      }
    }).catch(function(fetchErr) {
      console.error('Error al cargar directorio:', fetchErr);
      var tc2 = document.getElementById('tc-directorio');
      if (tc2) { tc2.innerHTML = '<div class="com-vacio">Error de conexi\u00F3n: ' + (fetchErr.message || fetchErr) + '</div>'; }
    });
  }

    var unidades = _dirData.unidades;

    var nEstac  = unidades.filter(function(u) { var t = String(u.tipoUnidad||'').toUpperCase(); return t==='ESTAC'||t==='ESTACIONAMIENTO'; }).length;
    var nBodega = unidades.filter(function(u) { var t = String(u.tipoUnidad||'').toUpperCase(); return t==='BODEGA'; }).length;
    var setCoprop = {}; var setResid = {};
    unidades.forEach(function(u) {
      if (u.idCopropietario) setCoprop[u.idCopropietario] = true;
      if (u.idResidente)     setResid[u.idResidente]      = true;

    var nCoprop = Object.keys(setCoprop).length;
    var nResid  = Object.keys(setResid).length;
    var partes = [];
    if (nDeptos > 0) partes.push(nDeptos + ' depto' + (nDeptos !== 1 ? 's' : ''));
    if (nEstac  > 0) partes.push(nEstac  + ' estac.');
    if (nBodega > 0) partes.push(nBodega + ' bodega' + (nBodega !== 1 ? 's' : ''));

    info.textContent = partes.join(' \u00B7 ');

    var btnAgregar = document.createElement('button');

    btnExportar.style.fontSize = '12px';
    btnExportar.innerHTML = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 11v2a1 1 0 001 1h10a1 1 0 001-1v-2M8 3v8M5 8l3 3 3-3"/></svg> Exportar';
    btnExportar.addEventListener('click', function() { modalExportarDirectorio(unidades, _dirComunidad); });

    btns.appendChild(btnAgregar);
    btns.appendChild(btnExportar);
    btns.appendChild(btnImportar);
    hdr.appendChild(info);
    hdr.appendChild(btns);
    tc.appendChild(hdr);

    if (unidades.length > 0) {
      var total = unidades.reduce(function(s, u) { return s + (parseFloat(u.alicuota) || 0); }, 0);
      var diff  = Math.abs(total - 1);
      var validBar = document.createElement('div');
      validBar.style.cssText = 'display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--co-r-md);margin-bottom:12px;font-size:12px;font-weight:600;' +
        (diff < 0.0001 ? 'background:var(--co-green-soft);color:var(--co-green)' : 'background:var(--co-red-soft);color:var(--co-red)');
      validBar.innerHTML = (diff < 0.0001
        ? '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8l4 4 6-6"/></svg> Al\u00EDcuotas suman 1.0000 \u2014 100% correcto'
        : '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 5v4M8 11v1"/><circle cx="8" cy="8" r="6"/></svg> Al\u00EDcuotas suman ' + total.toFixed(4) + ' (' + (total*100).toFixed(2) + '%) \u2014 Falta ' + diff.toFixed(4) + ' para completar 1.0000 (100%)');
      tc.appendChild(validBar);
    }

    if (unidades.length === 0) {
      var vacio = document.createElement('div');
      vacio.style.cssText = 'text-align:center;padding:40px 20px;border:1.5px dashed var(--co-line);border-radius:var(--co-r-lg)';
      vacio.innerHTML = '<div style="font-size:13px;font-weight:700;color:var(--co-ink);margin-bottom:6px">Sin unidades registradas</div>'
        + '<div style="font-size:12px;color:var(--co-mute);margin-bottom:16px">Importe la tabla de prorrateo para comenzar o agregue unidades manualmente.</div>';
      var btnV = document.createElement('button');
      btnV.className = 'btn-nuevo';
      btnV.innerHTML = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 11v2a1 1 0 001 1h10a1 1 0 001-1v-2M8 3v8M5 8l3 3 3-3"/></svg> Importar tabla de prorrateo';
      btnV.addEventListener('click', function() { modalImportarDirectorio(comunidadId); });
      vacio.appendChild(btnV);
      tc.appendChild(vacio);
      return;
    }

    var wrap = document.createElement('div');
    wrap.className = 'com-dir-wrap';
    var tabla = document.createElement('table');
    tabla.className = 'com-dir-table';

    var thead = document.createElement('thead');
    var trh   = document.createElement('tr');
    ['Unidad','Tipo','Al\u00EDcuota','Copropietario','N\u00BA ID','Condici\u00F3n','Residente','Tel\u00E9fono',''].forEach(function(h) {
      var th = document.createElement('th');
      th.textContent = h;
      trh.appendChild(th);
    });
    thead.appendChild(trh);
    tabla.appendChild(thead);

    var tbody = document.createElement('tbody');
    var ORDEN_TIPO = { 'DEPTO':1,'CASA':1,'LOCAL':2,'OFICINA':2,'ESTAC':3,'ESTACIONAMIENTO':3,'BODEGA':4 };
    unidades.slice().sort(function(a, b) {
      var ta = ORDEN_TIPO[String(a.tipoUnidad||'').toUpperCase()] || 5;
      var tb = ORDEN_TIPO[String(b.tipoUnidad||'').toUpperCase()] || 5;
      if (ta !== tb) return ta - tb;
      return String(a.numeroUnidad).localeCompare(String(b.numeroUnidad), 'es', { numeric: true });
    }).forEach(function(u) {
      var tr = document.createElement('tr');
      function td(val) { var t = document.createElement('td'); t.textContent = val || '\u2014'; return t; }

      var tdTipo = document.createElement('td');
      var tipoSpan = document.createElement('span');
      var tipoNorm = String(u.tipoUnidad||'').toUpperCase();
      tipoSpan.className = 'com-uni-tipo ' + (tipoNorm==='DEPTO'||tipoNorm==='CASA' ? 't-dep' : tipoNorm==='ESTAC' ? 't-est' : tipoNorm==='BODEGA' ? 't-bod' : 't-loc');
      tipoSpan.textContent = u.tipoUnidad || '\u2014';
      tdTipo.appendChild(tipoSpan);

      var tdCond = document.createElement('td');
      if (u.condicionOcupacion) {
        var condPill = document.createElement('span');
        condPill.className = 'co-pill ' + (u.condicionOcupacion === 'propietario residente' ? 'pill-ok' : u.condicionOcupacion === 'arrendado' ? 'pill-warn' : 'pill-pend');
        condPill.textContent = u.condicionOcupacion.charAt(0).toUpperCase() + u.condicionOcupacion.slice(1);
        tdCond.appendChild(condPill);
      } else { tdCond.textContent = '\u2014'; }

      var tdAcc = document.createElement('td');
      var btnAcc = document.createElement('button');
      btnAcc.style.cssText = 'background:none;border:none;cursor:pointer;font-size:16px;color:var(--co-mute);padding:2px 6px;border-radius:4px;line-height:1';
      btnAcc.textContent = '\u22EF';
      btnAcc.title = 'Acciones';
      btnAcc.addEventListener('click', function(e) {
        e.stopPropagation();
        mostrarMenuAcciones(e, u, {}, {}, comunidadId);
      });
      tdAcc.appendChild(btnAcc);

      var alicDisplay = u.alicuota ? (parseFloat(u.alicuota) * 100).toFixed(2) + '%' : '\u2014';

      tr.appendChild(td(u.numeroUnidad));
      tr.appendChild(tdTipo);
      tr.appendChild(td(alicDisplay));
      tr.appendChild(td(u.nombreCopropietario));
      tr.appendChild(td(u.numeroIdCopropietario));
      tr.appendChild(tdCond);
      tr.appendChild(td(u.nombreResidente));
      tr.appendChild(td(u.telefonoResidente));
      tr.appendChild(tdAcc);
      tbody.appendChild(tr);
    });
    tabla.appendChild(tbody);
    wrap.appendChild(tabla);
    tc.appendChild(wrap);
  }

  // ── MENÚ CONTEXTUAL DIRECTORIO ───────────────────────────────
  function mostrarMenuAcciones(e, unidad, prop, res, comunidadId) {
    document.querySelectorAll('.dir-menu-ctx').forEach(function(m) { m.remove(); });
    var menu = document.createElement('div');
    menu.className = 'dir-menu-ctx';
    menu.style.cssText = 'position:fixed;background:var(--co-surface);border:1px solid var(--co-line);border-radius:var(--co-r-md);box-shadow:var(--co-shadow-lg);z-index:3000;min-width:180px;padding:4px 0;font-family:var(--co-font)';

    var rect = e.target.getBoundingClientRect();
    menu.style.top  = (rect.bottom + 4) + 'px';
    menu.style.left = Math.min(rect.left, window.innerWidth - 200) + 'px';

    function itemMenu(icono, texto, color, fn) {
      var item = document.createElement('button');
      item.style.cssText = 'display:flex;align-items:center;gap:9px;width:100%;padding:9px 14px;background:none;border:none;font-family:var(--co-font);font-size:12px;font-weight:600;color:' + (color || 'var(--co-ink)') + ';cursor:pointer;text-align:left';
      item.innerHTML = icono + '<span>' + texto + '</span>';
      item.addEventListener('mouseenter', function() { item.style.background = 'var(--co-cream)'; });
      item.addEventListener('mouseleave', function() { item.style.background = 'none'; });
      item.addEventListener('click', function() { menu.remove(); fn(); });
      menu.appendChild(item);
    }

    var icoEdit = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 2.5a1.414 1.414 0 0 1 2 2L5 13H3v-2Z"/></svg>';
    var icoUser = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="6" r="3"/><path d="M3 14c0-3 2-5 5-5s5 2 5 5"/></svg>';
    var icoHome = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7l6-5 6 5v7H2z"/><path d="M6 16v-5h4v5"/></svg>';

    itemMenu(icoEdit, 'Editar unidad', '', function() { modalEditarUnidad(unidad, comunidadId); });
    if (unidad.idCopropietario) {
      itemMenu(icoEdit, 'Editar copropietario', '', function() { modalEditarCopropietario(unidad, comunidadId); });
    } else {
      itemMenu(icoUser, 'Agregar copropietario', 'var(--co-orange)', function() { modalAgregarPropietario(unidad, comunidadId); });
    }
    if (unidad.idResidente) {
      itemMenu(icoEdit, 'Editar residente', '', function() { modalEditarResidente(unidad, comunidadId); });
    } else {
      itemMenu(icoHome, 'Agregar residente', 'var(--co-orange)', function() { modalAgregarResidente(unidad, comunidadId); });
    }

    document.body.appendChild(menu);
    var cerrarMenu = function(ev) { if (!menu.contains(ev.target)) { menu.remove(); document.removeEventListener('click', cerrarMenu); } };
    setTimeout(function() { document.addEventListener('click', cerrarMenu); }, 50);
  }

  function exportarDirectorioExcel(unidades, comunidad) {
    _cargarXLSX(function() {
      var wb = XLSX.utils.book_new();
      var nomCom = comunidad.nombre || 'Comunidad';
      var fecha  = new Date().toLocaleDateString('es-CL');
      function crearHoja(titulo, cols, filas) {
        var data = [[nomCom + ' \u2014 ' + titulo],['Exportado: ' + fecha + ' \u00B7 CoproActiva Administraci\u00F3n SpA'],[],cols];
        filas.forEach(function(f) { data.push(f); });
        var ws = XLSX.utils.aoa_to_sheet(data);
        ws['!cols'] = cols.map(function() { return { wch: 20 }; });
        return ws;
      }
      var deptos = unidades.filter(function(u) { return String(u.tipoUnidad||'').toUpperCase() === 'DEPTO' || String(u.tipoUnidad||'').toUpperCase() === 'CASA'; });
      var wsD = crearHoja('Departamentos',
        ['N\u00BA Unidad','Al\u00EDcuota %','Copropietario','RUT / ID','Condici\u00F3n','Residente','Tel\u00E9fono'],
        deptos.map(function(u) { return [u.numeroUnidad, ((parseFloat(u.alicuota)||0)*100).toFixed(4)+'%', u.nombreCopropietario||'', u.numeroIdCopropietario||'', u.condicionOcupacion||'', u.nombreResidente||'', u.telefonoResidente||'']; })
      );
      XLSX.utils.book_append_sheet(wb, wsD, 'Deptos');
      var estac = unidades.filter(function(u) { return String(u.tipoUnidad||'').toUpperCase() === 'ESTAC' || String(u.tipoUnidad||'').toUpperCase() === 'ESTACIONAMIENTO'; });
      if (estac.length > 0) {
        var wsE = crearHoja('Estacionamientos',
          ['N\u00BA Unidad','Al\u00EDcuota %','Copropietario','RUT / ID','Unidad Principal','Residente'],
          estac.map(function(u) { return [u.numeroUnidad, ((parseFloat(u.alicuota)||0)*100).toFixed(4)+'%', u.nombreCopropietario||'', u.numeroIdCopropietario||'', u.idUnidadPrincipal||'', u.nombreResidente||'']; })
        );
        XLSX.utils.book_append_sheet(wb, wsE, 'Estac.');
      }
      var bodegas = unidades.filter(function(u) { return String(u.tipoUnidad||'').toUpperCase() === 'BODEGA'; });
      if (bodegas.length > 0) {
        var wsB = crearHoja('Bodegas',
          ['N\u00BA Unidad','Al\u00EDcuota %','Copropietario','RUT / ID','Unidad Principal','Residente'],
          bodegas.map(function(u) { return [u.numeroUnidad, ((parseFloat(u.alicuota)||0)*100).toFixed(4)+'%', u.nombreCopropietario||'', u.numeroIdCopropietario||'', u.idUnidadPrincipal||'', u.nombreResidente||'']; })
        );
        XLSX.utils.book_append_sheet(wb, wsB, 'Bodegas');
      }
      var totalAlic = unidades.reduce(function(s,u){ return s+(parseFloat(u.alicuota)||0); }, 0);
      var setCop = {}; unidades.forEach(function(u){ if(u.idCopropietario) setCop[u.idCopropietario]=true; });
      var setRes = {}; unidades.forEach(function(u){ if(u.idResidente) setRes[u.idResidente]=true; });
      var wsR = XLSX.utils.aoa_to_sheet([[nomCom+' \u2014 Resumen'],['Generado: '+fecha],[],['Concepto','Valor'],['Departamentos',deptos.length],['Estacionamientos',estac.length],['Bodegas',bodegas.length],['Total unidades',unidades.length],[],['Copropietarios \u00FAnicos',Object.keys(setCop).length],['Residentes \u00FAnicos',Object.keys(setRes).length],[],['Suma al\u00EDcuotas (factor)',totalAlic.toFixed(6)],['Suma al\u00EDcuotas (%)',(totalAlic*100).toFixed(4)+'%'],['Al\u00EDcuotas v\u00E1lidas',Math.abs(totalAlic-1)<0.0001?'S\u00ED \u2713':'No \u2717']]);
      wsR['!cols'] = [{ wch: 28 }, { wch: 16 }];
      XLSX.utils.book_append_sheet(wb, wsR, 'Resumen');
      XLSX.writeFile(wb, 'Directorio_' + nomCom.replace(/\s/g,'-') + '_' + fecha.replace(/\//g,'-') + '.xlsx');
    });
  }

  function procesarArchivoDirectorio(file, comunidadId, box, overlay) {
    if (typeof XLSX === 'undefined') { var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = function() { procesarArchivoDirectorio(file, comunidadId, box, overlay); }; document.head.appendChild(s); return; }
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var wb = XLSX.read(e.target.result, { type: 'array' });
        function buscarHoja(wb, nombres) { for (var i=0;i<nombres.length;i++){ var buscar=nombres[i].toLowerCase().trim(); for (var j=0;j<wb.SheetNames.length;j++){ if(wb.SheetNames[j].toLowerCase().trim()===buscar) return wb.Sheets[wb.SheetNames[j]]; } } return wb.Sheets[wb.SheetNames[0]]||null; }
        var hoja = buscarHoja(wb, ['carga_masiva','carga masiva','directorio','unidades','data']);
        var filas = hoja ? XLSX.utils.sheet_to_json(hoja, { defval: '' }) : [];
        filas = filas.map(function(f){ var norm={}; Object.keys(f).forEach(function(k){ var kn=k.replace(/\s*\*\s*/g,'').trim(); norm[kn]=f[k]; }); return norm; });
        filas = filas.filter(function(f){ return f.n_unidad && String(f.n_unidad).trim()!=='' && f.tipo_unidad && String(f.tipo_unidad).trim()!==''; });
        if (filas.length === 0) { var errDiv=box.querySelector('.form-error'); if(errDiv){ errDiv.textContent='No se encontraron datos v\u00E1lidos. Hojas: '+wb.SheetNames.join(', '); errDiv.style.display='block'; } return; }
        mostrarPrevisualizacion(filas, comunidadId, box, overlay);
      } catch (err) { var errDiv=box.querySelector('.form-error'); if(errDiv){ errDiv.textContent='Error al leer el archivo: '+err.message; errDiv.style.display='block'; } }
    };
    reader.readAsArrayBuffer(file);
  }

  function ejecutarImportacion(filas, comunidadId, btn, errDiv, overlay) {

      var msg = '\u2713 ' + (r.creadas||0) + ' unidades \u00B7 ' + (r.copropietarios||0) + ' copropietarios \u00B7 ' + (r.residentes||0) + ' residentes';

  }

    instTit.textContent = 'Instalaciones y equipamientos';
    box.appendChild(instTit);

    var instActual = _parsearInstalaciones(c.instalaciones) || {};
    var instLista = document.createElement('div');
    instLista.style.cssText = 'display:flex;flex-direction:column;gap:6px;margin-bottom:4px';
    INSTALACIONES_OPTS.forEach(function(inst) {
      var item = document.createElement('label');
      item.style.cssText = 'display:flex;align-items:center;gap:12px;padding:9px 14px;border:1.5px solid var(--co-line);border-radius:var(--co-r-md);cursor:pointer;transition:border-color 0.13s;font-size:13px;font-weight:500;color:var(--co-ink)';
      var chk = document.createElement('input');
      chk.type = 'checkbox'; chk.id = 'ei-' + inst.key;
      chk.checked = !!instActual[inst.key];
      chk.style.cssText = 'width:16px;height:16px;accent-color:var(--co-orange);cursor:pointer;flex-shrink:0';
      chk.addEventListener('change', function() {
        item.style.borderColor = chk.checked ? 'var(--co-orange)' : 'var(--co-line)';
      });
      if (chk.checked) item.style.borderColor = 'var(--co-orange)';
      item.appendChild(chk);
      item.appendChild(document.createTextNode(inst.label));
      instLista.appendChild(item);
    });
    box.appendChild(instLista);

    var errDiv = document.createElement('div'); errDiv.className = 'form-error'; errDiv.style.display = 'none'; box.appendChild(errDiv);
    var btnGuardar = document.createElement('button'); btnGuardar.className = 'btn-guardar'; btnGuardar.textContent = 'Guardar cambios'; box.appendChild(btnGuardar);

    overlay.appendChild(box); document.body.appendChild(overlay);
    var cerrar = function() { overlay.remove(); };
    btnCerrar.addEventListener('click', cerrar);
    overlay.addEventListener('click', function(e) { if (e.target === overlay) cerrar(); });

    btnGuardar.addEventListener('click', function() {
      var nombre    = document.getElementById('e-nombre').value.trim();
      var direccion = document.getElementById('e-direccion').value.trim();
      var comuna    = document.getElementById('e-comuna').value.trim();
      if (!nombre || !direccion || !comuna) { errDiv.textContent = 'Nombre, direcci\u00F3n y comuna son obligatorios.'; errDiv.style.display='block'; return; }

      // Recoger instalaciones
      var nuevaInst = {};
      INSTALACIONES_OPTS.forEach(function(inst) {
        var chk = document.getElementById('ei-' + inst.key);
        if (chk && chk.checked) nuevaInst[inst.key] = true;
      });

      btnGuardar.disabled = true; btnGuardar.textContent = 'Guardando\u2026'; errDiv.style.display = 'none';
      var datos = {
        action:'editarComunidad', id:c.id,
        nombre:nombre, direccion:direccion, comuna:comuna,
        rut:document.getElementById('e-rut').value.trim(),
        unidades:document.getElementById('e-unidades').value||0,
        honorario:document.getElementById('e-honorario').value||0,
        modalidad:document.getElementById('e-modalidad').value,
        contactoNombre:document.getElementById('e-contacto').value.trim(),
        contactoTelefono:document.getElementById('e-telefono').value.trim(),
        fechaInicioContrato:document.getElementById('e-inicio').value.trim(),
        fechaRenovacion:document.getElementById('e-renovacion').value.trim(),
        estado:document.getElementById('e-estado').value,
        instalaciones:JSON.stringify(nuevaInst)
      };
      api('/comunidades', 'POST', datos).then(function(resp) {
        if (resp.ok && resp.data && resp.data.ok) {
          Object.assign(c, datos);
          // Actualizar también en _comunidades
          for (var i=0; i<_comunidades.length; i++) {
            if (_comunidades[i].id === c.id) { Object.assign(_comunidades[i], datos); break; }
          }
          btnGuardar.textContent = '\u2713 Cambios guardados';
          btnGuardar.style.background = 'var(--co-green)';
          setTimeout(function(){ overlay.remove(); abrirFicha(c); }, 900);
        } else {
          errDiv.textContent=(resp.data&&resp.data.error)||resp.error||'Error al guardar';
          errDiv.style.display='block'; btnGuardar.disabled=false; btnGuardar.textContent='Guardar cambios';
        }
      }).catch(function(err){
        errDiv.textContent='Error de conexi\u00F3n: '+err.message;
        errDiv.style.display='block'; btnGuardar.disabled=false; btnGuardar.textContent='Guardar cambios';
      });
    });
  }

  // ── RECARGA LISTADO ───────────────────────────────────────────
  function _recargarListado() {
    var root = document.getElementById('com-root');
    if (root) root.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--co-mute);font-size:13px;font-weight:600;gap:8px"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13.5 8A5.5 5.5 0 1 1 8 2.5"/><path d="M13.5 2.5v3h-3"/></svg>Actualizando\u2026</div>';
    api('/comunidades').then(function(resp) {
      var lista = null;
      if (resp.ok) {
        if (Array.isArray(resp.data)) lista = resp.data;
        else if (resp.data && Array.isArray(resp.data.data)) lista = resp.data.data;
        else if (resp.data && resp.data.ok && Array.isArray(resp.data.data)) lista = resp.data.data;
      }
      if (lista === null) { mostrarError('Error al actualizar listado'); return; }
      _comunidades = lista;
      window._comunidadesKpis = { activas: _comunidades.filter(function(c){ return c.estado==='activo'; }).length, alertas: 0, venc: 0 };
      if (typeof actualizarKpisComunidades === 'function') actualizarKpisComunidades();
      renderListado();
    }).catch(function(err){ mostrarError('Error de conexi\u00F3n: ' + err.message); });
  }

  function mostrarError(msg) {
    var root = document.getElementById('com-root');
    root.innerHTML = '';
    var div = document.createElement('div');
    div.className = 'com-error';
    div.textContent = 'Error al cargar Comunidades: ' + msg;
    root.appendChild(div);
  }

  init();

})();
</script>
