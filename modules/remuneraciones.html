  function _scrapingPrevired(contenedor) {
    // Mostrar loading
    var overlay = document.createElement('div'); overlay.className = 'modal-overlay';
    var box = document.createElement('div'); box.className = 'modal-box'; box.style.maxWidth = '560px';
    var ey = document.createElement('div'); ey.className = 'modal-eyebrow'; ey.textContent = 'Parámetros';
    var tt = document.createElement('div'); tt.className = 'modal-titulo'; tt.textContent = 'Actualizar indicadores desde Previred';
    var st = document.createElement('div'); st.className = 'modal-subtitulo'; st.textContent = 'Obteniendo datos del PDF oficial de Previred…';
    var btnCerrar = document.createElement('button'); btnCerrar.className = 'modal-close'; btnCerrar.textContent = '×';
    var cerrar = function() { overlay.remove(); };
    btnCerrar.addEventListener('click', cerrar);
    overlay.addEventListener('click', function(e) { if (e.target === overlay) cerrar(); });
    var contenidoModal = document.createElement('div'); contenidoModal.style.cssText = 'margin-top:16px';
    contenidoModal.innerHTML = '<div style="text-align:center;padding:24px;color:var(--co-mute)"><i class="ti ti-loader-2" aria-hidden="true" style="font-size:28px;display:block;margin-bottom:8px"></i>Consultando Previred…</div>';
    box.appendChild(btnCerrar); box.appendChild(ey); box.appendChild(tt); box.appendChild(st); box.appendChild(contenidoModal);
    overlay.appendChild(box); document.body.appendChild(overlay);

    api('/remuneraciones/parametros/scraping-previred').then(function(resp) {
      var data = resp.data && resp.data.data ? resp.data.data : (resp.data || {});
      if (!resp.data || !resp.data.ok) {
        contenidoModal.innerHTML = '<div class="rem-alerta danger" style="margin-top:8px"><i class="ti ti-alert-circle" aria-hidden="true"></i><div class="rem-alerta-txt">' + (resp.data && resp.data.error ? resp.data.error : 'Error al obtener datos.') + '</div></div>' +
          '<p style="font-size:12px;color:var(--co-mute);margin-top:12px">Puedes ingresar los valores manualmente usando el botón Editar.</p>';
        return;
      }

      var ind = data.indicadores || {};
      st.textContent = data.mes + ' — ' + (data.urlUsada ? 'PDF obtenido correctamente' : '');

      // Construir tabla de revisión
      var LABELS = {
        UF_MES:'UF mes actual', UF_MES_ANT:'UF mes anterior', UTM:'UTM',
        IMM:'Ingreso mínimo mensual ($)', IMM_CASA_PARTICULAR:'IMM Casa Particular ($)',
        TOPE_AFP_UF:'Tope imponible AFP (UF)', TOPE_IPS_UF:'Tope imponible IPS (UF)',
        TOPE_AFC_UF:'Tope imponible AFC/SC (UF)', TOPE_AFP_PESOS:'Tope imponible AFP ($)',
        SIS_TASA:'Tasa SIS (%)', EXPECTATIVA_VIDA:'Expectativa de Vida (%)',
        FONASA_CON_CCAF_CCAF:'Fonasa con CCAF — a CCAF (%)', FONASA_CON_CCAF_EMP:'Fonasa con CCAF — empleado (%)',
        CCAF_NO_ISAPRE:'CCAF no afiliados Isapre (%)',
        SC_EMP_INDEFINIDO:'SC empleador indefinido (%)', SC_TRAB_INDEFINIDO:'SC trabajador indefinido (%)',
        SC_EMP_PLAZO_FIJO:'SC empleador plazo fijo (%)', SC_EMP_11_ANOS:'SC empleador >11 años (%)',
        SC_TRAB_PLAZO_FIJO:'SC trabajador plazo fijo (%)',
        TRABAJO_PESADO_TASA:'Trabajo pesado total (%)', TRABAJO_MEN_PESADO:'Trabajo menos pesado total (%)',
        AFP_33_CAPITAL:'AFP Capital (%)', AFP_03_CUPRUM:'AFP Cuprum (%)', AFP_05_HABITAT:'AFP Habitat (%)',
        AFP_34_MODELO:'AFP Modelo (%)', AFP_29_PLANVITAL:'AFP PlanVital (%)',
        AFP_08_PROVIDA:'AFP ProVida (%)', AFP_35_UNO:'AFP Uno (%)',
        APV_TOPE_MENSUAL_UF:'APV tope mensual (UF)', APV_TOPE_ANUAL_UF:'APV tope anual (UF)',
        DEP_CONV_TOPE_UF:'Depósito convenido tope anual (UF)',
        AF_TRAMO_A_MONTO:'Asig. familiar tramo A ($)', AF_TRAMO_B_MONTO:'Asig. familiar tramo B ($)',
        AF_TRAMO_C_MONTO:'Asig. familiar tramo C ($)',
        AF_LIMITE_A:'Límite tramo A ($)', AF_LIMITE_B:'Límite tramo B ($)', AF_LIMITE_C:'Límite tramo C ($)'
      };

      var html = '<div class="rem-alerta warn" style="margin-bottom:14px"><i class="ti ti-alert-triangle" aria-hidden="true"></i>' +
        '<div class="rem-alerta-txt"><b>Revisa los valores antes de guardar.</b> ' + (data.advertencia || '') + '</div></div>';

      html += '<div style="overflow-x:auto"><table class="rem-table" style="margin-bottom:14px">' +
        '<thead><tr><th>Indicador</th><th>Valor extraído</th></tr></thead><tbody>';

      var tieneValores = false;
      Object.keys(LABELS).forEach(function(k) {
        if (ind[k] !== undefined && ind[k] !== null) {
          tieneValores = true;
          var CLAVES_UF_VAL  = ['UF_MES','UF_MES_ANT'];
          var CLAVES_PESOS   = ['IMM','IMM_CASA_PARTICULAR','UTM','AF_LIMITE_A','AF_LIMITE_B','AF_LIMITE_C'];
          var CLAVES_TOPE_UF = ['TOPE_AFP_UF','TOPE_IPS_UF','TOPE_AFC_UF'];
          var CLAVES_APV_UF  = ['APV_TOPE_MENSUAL_UF','APV_TOPE_ANUAL_UF','DEP_CONV_TOPE_UF'];
          // Tope AFP pesos — para calcular junto a UF
          var ufMes = ind['UF_MES'] || 0;
          var topeUfPesos = {
            TOPE_AFP_UF: Math.round((ind['TOPE_AFP_UF']||0) * ufMes),
            TOPE_IPS_UF: Math.round((ind['TOPE_IPS_UF']||0) * ufMes),
            TOPE_AFC_UF: Math.round((ind['TOPE_AFC_UF']||0) * ufMes),
            APV_TOPE_MENSUAL_UF: Math.round((ind['APV_TOPE_MENSUAL_UF']||0) * ufMes),
            APV_TOPE_ANUAL_UF:   Math.round((ind['APV_TOPE_ANUAL_UF']||0)   * ufMes),
            DEP_CONV_TOPE_UF:    Math.round((ind['DEP_CONV_TOPE_UF']||0)    * ufMes),
          };
          var fmt;
          if (CLAVES_UF_VAL.includes(k))
            fmt = '$' + ind[k].toLocaleString('es-CL');
          else if (CLAVES_PESOS.includes(k) || k.includes('MONTO') || k.includes('PESOS'))
            fmt = '$' + Math.round(ind[k]).toLocaleString('es-CL');
          else if (CLAVES_TOPE_UF.includes(k) || CLAVES_APV_UF.includes(k))
            fmt = ind[k] + ' UF / $' + (topeUfPesos[k]||0).toLocaleString('es-CL');
          else
            fmt = ind[k] + '%';
          html += '<tr><td>' + LABELS[k] + '</td><td><b>' + fmt + '</b></td></tr>';
        }
      });

      if (!tieneValores) {
        html += '<tr><td colspan="2" style="text-align:center;color:var(--co-mute)">No se pudieron extraer valores del PDF. Ingresa los datos manualmente.</td></tr>';
      }
      html += '</tbody></table></div>';

      contenidoModal.innerHTML = html;

      if (tieneValores) {
        var errDiv = document.createElement('div'); errDiv.className = 'form-error'; errDiv.style.display = 'none';
        var btnGuardar = document.createElement('button'); btnGuardar.className = 'btn-guardar';
        btnGuardar.textContent = 'Guardar indicadores actualizados';
        contenidoModal.appendChild(errDiv);
        contenidoModal.appendChild(btnGuardar);

        btnGuardar.addEventListener('click', function() {
          btnGuardar.disabled = true; btnGuardar.textContent = 'Guardando…'; errDiv.style.display = 'none';
          var partesMes = data.mes ? data.mes.split(' ') : [];
          var MESES = {'Enero':'01','Febrero':'02','Marzo':'03','Abril':'04','Mayo':'05','Junio':'06',
                       'Julio':'07','Agosto':'08','Septiembre':'09','Octubre':'10','Noviembre':'11','Diciembre':'12'};
          var periodo = partesMes.length === 2
            ? partesMes[1] + '-' + (MESES[partesMes[0]] || '01')
            : new Date().getFullYear() + '-' + String(new Date().getMonth()+1).padStart(2,'0');

          // Una sola llamada con todos los indicadores
          api('/remuneraciones/parametros/indicadores/masivo', 'POST', {
            action: 'guardarIndicadoresMasivo',
            indicadores: ind,
            periodo: periodo,
            usuario: 'sistema-scraping'
          }).then(function(resp) {
            var ok = resp.ok && resp.data && (resp.data.ok || (resp.data.data && resp.data.data.ok));
            if (ok) {
              btnGuardar.textContent = '✓ Indicadores guardados';
              btnGuardar.style.background = '#3B6D11';
              _indicadores = [];
              setTimeout(function() {
                overlay.remove();
                // Recargar subtab completa
                var subContenido = document.getElementById('rem-ind-contenedor');
                if (subContenido) {
                  subContenido.innerHTML = '<div style="text-align:center;color:var(--co-mute);padding:16px">Cargando indicadores…</div>';
                  api('/remuneraciones/parametros/indicadores').then(function(r) {
                    _indicadores = (r.data && r.data.data) ? r.data.data : (r.data || []);
                    _renderIndicadoresData(subContenido, _indicadores);
                  });
                }
              }, 1200);
            } else {
              var err = (resp.data && resp.data.error) || resp.error || 'Error al guardar';
              errDiv.textContent = err; errDiv.style.display = 'block';
              btnGuardar.disabled = false; btnGuardar.textContent = 'Guardar indicadores actualizados';
            }
          }).catch(function(e) {
            errDiv.textContent = 'Error de conexión: ' + e.message;
            errDiv.style.display = 'block';
            btnGuardar.disabled = false; btnGuardar.textContent = 'Guardar indicadores actualizados';
          });
        });
      }
    }).catch(function(e) {
      contenidoModal.innerHTML = '<div class="rem-alerta danger"><i class="ti ti-alert-circle" aria-hidden="true"></i><div class="rem-alerta-txt">Error de conexión: ' + e.message + '</div></div>';
    });
  }

  function _renderIndicadoresData(el, lista) {
    if (!lista.length) {
      el.innerHTML = '<div style="text-align:center;color:var(--co-mute);padding:24px">Sin indicadores cargados.</div>';
      return;
    }

    // Construir mapa clave→valor
    var mapa = {};
    lista.forEach(function(d) { mapa[d.clave] = Number(d.valor) || 0; });

    var ufMes = mapa['UF_MES'] || 0;

    function fmtPesos(v)  { return '$' + Math.round(v).toLocaleString('es-CL'); }
    function fmtUFPesos(uf) {
      return uf + ' UF / ' + fmtPesos(Math.round(uf * ufMes));
    }
    function fmtPct(v)    { return v + '%'; }
    function fmtUFVal(v)  { return '$' + v.toLocaleString('es-CL'); }

    function mkCard(titulo, filas) {
      var card = document.createElement('div'); card.className = 'rem-param-card';
      card.innerHTML = '<div class="rem-param-card-title">' + titulo + '</div>';
      filas.forEach(function(f) {
        if (f.val === undefined || f.val === null) return;
        var row = document.createElement('div'); row.className = 'rem-param-row';
        row.innerHTML = '<span class="rem-param-key">' + f.label + '</span><span class="rem-param-val">' + f.val + '</span>';
        card.appendChild(row);
      });
      return card;
    }

    el.innerHTML = '';
    var grid = document.createElement('div'); grid.className = 'rem-param-grid';

    // Card 1: Valores generales
    grid.appendChild(mkCard('Valores generales ' + new Date().getFullYear(), [
      { label: 'UF mes actual',              val: mapa['UF_MES']              ? fmtUFVal(mapa['UF_MES'])              : null },
      { label: 'UF mes anterior',            val: mapa['UF_MES_ANT']          ? fmtUFVal(mapa['UF_MES_ANT'])          : null },
      { label: 'UTM',                        val: mapa['UTM']                  ? fmtPesos(mapa['UTM'])                  : null },
      { label: 'Ingreso mínimo mensual',val: mapa['IMM']                  ? fmtPesos(mapa['IMM'])                  : null },
      { label: 'IMM Casa Particular',        val: mapa['IMM_CASA_PARTICULAR']  ? fmtPesos(mapa['IMM_CASA_PARTICULAR'])  : null },
      { label: 'Tope imponible AFP',         val: mapa['TOPE_AFP_UF']          ? fmtUFPesos(mapa['TOPE_AFP_UF'])       : null },
      { label: 'Tope imponible IPS',         val: mapa['TOPE_IPS_UF']          ? fmtUFPesos(mapa['TOPE_IPS_UF'])       : null },
      { label: 'Tope imponible AFC/SC',      val: mapa['TOPE_AFC_UF']          ? fmtUFPesos(mapa['TOPE_AFC_UF'])       : null },
      { label: 'Tasa SIS',                   val: mapa['SIS_TASA']             ? fmtPct(mapa['SIS_TASA'])              : null },
      { label: 'Expectativa de Vida',        val: mapa['EXPECTATIVA_VIDA']     ? fmtPct(mapa['EXPECTATIVA_VIDA'])      : null },
    ]));

    // Card 2: AFP — con columna 0.1% cargo empleador
    var AFP_NOMBRES = { AFP_33_CAPITAL:'Capital', AFP_03_CUPRUM:'Cuprum', AFP_05_HABITAT:'Habitat',
                        AFP_34_MODELO:'Modelo', AFP_29_PLANVITAL:'PlanVital', AFP_08_PROVIDA:'ProVida', AFP_35_UNO:'Uno' };
    var cardAfp = document.createElement('div'); cardAfp.className = 'rem-param-card';
    cardAfp.innerHTML = '<div class="rem-param-card-title">Tasas AFP vigentes</div>';
    // Header tabla AFP
    var afpHdr = document.createElement('div');
    afpHdr.style.cssText = 'display:grid;grid-template-columns:1fr 80px 80px 90px;gap:4px;padding:4px 0 6px;border-bottom:1px solid var(--co-line);font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--co-mute)';
    afpHdr.innerHTML = '<span>AFP</span><span style="text-align:right">Trabajador</span><span style="text-align:right">Empleador</span><span style="text-align:right">Total</span>';
    cardAfp.appendChild(afpHdr);
    Object.keys(AFP_NOMBRES).forEach(function(k) {
      if (!mapa[k]) return;
      var trab = mapa[k]; var emp = 0.1; var total = Math.round((trab + emp) * 100) / 100;
      var row = document.createElement('div');
      row.style.cssText = 'display:grid;grid-template-columns:1fr 80px 80px 90px;gap:4px;padding:6px 0;border-top:1px solid var(--co-line);font-size:12px;align-items:center';
      row.innerHTML = '<span style="color:var(--co-mute)">' + AFP_NOMBRES[k] + '</span>' +
        '<span style="text-align:right;font-weight:700">' + trab + '%</span>' +
        '<span style="text-align:right;color:var(--co-mute)">' + emp + '%</span>' +
        '<span style="text-align:right;font-weight:700">' + total + '%</span>';

    grid2.appendChild(mkCard('Salud y CCAF', [
      { label: 'Fonasa sin CCAF',            val: '7%' },
      { label: 'Fonasa con CCAF (empleado)', val: mapa['FONASA_CON_CCAF_EMP']  ? fmtPct(mapa['FONASA_CON_CCAF_EMP'])  : null },
      { label: 'Fonasa con CCAF (a CCAF)',   val: mapa['FONASA_CON_CCAF_CCAF'] ? fmtPct(mapa['FONASA_CON_CCAF_CCAF']) : null },

    var grid3 = document.createElement('div'); grid3.className = 'rem-param-grid';
    grid3.appendChild(mkCard('APV y Depósito Convenido', [
      { label: 'APV tope mensual',           val: mapa['APV_TOPE_MENSUAL_UF']  ? fmtUFPesos(mapa['APV_TOPE_MENSUAL_UF'])  : null },
      { label: 'APV tope anual',             val: mapa['APV_TOPE_ANUAL_UF']    ? fmtUFPesos(mapa['APV_TOPE_ANUAL_UF'])    : null },
      { label: 'Dep. Convenido tope anual',  val: mapa['DEP_CONV_TOPE_UF']     ? fmtUFPesos(mapa['DEP_CONV_TOPE_UF'])     : null },

      { label: 'Trabajo menos pesado total', val: mapa['TRABAJO_MEN_PESADO']   ? fmtPct(mapa['TRABAJO_MEN_PESADO'])   : null },
    ]));
    el.appendChild(grid3);

    el.appendChild(_divider());

    var secLabel2 = document.createElement('div'); secLabel2.className = 'rem-section-label';
    secLabel2.textContent = 'Asignación familiar — tramos y montos'; el.appendChild(secLabel2);
    var gridAF = document.createElement('div'); gridAF.className = 'rem-param-grid';
    gridAF.appendChild(mkCard('Monto por carga ($)', [
      { label: 'Tramo A', val: mapa['AF_TRAMO_A_MONTO'] !== undefined ? fmtPesos(mapa['AF_TRAMO_A_MONTO']) : null },
      { label: 'Tramo B', val: mapa['AF_TRAMO_B_MONTO'] !== undefined ? fmtPesos(mapa['AF_TRAMO_B_MONTO']) : null },
      { label: 'Tramo C', val: mapa['AF_TRAMO_C_MONTO'] !== undefined ? fmtPesos(mapa['AF_TRAMO_C_MONTO']) : null },
      { label: 'Tramo D', val: '—' },
    ]));
    gridAF.appendChild(mkCard('Renta máxima por tramo', [
      { label: 'Límite tramo A', val: mapa['AF_LIMITE_A'] ? fmtPesos(mapa['AF_LIMITE_A']) : null },
      { label: 'Límite tramo B', val: mapa['AF_LIMITE_B'] ? fmtPesos(mapa['AF_LIMITE_B']) : null },
      { label: 'Límite tramo C', val: mapa['AF_LIMITE_C'] ? fmtPesos(mapa['AF_LIMITE_C']) : null },
    ]));
    el.appendChild(gridAF);

    el.appendChild(_divider());
    // Tabla impuesto 2a categoría — solo si hay datos IMP2
    var tieneImp = lista.some(function(d) { return d.clave.startsWith('IMP2_'); });
    if (tieneImp) {

      var lfImp = document.createElement('div'); lfImp.className = 'rem-section-label';
      lfImp.textContent = 'Tabla impuesto 2ª categoría — tramos mensuales'; el.appendChild(lfImp);
      var tbWrap = document.createElement('div'); tbWrap.style.overflowX = 'auto';
      var table = document.createElement('table'); table.className = 'rem-table';
      table.innerHTML = '<thead><tr><th>Tramo</th><th>Hasta</th><th>Tasa</th><th>Rebaja</th></tr></thead>';
      var tbodyImp = document.createElement('tbody');
      var tramos = [
        { num:1, hasta:'IMP2_TRAMO1_HASTA', tasa:null,               rebaja:null },
        { num:2, hasta:'IMP2_TRAMO2_HASTA', tasa:'IMP2_TRAMO2_TASA', rebaja:'IMP2_TRAMO2_REBAJA' },
        { num:3, hasta:'IMP2_TRAMO3_HASTA', tasa:'IMP2_TRAMO3_TASA', rebaja:'IMP2_TRAMO3_REBAJA' },
        { num:4, hasta:'IMP2_TRAMO4_HASTA', tasa:'IMP2_TRAMO4_TASA', rebaja:'IMP2_TRAMO4_REBAJA' },
        { num:5, hasta:'IMP2_TRAMO5_HASTA', tasa:'IMP2_TRAMO5_TASA', rebaja:'IMP2_TRAMO5_REBAJA' },
        { num:6, hasta:'IMP2_TRAMO6_HASTA', tasa:'IMP2_TRAMO6_TASA', rebaja:'IMP2_TRAMO6_REBAJA' },
        { num:7, hasta:'IMP2_TRAMO7_HASTA', tasa:'IMP2_TRAMO7_TASA', rebaja:'IMP2_TRAMO7_REBAJA' },
        { num:8, hasta:null,                tasa:'IMP2_TRAMO8_TASA', rebaja:'IMP2_TRAMO8_REBAJA' },

      tramos.forEach(function(t) {
        var tr = document.createElement('tr');
        var hasta  = t.hasta  ? (mapa[t.hasta]  ? fmtPesos(mapa[t.hasta])  : '—') : 'En adelante';
        var tasa   = t.tasa   ? (mapa[t.tasa]   ? fmtPct(mapa[t.tasa])     : '—') : 'Exento';
        var rebaja = t.rebaja ? (mapa[t.rebaja] ? fmtPesos(mapa[t.rebaja]) : '—') : '—';
        tr.innerHTML = '<td>Tramo ' + t.num + '</td><td>' + hasta + '</td><td><b>' + tasa + '</b></td><td>' + rebaja + '</td>';
        tbodyImp.appendChild(tr);
      });
      table.appendChild(tbodyImp); tbWrap.appendChild(table); el.appendChild(tbWrap);
    } else {
      var notaImp = document.createElement('p');
      notaImp.style.cssText = 'font-size:11px;color:var(--co-mute);margin-top:16px;padding:10px 14px;background:var(--co-bg);border-radius:8px;border:1px solid var(--co-line)';
      notaImp.innerHTML = '<i class="ti ti-info-circle" style="color:var(--co-orange)"></i> La tabla de impuesto 2ª categoría se carga con los datos base — usa <b>Cargar datos base</b> para inicializar o restaurar.';
      el.appendChild(notaImp);
    }
  }

  // ── PLANTILLAS ONBOARDING ─────────────────────────────────────────────────
  function renderPlantillas(el) {
    el.innerHTML = '<div class="module-loading" style="min-height:180px"><div class="ml-iso-wrap"><div class="ml-iso" aria-hidden="true"></div></div><div class="ml-text"><div class="ml-brand"><b>co</b>proactiva</div><div class="ml-status"><span class="ml-status-dot"></span>Cargando plantilla</div></div></div>';
    var cargarYRenderizar = function() {
      el.innerHTML = '';
      var hdr = document.createElement('div'); hdr.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px';
      var secLabel = document.createElement('div'); secLabel.className = 'rem-section-label'; secLabel.style.marginBottom = '0'; secLabel.textContent = 'Plantillas de onboarding por cargo';
      var btnNuevo = document.createElement('button'); btnNuevo.className = 'rem-btn-pri'; btnNuevo.innerHTML = '<i class="ti ti-plus" aria-hidden="true"></i> Agregar ítem';
      btnNuevo.addEventListener('click', function() { abrirModalItem(null, _cargoActivo); });
      hdr.appendChild(secLabel); hdr.appendChild(btnNuevo); el.appendChild(hdr);

      var cargoList = document.createElement('div'); cargoList.className = 'rem-cargo-list';
      var cargosRender = [{ id:'*', label:'Todos (generales)' }].concat(_cargos.map(function(c) { return { id: c.nombre, label: c.nombre }; }));
      cargosRender.forEach(function(c) {
        var chip = document.createElement('button');
        chip.className = 'rem-cargo-chip' + (c.id === _cargoActivo ? ' act' : '');
        chip.textContent = c.label;
        chip.addEventListener('click', function() {
          _cargoActivo = c.id;
          cargoList.querySelectorAll('.rem-cargo-chip').forEach(function(b) { b.classList.remove('act'); });
          chip.classList.add('act');
          itemsContenedor.innerHTML = '<div style="text-align:center;color:var(--co-mute);padding:16px">Cargando…</div>';
          _cargarItemsPlantilla(itemsContenedor, _cargoActivo);
        });
        cargoList.appendChild(chip);
      });
      el.appendChild(cargoList);

      var itemsContenedor = document.createElement('div'); itemsContenedor.id = 'rem-plt-items'; el.appendChild(itemsContenedor);
      _cargarItemsPlantilla(itemsContenedor, _cargoActivo);
    };

    if (_cargos.length > 0) {
      cargarYRenderizar();
    } else {
      api('/remuneraciones/parametros/cargos').then(function(resp) {
        _cargos = (resp.data && resp.data.data) ? resp.data.data : (resp.data || []);
        cargarYRenderizar();
      }).catch(function() { cargarYRenderizar(); });
    }
  }

  function _cargarItemsPlantilla(el, cargo) {
    if (_plantillas.length > 0 && _plantillasCargo === cargo) {
      _renderItemsPlantilla(el, _plantillas, cargo);
      return;
    }
    el.innerHTML = '<div class="module-loading" style="min-height:180px"><div class="ml-iso-wrap"><div class="ml-iso" aria-hidden="true"></div></div><div class="ml-text"><div class="ml-brand"><b>co</b>proactiva</div><div class="ml-status"><span class="ml-status-dot"></span>Cargando plantilla</div></div></div>';
    var url = cargo === '*'
      ? '/remuneraciones/parametros/plantillas?todas=true'
      : '/remuneraciones/parametros/plantillas?cargo=' + encodeURIComponent(cargo);
    api(url).then(function(resp) {
      _plantillas = (resp.data && resp.data.data) ? resp.data.data : (resp.data || []);
      _plantillasCargo = cargo;
      _renderItemsPlantilla(el, _plantillas, cargo);
    }).catch(function() {
      el.innerHTML = '<div style="text-align:center;color:#A32D2D;padding:16px">Error al cargar plantilla.</div>';
    });
  }

  function _renderItemsPlantilla(el, items, cargo) {
    el.innerHTML = '';
    if (!items.length) {
      el.innerHTML = '<div style="text-align:center;color:var(--co-mute);padding:24px">No hay ítems para este cargo.</div>';
      return;
    }
    var cats = {};
    items.forEach(function(it) { if (!cats[it.categoria]) cats[it.categoria] = []; cats[it.categoria].push(it); });
    Object.keys(cats).forEach(function(cat) {
      var secLabel = document.createElement('div'); secLabel.className = 'rem-section-label'; secLabel.textContent = cat; el.appendChild(secLabel);
      cats[cat].forEach(function(it) {
        // nivelProteccion: 'sistema' | 'administrador' | 'borrador' (fallback desde esLegal)
        var nivel = it.nivelProteccion || (it.esLegal ? 'sistema' : 'borrador');
        var claseNivel = nivel === 'sistema' ? ' nivel-sistema' : (nivel === 'administrador' ? ' nivel-administrador' : '');
        var div = document.createElement('div'); div.className = 'rem-plt-item' + claseNivel;
        var nombre = document.createElement('span'); nombre.className = 'rem-plt-name'; nombre.textContent = it.nombre;
        var catPill = document.createElement('span'); catPill.className = 'rem-plt-cat'; catPill.textContent = it.cargo === '*' ? 'General' : it.cargo;
        var badges = document.createElement('div'); badges.className = 'rem-plt-badges';
        if (nivel === 'sistema') {
          var b = document.createElement('span'); b.className = 'rem-pill legal'; b.textContent = 'Sistema'; badges.appendChild(b);
        } else if (nivel === 'administrador') {
          var b = document.createElement('span'); b.className = 'rem-pill blue'; b.textContent = 'Protegido'; badges.appendChild(b);
        }
        if (it.requiereFirma)   { var b = document.createElement('span'); b.className = 'rem-pill blue'; b.textContent = 'Firma'; badges.appendChild(b); }
        if (it.requiereAdjunto) { var b = document.createElement('span'); b.style.cssText='background:#EAF3DE;color:#3B6D11;display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700'; b.textContent = 'Adjunto'; badges.appendChild(b); }
        var plazo = document.createElement('span'); plazo.className = 'rem-plt-plazo'; plazo.textContent = 'Día ' + it.plazosDias;
        var actions = document.createElement('div'); actions.className = 'rem-plt-actions';
        var btnEdit = document.createElement('button'); btnEdit.className = 'rem-ico-btn'; btnEdit.title = 'Editar'; btnEdit.innerHTML = '<i class="ti ti-edit" aria-hidden="true"></i>';
        (function(item) {
          btnEdit.addEventListener('click', function(e) { e.stopPropagation(); abrirModalItem(item, cargo); });
        })(it);
        var btnDel = document.createElement('button');
        if (nivel === 'sistema') {
          btnDel.className = 'rem-ico-btn rem-lock'; btnDel.innerHTML = '<i class="ti ti-trash" aria-hidden="true"></i>'; btnDel.title = 'Ítem de sistema — no eliminable';
        } else {
          btnDel.className = 'rem-ico-btn danger'; btnDel.innerHTML = '<i class="ti ti-trash" aria-hidden="true"></i>';
          (function(itemId) {
            btnDel.addEventListener('click', function(e) { e.stopPropagation(); _eliminarItem(itemId, el, cargo); });
          })(it.id);
        }
        actions.appendChild(btnEdit); actions.appendChild(btnDel);
        div.appendChild(nombre); div.appendChild(catPill); div.appendChild(badges); div.appendChild(plazo); div.appendChild(actions);
        el.appendChild(div);
      });
    });
    var nota = document.createElement('p');
    nota.style.cssText = 'font-size:11px;color:var(--co-mute);margin-top:10px;display:flex;align-items:center;gap:4px';
    nota.innerHTML = '<i class="ti ti-lock" aria-hidden="true" style="color:var(--co-orange);font-size:13px"></i> Ítems <b style="color:var(--co-ink)">&nbsp;Sistema&nbsp;</b> son definidos por CoproActiva y no pueden eliminarse.';
    el.appendChild(nota);
  }

  // ── MODAL AGREGAR / EDITAR ÍTEM PLANTILLA ────────────────────────────────
  function abrirModalItem(item, cargo) {
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.addEventListener('click', function(e) { if (e.target === overlay) cerrar(); });

    var box = document.createElement('div');
    box.className = 'modal-box';
    box.style.maxWidth = '580px';

    var btnX = document.createElement('button'); btnX.className = 'modal-close'; btnX.textContent = '×';
    btnX.addEventListener('click', cerrar);
    box.appendChild(btnX);

    var ey = document.createElement('div'); ey.className = 'modal-eyebrow'; ey.textContent = 'Parámetros · Onboarding'; box.appendChild(ey);
    var tt = document.createElement('div'); tt.className = 'modal-titulo'; tt.textContent = item ? 'Editar ítem' : 'Agregar ítem'; box.appendChild(tt);
    var st = document.createElement('div'); st.className = 'modal-subtitulo'; st.textContent = 'Plantilla de onboarding'; box.appendChild(st);

    var form = document.createElement('div');

    function secTitle(txt) {
      var d = document.createElement('div');
      d.style.cssText = 'font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--co-mute);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--co-line)';
      d.textContent = txt; return d;
    }
    function field(label, el, full) {
      var grp = document.createElement('div');
      grp.className = 'form-group' + (full ? ' form-full' : '');
      var lbl = document.createElement('label'); lbl.textContent = label;
      grp.appendChild(lbl); grp.appendChild(el); return grp;
    }
    function mkInput(type, placeholder, val) {
      var i = document.createElement('input');
      i.type = type || 'text'; i.placeholder = placeholder || '';
      if (val !== undefined && val !== null) i.value = val; return i;
    }
    function mkSelect(opciones, val) {
      var s = document.createElement('select');
      opciones.forEach(function(o) {
        var opt = document.createElement('option');
        opt.value = o.v !== undefined ? o.v : o;
        opt.textContent = o.l !== undefined ? o.l : o;
        if (val !== undefined && String(opt.value) === String(val)) opt.selected = true;
        s.appendChild(opt);
      });
      return s;
    }
    function mkCheck(label, checked) {
      var wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--co-ink);cursor:pointer';
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!checked;
      cb.style.cssText = 'width:15px;height:15px;accent-color:var(--co-orange)';
      wrap.appendChild(cb); wrap.appendChild(document.createTextNode(label));
      wrap._cb = cb; return wrap;
    }

    // nivel actual
    var nivelActual = item ? (item.nivelProteccion || (item.esLegal ? 'sistema' : 'borrador')) : 'borrador';
    var esSistema = nivelActual === 'sistema';

    form.appendChild(secTitle('Identificación'));
    var grid1 = document.createElement('div'); grid1.className = 'form-grid';

    var fNombre = mkInput('text', 'Ej: Firma contrato de trabajo', item ? item.nombre : '');
    if (esSistema) fNombre.disabled = true;

    var cargosOpts = [{ v:'*', l:'Todos los cargos' }].concat(_cargos.map(function(c) { return { v: c.nombre, l: c.nombre }; }));
    var fCargo = mkSelect(cargosOpts, item ? item.cargo : (cargo || '*'));
    if (esSistema) fCargo.disabled = true;

    var fCategoria = mkSelect([
      {v:'Documentación',l:'Documentación'},
      {v:'Prevención',l:'Prevención'},
      {v:'Legal',l:'Legal'},
      {v:'Inducción',l:'Inducción'},
      {v:'EPP',l:'EPP'},
      {v:'Accesos',l:'Accesos'}
    ], item ? item.categoria : 'Documentación');
    if (esSistema) fCategoria.disabled = true;

    var fResponsable = mkSelect([
      {v:'administrador',l:'Administrador'},
      {v:'trabajador',l:'Trabajador'}
    ], item ? item.responsable : 'administrador');

    var fPlazo = mkInput('number', '5', item ? item.plazosDias : 5);
    fPlazo.min = 1; fPlazo.max = 90; fPlazo.style.width = '100px';

    grid1.appendChild(field('Nombre del ítem *', fNombre, true));
    grid1.appendChild(field('Cargo', fCargo));
    grid1.appendChild(field('Categoría *', fCategoria));
    grid1.appendChild(field('Responsable', fResponsable));
    grid1.appendChild(field('Plazo (días desde ingreso) *', fPlazo));
    form.appendChild(grid1);

    form.appendChild(secTitle('Propiedades'));
    var wFirma   = mkCheck('Requiere firma del trabajador',   item ? item.requiereFirma   : false);
    var wAdjunto = mkCheck('Requiere adjuntar documento',     item ? item.requiereAdjunto : false);
    var fgFirma   = document.createElement('div'); fgFirma.className = 'form-group form-full'; fgFirma.appendChild(wFirma);
    var fgAdjunto = document.createElement('div'); fgAdjunto.className = 'form-group form-full'; fgAdjunto.appendChild(wAdjunto);
    form.appendChild(fgFirma);
    form.appendChild(fgAdjunto);

    form.appendChild(secTitle('Nivel de protección'));
    var fNivel = mkSelect([
      {v:'borrador',    l:'Borrador — eliminable libremente'},
      {v:'administrador',l:'Administrador — protegido por el administrador'},
      {v:'sistema',     l:'Sistema — definido por CoproActiva (no eliminable)'}
    ], nivelActual);
    if (esSistema) fNivel.disabled = true;
    var fgNivel = document.createElement('div'); fgNivel.className = 'form-group form-full'; fgNivel.appendChild(fNivel);
    form.appendChild(fgNivel);

    // Advertencia nivel sistema
    if (esSistema) {
      var aviso = document.createElement('div');
      aviso.className = 'rem-alerta warn';
      aviso.style.marginTop = '12px';
      aviso.innerHTML = '<i class="ti ti-alert-triangle" aria-hidden="true"></i><div class="rem-alerta-txt">Ítem de nivel <b>Sistema</b> — solo puedes editar el responsable y plazo. El nombre, cargo, categoría y nivel no son modificables.</div>';
      form.appendChild(aviso);
    }

    var errDiv = document.createElement('div'); errDiv.className = 'form-error'; form.appendChild(errDiv);

    var btnGuardar = document.createElement('button'); btnGuardar.className = 'btn-guardar';
    btnGuardar.textContent = item ? 'Guardar cambios' : 'Crear ítem';
    btnGuardar.addEventListener('click', function() {
      var nombre = fNombre.value.trim();
      if (!nombre) { errDiv.textContent = 'El nombre es obligatorio.'; return; }
      if (!fPlazo.value || Number(fPlazo.value) < 1) { errDiv.textContent = 'El plazo debe ser al menos 1 día.'; return; }
      errDiv.textContent = '';
      btnGuardar.disabled = true;
      btnGuardar.textContent = 'Guardando…';

      var datos = {
        nombre:           nombre,
        cargo:            fCargo.value,
        categoria:        fCategoria.value,
        responsable:      fResponsable.value,
        plazosDias:       Number(fPlazo.value),
        requiereFirma:    wFirma._cb.checked,
        requiereAdjunto:  wAdjunto._cb.checked,
        nivelProteccion:  fNivel.value
      };

      if (item) {
        datos.action = 'editarItemPlantilla';
        datos.id = item.id;
      } else {
        datos.action = 'crearItemPlantilla';
      }

      api('/remuneraciones/parametros/plantillas', 'POST', datos).then(function(resp) {
        var ok = resp.data && (resp.data.ok || (resp.data.data && resp.data.data.ok));
        if (ok) {
          _plantillas = [];
          _plantillasCargo = null;
          var contenedor = document.getElementById('rem-plt-items');
          if (contenedor) _cargarItemsPlantilla(contenedor, _cargoActivo);
          cerrar();
        } else {
          errDiv.textContent = (resp.data && resp.data.error) ? resp.data.error : 'Error al guardar.';
          btnGuardar.disabled = false;
          btnGuardar.textContent = item ? 'Guardar cambios' : 'Crear ítem';
        }
      }).catch(function() {
        errDiv.textContent = 'Error de conexión.';
        btnGuardar.disabled = false;
        btnGuardar.textContent = item ? 'Guardar cambios' : 'Crear ítem';
      });
    });
    form.appendChild(btnGuardar);

    box.appendChild(form);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    function cerrar() { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }
  }

  function _eliminarItem(id, contenedor, cargo) {
    if (!confirm('\u00BFEliminar este \u00EDtem de la plantilla?')) return;
    api('/remuneraciones/parametros/plantillas', 'POST', { action:'eliminarItemPlantilla', id:id })
      .then(function(resp) {
        if (resp.data && resp.data.ok) { _plantillas = []; _plantillasCargo = null; _cargarItemsPlantilla(contenedor, cargo); }
        else alert('Error: ' + (resp.data && resp.data.error ? resp.data.error : 'No se pudo eliminar.'));
      });
  }

  // ── Helpers UI ────────────────────────────────────────────────────────────
  function _avisoSinComunidad() {
    var div = document.createElement('div'); div.className = 'rem-empty';
    div.innerHTML = '<i class="ti ti-building-estate" aria-hidden="true"></i><div class="rem-empty-title">Selecciona una comunidad</div><div class="rem-empty-sub">Usa el selector en la parte superior derecha para elegir la comunidad con la que deseas trabajar.</div>';
    return div;
  }
  function _proximamente(ico, titulo, sub) {
    var div = document.createElement('div'); div.className = 'rem-empty';
    div.innerHTML = '<i class="ti ' + ico + '" aria-hidden="true"></i><div class="rem-empty-title">' + titulo + '</div><div class="rem-empty-sub">' + sub + '<br>Disponible en la pr\u00F3xima versi\u00F3n.</div>';
    return div;
  }
  function _divider() {
    var d = document.createElement('div'); d.className = 'rem-divider'; return d;
  }

  init();

})();
</script>
