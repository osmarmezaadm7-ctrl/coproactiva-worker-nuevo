<div id="rem-root">
  <div class="module-loading">
    <div class="ml-iso-wrap"><div class="ml-iso" aria-hidden="true"></div></div>
    <div class="ml-text">
      <div class="ml-brand"><b>co</b>proactiva</div>
      <div class="ml-status"><span class="ml-status-dot"></span>Cargando Remuneraciones</div>
    </div>
  </div>
</div>

<script>
(function() {

  var WORKER_URL = 'https://coproactiva-worker-nuevo.osmarmeza-adm7.workers.dev';
  function _token() { return sessionStorage.getItem('token') || ''; }

  var _tabActiva    = 'panel';
  var _subtabParam  = 'indicadores';
  var _cargoActivo  = '*';
  var _colaboradores = [];
  var _indicadores   = [];
  var _plantillas    = [];
  var _cargos        = [];
  var _filtroActivo  = 'vigentes';
  var _colaboradoresComunidadId = null;
  var _plantillasCargo = null;

  // ── API ───────────────────────────────────────────────────────────────────
  function api(path, method, body) {
    method = method || 'GET';
    var opts = { method: method, headers: { 'Authorization': 'Bearer ' + _token(), 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    return fetch(WORKER_URL + path, opts).then(function(r) { return r.json(); });
  }

  function iniciales(nombre) {
    if (!nombre) return '?';
    var p = nombre.trim().split(' ');
    return p.length >= 2 ? (p[0][0] + p[1][0]).toUpperCase() : p[0].substring(0,2).toUpperCase();
  }

  function fmtPeso(n) {
    if (!n && n !== 0) return '\u2014';
    return '$' + Math.round(n).toLocaleString('es-CL');
  }

  function fmtPct(n) {
    if (!n && n !== 0) return '\u2014';
    return n + '%';
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  function init() { renderModulo(); }

  // ── Shell ─────────────────────────────────────────────────────────────────
  function renderModulo() {
    var root = document.getElementById('rem-root');
    root.innerHTML = '';

    var pageHdr = document.createElement('div');
    pageHdr.className = 'page-header';
    var left = document.createElement('div');
    var ey = document.createElement('div'); ey.className = 'page-eyebrow'; ey.textContent = 'OPERACIONES';
    var tt = document.createElement('h1'); tt.className = 'page-title'; tt.innerHTML = 'Remune<em>raciones</em>';
    var sb = document.createElement('p'); sb.className = 'page-sub'; sb.textContent = 'Gesti\u00F3n de personal, liquidaciones y procesos de pago.';
    left.appendChild(ey); left.appendChild(tt); left.appendChild(sb);
    var selWrap = document.createElement('div'); selWrap.className = 'com-sel-wrap'; selWrap.id = 'rem-com-sel';
    pageHdr.appendChild(left); pageHdr.appendChild(selWrap);
    root.appendChild(pageHdr);

    if (typeof renderSelectorComunidad === 'function') {
      renderSelectorComunidad('rem-com-sel', function() { renderTabContent(); });
    }

    var tabsEl = document.createElement('div'); tabsEl.className = 'rem-tabs'; tabsEl.id = 'rem-tabs';
    var TABS = [
      { id: 'panel',         label: 'Panel',          ico: 'ti-layout-dashboard' },
      { id: 'colaboradores', label: 'Colaboradores',  ico: 'ti-users'            },
      { id: 'procesos',      label: 'Procesos',       ico: 'ti-receipt'          },
      { id: 'asistencia',    label: 'Asistencia',     ico: 'ti-calendar-check'   },
      { id: 'novedades',     label: 'Novedades',      ico: 'ti-beach'            },
      { id: 'parametros',    label: 'Par\u00E1metros',ico: 'ti-settings-2'       },
    ];
    TABS.forEach(function(t) {
      var btn = document.createElement('button');
      btn.className = 'rem-tab' + (t.id === _tabActiva ? ' act' : '');
      btn.dataset.tab = t.id;
      btn.innerHTML = '<i class="ti ' + t.ico + ' rem-tab-ico" aria-hidden="true"></i> ' + t.label;
      btn.addEventListener('click', function() {
        _tabActiva = t.id;
        tabsEl.querySelectorAll('.rem-tab').forEach(function(b) { b.classList.remove('act'); });
        btn.classList.add('act');
        renderTabContent();
      });
      tabsEl.appendChild(btn);
    });
    root.appendChild(tabsEl);

    var contenido = document.createElement('div'); contenido.id = 'rem-contenido';
    root.appendChild(contenido);
    renderTabContent();
  }

  function renderTabContent() {
    var contenido = document.getElementById('rem-contenido');
    if (!contenido) return;
    contenido.innerHTML = '';
    var RENDERERS = {
      panel: renderPanel, colaboradores: renderColaboradores,
      procesos: renderProcesos, asistencia: renderAsistencia,
      novedades: renderNovedades, parametros: renderParametros,
    };
    if (RENDERERS[_tabActiva]) RENDERERS[_tabActiva](contenido);
  }

  // ── PANEL ─────────────────────────────────────────────────────────────────
  function renderPanel(el) {
    var kpiGrid = document.createElement('div'); kpiGrid.className = 'rem-kpi-grid';
    var kpiData = [
      { label: 'Colaboradores activos', id: 'kpi-activos', val: '\u2014', sub: 'cargando...' },
      { label: 'Gasto total mes',       id: 'kpi-gasto',   val: '\u2014', sub: 'Jun 2026'    },
      { label: 'Per\u00EDodos abiertos',id: 'kpi-periodos',val: '\u2014', cls: 'rem-warn', sub: 'sin cerrar' },
      { label: 'Contratos a vencer',    id: 'kpi-contratos',val: '\u2014', cls: 'rem-warn', sub: 'pr\u00F3ximos 30 d\u00EDas' },
    ];
    kpiData.forEach(function(k) {
      var card = document.createElement('div'); card.className = 'rem-kpi';
      var lbl = document.createElement('div'); lbl.className = 'rem-kpi-label'; lbl.textContent = k.label;
      var val = document.createElement('div'); val.className = 'rem-kpi-val' + (k.cls ? ' ' + k.cls : ''); val.id = k.id; val.textContent = k.val;
      var sub = document.createElement('div'); sub.className = 'rem-kpi-sub'; sub.textContent = k.sub;
      card.appendChild(lbl); card.appendChild(val); card.appendChild(sub);
      kpiGrid.appendChild(card);
    });
    el.appendChild(kpiGrid);
    el.appendChild(_divider());

    var twoCol = document.createElement('div'); twoCol.className = 'rem-two-col';
    var carteraWrap = document.createElement('div');
    var secLabel = document.createElement('div'); secLabel.className = 'rem-section-label'; secLabel.textContent = 'Cartera \u2014 estado del per\u00EDodo actual';
    carteraWrap.appendChild(secLabel);
    var tbWrap = document.createElement('div'); tbWrap.className = 'rem-cartera-wrap';
    var tb = document.createElement('table'); tb.className = 'rem-table';
    tb.innerHTML = '<thead><tr><th>Comunidad</th><th>Colabs.</th><th>Gasto base</th><th>Estado</th><th></th></tr></thead>' +
      '<tbody id="rem-cartera-body"><tr><td colspan="5" style="text-align:center;color:var(--co-mute);padding:20px">Cargando\u2026</td></tr></tbody>';
    tbWrap.appendChild(tb); carteraWrap.appendChild(tbWrap); twoCol.appendChild(carteraWrap);

    var alertasWrap = document.createElement('div');
    var aLabel = document.createElement('div'); aLabel.className = 'rem-section-label'; aLabel.textContent = 'Alertas';
    alertasWrap.appendChild(aLabel);
    var alertasList = document.createElement('div'); alertasList.className = 'rem-alertas'; alertasList.id = 'rem-alertas';
    alertasList.innerHTML = '<div class="rem-alerta info"><i class="ti ti-info-circle" aria-hidden="true"></i><div class="rem-alerta-txt">Cargando\u2026</div></div>';
    alertasWrap.appendChild(alertasList); twoCol.appendChild(alertasWrap);
    el.appendChild(twoCol);

    _cargarPanel();
  }

  function _cargarPanel() {
    var lista = window._comunidades || [];
    if (!lista.length) { setTimeout(_cargarPanel, 600); return; }

    var tbody = document.getElementById('rem-cartera-body');
    var alertasEl = document.getElementById('rem-alertas');
    if (!tbody) return;

    var totalActivos = 0; var totalGasto = 0;
    var pendientes = lista.length;
    tbody.innerHTML = '';

    lista.forEach(function(c) {
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td><b>' + c.nombre + '</b><br><span style="font-size:11px;color:var(--co-mute)">' + (c.comuna || '') + '</span></td>' +
        '<td id="pan-col-' + c.id + '" style="text-align:center">\u2014</td>' +
        '<td id="pan-gasto-' + c.id + '">\u2014</td>' +
        '<td><span class="rem-pill gray">Sin datos</span></td>' +
        '<td><button class="rem-btn-sec" style="font-size:11px;padding:4px 10px">Ver</button></td>';
      tr.querySelector('button').addEventListener('click', function() {
        if (typeof setComunidadActiva === 'function') setComunidadActiva({ id: c.id, nombre: c.nombre });
        _tabActiva = 'colaboradores';
        renderModulo();
      });
      tbody.appendChild(tr);

      api('/remuneraciones/trabajadores/resumen?comunidadId=' + c.id).then(function(resp) {
        var data = resp.data || {};
        var colEl   = document.getElementById('pan-col-' + c.id);
        var gastoEl = document.getElementById('pan-gasto-' + c.id);
        if (colEl)   colEl.textContent   = data.activos || 0;
        if (gastoEl) gastoEl.textContent = fmtPeso(data.gastoBase || 0);
        totalActivos += (data.activos || 0);
        totalGasto   += (data.gastoBase || 0);
        pendientes--;
        if (pendientes === 0) {
          var kA = document.getElementById('kpi-activos');
          var kG = document.getElementById('kpi-gasto');
          if (kA) kA.textContent = totalActivos;
          if (kG) kG.textContent = fmtPeso(totalGasto);
        }
      }).catch(function() { pendientes--; });
    });

    if (alertasEl) {
      alertasEl.innerHTML = '<div class="rem-alerta info"><i class="ti ti-info-circle" aria-hidden="true"></i>' +
        '<div class="rem-alerta-txt">Las alertas aparecer\u00E1n cuando se registren per\u00EDodos y colaboradores.</div></div>';
    }
  }

  // ── COLABORADORES ─────────────────────────────────────────────────────────
  function renderColaboradores(el) {
    var com = typeof getComunidadActiva === 'function' ? getComunidadActiva() : null;

    var hdrAcc = document.createElement('div');
    hdrAcc.style.cssText = 'display:flex;justify-content:flex-end;gap:8px;margin-bottom:16px;flex-wrap:wrap';
    var btnImportar = document.createElement('button');
    btnImportar.className = 'rem-btn-sec';
    btnImportar.innerHTML = '<i class="ti ti-upload" aria-hidden="true"></i> Importar n\u00F3mina';
    var btnNuevo = document.createElement('button');
    btnNuevo.className = 'rem-btn-pri';
    btnNuevo.innerHTML = '<i class="ti ti-plus" aria-hidden="true"></i> Nuevo trabajador';
    btnNuevo.addEventListener('click', function() { abrirModalColaborador(null, com); });
    hdrAcc.appendChild(btnImportar); hdrAcc.appendChild(btnNuevo);
    el.appendChild(hdrAcc);

    if (!com) { el.appendChild(_avisoSinComunidad()); return; }

    var searchBar = document.createElement('div'); searchBar.className = 'rem-search-bar';
    var searchBox = document.createElement('div'); searchBox.className = 'rem-search-box';
    searchBox.innerHTML = '<i class="ti ti-search" aria-hidden="true" style="color:var(--co-mute);font-size:14px"></i>';
    var searchInput = document.createElement('input'); searchInput.type = 'text'; searchInput.placeholder = 'Buscar por nombre, RUT o cargo\u2026';
    searchBox.appendChild(searchInput); searchBar.appendChild(searchBox); el.appendChild(searchBar);

    var filtros = document.createElement('div'); filtros.className = 'rem-filtros';
    [{ id:'vigentes',label:'Vigentes' },{ id:'desvinculados',label:'Desvinculados' },{ id:'todos',label:'Todos' }].forEach(function(f) {
      var btn = document.createElement('button');
      btn.className = 'rem-filtro' + (f.id === _filtroActivo ? ' act' : '');
      btn.textContent = f.label;
      btn.addEventListener('click', function() {
        _filtroActivo = f.id;
        filtros.querySelectorAll('.rem-filtro').forEach(function(b) { b.classList.remove('act'); });
        btn.classList.add('act');
        _renderListaColaboradores(tbody, searchInput.value, _filtroActivo);
      });
      filtros.appendChild(btn);
    });
    el.appendChild(filtros);

    var tbWrap = document.createElement('div'); tbWrap.className = 'rem-table-wrap'; tbWrap.style.overflowX = 'auto';
    var table = document.createElement('table'); table.className = 'rem-table';
    table.innerHTML = '<thead><tr><th></th><th>Nombre</th><th>RUT</th><th>Cargo</th><th>Contrato</th><th>Sueldo base</th><th>Estado</th><th></th></tr></thead>';
    var tbody = document.createElement('tbody');
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--co-mute);padding:24px">Cargando colaboradores\u2026</td></tr>';
    table.appendChild(tbody); tbWrap.appendChild(table); el.appendChild(tbWrap);

    var cardsWrap = document.createElement('div'); cardsWrap.className = 'rem-col-cards';
    cardsWrap.innerHTML = '<div style="text-align:center;color:var(--co-mute);padding:24px;font-size:12px">Cargando colaboradores\u2026</div>';
    el.appendChild(cardsWrap);

    searchInput.addEventListener('input', function() { _renderListaColaboradores(tbody, searchInput.value, _filtroActivo, cardsWrap); });

    // Cargar datos reales — usar caché si misma comunidad
    if (_colaboradores.length > 0 && _colaboradoresComunidadId === com.id) {
      _renderListaColaboradores(tbody, '', _filtroActivo, cardsWrap);
    } else {
      api('/remuneraciones/trabajadores?comunidadId=' + com.id).then(function(resp) {
        _colaboradores = (resp.data && resp.data.data) ? resp.data.data : (resp.data || []);
        _colaboradoresComunidadId = com.id;
        _renderListaColaboradores(tbody, '', _filtroActivo, cardsWrap);
      }).catch(function() {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#A32D2D;padding:24px">Error al cargar colaboradores.</td></tr>';
        cardsWrap.innerHTML = '<div style="text-align:center;color:#A32D2D;padding:24px;font-size:12px">Error al cargar colaboradores.</div>';
      });
    }
  }

  function _renderListaColaboradores(tbody, busqueda, filtro, cardsWrap) {
    var lista = _colaboradores.filter(function(c) {
      if (filtro === 'vigentes'      && c.estado !== 'activo' && c.estado !== 'licencia') return false;
      if (filtro === 'desvinculados' && c.estado !== 'desvinculado') return false;
      if (busqueda) {
        var q = busqueda.toLowerCase();
        var nombre = (c.nombreCompleto || c.nombres || '').toLowerCase();
        return nombre.includes(q) || (c.rut || '').toLowerCase().includes(q) || (c.cargo || '').toLowerCase().includes(q);
      }
      return true;
    });

    if (!lista.length) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--co-mute);padding:24px">' +
        'No hay colaboradores' + (filtro === 'todos' ? '' : ' ' + (filtro === 'vigentes' ? 'vigentes' : 'desvinculados')) + ' en esta comunidad.<br>' +
        '<span style="font-size:11px">Usa "Nuevo trabajador" para agregar el primero.</span></td></tr>';
      if (cardsWrap) {
        cardsWrap.innerHTML = '<div style="text-align:center;color:var(--co-mute);padding:24px;font-size:12px">' +
          'No hay colaboradores' + (filtro === 'todos' ? '' : ' ' + (filtro === 'vigentes' ? 'vigentes' : 'desvinculados')) + ' en esta comunidad.</div>';
      }
      return;
    }

    tbody.innerHTML = '';
    if (cardsWrap) cardsWrap.innerHTML = '';
    lista.forEach(function(c) {
      var estadoPill = { activo:'<span class="rem-pill ok">Activo</span>', licencia:'<span class="rem-pill warn">Licencia</span>', desvinculado:'<span class="rem-pill gray">Desvinculado</span>' }[c.estado] || '<span class="rem-pill gray">' + (c.estado || '\u2014') + '</span>';
      var nombre = c.nombreCompleto || ((c.nombres || '') + ' ' + (c.apellidoPaterno || '')).trim() || '\u2014';

      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td><div class="rem-avatar">' + iniciales(nombre) + '</div></td>' +
        '<td><b>' + nombre + '</b></td>' +
        '<td>' + (c.rut ? c.rut + '-' + (c.dv || '') : '\u2014') + '</td>' +
        '<td>' + (c.cargo || '\u2014') + '</td>' +
        '<td>' + (c.tipoContrato || '\u2014') + '</td>' +
        '<td>' + fmtPeso(c.sueldoBase) + '</td>' +
        '<td>' + estadoPill + '</td>' +
        '<td><i class="ti ti-chevron-right" aria-hidden="true" style="color:var(--co-mute)"></i></td>';
      tr.addEventListener('click', function() { abrirFichaColaborador(c); });
      tbody.appendChild(tr);

      if (cardsWrap) {
        var card = document.createElement('div');
        card.className = 'rem-col-card';
        card.innerHTML =
          '<div class="rem-col-card-top">' +
            '<div class="rem-avatar">' + iniciales(nombre) + '</div>' +
            '<div class="rem-col-card-name-wrap">' +
              '<div class="rem-col-card-name">' + nombre + '</div>' +
              '<div class="rem-col-card-cargo">' + (c.cargo || '\u2014') + '</div>' +
            '</div>' +
            '<i class="ti ti-chevron-right" aria-hidden="true" style="color:var(--co-mute);font-size:16px;flex-shrink:0"></i>' +
          '</div>' +
          '<div class="rem-col-card-divider"></div>' +
          '<div class="rem-col-card-meta">' +
            '<div class="rem-col-card-meta-item"><span class="rem-col-card-meta-lbl">RUT</span><span class="rem-col-card-meta-val">' + (c.rut ? c.rut + '-' + (c.dv || '') : '\u2014') + '</span></div>' +
            '<div class="rem-col-card-meta-item"><span class="rem-col-card-meta-lbl">Sueldo base</span><span class="rem-col-card-meta-val">' + fmtPeso(c.sueldoBase) + '</span></div>' +
            '<div class="rem-col-card-meta-item"><span class="rem-col-card-meta-lbl">Estado</span>' + estadoPill + '</div>' +
          '</div>';
        card.addEventListener('click', function() { abrirFichaColaborador(c); });
        cardsWrap.appendChild(card);
      }
    });
  }

  // ── MODAL NUEVO / EDITAR TRABAJADOR ─────────────────────────────────────
  function abrirModalColaborador(colaborador, com) {
    if (!com) { alert('Selecciona una comunidad primero.'); return; }

    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.addEventListener('click', function(e) { if (e.target === overlay) cerrar(); });

    var box = document.createElement('div');
    box.className = 'modal-box';
    box.style.maxWidth = '640px';

    var btnX = document.createElement('button'); btnX.className = 'modal-close'; btnX.textContent = '\u00D7';
    btnX.addEventListener('click', cerrar);
    box.appendChild(btnX);

    var ey = document.createElement('div'); ey.className = 'modal-eyebrow'; ey.textContent = 'Remuneraciones'; box.appendChild(ey);
    var tt = document.createElement('div'); tt.className = 'modal-titulo'; tt.textContent = colaborador ? 'Editar trabajador' : 'Nuevo trabajador'; box.appendChild(tt);
    var st = document.createElement('div'); st.className = 'modal-subtitulo'; st.textContent = com.nombre; box.appendChild(st);

    // ── Formulario ──
    var form = document.createElement('div');

    function secTitle(txt) {
      var d = document.createElement('div');
      d.style.cssText = 'font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--co-mute);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--co-line)';
      d.textContent = txt;
      return d;
    }

    function field(label, el, full) {
      var grp = document.createElement('div');
      grp.className = 'form-group' + (full ? ' form-full' : '');
      var lbl = document.createElement('label'); lbl.textContent = label;
      grp.appendChild(lbl); grp.appendChild(el);
      return grp;
    }

    function input(type, placeholder, val) {
      var i = document.createElement('input');
      i.type = type || 'text'; i.placeholder = placeholder || '';
      if (val !== undefined && val !== null) i.value = val;
      return i;
    }

    function select(opciones, val) {
      var s = document.createElement('select');
      opciones.forEach(function(o) {
        var opt = document.createElement('option');
        opt.value = o.v !== undefined ? o.v : o;
        opt.textContent = o.l !== undefined ? o.l : o;
        if (val !== undefined && opt.value == val) opt.selected = true;
        s.appendChild(opt);
      });
      return s;
    }

    // ── SECCIÓN 1: Identificación ──
    form.appendChild(secTitle('Identificaci\u00F3n'));
    var grid1 = document.createElement('div'); grid1.className = 'form-grid';

    var fRut    = input('text', '12345678', colaborador ? colaborador.rut : '');
    var fDv     = input('text', 'K', colaborador ? colaborador.dv : '');
    fDv.style.width = '60px';
    var fApPat  = input('text', 'Apellido paterno', colaborador ? colaborador.apellidoPaterno : '');
    var fApMat  = input('text', 'Apellido materno', colaborador ? colaborador.apellidoMaterno : '');
    var fNombres= input('text', 'Nombres', colaborador ? colaborador.nombres : '');
    var fSexo   = select([{v:'M',l:'Masculino'},{v:'F',l:'Femenino'}], colaborador ? colaborador.sexo : 'M');
    var fNac    = select([{v:0,l:'Chileno/a'},{v:1,l:'Extranjero/a'}], colaborador ? colaborador.nacionalidad : 0);

    // Auto-calcular DV al salir del campo RUT
    fRut.addEventListener('blur', function() {
      var rut = fRut.value.replace(/\./g,'').split('-')[0].trim();
      if (rut && !fDv.value) { fDv.value = _calcDv(rut); }
    });

    grid1.appendChild(field('RUT (sin puntos, sin DV)', fRut));
    grid1.appendChild(field('D\u00EDgito verificador', fDv));
    grid1.appendChild(field('Apellido paterno *', fApPat));
    grid1.appendChild(field('Apellido materno', fApMat));
    grid1.appendChild(field('Nombres *', fNombres, true));
    grid1.appendChild(field('Sexo', fSexo));
    grid1.appendChild(field('Nacionalidad', fNac));
    form.appendChild(grid1);

    // ── SECCIÓN 2: Contrato ──
    form.appendChild(secTitle('Contrato'));
    var grid2 = document.createElement('div'); grid2.className = 'form-grid';

    // Cargar cargos configurables
    var cargosOpts = _cargos.length > 0
      ? _cargos.map(function(c) { return { v: c.nombre, l: c.nombre }; })
      : [{v:'Conserje',l:'Conserje'},{v:'Guardia',l:'Guardia'},{v:'Mayordomo',l:'Mayordomo'},{v:'Auxiliar',l:'Auxiliar'},{v:'Jardinero',l:'Jardinero'},{v:'Otro',l:'Otro'}];

    var fCargo   = select(cargosOpts, colaborador ? colaborador.cargo : '');
    var fTipoCto = select([{v:'Indefinido',l:'Indefinido'},{v:'Plazo fijo',l:'Plazo fijo'},{v:'Obra o faena',l:'Obra o faena'}], colaborador ? colaborador.tipoContrato : 'Indefinido');
    var fFecIni  = input('date', '', colaborador ? _dateToInput(colaborador.fechaInicio) : '');
    var fFecTer  = input('date', '', colaborador ? _dateToInput(colaborador.fechaTermino) : '');
    fFecTer.disabled = !(colaborador && colaborador.tipoContrato !== 'Indefinido');
    var fJornada = input('number', '42', colaborador ? colaborador.jornadaHoras : 42);
    fJornada.min = 1; fJornada.max = 42;

  function _guardarColaborador(colaborador, com, datos, btn, errDiv) {
    // Validaciones básicas
    if (!datos.rut)            { errDiv.textContent = 'El RUT es obligatorio.'; return; }
    if (!datos.apellidoPaterno){ errDiv.textContent = 'El apellido paterno es obligatorio.'; return; }
    if (!datos.nombres)        { errDiv.textContent = 'Los nombres son obligatorios.'; return; }
    if (!datos.fechaInicio)    { errDiv.textContent = 'La fecha de inicio es obligatoria.'; return; }
    if (!datos.sueldoBase || datos.sueldoBase < 510000) { errDiv.textContent = 'El sueldo base debe ser igual o mayor al ingreso m\u00EDnimo ($510.000).'; return; }

    errDiv.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Guardando\u2026';

    var action = colaborador ? 'editarTrabajador' : 'crearTrabajador';
    var body   = Object.assign({ action: action }, datos);
    if (colaborador) body.id = colaborador.id;

    api('/remuneraciones/trabajadores', 'POST', body).then(function(resp) {
      var data = (resp.data && resp.data.data) ? resp.data.data : resp.data;
      if (data && data.ok) {
        // Recargar lista
        _colaboradores = [];
        renderTabContent();
        // Cerrar modal
        var overlay = btn.closest('.modal-overlay');
        if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
      } else {
        errDiv.textContent = (data && data.error) ? data.error : 'Error al guardar. Intenta nuevamente.';
        btn.disabled = false;
        btn.textContent = colaborador ? 'Guardar cambios' : 'Crear trabajador';
      }
    }).catch(function() {
      errDiv.textContent = 'Error de conexi\u00F3n. Intenta nuevamente.';
      btn.disabled = false;
      btn.textContent = colaborador ? 'Guardar cambios' : 'Crear trabajador';
    });
  }

  // Helper: calcular DV del RUT
  function _calcDv(rut) {
    var suma = 0; var multiplo = 2;
    for (var i = String(rut).length - 1; i >= 0; i--) {
      suma += parseInt(String(rut)[i]) * multiplo;
      multiplo = multiplo === 7 ? 2 : multiplo + 1;
    }
    var resto = 11 - (suma % 11);
    if (resto === 11) return '0';
    if (resto === 10) return 'K';
    return String(resto);
  }

  // Helper: convertir fecha dd/MM/yyyy a yyyy-MM-dd para input date
  function _dateToInput(fecha) {
    if (!fecha) return '';
    if (fecha.includes('-') && fecha.length === 10) return fecha;
    var p = fecha.split('/');
    if (p.length === 3) return p[2] + '-' + p[1] + '-' + p[0];
    return '';
  }

  // ── Helper formato fecha ─────────────────────────────────────────────
  function _fmtFecha(f) {
    if (!f) return '\u2014';
    var d = new Date(f);
    if (isNaN(d)) {
      // intentar DD/MM/YYYY
      var p = String(f).split('/');
      if (p.length === 3) return p[0].padStart(2,'0') + '/' + p[1].padStart(2,'0') + '/' + p[2];
      return f;
    }
    return d.getDate().toString().padStart(2,'0') + '/' +
           (d.getMonth()+1).toString().padStart(2,'0') + '/' +
           d.getFullYear();
  }

  function _fmtFechaHora(f) {
    if (!f) return '\u2014';
    var d = new Date(f);
    if (isNaN(d)) return f;
    return d.getDate().toString().padStart(2,'0') + '/' +
           (d.getMonth()+1).toString().padStart(2,'0') + '/' +
           d.getFullYear() + ' ' +
           d.getHours().toString().padStart(2,'0') + ':' +
           d.getMinutes().toString().padStart(2,'0');
  }

  function _nombreAfp(codigo) {
    var map = {'00':'Sin AFP','03':'Cuprum','05':'Habitat','08':'ProVida',
               '29':'PlanVital','33':'Capital','34':'Modelo','35':'Uno'};
    var key = String(codigo || '').padStart(2,'0');
    return map[key] || map[String(codigo)] || codigo || '\u2014';
  }

  function _nombreSalud(codigo, montoPlan, moneda) {
    var map = {'07':'Fonasa','01':'Banm\u00e9dica','02':'Consalud','03':'VidaTres',
               '04':'Colmena','05':'Cruz Blanca','10':'Nueva Masvida','11':'Isalud',
               '12':'Fundaci\u00f3n','25':'Cruz del Norte','28':'Esencial'};
    var key = String(codigo || '').padStart(2,'0');
    var nombre = map[key] || map[String(codigo)] || codigo || '\u2014';
    if (key !== '07' && montoPlan) {
      nombre += ' \u00B7 ' + (moneda === '2' ? montoPlan + ' UF' : fmtPeso(montoPlan));
    }
    return nombre;
  }

  function _renderFichaTab(el, tab, c) {
    // Ocultar todos los paneles cacheados
    el.querySelectorAll('[data-tab-panel]').forEach(function(p) { p.style.display = 'none'; });

    // Si ya existe el panel, solo mostrarlo
    var cached = el.querySelector('[data-tab-panel="' + tab + '"]');
    if (cached) { cached.style.display = ''; return; }

    // Primera vez: crear panel y renderizar
    var panel = document.createElement('div');
    panel.dataset.tabPanel = tab;
    el.appendChild(panel);

    if (tab === 'resumen')            _fichaResumen(panel, c);
    else if (tab === 'liquidaciones') _fichaLiquidaciones(panel, c);
    else if (tab === 'onboarding')    _fichaOnboarding(panel, c);
    else if (tab === 'documentos')    _fichaDocumentos(panel, c);
    else if (tab === 'asistencia')    _fichaAsistencia(panel, c);
    else if (tab === 'historial')     _fichaHistorial(panel, c);
  }

  // ── TAB RESUMEN ───────────────────────────────────────────────────────
  function _fichaResumen(el, c) {
    // KPIs
    var kpiGrid = document.createElement('div');
    kpiGrid.className = 'rem-ficha-kpis';

    function mkKpi(lbl, val, sub, cls) {
      var k = document.createElement('div'); k.className = 'rem-ficha-kpi';
      var l = document.createElement('div'); l.className = 'rem-ficha-kpi-lbl'; l.textContent = lbl;
      var v = document.createElement('div'); v.className = 'rem-ficha-kpi-val' + (cls ? ' ' + cls : ''); v.textContent = val;
      var s = document.createElement('div'); s.className = 'rem-ficha-kpi-sub'; s.textContent = sub;
      k.appendChild(l); k.appendChild(v); k.appendChild(s);
      return k;
    }

    // Calcular antigüedad
    var antig = '\u2014';
    var antigSub = '';
    if (c.fechaInicio) {
      var fIni = new Date(c.fechaInicio.includes('/') ? c.fechaInicio.split('/').reverse().join('-') : c.fechaInicio);
      if (!isNaN(fIni)) {
        var meses = Math.floor((new Date() - fIni) / (1000 * 60 * 60 * 24 * 30.44));
        var anos = Math.floor(meses / 12); var mesR = meses % 12;
        antig = anos > 0 ? anos + ' año' + (anos > 1 ? 's' : '') : meses + ' meses';
        if (anos > 0 && mesR > 0) antig += ' ' + mesR + 'm';
        antigSub = 'desde ' + _fmtFecha(c.fechaInicio);
      }
    }

    kpiGrid.appendChild(mkKpi('Antig\u00fcedad', antig, antigSub, ''));
    kpiGrid.appendChild(mkKpi('Sueldo base', fmtPeso(c.sueldoBase), c.asigColacion || c.asigMovilizacion ? '+ asignaciones' : '', 'orange'));
    kpiGrid.appendChild(mkKpi('\u00dalt. liquidaci\u00f3n', '\u2014', 'pendiente', ''));
    kpiGrid.appendChild(mkKpi('Vacaciones', '\u2014', 'pendiente', ''));
    el.appendChild(kpiGrid);

    // 2 columnas
    var twoCol = document.createElement('div');
    twoCol.className = 'rem-ficha-2col';

    // Col izq — contrato
    var colIzq = document.createElement('div');
    colIzq.appendChild(_fichaSecLabel('Contrato y previsional'));
    var cardContrato = document.createElement('div');

    [
      ['Tipo contrato',    c.tipoContrato],
      ['Jornada',         (c.jornadaHoras || 42) + ' hrs \u00B7 ' + (c.tipoJornada == '2' ? 'Part-time' : 'Completa')],
      ['Inicio',          _fmtFecha(c.fechaInicio)],
      ['AFP',             _nombreAfp(c.codigoAfp)],

      ['CCAF',            c.codigoCcaf && c.codigoCcaf !== '00' ? {'01':'Los Andes','02':'La Araucana','03':'Los H\u00e9roes','04':'18 de Septiembre'}[c.codigoCcaf] || c.codigoCcaf : 'Sin CCAF'],
      ['Cargas familiares', (Number(c.cargasSimples) || 0) + ' simples'],

    var cardHist = document.createElement('div');
    cardHist.className = 'rem-ficha-card';
    cardHist.appendChild(_fichaHist('Trabajador ingresado al sistema', (c.fechaInicio || ''), true));
    cardHist.appendChild(_fichaLinkOrange('Ver historial completo \u2192', function() {
      var tabs = document.querySelectorAll('.rem-ficha-tab');
      if (tabs[5]) tabs[5].click();
    }));
    colIzq.appendChild(cardHist);
    twoCol.appendChild(colIzq);

    // Col der — novedades + onboarding
    var colDer = document.createElement('div');
    colDer.appendChild(_fichaSecLabel('Novedades activas'));
    var cardNov = document.createElement('div');
    cardNov.className = 'rem-ficha-card';
    var novVac = document.createElement('div');
    novVac.className = 'rem-ficha-nov';
    novVac.innerHTML = '<div class="rem-ficha-nov-dot" style="background:var(--co-line)"></div><div style="font-size:12px;color:var(--co-mute)">Sin novedades activas</div>';
    cardNov.appendChild(novVac);
    colDer.appendChild(cardNov);

    colDer.appendChild(_fichaSecLabel('Onboarding'));
    var cardOb = document.createElement('div');
    cardOb.className = 'rem-ficha-card';
    // Mostrar placeholder mientras carga
    cardOb.innerHTML = '<div class="rem-ficha-prog-hdr"><div><div class="rem-ficha-prog-pct">…</div>' +
      '<div style="font-size:12px;color:var(--co-mute);margin-top:2px">Cargando...</div></div></div>' +
      '<div class="rem-ficha-prog-bar"><div class="rem-ficha-prog-fill" id="res-ob-fill" style="width:0%"></div></div>';
    var linkOb = _fichaLinkOrange('Ver checklist completo →', function() {
      var tabs = document.querySelectorAll('.rem-ficha-tab');
      if (tabs[2]) tabs[2].click();
    });
    cardOb.appendChild(linkOb);
    colDer.appendChild(cardOb);

    // Calcular porcentaje real: completados / total plantilla
    api('/remuneraciones/parametros/plantillas?cargo=' + encodeURIComponent(c.cargo || '*')).then(function(resp) {
      var items = (resp.data && resp.data.data) ? resp.data.data : (resp.data || []);
      var obTotal = items.length;
      var obJson  = c.onboardingJson || {};
      var obDone  = Object.keys(obJson).filter(function(k) {
        return obJson[k] && obJson[k].estado === 'completado';
      }).length;
      var obPct = obTotal > 0 ? Math.round(obDone / obTotal * 100) : 0;

      cardOb.innerHTML = '<div class="rem-ficha-prog-hdr"><div><div class="rem-ficha-prog-pct">' + obPct + '%</div>' +
        '<div style="font-size:12px;color:var(--co-mute);margin-top:2px">' + obDone + ' de ' + obTotal + ' completados</div></div></div>' +
        '<div class="rem-ficha-prog-bar"><div class="rem-ficha-prog-fill" style="width:' + obPct + '%"></div></div>';
      cardOb.appendChild(linkOb);
    }).catch(function() {
      cardOb.innerHTML = '<div style="font-size:12px;color:var(--co-mute)">Sin plantilla configurada</div>';

    twoCol.appendChild(colDer);
    el.appendChild(twoCol);

  // ── TAB LIQUIDACIONES ────────────────────────────────────────────────
  function _fichaLiquidaciones(el, c) {
    el.innerHTML = '<div class="module-loading" style="min-height:180px"><div class="ml-iso-wrap"><div class="ml-iso" aria-hidden="true"></div></div><div class="ml-text"><div class="ml-brand"><b>co</b>proactiva</div><div class="ml-status"><span class="ml-status-dot"></span>Cargando liquidaciones</div></div></div>';
    api('/remuneraciones/liquidaciones/trabajador/' + c.id)
      .then(function(resp) {
        el.innerHTML = '';
        el.appendChild(_fichaSecLabel('Historial de liquidaciones'));
        var lista = (resp && resp.data && resp.data.data) ? resp.data.data.filter(function(l) { return l.estado === 'cerrado'; }) : [];
        var card = document.createElement('div');
        card.className = 'rem-ficha-card';
        card.style.padding = '0';
        if (!lista.length) {
          var empty = document.createElement('div');
          empty.style.cssText = 'padding:32px;text-align:center;color:var(--co-mute);font-size:12px';
          empty.textContent = 'A\u00fan no hay liquidaciones pagadas para este colaborador.';
          card.appendChild(empty);
        } else {
          var hdr = document.createElement('div');
          hdr.className = 'liq-row-hdr';
          hdr.innerHTML = '<span>Per\u00edodo</span><span>L\u00edquido a pagar</span><span>Descuentos prev.</span><span>D\u00edas</span><span>Estado</span><span></span>';
          card.appendChild(hdr);

          lista.forEach(function(liq) {
            var row = document.createElement('div');
            row.style.cssText = 'border-bottom:1px solid var(--co-line)';

            var descPrev = (liq.cotizacionAfp || 0) + (liq.cotizacionSalud || 0) + (liq.cotizacionSC || 0);
            var diasLbl  = (liq.diasTrabajados || 30) + '/30';

            var resumen = document.createElement('div');
            resumen.className = 'liq-row-data';
            resumen.innerHTML =
              '<div class="liq-dt-only">' + _liqPeriodoLabel(liq.periodo) + '</div>' +
              '<div class="liq-dt-only"><span class="liq-cell-liquido">' + fmtPeso(liq.liquidoAPagar) + '</span></div>' +
              '<div class="liq-dt-only"><span class="liq-cell-desc">' + fmtPeso(descPrev) + '</span></div>' +
              '<div class="liq-dt-only"><span class="liq-cell-dias">' + diasLbl + '</span></div>' +
              '<div class="liq-dt-only">' + _liqBadge(liq.estado) + '</div>' +
              '<div class="liq-dt-only liq-chev" style="color:var(--co-mute);font-size:14px"><i class="ti ti-chevron-down" aria-hidden="true"></i></div>' +
              '<div class="liq-mv-only">' +
                '<div class="liq-mv-top">' + _liqPeriodoLabel(liq.periodo) +
                  '<span style="display:flex;align-items:center;gap:8px">' + _liqBadge(liq.estado) +
                  '<span class="liq-chev" style="color:var(--co-mute);font-size:14px"><i class="ti ti-chevron-down" aria-hidden="true"></i></span></span>' +
                '</div>' +
                '<div class="liq-mv-nums">' +
                  '<div><div class="liq-mv-lbl">L\u00edquido</div><span class="liq-cell-liquido">' + fmtPeso(liq.liquidoAPagar) + '</span></div>' +
                  '<div style="text-align:center"><div class="liq-mv-lbl">Desc. prev.</div><span class="liq-cell-desc">' + fmtPeso(descPrev) + '</span></div>' +
                  '<div style="text-align:right"><div class="liq-mv-lbl">D\u00edas</div><span class="liq-cell-dias">' + diasLbl + '</span></div>' +
                '</div>' +
              '</div>';
            var detalle = document.createElement('div');
            detalle.style.cssText = 'display:none;background:var(--co-cream-deep);border-top:1px solid var(--co-line);padding:16px 14px';
            detalle.dataset.liqDet = '1';
            detalle.appendChild(_liqDetalle(liq));
            resumen.addEventListener('click', function() {
              var open = detalle.style.display !== 'none';
              card.querySelectorAll('[data-liq-det]').forEach(function(d) { d.style.display = 'none'; });
              card.querySelectorAll('.liq-chev i').forEach(function(i) { i.style.transform = ''; });
              if (!open) {
                detalle.style.display = 'block';
                resumen.querySelectorAll('.liq-chev i').forEach(function(i) { i.style.transform = 'rotate(180deg)'; });
              }
            });
            row.appendChild(resumen);
            row.appendChild(detalle);
            card.appendChild(row);
          });
        }
        el.appendChild(card);
      })
      .catch(function() {
        el.innerHTML = '';
        el.appendChild(_fichaSecLabel('Historial de liquidaciones'));
        var err = document.createElement('div');
        err.style.cssText = 'padding:24px;text-align:center;color:var(--co-mute);font-size:12px';
        err.textContent = 'No se pudo cargar el historial de liquidaciones.';
        el.appendChild(err);

  function _liqPeriodoLabel(periodo) {
    if (!periodo) return '<span style="font-size:13px;font-weight:500;color:var(--co-ink)">\u2014</span>';
    var meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    var s = String(periodo);
    if (s.length > 7) s = s.substring(0, 7);
    var p = s.split('-');
    if (p.length < 2 || !p[1] || isNaN(parseInt(p[1]))) return '<span style="font-size:13px;font-weight:500;color:var(--co-ink)">' + s + '</span>';
    var label = (meses[parseInt(p[1]) - 1] || p[1]) + ' ' + p[0];
    return '<span style="font-size:13px;font-weight:500;color:var(--co-ink)">' + label + '</span>';
  }

  function _liqBadge(estado) {
    if (estado === 'cerrado') {
      return '<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 8px;border-radius:99px;background:var(--co-green-soft);color:var(--co-green)"><i class="ti ti-circle-check" aria-hidden="true"></i> Pagado</span>';
    }
    return '<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 8px;border-radius:99px;background:var(--co-cream-deep);border:1px solid var(--co-line);color:var(--co-mute)"><i class="ti ti-pencil" aria-hidden="true"></i> Borrador</span>';
  }

  function _liqDetalle(liq) {
    var wrap = document.createElement('div');
    function secLbl(txt) {
      var d = document.createElement('div');
      d.style.cssText = 'font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--co-mute);padding:10px 0 6px;border-bottom:1px solid var(--co-line);margin-bottom:4px;margin-top:14px';
      d.textContent = txt; return d;
    }
    function fila(lbl, val, color) {
      var d = document.createElement('div');
      d.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px;border-bottom:1px solid var(--co-line-soft)';
      d.innerHTML = '<span style="color:var(--co-ink-3)">' + lbl + '</span><span style="font-weight:500;color:' + (color || 'var(--co-ink)') + '">' + val + '</span>';
      return d;
    }
    function subtotal(lbl, val, color) {
      var d = document.createElement('div');
      d.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13px;font-weight:600;color:var(--co-ink-2);border-top:1px solid var(--co-line);margin-top:2px';
      d.innerHTML = '<span>' + lbl + '</span><span style="color:' + (color || 'var(--co-ink-2)') + '">' + val + '</span>';
      return d;
    }
    var secImp = document.createElement('div');
    var lbl1 = secLbl('Haberes imponibles'); lbl1.style.marginTop = '0';
    secImp.appendChild(lbl1);
    var diasLabel = liq.diasTrabajados < 30 ? ' (' + liq.diasTrabajados + '/30 d\u00edas)' : '';
    if (liq.sueldoProporcional) secImp.appendChild(fila('Sueldo base' + diasLabel, fmtPeso(liq.sueldoProporcional)));
    if (liq.montoHorasExtra)    secImp.appendChild(fila('Horas extra (' + liq.horasExtra + ' hrs)', fmtPeso(liq.montoHorasExtra)));
    if (liq.gratificacion)      secImp.appendChild(fila('Gratificaci\u00f3n garantizada', fmtPeso(liq.gratificacion)));
    if (liq.bonosAdicionales)   secImp.appendChild(fila('Bonos adicionales', fmtPeso(liq.bonosAdicionales)));
    secImp.appendChild(subtotal('Subtotal imponible', fmtPeso(liq.baseImponibleAfp)));
    wrap.appendChild(secImp);
    var totalNoImp = (liq.asigColacion || 0) + (liq.asigMovilizacion || 0);
    if (totalNoImp > 0) {
      var secNoImp = document.createElement('div');
      secNoImp.appendChild(secLbl('Haberes no imponibles'));
      if (liq.asigColacion)     secNoImp.appendChild(fila('Asig. colaci\u00f3n', fmtPeso(liq.asigColacion)));
      if (liq.asigMovilizacion) secNoImp.appendChild(fila('Asig. movilizaci\u00f3n', fmtPeso(liq.asigMovilizacion)));
      secNoImp.appendChild(subtotal('Subtotal no imponible', fmtPeso(totalNoImp)));
      wrap.appendChild(secNoImp);
    }
    var secDesc = document.createElement('div');
    secDesc.appendChild(secLbl('Descuentos legales'));
    var detSalud = {};
    try { detSalud = JSON.parse(liq.cotizacionSaludDetalle || '{}'); } catch(e) {}
    if (liq.cotizacionAfp)   secDesc.appendChild(fila('AFP', '-' + fmtPeso(liq.cotizacionAfp), 'var(--co-red)'));
    var saludLabel = detSalud.tipo === 'isapre' ? 'Isapre (plan)' : detSalud.tipo === 'fonasa_ccaf' ? 'Salud Fonasa + CCAF (7%)' : 'Salud Fonasa (7%)';
    if (liq.cotizacionSalud) secDesc.appendChild(fila(saludLabel, '-' + fmtPeso(liq.cotizacionSalud), 'var(--co-red)'));
    if (liq.cotizacionSC)    secDesc.appendChild(fila('Seguro cesant\u00eda (0.6%)', '-' + fmtPeso(liq.cotizacionSC), 'var(--co-red)'));
    if (liq.descuentosCcaf)  secDesc.appendChild(fila('Descuentos CCAF', '-' + fmtPeso(liq.descuentosCcaf), 'var(--co-red)'));
    if (liq.adelantos)       secDesc.appendChild(fila('Anticipos', '-' + fmtPeso(liq.adelantos), 'var(--co-red)'));
    if (liq.otrosDescuentos) secDesc.appendChild(fila('Otros descuentos', '-' + fmtPeso(liq.otrosDescuentos), 'var(--co-red)'));
    secDesc.appendChild(fila('Impuesto 2a categor\u00eda', liq.impuesto2Cat ? '-' + fmtPeso(liq.impuesto2Cat) : '$0', liq.impuesto2Cat ? 'var(--co-red)' : 'var(--co-mute)'));
    secDesc.appendChild(subtotal('Total descuentos', '-' + fmtPeso(liq.totalDescuentos), 'var(--co-red)'));
    wrap.appendChild(secDesc);
    var secAf = document.createElement('div');
    secAf.appendChild(secLbl('Beneficios'));
    secAf.appendChild(fila('Asig. familiar (tramo ' + (liq.tramoAsigFamiliar || '\u2014') + ')', liq.asigFamiliar ? fmtPeso(liq.asigFamiliar) : '$0', liq.asigFamiliar ? 'var(--co-green)' : 'var(--co-mute)'));
    wrap.appendChild(secAf);
    var liqTotal = document.createElement('div');
    liqTotal.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:12px 0 4px;margin-top:8px;border-top:2px solid var(--co-ink);font-size:15px;font-weight:700';
    liqTotal.innerHTML = '<span style="color:var(--co-ink)">L\u00edquido a pagar</span><span style="color:var(--co-orange)">' + fmtPeso(liq.liquidoAPagar) + '</span>';
    wrap.appendChild(liqTotal);
    var acciones = document.createElement('div');
    acciones.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;margin-top:14px';
    var btnEmp = document.createElement('button');
    btnEmp.className = 'rem-btn-sec'; btnEmp.style.fontSize = '12px';
    btnEmp.innerHTML = '<i class="ti ti-building-bank" aria-hidden="true"></i> Ver costo empleador';
    btnEmp.addEventListener('click', function(e) { e.stopPropagation(); _liqModalCostoEmpleador(liq); });
    var btnPdf = document.createElement('button');
    btnPdf.className = 'rem-btn-pri'; btnPdf.style.fontSize = '12px';
    btnPdf.innerHTML = '<i class="ti ti-download" aria-hidden="true"></i> Descargar PDF';
    btnPdf.disabled = true; btnPdf.title = 'Pr\u00f3ximamente';
    acciones.appendChild(btnEmp); acciones.appendChild(btnPdf);
    wrap.appendChild(acciones);
    return wrap;
  }

  function _liqModalCostoEmpleador(liq) {
    var modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:500;display:flex;align-items:center;justify-content:center';
    var box = document.createElement('div');
    box.style.cssText = 'background:var(--co-surface);border-radius:14px;padding:24px;width:360px;max-width:90vw';
    var rows = '';
    if (liq.aporteEmpleadorAfp)      rows += _liqCostoRow('AFP reforma (0.1%)', liq.aporteEmpleadorAfp);
    if (liq.aporteEmpleadorSIS)      rows += _liqCostoRow('SIS (1.62%)', liq.aporteEmpleadorSIS);
    if (liq.aporteEmpleadorExpVida)  rows += _liqCostoRow('Expectativa de vida (0.9%)', liq.aporteEmpleadorExpVida);
    if (liq.aporteEmpleadorRentProt) rows += _liqCostoRow('Rentabilidad protegida', liq.aporteEmpleadorRentProt);
    if (liq.aporteEmpleadorSC)       rows += _liqCostoRow('Seguro cesant\u00eda empleador', liq.aporteEmpleadorSC);
    if (liq.aporteEmpleadorMutual)   rows += _liqCostoRow('Mutual', liq.aporteEmpleadorMutual);
    box.innerHTML = '<div style="font-size:14px;font-weight:700;color:var(--co-ink);margin-bottom:16px">Costo empleador \u2014 ' + liq.periodo + '</div>' + rows +
      '<div style="display:flex;justify-content:space-between;padding:10px 0 0;margin-top:8px;border-top:2px solid var(--co-ink);font-size:14px;font-weight:700"><span>Total costo empleador</span><span style="color:var(--co-orange)">' + fmtPeso(liq.totalCostoEmpleador) + '</span></div>';
    var btnCerrar = document.createElement('button');
    btnCerrar.className = 'rem-btn-sec';
    btnCerrar.style.cssText = 'margin-top:16px;width:100%;font-size:13px';
    btnCerrar.textContent = 'Cerrar';
    btnCerrar.addEventListener('click', function() { document.body.removeChild(modal); });
    modal.addEventListener('click', function(e) { if (e.target === modal) document.body.removeChild(modal); });
    box.appendChild(btnCerrar); modal.appendChild(box); document.body.appendChild(modal);
  }

  function _liqCostoRow(lbl, val) {
    return '<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid var(--co-line-soft)"><span style="color:var(--co-ink-3)">' + lbl + '</span><span style="font-weight:500;color:var(--co-ink)">' + fmtPeso(val) + '</span></div>';
  }

  // ── TAB ONBOARDING ───────────────────────────────────────────────────
  function _actualizarPorcentajeOnboarding(el) {
    var total = el.querySelectorAll('[data-done]').length;
    var done  = el.querySelectorAll('[data-done="1"]').length;
    var pct   = total > 0 ? Math.round(done / total * 100) : 0;
    var pctEl  = el.querySelector('#ob-pct');
    var subEl  = el.querySelector('#ob-sub');
    var fillEl = el.querySelector('#ob-fill');
    if (pctEl)  pctEl.textContent  = pct + '%';
    if (subEl)  subEl.textContent  = done + ' de ' + total + ' completados';
    if (fillEl) fillEl.style.width = pct + '%';
  }

  function _guardarOnboarding(c) {
    // Serializar estado actual del onboarding y guardar en GAS
    var estado = c.onboardingJson || {};
    api('/remuneraciones/trabajadores', 'POST', {
      action:        'editarTrabajador',
      id:            c.id,
      onboardingJson: JSON.stringify(estado),
      modificadoPor: 'sistema'
    }).catch(function() {
      // Silencioso — no bloquear la UX si falla
    });
    // Actualizar % en card Resumen sin recargar el panel
    var fichaContenido = document.getElementById('rem-ficha-contenido');
    if (fichaContenido) {
      var resumenPanel = fichaContenido.querySelector('[data-tab-panel="resumen"]');
      var obPanel      = fichaContenido.querySelector('[data-tab-panel="onboarding"]');
      if (resumenPanel && obPanel) {
        var total = obPanel.querySelectorAll('[data-done]').length;
        var done  = obPanel.querySelectorAll('[data-done="1"]').length;
        var pct   = total > 0 ? Math.round(done / total * 100) : 0;
        var fillEl = resumenPanel.querySelector('#res-ob-fill');
        var pctEl  = resumenPanel.querySelector('.rem-ficha-prog-pct');
        var subEl  = resumenPanel.querySelector('[style*="co-mute"][style*="margin-top"]');
        if (fillEl) fillEl.style.width = pct + '%';
        if (pctEl)  pctEl.textContent  = pct + '%';
        if (subEl)  subEl.textContent  = done + ' de ' + total + ' completados';
      }
    }
  }

  function _fichaOnboarding(el, c) {
    // Spinner mientras carga
    var token = {};
    el._fichaToken = token;
    el.innerHTML = '<div class="module-loading" style="min-height:180px"><div class="ml-iso-wrap"><div class="ml-iso" aria-hidden="true"></div></div><div class="ml-text"><div class="ml-brand"><b>co</b>proactiva</div><div class="ml-status"><span class="ml-status-dot"></span>Cargando onboarding</div></div></div>';

    var url = '/remuneraciones/parametros/plantillas?cargo=' + encodeURIComponent(c.cargo || '*');
    api(url).then(function(resp) {
      // Si el usuario cambió de tab, ignorar respuesta
      if (el._fichaToken !== token) return;
      el.innerHTML = '';

      // Verificar respuesta válida
      if (!resp || (resp.data && resp.data.ok === false)) {
        var empty2 = document.createElement('div');
        empty2.style.cssText = 'text-align:center;color:var(--co-mute);padding:24px;font-size:12px';
        empty2.textContent = 'Sin plantilla de onboarding para el cargo "' + (c.cargo || 'sin cargo') + '". Configure una en Parámetros → Plantillas.';
        el.appendChild(empty2);
        return;
      }
      var items = (resp.data && resp.data.data) ? resp.data.data : (resp.data || []);

      // Header progreso — construido con data real, de una vez
      var cardProg = document.createElement('div');
      cardProg.className = 'rem-ficha-card';
      cardProg.style.marginBottom = '16px';
      cardProg.innerHTML = '<div class="rem-ficha-prog-hdr"><div><div class="rem-ficha-prog-pct" id="ob-pct">0%</div><div style="font-size:12px;color:var(--co-mute);margin-top:2px" id="ob-sub">0 de 0 completados</div></div></div><div class="rem-ficha-prog-bar"><div class="rem-ficha-prog-fill" id="ob-fill" style="width:0%"></div></div>';
      el.appendChild(cardProg);

      var cats = {};
      items.forEach(function(it) {
        if (!cats[it.categoria]) cats[it.categoria] = [];
        cats[it.categoria].push(it);
      });
      // Agrupar por categoría y mostrar como pendientes (onboarding real pendiente)
      Object.keys(cats).forEach(function(cat) {
        try {
        el.appendChild(_fichaSecLabel(cat));
        var card = document.createElement('div');
        card.className = 'rem-ficha-card';
        cats[cat].forEach(function(it) {
          var nivel = it.nivelProteccion || (it.esLegal ? 'sistema' : 'borrador');
          var estadoGuardado = (c.onboardingJson && c.onboardingJson[it.id]) ? c.onboardingJson[it.id] : null;

          var wrap = document.createElement('div');
          wrap.style.cssText = 'border-top:1px solid var(--co-line-soft);padding:8px 0';

          var row = document.createElement('div');
          row.className = 'rem-ficha-chk';
          row.style.borderTop = 'none';
          row.style.paddingBottom = '4px';

          // ── obsWrap y obsInp PRIMERO ────────────────────────────────────
          var obsWrap = document.createElement('div');
          obsWrap.style.cssText = 'display:none;padding:2px 0 4px 30px';
          var obsInp = document.createElement('input');
          obsInp.type = 'text';
          obsInp.placeholder = 'Agregar observación…';
          obsInp.style.cssText = 'border:none;background:transparent;font-family:var(--co-font);font-size:12px;color:var(--co-ink);width:100%;outline:none';
          obsInp.addEventListener('click', function(e) { e.stopPropagation(); });
          obsWrap.appendChild(obsInp);
          if (estadoGuardado && estadoGuardado.estado === 'completado') {
            obsWrap.style.display = 'block';
            if (estadoGuardado.observacion) obsInp.value = estadoGuardado.observacion;
          }

          // ── fechaEl SEGUNDO ─────────────────────────────────────────────
          var fechaEl = document.createElement('span');
          fechaEl.style.cssText = 'font-size:11px;color:var(--co-mute);white-space:nowrap';
          if (estadoGuardado && estadoGuardado.estado === 'completado') {
            fechaEl.textContent = estadoGuardado.fecha || '';
            fechaEl.style.color = '#3B6D11';
            fechaEl.style.fontWeight = '600';
          } else {
            fechaEl.textContent = 'Día ' + (it.plazosDias || 5);
          }

          // ── Checkbox TERCERO ────────────────────────────────────────────
          var chkWrap = document.createElement('div');
          chkWrap.style.cssText = 'width:18px;height:18px;border-radius:50%;border:2px solid var(--co-line);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .15s';
          chkWrap.dataset.done = '0';
          if (estadoGuardado && estadoGuardado.estado === 'completado') {
            chkWrap.dataset.done = '1';
            chkWrap.style.background = '#EAF3DE';
            chkWrap.style.borderColor = '#3B6D11';
            chkWrap.innerHTML = '<i class="ti ti-check" style="font-size:10px;color:#3B6D11" aria-hidden="true"></i>';
          }

          chkWrap.addEventListener('click', function() {
            var done = chkWrap.dataset.done === '1';
            var ahora = !done;
            chkWrap.dataset.done = ahora ? '1' : '0';
            chkWrap.style.background = ahora ? '#EAF3DE' : '';
            chkWrap.style.borderColor = ahora ? '#3B6D11' : 'var(--co-line)';
            chkWrap.innerHTML = ahora ? '<i class="ti ti-check" style="font-size:10px;color:#3B6D11" aria-hidden="true"></i>' : '';
            var fechaHoy = _fmtFecha(new Date().toISOString());
            fechaEl.textContent = ahora ? fechaHoy : 'Día ' + (it.plazosDias || 5);
            fechaEl.style.color = ahora ? '#3B6D11' : 'var(--co-mute)';
            fechaEl.style.fontWeight = ahora ? '600' : 'normal';
            obsWrap.style.display = ahora ? 'block' : 'none';
            if (!ahora) obsInp.value = '';
            if (!c.onboardingJson) c.onboardingJson = {};
            if (ahora) {
              c.onboardingJson[it.id] = { estado: 'completado', fecha: fechaHoy, observacion: obsInp.value };
            } else {
              delete c.onboardingJson[it.id];
            }
            _guardarOnboarding(c);
            _actualizarPorcentajeOnboarding(el);
          });

          obsInp.addEventListener('blur', function() {
            if (chkWrap.dataset.done === '1') {
              if (!c.onboardingJson) c.onboardingJson = {};
              if (!c.onboardingJson[it.id]) c.onboardingJson[it.id] = { estado: 'completado', fecha: _fmtFecha(new Date().toISOString()) };
              c.onboardingJson[it.id].observacion = obsInp.value;
              _guardarOnboarding(c);
            }
          });

          // ── Nombre e ítem ───────────────────────────────────────────────
          var name = document.createElement('span');
          name.className = 'rem-ficha-chk-name';
          name.textContent = it.nombre;

          if (nivel === 'sistema') {
            var badge = document.createElement('span');
            badge.className = 'rem-pill legal';
            badge.textContent = 'Requerido';
            badge.style.marginRight = '6px';
            row.appendChild(chkWrap); row.appendChild(name); row.appendChild(badge);
          } else {
            row.appendChild(chkWrap); row.appendChild(name);
          }
          row.appendChild(fechaEl);
          wrap.appendChild(row);
          wrap.appendChild(obsWrap);

          card.appendChild(wrap);
        });
        el.appendChild(card);
        } catch(e) {
          var errDiv = document.createElement('div');
          errDiv.style.cssText = 'color:#A32D2D;font-size:11px;padding:8px';
          errDiv.textContent = 'Error en ' + cat + ': ' + e.message;
          el.appendChild(errDiv);
        }
      });
      // Actualizar porcentaje tras renderizar todos los ítems
      _actualizarPorcentajeOnboarding(el);

      if (!items.length) {
        var vacio = document.createElement('div');
        vacio.style.cssText = 'text-align:center;color:var(--co-mute);padding:24px;font-size:12px';
        vacio.textContent = 'Sin \u00edtems de onboarding para este cargo.';
        el.appendChild(vacio);
      }
    }).catch(function(e) {
      if (el._fichaToken !== token) return;
      el.innerHTML = '';
      var empty = document.createElement('div');
      empty.style.cssText = 'text-align:center;color:var(--co-mute);padding:24px;font-size:12px';
      empty.textContent = 'Sin plantilla de onboarding para el cargo "' + (c.cargo || 'sin cargo') + '". Configure una en Parámetros → Plantillas.';
      el.appendChild(empty);
    });
  }

  // ── TAB DOCUMENTOS ───────────────────────────────────────────────────
  function _fichaDocumentos(el, c) {
    el.innerHTML = '';

    if (!c.carpetaDriveId) {
      // Sin carpeta Drive
      var emptyWrap = document.createElement('div');
      emptyWrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center;border:2px dashed var(--co-line);border-radius:12px;margin-bottom:12px';
      emptyWrap.innerHTML = '<div style="font-size:32px;color:var(--co-line);margin-bottom:10px"><i class="ti ti-folder-off" aria-hidden="true"></i></div><div style="font-size:14px;font-weight:700;color:var(--co-ink);margin-bottom:6px">Sin carpeta Drive asignada</div><div style="font-size:12px;color:var(--co-mute);margin-bottom:16px;max-width:280px">Crea la carpeta para organizar los documentos de este trabajador en Drive.</div>';
      var btnCrear = document.createElement('button');
      btnCrear.className = 'rem-btn-pri';
      btnCrear.innerHTML = '<i class="ti ti-folder-plus" aria-hidden="true"></i> Crear carpeta en Drive';
      btnCrear.addEventListener('click', function() {
        btnCrear.disabled = true; btnCrear.textContent = 'Creando…';
        api('/remuneraciones/trabajadores/' + c.id + '/carpeta-drive', 'POST', {}).then(function(resp) {
          var carpId = resp.data && ((resp.data.data && resp.data.data.carpetaDriveId) || resp.data.carpetaDriveId);
          if (carpId) { c.carpetaDriveId = carpId; _fichaDocumentos(el, c); }
          else {
            btnCrear.disabled = false;
            btnCrear.innerHTML = '<i class="ti ti-folder-plus" aria-hidden="true"></i> Crear carpeta en Drive';
            alert('Error: ' + ((resp.data && resp.data.error) || 'desconocido'));
          }
        }).catch(function() { btnCrear.disabled = false; btnCrear.innerHTML = '<i class="ti ti-folder-plus" aria-hidden="true"></i> Crear carpeta en Drive'; });
      });
      emptyWrap.appendChild(btnCrear);
      el.appendChild(emptyWrap);
      var hint = document.createElement('div');
      hint.style.cssText = 'font-size:11px;color:var(--co-mute);text-align:center';
      hint.innerHTML = 'Se creará en <strong>Laboral / Colaboradores / ' + (c.apellidoPaterno||'') + ' ' + (c.nombres||'') + '</strong>';
      el.appendChild(hint);
      return;
    }

    // Con carpeta Drive — topbar
    var topBar = document.createElement('div');
    topBar.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:16px';
    var linkRaiz = document.createElement('a');
    linkRaiz.href = 'https://drive.google.com/drive/folders/' + c.carpetaDriveId;
    linkRaiz.target = '_blank';
    linkRaiz.style.cssText = 'display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--co-orange);text-decoration:none';
    linkRaiz.innerHTML = '<i class="ti ti-folder" aria-hidden="true"></i> Abrir carpeta raíz en Drive';
    var btnSubir = document.createElement('button');
    btnSubir.className = 'rem-btn-sec';
    btnSubir.innerHTML = '<i class="ti ti-upload" aria-hidden="true"></i> Subir documento';
    btnSubir.addEventListener('click', function() { window.open('https://drive.google.com/drive/folders/' + c.carpetaDriveId, '_blank'); });
    topBar.appendChild(linkRaiz); topBar.appendChild(btnSubir);
    el.appendChild(topBar);

    // Spinner mientras carga
    var spinner = document.createElement('div');
    spinner.className = 'module-loading';
    spinner.style.minHeight = '120px';
    spinner.innerHTML = '<div class="ml-iso-wrap"><div class="ml-iso"></div></div><div class="ml-text"><div class="ml-brand"><b>co</b>proactiva</div><div class="ml-status"><span class="ml-status-dot"></span>Cargando documentos</div></div>';
    el.appendChild(spinner);

    // Token para cancelar si el tab cambia antes de que responda la API
    var token = {};
    el._docToken = token;

    // Cargar documentos reales desde GAS
    api('/remuneraciones/trabajadores/' + c.id + '/documentos').then(function(resp) {
      if (el._docToken !== token) return; // tab cambió, ignorar
      if (el.contains(spinner)) el.removeChild(spinner);
      var docs = (resp.data && resp.data.data) ? resp.data.data : {};
      var SUBS = ['01_Contrato','02_Onboarding','03_Remuneraciones','04_Previsional','05_Otros'];
      var ABIERTAS = ['01_Contrato','02_Onboarding'];

      SUBS.forEach(function(sub, idx) {
        var archivos = docs[sub] || [];
        var total = archivos.length;
        var isOpen = ABIERTAS.indexOf(sub) >= 0;

        var folderEl = document.createElement('div');
        folderEl.style.cssText = 'background:var(--co-surface);border:1px solid ' + (isOpen ? 'var(--co-orange)' : 'var(--co-line)') + ';border-radius:12px;margin-bottom:8px;overflow:hidden;transition:border-color .15s';

        // Header carpeta
        var hdr = document.createElement('div');
        hdr.style.cssText = 'display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;user-select:none';
        hdr.innerHTML = '<div style="width:34px;height:34px;border-radius:8px;background:var(--co-orange-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ti ti-folder" style="font-size:16px;color:var(--co-orange)" aria-hidden="true"></i></div>';
        var nameEl = document.createElement('span');
        nameEl.style.cssText = 'flex:1;font-size:12px;font-weight:600;color:var(--co-ink)';
        nameEl.textContent = sub;
        var countEl = document.createElement('span');
        countEl.className = 'rem-pill ' + (total > 0 ? 'orange' : 'gray');
        countEl.style.marginRight = '8px';
        countEl.textContent = total + ' ' + (total === 1 ? 'archivo' : 'archivos');
        var arrEl = document.createElement('i');
        arrEl.className = 'ti ti-chevron-right';
        arrEl.style.cssText = 'font-size:14px;color:var(--co-mute);transition:transform .2s;' + (isOpen ? 'transform:rotate(90deg)' : '');
        hdr.appendChild(nameEl); hdr.appendChild(countEl); hdr.appendChild(arrEl);

        // Body carpeta
        var body = document.createElement('div');
        body.style.cssText = 'border-top:1px solid var(--co-line);padding:0 16px;display:' + (isOpen ? 'block' : 'none');

        if (total === 0) {
          var emptyMsg = document.createElement('div');
          emptyMsg.style.cssText = 'padding:14px 0;font-size:12px;color:var(--co-mute);text-align:center';
          emptyMsg.textContent = 'Sin documentos en esta carpeta.';
          body.appendChild(emptyMsg);
        } else {
          var mostrar = sub === '03_Remuneraciones' ? archivos.slice(0, 3) : archivos;
          mostrar.forEach(function(arch) {
            var row = document.createElement('div');
            row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--co-line-soft);font-size:12px';
            var ico = document.createElement('div');
            ico.style.cssText = 'width:26px;height:26px;border-radius:6px;background:var(--co-orange-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;color:var(--co-orange)';
            ico.innerHTML = '<i class="ti ti-file-text" aria-hidden="true"></i>';
            var info = document.createElement('div');
            info.style.cssText = 'flex:1;min-width:0';
            info.innerHTML = '<div style="font-weight:600;color:var(--co-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + arch.nombre + '</div><div style="font-size:11px;color:var(--co-mute);margin-top:1px">' + arch.fecha + (arch.tamano ? ' · ' + arch.tamano : '') + '</div>';
            var btnVer = document.createElement('button');
            btnVer.className = 'rem-btn-sec';
            btnVer.style.cssText = 'padding:4px 10px;font-size:11px;flex-shrink:0';
            btnVer.innerHTML = '<i class="ti ti-external-link" style="font-size:11px" aria-hidden="true"></i> Ver';
            btnVer.addEventListener('click', function() { window.open(arch.url, '_blank'); });
            row.appendChild(ico); row.appendChild(info); row.appendChild(btnVer);
            body.appendChild(row);
          });
          if (sub === '03_Remuneraciones' && total > 3) {
            var verMas = document.createElement('div');
            verMas.style.cssText = 'padding:10px 0;font-size:11px;font-weight:700;color:var(--co-orange);cursor:pointer';
            verMas.textContent = 'Ver todos en Drive →';
            verMas.addEventListener('click', function() { window.open('https://drive.google.com/drive/folders/' + c.carpetaDriveId, '_blank'); });
            body.appendChild(verMas);
          }
        }

        // Toggle
        hdr.addEventListener('click', function() {
          var abierta = body.style.display !== 'none';
          body.style.display = abierta ? 'none' : 'block';
          arrEl.style.transform = abierta ? '' : 'rotate(90deg)';
          folderEl.style.borderColor = abierta ? 'var(--co-line)' : 'var(--co-orange)';
        });

        folderEl.appendChild(hdr); folderEl.appendChild(body);
        el.appendChild(folderEl);
      });
    }).catch(function() {
      if (el._docToken !== token) return;
      if (el.contains(spinner)) el.removeChild(spinner);
      var err = document.createElement('div');
      err.style.cssText = 'text-align:center;color:#A32D2D;padding:24px;font-size:12px';
      err.textContent = 'Error al cargar documentos.';
      el.appendChild(err);
    });
  }

  // ── INDICADORES ───────────────────────────────────────────────────────────
  function renderIndicadores(el) {
    var hdr = document.createElement('div'); hdr.style.cssText = 'display:flex;justify-content:flex-end;gap:8px;margin-bottom:16px;flex-wrap:wrap';
    var btnBase = document.createElement('button'); btnBase.className = 'rem-btn-sec';

    var btnPrevired = document.createElement('button'); btnPrevired.className = 'rem-btn-sec';
    btnPrevired.innerHTML = '<i class="ti ti-cloud-download" aria-hidden="true"></i> Actualizar desde Previred';
    var btnEdit = document.createElement('button'); btnEdit.className = 'rem-btn-sec'; btnEdit.innerHTML = '<i class="ti ti-edit" aria-hidden="true"></i> Editar';

          _indicadores = [];
          btnBase.textContent = '✓ Datos base cargados';

    btnPrevired.addEventListener('click', function() { _scrapingPrevired(el); });
    hdr.appendChild(btnBase); hdr.appendChild(btnPrevired); hdr.appendChild(btnEdit); el.appendChild(hdr);

    var contenedor = document.createElement('div'); contenedor.id = 'rem-ind-contenedor';
    contenedor.innerHTML = '<div style="text-align:center;color:var(--co-mute);padding:24px">Cargando indicadores\u2026</div>';
    el.appendChild(contenedor);

    // Cargar desde GAS
    if (_indicadores.length > 0) {
      _renderIndicadoresData(contenedor, _indicadores);
    } else {
      api('/remuneraciones/parametros/indicadores').then(function(resp) {
        _indicadores = (resp.data && resp.data.data) ? resp.data.data : (resp.data || []);
        _renderIndicadoresData(contenedor, _indicadores);

        contenedor.innerHTML = '<div style="text-align:center;color:#A32D2D;padding:24px">Error al cargar indicadores.</div>';
