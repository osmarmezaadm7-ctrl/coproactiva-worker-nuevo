<!-- modules/remuneraciones.html — CoproActiva Remuneraciones -->
<!-- Version: 1.0 · Junio 2026 -->

<style>
  #rem-root { font-family: var(--co-font); color: var(--co-ink); }

  /* ── Tabs ── */
  .rem-tabs {
    display: flex;
    gap: 2px;
    border-bottom: 1px solid var(--co-line);
    margin-bottom: 20px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .rem-tabs::-webkit-scrollbar { display: none; }
  .rem-tab {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 9px 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--co-mute);
    cursor: pointer;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    white-space: nowrap;
    background: transparent;
    font-family: var(--co-font);
    transition: color 0.15s;
  }
  .rem-tab:hover { color: var(--co-ink); }
  .rem-tab.act { color: var(--co-orange); border-bottom-color: var(--co-orange); font-weight: 700; }
  .rem-tab .rem-tab-ico { font-size: 14px; }

  /* ── KPIs ── */
  .rem-kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }
  .rem-kpi {
    background: var(--co-surface);
    border: 1px solid var(--co-line);
    border-radius: var(--co-r-lg);
    padding: 14px 16px;
  }
  .rem-kpi-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--co-mute);
    margin-bottom: 6px;
  }
  .rem-kpi-val {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--co-ink);
  }
  .rem-kpi-val.rem-warn { color: var(--co-orange); }
  .rem-kpi-val.rem-ok   { color: #3B6D11; }
  .rem-kpi-sub {
    font-size: 10px;
    color: var(--co-mute);
    margin-top: 3px;
  }

  /* ── Selector comunidad (wrapper) ── */
  .com-sel-wrap { position: relative; display: inline-flex; align-items: center; }

  /* ── Section label ── */
  .rem-section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--co-mute);
    margin-bottom: 10px;
  }

  /* ── Tabla base ── */
  .rem-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .rem-table th {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--co-mute);
    padding: 0 12px 8px;
    text-align: left;
  }
  .rem-table td {
    padding: 10px 12px;
    border-top: 1px solid var(--co-line);
    color: var(--co-ink);
    vertical-align: middle;
  }
  .rem-table tr:hover td {
    background: var(--co-bg);
    cursor: pointer;
  }

  /* ── Pills estado ── */
  .rem-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
  }
  .rem-pill.ok      { background: #EAF3DE; color: #3B6D11; }
  .rem-pill.warn    { background: var(--co-orange-soft); color: #854F0B; }
  .rem-pill.danger  { background: #FCEBEB; color: #A32D2D; }
  .rem-pill.gray    { background: var(--co-bg); color: var(--co-mute); border: 1px solid var(--co-line); }
  .rem-pill.blue    { background: #E6F1FB; color: #185FA5; }

  /* ── Avatar ── */
  .rem-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--co-orange-soft);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--co-orange);
    flex-shrink: 0;
  }

  /* ── Botones ── */
  .rem-btn-pri {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: var(--co-orange);
    color: #fff;
    border: none;
    border-radius: var(--co-r-md);
    font-size: 12px;
    font-weight: 700;
    font-family: var(--co-font);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .rem-btn-pri:hover { background: #C4762F; }
  .rem-btn-sec {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    background: var(--co-surface);
    border: 1px solid var(--co-line);
    border-radius: var(--co-r-md);
    font-size: 12px;
    font-weight: 600;
    color: var(--co-ink);
    font-family: var(--co-font);
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s;
  }
  .rem-btn-sec:hover { border-color: var(--co-orange); }

  /* ── Search bar ── */
  .rem-search-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    align-items: center;
    flex-wrap: wrap;
  }
  .rem-search-box {
    flex: 1;
    min-width: 180px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--co-surface);
    border: 1px solid var(--co-line);
    border-radius: var(--co-r-md);
    padding: 8px 12px;
  }
  .rem-search-box input {
    border: none;
    background: transparent;
    font-family: var(--co-font);
    font-size: 12px;
    color: var(--co-ink);
    flex: 1;
    outline: none;
  }
  .rem-search-box input::placeholder { color: var(--co-mute); }

  /* ── Filtros pill ── */
  .rem-filtros {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .rem-filtro {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--co-line);
    color: var(--co-mute);
    background: var(--co-surface);
    cursor: pointer;
    font-family: var(--co-font);
    transition: all 0.13s;
  }
  .rem-filtro.act {
    background: var(--co-orange-soft);
    color: var(--co-orange);
    border-color: var(--co-orange-line);
  }

  /* ── Panel cartera table ── */
  .rem-cartera-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* ── Alertas ── */
  .rem-alertas { display: flex; flex-direction: column; gap: 8px; }
  .rem-alerta {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: var(--co-r-md);
    font-size: 12px;
  }
  .rem-alerta.warn   { background: var(--co-orange-soft); border: 1px solid var(--co-orange-line); }
  .rem-alerta.danger { background: #FCEBEB; border: 1px solid #F7C1C1; }
  .rem-alerta.info   { background: var(--co-bg); border: 1px solid var(--co-line); }
  .rem-alerta i      { font-size: 16px; flex-shrink: 0; }
  .rem-alerta.warn i   { color: #854F0B; }
  .rem-alerta.danger i { color: #A32D2D; }
  .rem-alerta.info i   { color: var(--co-mute); }
  .rem-alerta-txt    { color: var(--co-ink); flex: 1; font-size: 12px; }
  .rem-alerta-txt b  { font-weight: 700; }
  .rem-alerta-link   {
    font-size: 11px;
    font-weight: 700;
    color: var(--co-orange);
    cursor: pointer;
    white-space: nowrap;
    background: none;
    border: none;
    font-family: var(--co-font);
    padding: 0;
  }

  /* ── Panel two-col ── */
  .rem-two-col {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 768px) {
    .rem-two-col { grid-template-columns: 1fr; }
  }

  /* ── Periodo card ── */
  .rem-periodo-card {
    background: var(--co-surface);
    border: 1px solid var(--co-line);
    border-radius: var(--co-r-lg);
    padding: 16px 20px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .rem-periodo-ico {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 20px;
  }
  .rem-periodo-ico.abierto { background: var(--co-orange-soft); color: var(--co-orange); }
  .rem-periodo-ico.cerrado { background: #EAF3DE; color: #3B6D11; }
  .rem-periodo-info { flex: 1; min-width: 140px; }
  .rem-periodo-titulo { font-size: 13px; font-weight: 700; color: var(--co-ink); }
  .rem-periodo-sub { font-size: 11px; color: var(--co-mute); margin-top: 2px; }
  .rem-periodo-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ── Divider ── */
  .rem-divider { height: 1px; background: var(--co-line); margin: 16px 0; }

  /* ── Empty state ── */
  .rem-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    text-align: center;
    color: var(--co-mute);
  }
  .rem-empty i { font-size: 36px; margin-bottom: 12px; }
  .rem-empty-title { font-size: 14px; font-weight: 700; color: var(--co-ink); margin-bottom: 6px; }
  .rem-empty-sub { font-size: 12px; }

  /* ── Parametros ── */
  .rem-param-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 600px) {
    .rem-param-grid { grid-template-columns: 1fr; }
  }
  .rem-param-card {
    background: var(--co-surface);
    border: 1px solid var(--co-line);
    border-radius: var(--co-r-lg);
    padding: 16px;
  }
  .rem-param-card-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--co-mute);
    margin-bottom: 12px;
  }
  .rem-param-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-top: 1px solid var(--co-line);
    font-size: 12px;
  }
  .rem-param-row:first-of-type { border-top: none; }
  .rem-param-key { color: var(--co-mute); }
  .rem-param-val { font-weight: 700; color: var(--co-ink); }

  /* ── Novedades grid ── */
  .rem-nov-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }
  @media (max-width: 500px) {
    .rem-nov-grid { grid-template-columns: 1fr; }
  }
</style>

<div id="rem-root">
  <div class="module-loading">
    <div class="ml-iso-wrap">
      <div class="ml-iso" aria-hidden="true"></div>
    </div>
    <div class="ml-text">
      <div class="ml-brand"><b>co</b>proactiva</div>
      <div class="ml-status">
        <span class="ml-status-dot"></span>
        Cargando Remuneraciones
      </div>
    </div>
  </div>
</div>

<script>
(function() {

  var WORKER_URL = 'https://coproactiva-worker-nuevo.osmarmeza-adm7.workers.dev';

  function _token() { return sessionStorage.getItem('token') || ''; }

  // Tab activa
  var _tabActiva = 'panel';

  // Datos en memoria
  var _colaboradores = [];
  var _periodos      = [];

  // ── Utilidades ────────────────────────────────────────────────────────────

  function api(path, method, body) {
    method = method || 'GET';
    var opts = {
      method: method,
      headers: {
        'Authorization': 'Bearer ' + _token(),
        'Content-Type': 'application/json'
      }
    };
    if (body) opts.body = JSON.stringify(body);
    return fetch(WORKER_URL + path, opts).then(function(r) { return r.json(); });
  }

  function iniciales(nombre) {
    if (!nombre) return '?';
    var partes = nombre.trim().split(' ');
    if (partes.length >= 2) return (partes[0][0] + partes[1][0]).toUpperCase();
    return partes[0].substring(0, 2).toUpperCase();
  }

  function fmtPeso(n) {
    if (!n && n !== 0) return '\u2014';
    return '$' + Math.round(n).toLocaleString('es-CL');
  }

  // ── Arranque ──────────────────────────────────────────────────────────────

  function init() {
    var root = document.getElementById('rem-root');
    if (!root) return;
    renderModulo();
  }

  // ── Shell principal ───────────────────────────────────────────────────────

  function renderModulo() {
    var root = document.getElementById('rem-root');
    root.innerHTML = '';

    // Page header
    var pageHdr = document.createElement('div');
    pageHdr.className = 'page-header';

    var left = document.createElement('div');
    var ey = document.createElement('div');
    ey.className = 'page-eyebrow';
    ey.textContent = 'OPERACIONES';
    var tt = document.createElement('h1');
    tt.className = 'page-title';
    tt.innerHTML = 'Remune<em>raciones</em>';
    var sb = document.createElement('p');
    sb.className = 'page-sub';
    sb.textContent = 'Gesti\u00F3n de personal, liquidaciones y procesos de pago.';
    left.appendChild(ey); left.appendChild(tt); left.appendChild(sb);

    // Selector comunidad
    var selWrap = document.createElement('div');
    selWrap.className = 'com-sel-wrap';
    selWrap.id = 'rem-com-sel';

    pageHdr.appendChild(left);
    pageHdr.appendChild(selWrap);
    root.appendChild(pageHdr);

    // Inicializar selector de comunidad desde app.js
    if (typeof renderSelectorComunidad === 'function') {
      renderSelectorComunidad('rem-com-sel', function() {
        renderTabContent();
      });
    }

    // Tabs
    var tabsEl = document.createElement('div');
    tabsEl.className = 'rem-tabs';
    tabsEl.id = 'rem-tabs';

    var TABS = [
      { id: 'panel',        label: 'Panel',          ico: 'ti-layout-dashboard' },
      { id: 'colaboradores',label: 'Colaboradores',  ico: 'ti-users'            },
      { id: 'procesos',     label: 'Procesos',       ico: 'ti-receipt'          },
      { id: 'asistencia',   label: 'Asistencia',     ico: 'ti-calendar-check'   },
      { id: 'novedades',    label: 'Novedades',      ico: 'ti-beach'            },
      { id: 'parametros',   label: 'Par\u00E1metros',ico: 'ti-settings-2'       },
    ];

    TABS.forEach(function(t) {
      var btn = document.createElement('button');
      btn.className = 'rem-tab' + (t.id === _tabActiva ? ' act' : '');
      btn.dataset.tab = t.id;
      btn.innerHTML = '<i class="ti ' + t.ico + ' rem-tab-ico" aria-hidden="true"></i> ' + t.label;
      btn.addEventListener('click', function() {
        _tabActiva = t.id;
        tabsEl.querySelectorAll('.rem-tab').forEach(function(b) { b.classList.remove('act'); });
        btn.classList.add('act');
        renderTabContent();
      });
      tabsEl.appendChild(btn);
    });

    root.appendChild(tabsEl);

    // Contenido
    var contenido = document.createElement('div');
    contenido.id = 'rem-contenido';
    root.appendChild(contenido);

    renderTabContent();
  }

  function renderTabContent() {
    var contenido = document.getElementById('rem-contenido');
    if (!contenido) return;
    contenido.innerHTML = '';

    var RENDERERS = {
      panel:         renderPanel,
      colaboradores: renderColaboradores,
      procesos:      renderProcesos,
      asistencia:    renderAsistencia,
      novedades:     renderNovedades,
      parametros:    renderParametros,
    };

    if (RENDERERS[_tabActiva]) RENDERERS[_tabActiva](contenido);
  }

  // ── TAB: PANEL ────────────────────────────────────────────────────────────

  function renderPanel(el) {
    // KPIs globales
    var kpiGrid = document.createElement('div');
    kpiGrid.className = 'rem-kpi-grid';
    [
      { label: 'Colaboradores activos', val: '\u2014', sub: 'cargando...' },
      { label: 'Gasto total mes',       val: '\u2014', sub: 'Jun 2026'    },
      { label: 'Per\u00EDodos abiertos',val: '\u2014', cls: 'rem-warn', sub: 'sin cerrar' },
      { label: 'Contratos a vencer',    val: '\u2014', cls: 'rem-warn', sub: 'pr\u00F3ximos 30 d\u00EDas' },
    ].forEach(function(k) {
      var card = document.createElement('div');
      card.className = 'rem-kpi';
      var lbl = document.createElement('div'); lbl.className = 'rem-kpi-label'; lbl.textContent = k.label;
      var val = document.createElement('div'); val.className = 'rem-kpi-val' + (k.cls ? ' ' + k.cls : ''); val.textContent = k.val;
      var sub = document.createElement('div'); sub.className = 'rem-kpi-sub'; sub.textContent = k.sub;
      card.appendChild(lbl); card.appendChild(val); card.appendChild(sub);
      kpiGrid.appendChild(card);
    });
    el.appendChild(kpiGrid);

    var divider = document.createElement('div');
    divider.className = 'rem-divider';
    el.appendChild(divider);

    // Two-col: cartera + alertas
    var twoCol = document.createElement('div');
    twoCol.className = 'rem-two-col';

    // Cartera
    var carteraWrap = document.createElement('div');
    var secLabel = document.createElement('div');
    secLabel.className = 'rem-section-label';
    secLabel.textContent = 'Cartera \u2014 estado del per\u00EDodo Jun 2026';
    carteraWrap.appendChild(secLabel);

    var tbWrap = document.createElement('div');
    tbWrap.className = 'rem-cartera-wrap';
    var tb = document.createElement('table');
    tb.className = 'rem-table';
    tb.innerHTML =
      '<thead><tr>' +
        '<th>Comunidad</th>' +
        '<th>Colabs.</th>' +
        '<th>Gasto mes</th>' +
        '<th>Per\u00EDodo</th>' +
        '<th></th>' +
      '</tr></thead>' +
      '<tbody id="rem-cartera-body">' +
        '<tr><td colspan="5" style="text-align:center;color:var(--co-mute);padding:20px">Cargando comunidades\u2026</td></tr>' +
      '</tbody>';
    tbWrap.appendChild(tb);
    carteraWrap.appendChild(tbWrap);
    twoCol.appendChild(carteraWrap);

    // Alertas
    var alertasWrap = document.createElement('div');
    var aLabel = document.createElement('div');
    aLabel.className = 'rem-section-label';
    aLabel.textContent = 'Alertas';
    alertasWrap.appendChild(aLabel);
    var alertasList = document.createElement('div');
    alertasList.className = 'rem-alertas';
    alertasList.id = 'rem-alertas';
    alertasList.innerHTML = '<div class="rem-alerta info"><i class="ti ti-info-circle" aria-hidden="true"></i><div class="rem-alerta-txt">Cargando alertas\u2026</div></div>';
    alertasWrap.appendChild(alertasList);
    twoCol.appendChild(alertasWrap);

    el.appendChild(twoCol);

    // Poblar cartera con comunidades reales
    if (window._comunidades && window._comunidades.length > 0) {
      _poblarCartera();
    } else {
      setTimeout(_poblarCartera, 800);
    }
  }

  function _poblarCartera() {
    var tbody = document.getElementById('rem-cartera-body');
    var alertasEl = document.getElementById('rem-alertas');
    if (!tbody) return;

    var lista = window._comunidades || [];
    if (!lista.length) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--co-mute);padding:20px">Sin comunidades disponibles.</td></tr>';
      return;
    }

    tbody.innerHTML = '';
    var alertas = [];

    lista.forEach(function(c) {
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td><b>' + c.nombre + '</b><br><span style="font-size:11px;color:var(--co-mute)">' + (c.comuna || '') + '</span></td>' +
        '<td style="text-align:center">\u2014</td>' +
        '<td>\u2014</td>' +
        '<td><span class="rem-pill gray">Sin datos</span></td>' +
        '<td><button class="rem-btn-sec" style="font-size:11px;padding:4px 10px">Ver</button></td>';
      tr.querySelector('button').addEventListener('click', function() {
        if (typeof setComunidadActiva === 'function') setComunidadActiva({ id: c.id, nombre: c.nombre });
        _tabActiva = 'procesos';
        renderModulo();
      });
      tbody.appendChild(tr);
    });

    // Alerta placeholder
    if (alertasEl) {
      alertasEl.innerHTML =
        '<div class="rem-alerta info"><i class="ti ti-info-circle" aria-hidden="true"></i>' +
        '<div class="rem-alerta-txt">Las alertas aparecer\u00E1n cuando se registren per\u00EDodos y colaboradores.</div></div>';
    }
  }

  // ── TAB: COLABORADORES ────────────────────────────────────────────────────

  function renderColaboradores(el) {
    var com = typeof getComunidadActiva === 'function' ? getComunidadActiva() : null;

    // Header acciones
    var hdrAcc = document.createElement('div');
    hdrAcc.style.cssText = 'display:flex;justify-content:flex-end;gap:8px;margin-bottom:16px;flex-wrap:wrap';
    var btnImportar = document.createElement('button');
    btnImportar.className = 'rem-btn-sec';
    btnImportar.innerHTML = '<i class="ti ti-upload" aria-hidden="true"></i> Importar n\u00F3mina';
    var btnNuevo = document.createElement('button');
    btnNuevo.className = 'rem-btn-pri';
    btnNuevo.innerHTML = '<i class="ti ti-plus" aria-hidden="true"></i> Nuevo trabajador';
    btnNuevo.addEventListener('click', function() { abrirModalColaborador(null); });
    hdrAcc.appendChild(btnImportar);
    hdrAcc.appendChild(btnNuevo);
    el.appendChild(hdrAcc);

    // Aviso si no hay comunidad
    if (!com) {
      el.appendChild(_avisoSinComunidad());
      return;
    }

    // Search + filtros
    var searchBar = document.createElement('div');
    searchBar.className = 'rem-search-bar';
    var searchBox = document.createElement('div');
    searchBox.className = 'rem-search-box';
    searchBox.innerHTML = '<i class="ti ti-search" aria-hidden="true" style="color:var(--co-mute);font-size:14px"></i>';
    var searchInput = document.createElement('input');
    searchInput.type = 'text';
    searchInput.placeholder = 'Buscar por nombre, RUT o cargo\u2026';
    searchBox.appendChild(searchInput);
    searchBar.appendChild(searchBox);
    el.appendChild(searchBar);

    var filtros = document.createElement('div');
    filtros.className = 'rem-filtros';
    var _filtroActivo = 'vigentes';

      { id: 'todos',         label: 'Todos'         },

      btn.className = 'rem-filtro' + (f.id === _filtroActivo ? ' act' : '');
      btn.textContent = f.label;
      btn.addEventListener('click', function() {
        _filtroActivo = f.id;
        filtros.querySelectorAll('.rem-filtro').forEach(function(b) { b.classList.remove('act'); });
        btn.classList.add('act');
        _renderListaColaboradores(tbody, searchInput.value, _filtroActivo);
      });
      filtros.appendChild(btn);
    });

    // Tabla
    var tbWrap = document.createElement('div');
    tbWrap.style.overflowX = 'auto';
    var table = document.createElement('table');
    table.className = 'rem-table';
    table.innerHTML =
      '<thead><tr>' +

        '<th>Nombre</th>' +

    searchInput.addEventListener('input', function() {
      _renderListaColaboradores(tbody, searchInput.value, _filtroActivo);
    });

    _colaboradores = [];
    _renderListaColaboradores(tbody, '', _filtroActivo);
  }

  function _renderListaColaboradores(tbody, busqueda, filtro) {
    var lista = _colaboradores.filter(function(c) {
      if (filtro === 'vigentes'      && c.estado !== 'activo')       return false;
      if (filtro === 'desvinculados' && c.estado !== 'desvinculado') return false;
      if (busqueda) {
        var q = busqueda.toLowerCase();
        return (c.nombre || '').toLowerCase().includes(q) ||
               (c.rut    || '').toLowerCase().includes(q) ||
               (c.cargo  || '').toLowerCase().includes(q);
      }
      return true;
    });

    if (!lista.length) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--co-mute);padding:24px">' +
        'No hay colaboradores registrados en esta comunidad.<br>' +
        '<span style="font-size:11px">Usa "Nuevo trabajador" para agregar el primero.</span>' +
        '</td></tr>';
      return;
    }

    tbody.innerHTML = '';
    lista.forEach(function(c) {
      var estadoPill = {
        activo:        '<span class="rem-pill ok">Activo</span>',
        licencia:      '<span class="rem-pill warn">Licencia</span>',
        desvinculado:  '<span class="rem-pill gray">Desvinculado</span>',
      }[c.estado] || '<span class="rem-pill gray">' + (c.estado || '\u2014') + '</span>';

      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td><div class="rem-avatar">' + iniciales(c.nombre) + '</div></td>' +
        '<td><b>' + (c.nombre || '\u2014') + '</b></td>' +
        '<td>' + (c.rut || '\u2014') + '</td>' +
        '<td>' + (c.cargo || '\u2014') + '</td>' +
        '<td>' + (c.tipoContrato || '\u2014') + '</td>' +
        '<td>' + fmtPeso(c.sueldoBase) + '</td>' +
        '<td>' + estadoPill + '</td>' +
        '<td><i class="ti ti-chevron-right" aria-hidden="true" style="color:var(--co-mute)"></i></td>';
      tr.addEventListener('click', function() { abrirFichaColaborador(c); });
      tbody.appendChild(tr);
    });
  }

      { mes: 'Mayo 2026',   estado: 'cerrado', liquidaciones: 3, total: 3, liquido: 1610000, previredPagado: true  },
    ];

    periodos.forEach(function(p) {
      var card = document.createElement('div');
      card.className = 'rem-periodo-card';

      var ico = document.createElement('div');
      ico.className = 'rem-periodo-ico ' + p.estado;
      ico.innerHTML = p.estado === 'abierto'
        ? '<i class="ti ti-clock" aria-hidden="true"></i>'
        : '<i class="ti ti-circle-check" aria-hidden="true"></i>';

      var info = document.createElement('div');
      info.className = 'rem-periodo-info';
      var titulo = document.createElement('div');
      titulo.className = 'rem-periodo-titulo';
      titulo.textContent = p.mes + (p.estado === 'abierto' ? ' \u2014 Abierto' : ' \u2014 Cerrado');
      var sub = document.createElement('div');
      sub.className = 'rem-periodo-sub';
      if (p.estado === 'abierto') {
        sub.textContent = p.liquidaciones + ' de ' + p.total + ' liquidaciones generadas';
      } else {
        sub.textContent = p.total + ' liquidaciones \u00B7 ' + fmtPeso(p.liquido) + ' l\u00EDquido' + (p.previredPagado ? ' \u00B7 Previred pagado' : '');
      }
      info.appendChild(titulo);
      info.appendChild(sub);

      var actions = document.createElement('div');
      actions.className = 'rem-periodo-actions';
      if (p.estado === 'abierto') {
        var btnGen = document.createElement('button');
        btnGen.className = 'rem-btn-pri';

        actions.appendChild(btnGen);
      } else {
        var btnPrev = document.createElement('button');
        btnPrev.className = 'rem-btn-sec';
        btnPrev.innerHTML = '<i class="ti ti-download" aria-hidden="true"></i> Previred';
        var btnLibro = document.createElement('button');

        btnLibro.innerHTML = '<i class="ti ti-book" aria-hidden="true"></i> Libro';
        actions.appendChild(btnPrev);
        actions.appendChild(btnLibro);
      }

      card.appendChild(ico);
      card.appendChild(info);
      card.appendChild(actions);
      el.appendChild(card);
    });
  }
