<!-- modules/crm.html — CoproActiva CRM -->
<!-- Versión: 2.2 · Mayo 2026 — fix B1 condición de carrera iniciarDiagnostico -->

<style>
  :root {
    --azul:       #304660;
    --azul-claro: #3d5a7a;
    --naranja:    #D18549;
    --verde:      #6FA885;
    --rojo:       #B83232;
    --superficie: #F2F0ED;
    --borde:      #E8E4DE;
    --texto:      #1a1a1a;
    --texto-sub:  #6b7280;
    --sombra:     0 2px 12px rgba(48,70,96,0.10);
  }

  #crm-root { font-family: 'Segoe UI', Arial, sans-serif; color: var(--texto); }

  /* ── KPIs ── */
  .crm-kpis { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .kpi-card { background: white; border: 1px solid var(--borde); border-radius: 10px; padding: 12px 18px; min-width: 90px; text-align: center; flex-shrink: 0; box-shadow: var(--sombra); }
  .kpi-num { font-size: 26px; font-weight: 700; color: var(--azul); line-height: 1; }
  .kpi-num.urgente { color: var(--rojo); }
  .kpi-num.ganado  { color: var(--verde); }
  .kpi-num.perdido { color: #aaa; }
  .kpi-label { font-size: 11px; color: var(--texto-sub); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.4px; }

  /* ── Toolbar ── */
  .crm-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; }
  .crm-toolbar h2 { margin: 0; font-size: 16px; font-weight: 700; color: var(--azul); }
  .btn-nuevo { background: var(--naranja); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; min-height: 44px; display: flex; align-items: center; gap: 6px; }
  .btn-nuevo:hover { opacity: 0.88; }
  .btn-nuevo:active { transform: scale(0.97); }

  /* ── Desktop Kanban ── */
  @media (min-width: 768px) {
    .vista-mobile  { display: none !important; }
    .vista-desktop { display: block; }
    .pipeline-scroll { overflow-x: auto; padding-bottom: 8px; }
    .pipeline { display: flex; gap: 12px; min-width: max-content; align-items: flex-start; }
    .columna { background: var(--superficie); border-radius: 10px; width: 200px; flex-shrink: 0; padding: 10px; }
    .columna-header { font-size: 11px; font-weight: 700; color: var(--azul); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; padding: 0 2px; }
    .columna-count { background: var(--azul); color: white; border-radius: 10px; padding: 1px 7px; font-size: 10px; }
    .columna-vacia { font-size: 11px; color: #bbb; text-align: center; padding: 16px 0; }
  }

  /* ── Móvil Accordion ── */
  @media (max-width: 767px) {
    .vista-desktop { display: none !important; }
    .vista-mobile  { display: block; }
    .accordion-etapa { background: white; border: 1px solid var(--borde); border-radius: 10px; margin-bottom: 8px; overflow: hidden; box-shadow: var(--sombra); }
    .accordion-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; cursor: pointer; min-height: 44px; user-select: none; -webkit-tap-highlight-color: transparent; }
    .accordion-header:active { background: var(--superficie); }
    .accordion-titulo { font-size: 13px; font-weight: 700; color: var(--azul); }
    .accordion-meta { display: flex; align-items: center; gap: 8px; }
    .accordion-count { background: var(--azul); color: white; border-radius: 10px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
    .accordion-count.vacio { background: #ddd; color: #999; }
    .accordion-chevron { font-size: 12px; color: var(--texto-sub); transition: transform 0.2s; }
    .accordion-chevron.abierto { transform: rotate(180deg); }
    .accordion-body { display: none; padding: 0 10px 10px; border-top: 1px solid var(--borde); }
    .accordion-body.abierto { display: block; }
    .accordion-vacia { font-size: 12px; color: #bbb; text-align: center; padding: 14px 0; }
  }

  /* ── Tarjeta ── */
  .tarjeta { background: white; border: 1px solid var(--borde); border-radius: 8px; padding: 12px; margin-bottom: 8px; cursor: pointer; border-left: 4px solid var(--borde); transition: box-shadow 0.15s, transform 0.1s; -webkit-tap-highlight-color: transparent; }
  .tarjeta:hover  { box-shadow: 0 3px 12px rgba(48,70,96,0.13); }
  .tarjeta:active { transform: scale(0.98); }
  .tarjeta.sem-rojo     { border-left-color: var(--rojo); }
  .tarjeta.sem-amarillo { border-left-color: #e8a020; }
  .tarjeta.sem-verde    { border-left-color: var(--verde); }
  .tarjeta.sem-gris     { border-left-color: #ccc; opacity: 0.65; }
  .tarjeta-nombre { font-size: 13px; font-weight: 700; color: var(--azul); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tarjeta-contacto { font-size: 11px; color: var(--texto-sub); margin-bottom: 6px; }
  .tarjeta-footer { display: flex; justify-content: space-between; align-items: center; }
  .tarjeta-unidades { font-size: 11px; color: var(--texto-sub); }
  .semaforo-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot-rojo     { background: var(--rojo); }
  .dot-amarillo { background: #e8a020; }
  .dot-verde    { background: var(--verde); }
  .dot-gris     { background: #ccc; }
  .tarjeta-accion { font-size: 10px; color: var(--texto-sub); margin-top: 6px; border-top: 1px solid var(--borde); padding-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 767px) {
    .tarjeta { padding: 14px; }
    .tarjeta-nombre { font-size: 14px; }
    .tarjeta-contacto { font-size: 12px; }
  }

  /* ── Modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal-box { background: white; border-radius: 12px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 24px; position: relative; box-shadow: 0 8px 40px rgba(0,0,0,0.18); }
  @media (max-width: 767px) {
    .modal-overlay { padding: 0; align-items: flex-end; }
    .modal-box { border-radius: 16px 16px 0 0; max-height: 92vh; padding: 20px 16px 32px; }
  }
  .modal-handle { display: none; width: 40px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 16px; }
  @media (max-width: 767px) { .modal-handle { display: block; } }
  .modal-close { position: absolute; top: 14px; right: 16px; background: none; border: none; font-size: 22px; cursor: pointer; color: var(--texto-sub); min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
  .modal-titulo { font-size: 18px; font-weight: 700; color: var(--azul); margin-bottom: 4px; padding-right: 36px; }
  .modal-subtitulo { font-size: 12px; color: var(--texto-sub); margin-bottom: 18px; }
  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  @media (max-width: 400px) { .modal-grid { grid-template-columns: 1fr; } }
  .modal-campo label { display: block; font-size: 10px; color: var(--texto-sub); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
  .modal-campo span { font-size: 13px; font-weight: 500; }
  .modal-seccion { border-top: 1px solid var(--borde); padding-top: 14px; margin-top: 4px; }
  .modal-seccion-titulo { font-size: 11px; font-weight: 700; color: var(--azul); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .accion-box { background: var(--superficie); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
  .accion-texto { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
  .accion-fecha { font-size: 11px; color: var(--texto-sub); }
  .etapa-select { width: 100%; padding: 10px 12px; border: 1px solid var(--borde); border-radius: 8px; font-size: 13px; color: var(--azul); background: white; margin-bottom: 10px; min-height: 44px; }
  .btn-cambiar { background: var(--azul); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; min-height: 44px; }
  .btn-cambiar:hover { background: var(--azul-claro); }
  .btn-cambiar:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-diagnostico { background: var(--naranja); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; min-height: 44px; margin-top: 10px; }
  .btn-diagnostico:hover { opacity: 0.9; }
  .msg-ok { font-size: 12px; color: var(--verde); margin-top: 8px; display: none; }

  /* ── Formulario nuevo ── */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } }
  .form-group { margin-bottom: 0; }
  .form-group label { display: block; font-size: 11px; color: var(--texto-sub); margin-bottom: 4px; }
  .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid var(--borde); border-radius: 8px; font-size: 13px; box-sizing: border-box; min-height: 44px; }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--azul); }
  .form-full { grid-column: 1 / -1; }
  .btn-guardar { background: var(--naranja); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 16px; min-height: 48px; }
  .btn-guardar:hover { opacity: 0.9; }
  .btn-guardar:disabled { opacity: 0.6; cursor: not-allowed; }
  .form-error { color: var(--rojo); font-size: 12px; margin-top: 8px; display: none; }

  /* ── Estados ── */
  .crm-loading { text-align: center; padding: 60px 20px; color: var(--texto-sub); font-size: 14px; }
  .crm-error { background: #fdeaea; border: 1px solid var(--rojo); border-radius: 8px; padding: 14px; color: var(--rojo); font-size: 13px; }
</style>

<div id="crm-root">
  <div class="crm-loading">Cargando CRM…</div>
</div>

<script>
(function() {

  const WORKER_URL = 'https://coproactiva-worker-nuevo.osmarmeza-adm7.workers.dev';
  const TOKEN = sessionStorage.getItem('token') || '';

  const ETAPAS = [
    'Nuevo prospecto', 'Reunión agendada', 'Reunión realizada',
    'Diagnóstico agendado', 'Diagnóstico realizado', 'Propuesta enviada',
    'Negociación', 'Ganado', 'Perdido'
  ];

  let prospectos = [];

  // ── API ──────────────────────────────────────────────────────────────────
  async function api(path, method = 'GET', body = null) {
    const opts = {
      method,
      headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' }
    };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(WORKER_URL + path, opts);
    return res.json();
  }

  // ── Init ─────────────────────────────────────────────────────────────────
  async function init() {
    try {
      const resp = await api('/crm');
      if (!resp.ok || !resp.data || !resp.data.ok) {
        mostrarError(resp.data?.error || resp.error || 'Error desconocido');
        return;
      }
      prospectos = resp.data.data || [];
      renderCRM();
    } catch (err) {
      mostrarError('Error de conexión: ' + err.message);
    }
  }

  // ── Render principal ─────────────────────────────────────────────────────
  function renderCRM() {
    const root = document.getElementById('crm-root');
    const activos  = prospectos.filter(p => p.etapa !== 'Ganado' && p.etapa !== 'Perdido');
    const ganados  = prospectos.filter(p => p.etapa === 'Ganado').length;
    const perdidos = prospectos.filter(p => p.etapa === 'Perdido').length;
    const urgentes = activos.filter(p => p.semaforo === 'rojo').length;

    root.innerHTML = `
      <div class="crm-kpis">
        <div class="kpi-card"><div class="kpi-num">${activos.length}</div><div class="kpi-label">Activos</div></div>
        <div class="kpi-card"><div class="kpi-num urgente">${urgentes}</div><div class="kpi-label">Urgentes</div></div>
        <div class="kpi-card"><div class="kpi-num ganado">${ganados}</div><div class="kpi-label">Ganados</div></div>
        <div class="kpi-card"><div class="kpi-num perdido">${perdidos}</div><div class="kpi-label">Perdidos</div></div>
      </div>
      <div class="crm-toolbar">
        <h2>Pipeline de ventas</h2>
        <button class="btn-nuevo" id="btn-nuevo">＋ Nuevo</button>
      </div>
      <div class="vista-desktop">
        <div class="pipeline-scroll"><div class="pipeline" id="pipeline-desktop"></div></div>
      </div>
      <div class="vista-mobile" id="accordion-mobile"></div>
    `;

    renderKanban();
    renderAccordion();
    document.getElementById('btn-nuevo').addEventListener('click', abrirModalNuevo);
  }

  // ── Kanban desktop ────────────────────────────────────────────────────────
  function renderKanban() {
    const pipeline = document.getElementById('pipeline-desktop');
    if (!pipeline) return;
    pipeline.innerHTML = '';
    ETAPAS.forEach(etapa => {
      const enEtapa = prospectos.filter(p => p.etapa === etapa);
      const col = document.createElement('div');
      col.className = 'columna';
      col.innerHTML = `
        <div class="columna-header">
          <span>${etapa}</span>
          <span class="columna-count">${enEtapa.length}</span>
        </div>
        ${enEtapa.length === 0 ? '<div class="columna-vacia">—</div>' : enEtapa.map(tarjetaHTML).join('')}
      `;
      pipeline.appendChild(col);
    });
    pipeline.querySelectorAll('.tarjeta').forEach(t => {
      t.addEventListener('click', () => {
        const p = prospectos.find(x => x.id === t.getAttribute('data-id'));
        if (p) abrirModalDetalle(p);
      });
    });
  }

  // ── Accordion móvil ───────────────────────────────────────────────────────
  function renderAccordion() {
    const acc = document.getElementById('accordion-mobile');
    if (!acc) return;
    acc.innerHTML = '';
    const etapasConDatos = ETAPAS.filter(e => prospectos.some(p => p.etapa === e));
    const etapasSinDatos = ETAPAS.filter(e => !prospectos.some(p => p.etapa === e));
    [...etapasConDatos, ...etapasSinDatos].forEach((etapa, idx) => {
      const enEtapa = prospectos.filter(p => p.etapa === etapa);
      const abierto = idx === 0 && enEtapa.length > 0;
      const bloque = document.createElement('div');
      bloque.className = 'accordion-etapa';
      bloque.innerHTML = `
        <div class="accordion-header">
          <span class="accordion-titulo">${etapa}</span>
          <div class="accordion-meta">
            <span class="accordion-count ${enEtapa.length === 0 ? 'vacio' : ''}">${enEtapa.length}</span>
            <span class="accordion-chevron ${abierto ? 'abierto' : ''}">▼</span>
          </div>
        </div>
        <div class="accordion-body ${abierto ? 'abierto' : ''}">
          ${enEtapa.length === 0 ? '<div class="accordion-vacia">Sin prospectos</div>' : enEtapa.map(tarjetaHTML).join('')}
        </div>
      `;
      bloque.querySelector('.accordion-header').addEventListener('click', () => {
        const body    = bloque.querySelector('.accordion-body');
        const chevron = bloque.querySelector('.accordion-chevron');
        const esta    = body.classList.contains('abierto');
        body.classList.toggle('abierto', !esta);
        chevron.classList.toggle('abierto', !esta);
      });
      acc.appendChild(bloque);
    });
    acc.querySelectorAll('.tarjeta').forEach(t => {
      t.addEventListener('click', () => {
        const p = prospectos.find(x => x.id === t.getAttribute('data-id'));
        if (p) abrirModalDetalle(p);
      });
    });
  }

  // ── HTML tarjeta ──────────────────────────────────────────────────────────
  function tarjetaHTML(p) {
    const sem = p.semaforo || 'gris';
    return `
      <div class="tarjeta sem-${sem}" data-id="${p.id}">
        <div class="tarjeta-nombre">${p.nombreCondominio}</div>
        <div class="tarjeta-contacto">${p.nombreContacto}${p.comuna ? ' · ' + p.comuna : ''}</div>
        <div class="tarjeta-footer">
          <span class="tarjeta-unidades">${p.unidades || 0} unid.</span>
          <span class="semaforo-dot dot-${sem}"></span>
        </div>
        ${p.proximaAccion ? `<div class="tarjeta-accion">▶ ${p.proximaAccion}</div>` : ''}
      </div>
    `;
  }

  // ── Modal detalle ─────────────────────────────────────────────────────────
  function abrirModalDetalle(p) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <div class="modal-handle"></div>
        <button class="modal-close" id="mc">×</button>
        <div class="modal-titulo">${p.nombreCondominio}</div>
        <div class="modal-subtitulo">${p.etapa} · ${p.comuna || '—'} · ${p.unidades || 0} unidades</div>
        <div class="modal-grid">
          <div class="modal-campo"><label>Contacto</label><span>${p.nombreContacto}</span></div>
          <div class="modal-campo"><label>Cargo</label><span>${p.cargoContacto || '—'}</span></div>
          <div class="modal-campo"><label>Teléfono</label><span>${p.telefono || '—'}</span></div>
          <div class="modal-campo"><label>Email</label><span>${p.email || '—'}</span></div>
          <div class="modal-campo"><label>Fuente</label><span>${p.fuenteLead || '—'}</span></div>
          <div class="modal-campo"><label>Responsable</label><span>${p.responsable || '—'}</span></div>
          <div class="modal-campo"><label>Primer contacto</label><span>${p.fechaPrimerContacto || '—'}</span></div>
          <div class="modal-campo"><label>Última interacción</label><span>${p.fechaUltimaInteraccion || '—'}</span></div>
        </div>
        ${p.observaciones ? `<div class="modal-campo" style="margin-bottom:14px"><label>Observaciones</label><span>${p.observaciones}</span></div>` : ''}

        <div class="modal-seccion">
          <div class="modal-seccion-titulo">Próxima acción</div>
          <div class="accion-box">
            <div class="accion-texto">${p.proximaAccion || 'Sin acción definida'}</div>
            ${p.fechaProximaAccion ? `<div class="accion-fecha">📅 ${p.fechaProximaAccion}</div>` : ''}
          </div>
        </div>

        <div class="modal-seccion">
          <div class="modal-seccion-titulo">Diagnóstico</div>
          <button class="btn-diagnostico" id="btn-diag">🔍 Iniciar diagnóstico</button>
        </div>

        <div class="modal-seccion">
          <div class="modal-seccion-titulo">Cambiar etapa</div>
          <select class="etapa-select" id="sel-etapa">
            ${ETAPAS.map(e => `<option value="${e}" ${e === p.etapa ? 'selected' : ''}>${e}</option>`).join('')}
          </select>
          <button class="btn-cambiar" id="btn-cambiar">Guardar cambio</button>
          <div class="msg-ok" id="msg-ok">✓ Etapa actualizada</div>
        </div>
      </div>
    `;

    document.body.appendChild(overlay);

    const cerrar = () => overlay.remove();
    overlay.querySelector('#mc').addEventListener('click', cerrar);
    overlay.addEventListener('click', e => { if (e.target === overlay) cerrar(); });

    // Botón iniciar diagnóstico
    overlay.querySelector('#btn-diag').addEventListener('click', () => {
      cerrar();
      iniciarDiagnostico(p.id, p.nombreCondominio, p);
    });

    // Cambiar etapa
    overlay.querySelector('#btn-cambiar').addEventListener('click', async () => {
      const nuevaEtapa = overlay.querySelector('#sel-etapa').value;
      const btn = overlay.querySelector('#btn-cambiar');
      const msg = overlay.querySelector('#msg-ok');
      if (nuevaEtapa === p.etapa) return;
      btn.disabled = true;
      btn.textContent = 'Guardando…';
      const resp = await api('/crm', 'POST', { action: 'cambiarEtapa', id: p.id, etapaNueva: nuevaEtapa });
      if (resp.ok && resp.data && resp.data.ok) {
        p.etapa = nuevaEtapa;
        msg.style.display = 'block';
        btn.textContent = 'Guardar cambio';
        btn.disabled = false;
        renderKanban();
        renderAccordion();
      } else {
        btn.textContent = 'Error — reintentar';
        btn.disabled = false;
      }
    });
  }

  // ── Iniciar diagnóstico desde CRM ─────────────────────────────────────────
  function iniciarDiagnostico(prospectoId, nombreCondominio, prospecto) {
    // 1. Guardar todos los campos del prospecto ANTES de navegar
    //    El standalone los leerá en initApp() y precargará el formulario completo
    sessionStorage.setItem('prospectoVinculado', JSON.stringify({
      id:             prospectoId,
      nombre:         nombreCondominio,
      unidades:       prospecto?.unidades       || '',
      contactoNombre: prospecto?.nombreContacto || '',
      contactoCorreo: prospecto?.email          || '',
      cargoContacto:  prospecto?.cargoContacto  || ''
    }));

    // 2. Navegar al módulo — SIN remover el wrapper
    //    Removerlo antes causaba condición de carrera: el iframe se recreaba
    //    antes de que sessionStorage estuviera disponible
    if (typeof cargarModulo === 'function') {
      cargarModulo('diagnostico');
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.nav-btn[data-modulo="diagnostico"]').forEach(b => b.classList.add('active'));
    } else {
      console.error('cargarModulo no está definida');
    }
  }

  // Exponer globalmente por si se necesita llamar desde fuera del módulo
  window.iniciarDiagnostico = iniciarDiagnostico;

  // ── Modal nuevo prospecto ─────────────────────────────────────────────────
  function abrirModalNuevo() {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <div class="modal-handle"></div>
        <button class="modal-close" id="mc2">×</button>
        <div class="modal-titulo">Nuevo prospecto</div>
        <div class="modal-subtitulo">Datos del condominio</div>
        <div class="form-grid">
          <div class="form-group form-full"><label>Nombre del condominio *</label><input type="text" id="f-nombre" placeholder="Ej: Edificio Las Rosas"></div>
          <div class="form-group"><label>Comuna</label><input type="text" id="f-comuna" placeholder="Ej: San Bernardo"></div>
          <div class="form-group"><label>Dirección</label><input type="text" id="f-dir" placeholder="Calle y número"></div>
          <div class="form-group"><label>Unidades</label><input type="number" id="f-unidades" placeholder="0" min="0"></div>
          <div class="form-group"><label>Nombre contacto *</label><input type="text" id="f-contacto" placeholder="Nombre completo"></div>
          <div class="form-group"><label>Cargo</label><input type="text" id="f-cargo" placeholder="Ej: Presidenta"></div>
          <div class="form-group"><label>Teléfono</label><input type="tel" id="f-tel" placeholder="+569..."></div>
          <div class="form-group"><label>Email</label><input type="email" id="f-email" placeholder="correo@cl"></div>
          <div class="form-group"><label>Fuente</label>
            <select id="f-fuente">
              <option value="web">Web</option>
              <option value="referido">Referido</option>
              <option value="Facebook">Facebook</option>
              <option value="Instagram">Instagram</option>
              <option value="otro">Otro</option>
            </select>
          </div>
          <div class="form-group"><label>Responsable</label><input type="text" id="f-resp" placeholder="Nombre"></div>
          <div class="form-group form-full"><label>Observaciones</label><input type="text" id="f-obs" placeholder="Notas adicionales"></div>
        </div>
        <div class="form-error" id="f-error"></div>
        <button class="btn-guardar" id="btn-guardar">Guardar prospecto</button>
      </div>
    `;

    document.body.appendChild(overlay);
    const cerrar = () => overlay.remove();
    overlay.querySelector('#mc2').addEventListener('click', cerrar);
    overlay.addEventListener('click', e => { if (e.target === overlay) cerrar(); });

    overlay.querySelector('#btn-guardar').addEventListener('click', async () => {
      const nombre   = overlay.querySelector('#f-nombre').value.trim();
      const contacto = overlay.querySelector('#f-contacto').value.trim();
      const errDiv   = overlay.querySelector('#f-error');
      const btn      = overlay.querySelector('#btn-guardar');
      if (!nombre || !contacto) {
        errDiv.textContent = 'Nombre del condominio y contacto son obligatorios.';
        errDiv.style.display = 'block';
        return;
      }
      btn.disabled = true; btn.textContent = 'Guardando…'; errDiv.style.display = 'none';
      const datos = {
        nombreCondominio: nombre,
        comuna:           overlay.querySelector('#f-comuna').value.trim(),
        direccion:        overlay.querySelector('#f-dir').value.trim(),
        unidades:         overlay.querySelector('#f-unidades').value || 0,
        nombreContacto:   contacto,
        cargoContacto:    overlay.querySelector('#f-cargo').value.trim(),
        telefono:         overlay.querySelector('#f-tel').value.trim(),
        email:            overlay.querySelector('#f-email').value.trim(),
        fuenteLead:       overlay.querySelector('#f-fuente').value,
        responsable:      overlay.querySelector('#f-resp').value.trim(),
        observaciones:    overlay.querySelector('#f-obs').value.trim(),
      };
      const resp = await api('/crm', 'POST', datos);
      if (resp.ok && resp.data && resp.data.ok) {
        overlay.remove();
        await init();
      } else {
        errDiv.textContent = resp.data?.error || resp.error || 'Error al guardar';
        errDiv.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Guardar prospecto';
      }
    });
  }

  // ── Error ─────────────────────────────────────────────────────────────────
  function mostrarError(msg) {
    document.getElementById('crm-root').innerHTML =
      `<div class="crm-error">Error al cargar el CRM: ${msg}</div>`;
  }

  init();

})();
</script>
