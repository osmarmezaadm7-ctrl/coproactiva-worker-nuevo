<!-- modules/crm.html — CoproActiva CRM -->
<!-- Versión: 3.0 · Mayo 2026 — rediseño visual integrado con styles.css -->

<style>
  /* Estilos específicos del módulo CRM. Los colores y tipografía
     se heredan de styles.css (variables --co-*).
     Las clases comunes (.tarjeta, .columna, .kpi-card, .btn-nuevo, etc.)
     están definidas en styles.css y NO se redefinen aquí. */

  #crm-root { font-family: var(--co-font); color: var(--co-ink); }

  /* ── Móvil Accordion ── */
  .vista-mobile { display: none; }
  @media (max-width: 767px) {
    .vista-desktop { display: none !important; }
    .vista-mobile  { display: block; }
    .accordion-etapa {
      background: var(--co-surface);
      border: 1px solid var(--co-line);
      border-radius: var(--co-r-md);
      margin-bottom: 8px;
      overflow: hidden;
      box-shadow: var(--co-shadow-sm);
    }
    .accordion-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px;
      cursor: pointer;
      min-height: 44px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .accordion-header:active { background: var(--co-cream); }
    .accordion-titulo {
      font-size: 13px;
      font-weight: 700;
      color: var(--co-ink);
      letter-spacing: -0.01em;
    }
    .accordion-meta { display: flex; align-items: center; gap: 8px; }
    .accordion-count {
      background: var(--co-ink);
      color: #fff;
      border-radius: 99px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
    }
    .accordion-count.vacio { background: var(--co-mute); opacity: 0.5; }
    .accordion-chevron {
      font-size: 11px;
      color: var(--co-mute);
      transition: transform 0.2s;
    }
    .accordion-chevron.abierto { transform: rotate(180deg); }
    .accordion-body {
      display: none;
      padding: 8px 10px 10px;
      border-top: 1px solid var(--co-line);
      background: var(--co-cream);
    }
    .accordion-body.abierto { display: block; }
    .accordion-vacia {
      font-size: 12px;
      color: var(--co-mute);
      text-align: center;
      padding: 14px 0;
    }
  }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26,23,20,0.55);
    backdrop-filter: blur(4px);
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-box {
    background: var(--co-surface);
    border-radius: var(--co-r-lg);
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 32px;
    position: relative;
    box-shadow: var(--co-shadow-lg);
  }
  @media (max-width: 767px) {
    .modal-overlay { padding: 0; align-items: flex-end; }
    .modal-box {
      border-radius: var(--co-r-lg) var(--co-r-lg) 0 0;
      max-height: 92vh;
      padding: 24px 20px 36px;
    }
  }
  .modal-handle {
    display: none;
    width: 44px;
    height: 4px;
    background: var(--co-line);
    border-radius: 99px;
    margin: 0 auto 18px;
  }
  @media (max-width: 767px) { .modal-handle { display: block; } }
  .modal-close {
    position: absolute;
    top: 18px;
    right: 18px;
    background: var(--co-cream);
    border: 1px solid var(--co-line);
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    color: var(--co-ink-2);
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.13s, color 0.13s;
  }
  .modal-close:hover { background: var(--co-orange-soft); color: var(--co-orange); }
  .modal-eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--co-orange);
    margin-bottom: 4px;
  }
  .modal-titulo {
    font-size: 22px;
    font-weight: 800;
    color: var(--co-ink);
    letter-spacing: -0.025em;
    line-height: 1.15;
    margin-bottom: 6px;
    padding-right: 44px;
  }
  .modal-subtitulo {
    font-size: 13px;
    color: var(--co-ink-3);
    margin-bottom: 24px;
    font-weight: 500;
  }
  .modal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 20px;
  }
  @media (max-width: 460px) { .modal-grid { grid-template-columns: 1fr; } }
  .modal-campo {
    background: var(--co-cream);
    border-radius: var(--co-r-sm);
    padding: 10px 12px;
  }
  .modal-campo label {
    display: block;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--co-mute);
    margin-bottom: 4px;
  }
  .modal-campo span {
    font-size: 13px;
    font-weight: 600;
    color: var(--co-ink);
  }
  .modal-seccion {
    border-top: 1px solid var(--co-line);
    padding-top: 20px;
    margin-top: 8px;
  }
  .modal-seccion-titulo {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--co-orange);
    margin-bottom: 12px;
  }
  .accion-box {
    background: var(--co-orange-soft);
    border: 1px solid var(--co-orange-line);
    border-radius: var(--co-r-md);
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  .accion-texto {
    font-size: 13px;
    font-weight: 700;
    color: var(--co-ink);
    margin-bottom: 4px;
    letter-spacing: -0.01em;
  }
  .accion-fecha {
    font-size: 11px;
    color: var(--co-ink-3);
    font-weight: 500;
  }
  .etapa-select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--co-line);
    border-radius: var(--co-r-md);
    font-family: var(--co-font);
    font-size: 13px;
    font-weight: 600;
    color: var(--co-ink);
    background: var(--co-surface);
    margin-bottom: 12px;
    min-height: 44px;
  }
  .etapa-select:focus { outline: none; border-color: var(--co-orange); }
  .btn-cambiar {
    background: var(--co-ink);
    color: #fff;
    border: none;
    padding: 13px 20px;
    border-radius: var(--co-r-md);
    font-family: var(--co-font);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    min-height: 46px;
    letter-spacing: -0.01em;
    transition: background 0.13s;
  }
  .btn-cambiar:hover { background: var(--co-ink-2); }
  .btn-cambiar:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-diagnostico {
    background: var(--co-orange);
    color: #fff;
    border: none;
    padding: 13px 20px;
    border-radius: var(--co-r-md);
    font-family: var(--co-font);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    min-height: 46px;
    margin-top: 10px;
    letter-spacing: -0.01em;
    transition: background 0.13s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-diagnostico:hover { background: var(--co-orange-hover); }
  .msg-ok {
    font-size: 12px;
    color: var(--co-green);
    margin-top: 10px;
    display: none;
    font-weight: 600;
  }

  /* ── Formulario nuevo ── */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } }
  .form-group label {
    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--co-mute);
    margin-bottom: 6px;
  }
  .form-group input,
  .form-group select {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--co-line);
    border-radius: var(--co-r-md);
    font-family: var(--co-font);
    font-size: 13px;
    font-weight: 500;
    color: var(--co-ink);
    background: var(--co-surface);
    box-sizing: border-box;
    min-height: 44px;
    transition: border-color 0.13s;
  }
  .form-group input:focus, .form-group select:focus {
    outline: none;
    border-color: var(--co-orange);
  }
  .form-group input::placeholder { color: var(--co-mute); }
  .form-full { grid-column: 1 / -1; }
  .btn-guardar {
    background: var(--co-orange);
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: var(--co-r-md);
    font-family: var(--co-font);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    margin-top: 20px;
    min-height: 50px;
    letter-spacing: -0.01em;
    transition: background 0.13s;
  }
  .btn-guardar:hover { background: var(--co-orange-hover); }
  .btn-guardar:disabled { opacity: 0.5; cursor: not-allowed; }
  .form-error {
    color: var(--co-red);
    font-size: 12px;
    margin-top: 10px;
    display: none;
    font-weight: 600;
  }

  /* Estado de carga global manejado por .module-loading en styles.css */
  .crm-error {
    background: var(--co-red-soft);
    border: 1px solid var(--co-red);
    border-radius: var(--co-r-md);
    padding: 16px 20px;
    color: var(--co-red);
    font-size: 13px;
    font-weight: 600;
  }
</style>

<div id="crm-root">
  <div class="module-loading">
    <div class="ml-iso-wrap">
      <div class="ml-iso" aria-hidden="true"></div>
    </div>
    <div class="ml-text">
      <div class="ml-brand"><b>co</b>proactiva</div>
      <div class="ml-status">
        <span class="ml-status-dot"></span>
        Cargando CRM
      </div>
    </div>
  </div>
</div>

<script>
(function() {

  const WORKER_URL = 'https://coproactiva-worker-nuevo.osmarmeza-adm7.workers.dev';
  const TOKEN = sessionStorage.getItem('token') || '';

  const ETAPAS = [
    'Nuevo prospecto', 'Reunión agendada', 'Reunión realizada',
    'Diagnóstico agendado', 'Diagnóstico realizado', 'Propuesta enviada',
    'Negociación', 'Ganado', 'Perdido'
  ];

  let prospectos = [];

  async function api(path, method = 'GET', body = null) {
    const opts = {
      method,
      headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' }
    };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(WORKER_URL + path, opts);
    return res.json();
  }

  async function init() {
    try {
      const resp = await api('/crm');
      if (!resp.ok || !resp.data || !resp.data.ok) {
        mostrarError(resp.data?.error || resp.error || 'Error desconocido');
        return;
      }
      prospectos = resp.data.data || [];
      renderCRM();
    } catch (err) {
      mostrarError('Error de conexión: ' + err.message);
    }
  }

  function renderCRM() {
    const root = document.getElementById('crm-root');
    const activos  = prospectos.filter(p => p.etapa !== 'Ganado' && p.etapa !== 'Perdido');
    const ganados  = prospectos.filter(p => p.etapa === 'Ganado').length;
    const perdidos = prospectos.filter(p => p.etapa === 'Perdido').length;
    const urgentes = activos.filter(p => p.semaforo === 'rojo').length;

    // Exponer KPIs al sidebar
    window._crmKpis = { activos: activos.length, urgentes, ganados };
    if (typeof actualizarKpisCRM === 'function') actualizarKpisCRM();

    root.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-eyebrow">CRM</div>
          <h1 class="page-title">Pipeline <em>comercial</em></h1>
          <p class="page-sub">Seguimiento de prospectos desde el primer contacto hasta la firma del contrato.</p>
        </div>
        <button class="btn-nuevo" id="btn-nuevo">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
          Nuevo prospecto
        </button>
      </div>

      <div class="crm-kpis">
        <div class="kpi-card activos">
          <div class="kpi-num">${activos.length}</div>
          <div class="kpi-label">Activos</div>
        </div>
        <div class="kpi-card urgente">
          <div class="kpi-num urgente">${urgentes}</div>
          <div class="kpi-label">Urgentes</div>
        </div>
        <div class="kpi-card ganado">
          <div class="kpi-num ganado">${ganados}</div>
          <div class="kpi-label">Ganados</div>
        </div>
        <div class="kpi-card perdido">
          <div class="kpi-num perdido">${perdidos}</div>
          <div class="kpi-label">Perdidos</div>
        </div>
      </div>

      <div class="crm-toolbar">
        <div class="toolbar-title">Pipeline de ventas</div>
      </div>

      <div class="vista-desktop">
        <div class="pipeline-scroll"><div class="pipeline" id="pipeline-desktop"></div></div>
      </div>
      <div class="vista-mobile" id="accordion-mobile"></div>
    `;

    renderKanban();
    renderAccordion();
    document.getElementById('btn-nuevo').addEventListener('click', abrirModalNuevo);
  }

  function renderKanban() {
    const pipeline = document.getElementById('pipeline-desktop');
    if (!pipeline) return;
    pipeline.innerHTML = '';
    ETAPAS.forEach(etapa => {
      const enEtapa = prospectos.filter(p => p.etapa === etapa);
      const col = document.createElement('div');
      col.className = 'columna';
      col.innerHTML = `
        <div class="columna-header">
          <span class="columna-title">${etapa}</span>
          <span class="columna-count ${enEtapa.length === 0 ? 'empty' : ''}">${enEtapa.length}</span>
        </div>
        ${enEtapa.length === 0 ? '<div class="columna-vacia">Sin prospectos</div>' : enEtapa.map(tarjetaHTML).join('')}
      `;
      pipeline.appendChild(col);
    });
    pipeline.querySelectorAll('.tarjeta').forEach(t => {
      t.addEventListener('click', () => {
        const p = prospectos.find(x => x.id === t.getAttribute('data-id'));
        if (p) abrirModalDetalle(p);
      });
    });
  }

  function renderAccordion() {
    const acc = document.getElementById('accordion-mobile');
    if (!acc) return;
    acc.innerHTML = '';
    const etapasConDatos = ETAPAS.filter(e => prospectos.some(p => p.etapa === e));
    const etapasSinDatos = ETAPAS.filter(e => !prospectos.some(p => p.etapa === e));
    [...etapasConDatos, ...etapasSinDatos].forEach((etapa, idx) => {
      const enEtapa = prospectos.filter(p => p.etapa === etapa);
      const abierto = idx === 0 && enEtapa.length > 0;
      const bloque = document.createElement('div');
      bloque.className = 'accordion-etapa';
      bloque.innerHTML = `
        <div class="accordion-header">
          <span class="accordion-titulo">${etapa}</span>
          <div class="accordion-meta">
            <span class="accordion-count ${enEtapa.length === 0 ? 'vacio' : ''}">${enEtapa.length}</span>
            <span class="accordion-chevron ${abierto ? 'abierto' : ''}">▼</span>
          </div>
        </div>
        <div class="accordion-body ${abierto ? 'abierto' : ''}">
          ${enEtapa.length === 0 ? '<div class="accordion-vacia">Sin prospectos</div>' : enEtapa.map(tarjetaHTML).join('')}
        </div>
      `;
      bloque.querySelector('.accordion-header').addEventListener('click', () => {
        const body    = bloque.querySelector('.accordion-body');
        const chevron = bloque.querySelector('.accordion-chevron');
        const esta    = body.classList.contains('abierto');
        body.classList.toggle('abierto', !esta);
        chevron.classList.toggle('abierto', !esta);
      });
      acc.appendChild(bloque);
    });
    acc.querySelectorAll('.tarjeta').forEach(t => {
      t.addEventListener('click', () => {
        const p = prospectos.find(x => x.id === t.getAttribute('data-id'));
        if (p) abrirModalDetalle(p);
      });
    });
  }

  function tarjetaHTML(p) {
    const sem = p.semaforo || 'gris';
    return `
      <div class="tarjeta sem-${sem}" data-id="${p.id}">
        <div class="tarjeta-nombre">${p.nombreCondominio}</div>
        <div class="tarjeta-contacto">${p.nombreContacto}${p.comuna ? ' · ' + p.comuna : ''}</div>
        <div class="tarjeta-footer">
          <span class="tarjeta-unidades"><strong>${p.unidades || 0}</strong> unid.</span>
          <span class="semaforo-dot dot-${sem}"></span>
        </div>
        ${p.proximaAccion ? `<div class="tarjeta-accion">${p.proximaAccion}</div>` : ''}
      </div>
    `;
  }

  function abrirModalDetalle(p) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <div class="modal-handle"></div>
        <button class="modal-close" id="mc">×</button>
        <div class="modal-eyebrow">${p.etapa}</div>
        <div class="modal-titulo">${p.nombreCondominio}</div>
        <div class="modal-subtitulo">${p.comuna || '—'} · ${p.unidades || 0} unidades</div>

        <div class="modal-grid">
          <div class="modal-campo"><label>Contacto</label><span>${p.nombreContacto}</span></div>
          <div class="modal-campo"><label>Cargo</label><span>${p.cargoContacto || '—'}</span></div>
          <div class="modal-campo"><label>Teléfono</label><span>${p.telefono || '—'}</span></div>
          <div class="modal-campo"><label>Email</label><span>${p.email || '—'}</span></div>
          <div class="modal-campo"><label>Fuente</label><span>${p.fuenteLead || '—'}</span></div>
          <div class="modal-campo"><label>Responsable</label><span>${p.responsable || '—'}</span></div>
          <div class="modal-campo"><label>Primer contacto</label><span>${p.fechaPrimerContacto || '—'}</span></div>
          <div class="modal-campo"><label>Última interacción</label><span>${p.fechaUltimaInteraccion || '—'}</span></div>
        </div>
        ${p.observaciones ? `<div class="modal-campo" style="margin-bottom:18px"><label>Observaciones</label><span>${p.observaciones}</span></div>` : ''}

        <div class="modal-seccion">
          <div class="modal-seccion-titulo">Próxima acción</div>
          <div class="accion-box">
            <div class="accion-texto">${p.proximaAccion || 'Sin acción definida'}</div>
            ${p.fechaProximaAccion ? `<div class="accion-fecha">${p.fechaProximaAccion}</div>` : ''}
          </div>
        </div>

        <div class="modal-seccion">
          <div class="modal-seccion-titulo">Diagnóstico</div>
          <button class="btn-diagnostico" id="btn-diag">Iniciar diagnóstico</button>
        </div>

        <div class="modal-seccion">
          <div class="modal-seccion-titulo">Cambiar etapa</div>
          <select class="etapa-select" id="sel-etapa">
            ${ETAPAS.map(e => `<option value="${e}" ${e === p.etapa ? 'selected' : ''}>${e}</option>`).join('')}
          </select>
          <button class="btn-cambiar" id="btn-cambiar">Guardar cambio</button>
          <div class="msg-ok" id="msg-ok">✓ Etapa actualizada</div>
        </div>
      </div>
    `;

    document.body.appendChild(overlay);

    const cerrar = () => overlay.remove();
    overlay.querySelector('#mc').addEventListener('click', cerrar);
    overlay.addEventListener('click', e => { if (e.target === overlay) cerrar(); });

    overlay.querySelector('#btn-diag').addEventListener('click', () => {
      cerrar();
      iniciarDiagnostico(p.id, p.nombreCondominio, p);
    });

    overlay.querySelector('#btn-cambiar').addEventListener('click', async () => {
      const nuevaEtapa = overlay.querySelector('#sel-etapa').value;
      const btn = overlay.querySelector('#btn-cambiar');
      const msg = overlay.querySelector('#msg-ok');
      if (nuevaEtapa === p.etapa) return;
      btn.disabled = true;
      btn.textContent = 'Guardando…';
      const resp = await api('/crm', 'POST', { action: 'cambiarEtapa', id: p.id, etapaNueva: nuevaEtapa });
      if (resp.ok && resp.data && resp.data.ok) {
        p.etapa = nuevaEtapa;
        msg.style.display = 'block';
        btn.textContent = 'Guardar cambio';
        btn.disabled = false;
        renderKanban();
        renderAccordion();
      } else {
        btn.textContent = 'Error — reintentar';
        btn.disabled = false;
      }
    });
  }

  function iniciarDiagnostico(prospectoId, nombreCondominio, prospecto) {
    sessionStorage.setItem('prospectoVinculado', JSON.stringify({
      id:             prospectoId,
      nombre:         nombreCondominio,
      unidades:       prospecto?.unidades       || '',
      contactoNombre: prospecto?.nombreContacto || '',
      contactoCorreo: prospecto?.email          || '',
      cargoContacto:  prospecto?.cargoContacto  || ''
    }));

    if (typeof cargarModulo === 'function') {
      cargarModulo('diagnostico');
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.nav-btn[data-modulo="diagnostico"]').forEach(b => b.classList.add('active'));
    } else {
      console.error('cargarModulo no está definida');
    }
  }

  window.iniciarDiagnostico = iniciarDiagnostico;

  function abrirModalNuevo() {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <div class="modal-handle"></div>
        <button class="modal-close" id="mc2">×</button>
        <div class="modal-eyebrow">Nuevo registro</div>
        <div class="modal-titulo">Nuevo prospecto</div>
        <div class="modal-subtitulo">Datos del condominio y contacto</div>
        <div class="form-grid">
          <div class="form-group form-full"><label>Nombre del condominio *</label><input type="text" id="f-nombre" placeholder="Ej: Edificio Las Rosas"></div>
          <div class="form-group"><label>Comuna</label><input type="text" id="f-comuna" placeholder="Ej: San Bernardo"></div>
          <div class="form-group"><label>Dirección</label><input type="text" id="f-dir" placeholder="Calle y número"></div>
          <div class="form-group"><label>Unidades</label><input type="number" id="f-unidades" placeholder="0" min="0"></div>
          <div class="form-group"><label>Nombre contacto *</label><input type="text" id="f-contacto" placeholder="Nombre completo"></div>
          <div class="form-group"><label>Cargo</label><input type="text" id="f-cargo" placeholder="Ej: Presidenta"></div>
          <div class="form-group"><label>Teléfono</label><input type="tel" id="f-tel" placeholder="+569..."></div>
          <div class="form-group"><label>Email</label><input type="email" id="f-email" placeholder="correo@cl"></div>
          <div class="form-group"><label>Fuente</label>
            <select id="f-fuente">
              <option value="web">Web</option>
              <option value="referido">Referido</option>
              <option value="Facebook">Facebook</option>
              <option value="Instagram">Instagram</option>
              <option value="otro">Otro</option>
            </select>
          </div>
          <div class="form-group"><label>Responsable</label><input type="text" id="f-resp" placeholder="Nombre"></div>
          <div class="form-group form-full"><label>Observaciones</label><input type="text" id="f-obs" placeholder="Notas adicionales"></div>
        </div>
        <div class="form-error" id="f-error"></div>
        <button class="btn-guardar" id="btn-guardar">Guardar prospecto</button>
      </div>
    `;

    document.body.appendChild(overlay);
    const cerrar = () => overlay.remove();
    overlay.querySelector('#mc2').addEventListener('click', cerrar);
    overlay.addEventListener('click', e => { if (e.target === overlay) cerrar(); });

    overlay.querySelector('#btn-guardar').addEventListener('click', async () => {
      const nombre   = overlay.querySelector('#f-nombre').value.trim();
      const contacto = overlay.querySelector('#f-contacto').value.trim();
      const errDiv   = overlay.querySelector('#f-error');
      const btn      = overlay.querySelector('#btn-guardar');
      if (!nombre || !contacto) {
        errDiv.textContent = 'Nombre del condominio y contacto son obligatorios.';
        errDiv.style.display = 'block';
        return;
      }
      btn.disabled = true; btn.textContent = 'Guardando…'; errDiv.style.display = 'none';
      const datos = {
        nombreCondominio: nombre,
        comuna:           overlay.querySelector('#f-comuna').value.trim(),
        direccion:        overlay.querySelector('#f-dir').value.trim(),
        unidades:         overlay.querySelector('#f-unidades').value || 0,
        nombreContacto:   contacto,
        cargoContacto:    overlay.querySelector('#f-cargo').value.trim(),
        telefono:         overlay.querySelector('#f-tel').value.trim(),
        email:            overlay.querySelector('#f-email').value.trim(),
        fuenteLead:       overlay.querySelector('#f-fuente').value,
        responsable:      overlay.querySelector('#f-resp').value.trim(),
        observaciones:    overlay.querySelector('#f-obs').value.trim(),
      };
      const resp = await api('/crm', 'POST', datos);
      if (resp.ok && resp.data && resp.data.ok) {
        overlay.remove();
        await init();
      } else {
        errDiv.textContent = resp.data?.error || resp.error || 'Error al guardar';
        errDiv.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Guardar prospecto';
      }
    });
  }

  function mostrarError(msg) {
    document.getElementById('crm-root').innerHTML =
      `<div class="crm-error">Error al cargar el CRM: ${msg}</div>`;
  }

  init();

})();
</script>
