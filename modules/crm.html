<script>
(function() {

  const WORKER_URL = 'https://coproactiva-worker-nuevo.osmarmeza-adm7.workers.dev';
  const TOKEN = sessionStorage.getItem('token') || '';

  const ETAPAS = [
    'Nuevo prospecto', 'Reuni\u00F3n Agendada', 'Diagn\u00F3stico',
    'Propuesta', 'Negociaci\u00F3n', 'Ganado', 'Perdido'
  ];

  const INSTALACIONES_OPTS = [
    { key: 'ascensores',       label: 'Ascensores / montacargas' },
    { key: 'calderas',         label: 'Calderas' },
    { key: 'gas',              label: 'Gas centralizado (Sello Verde SEC)' },
    { key: 'grupoElectrogeno', label: 'Grupo electr\u00F3geno' },
    { key: 'redHumedaSeca',    label: 'Red h\u00FAmeda y/o red seca' },
    { key: 'piscina',          label: 'Piscina / SPA' },
    { key: 'personalOS10',     label: 'Personal de seguridad OS-10' },
    { key: 'trabajadores',     label: 'Trabajadores dependientes (conserjes, limpieza, etc.)' },
    { key: 'cercoElectrico',   label: 'Cerco el\u00E9ctrico' },
    { key: 'panelesSolares',   label: 'Paneles solares' }
  ];

  const MIGRACION_ETAPAS = {
    'Reuni\u00F3n agendada':      'Reuni\u00F3n Agendada',
    'Reuni\u00F3n realizada':     'Reuni\u00F3n Agendada',
    'Diagn\u00F3stico agendado':  'Diagn\u00F3stico',
    'Diagn\u00F3stico realizado': 'Diagn\u00F3stico',
    'Propuesta enviada':          'Propuesta',
  };

  function normalizarEtapa(e) { return MIGRACION_ETAPAS[e] || e; }

  function _esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function _fechaCorta(iso) {
    if (!iso) return '—';
    try {
      const d = new Date(iso);
      return d.toLocaleDateString('es-CL', { day:'2-digit', month:'2-digit', year:'2-digit' });
    } catch(e) { return iso; }
  }

  function _histLabel(tipo) {
    const map = {
      creacion: 'Creación', edicion: 'Edición', cambio_estado: 'Cambio de estado',
      observacion: 'Observación', correo: 'Correo enviado', archivado: 'Archivado',
      reactivado: 'Reactivado', convertido: 'Convertido a prospecto'
    };
    return map[tipo] || tipo;
  }

  function _histTexto(ev) {
    const d = ev.datos || {};
    if (ev.tipo === 'cambio_estado') return 'De ' + (d.de||'?') + ' → ' + (d.a||'?') + (d.notas ? ' · ' + d.notas : '');
    if (ev.tipo === 'observacion')   return d.texto || '';
    if (ev.tipo === 'correo')        return 'Para: ' + (d.para||'') + (d.asunto ? ' · ' + d.asunto : '');
    if (ev.tipo === 'convertido')    return 'Prospecto: ' + (d.prospectoId||'');
    if (ev.tipo === 'creacion')      return 'Fuente: ' + (d.fuente||'manual');
    return d.notas || d.motivo || '';
  }

  let prospectos = [];
  let leads = [];
  let _tabActiva = 'leads';
  const _tabCache = {}; // cache de wrappers DOM para tabs que cargan módulos externos
  let _leadBusqueda = '';
  let _leadFiltroEstado = '';
  let _leadFiltroTipo = '';
  let _leadArchivados = false;
  let _leadSelIds = [];

  const TAB_CONFIG = {
    leads: {
      titulo:  'Leads <em>comerciales</em>',
      sub:     'Prospectos iniciales antes de ingresar al pipeline.',
      btnLbl:  'Nuevo lead',
      btnAct:  () => abrirModalNuevoLead(),
      kpis:    false,
    },
    pipeline: {
      titulo:  'Pipeline <em>comercial</em>',
      sub:     'Seguimiento de prospectos desde el primer contacto hasta la firma del contrato.',
      btnLbl:  'Nuevo prospecto',
      btnAct:  () => abrirModalNuevo(),
      kpis:    true,
    },
    diagnostico: {
      titulo:  'Diagn\u00F3sticos <em>guardados</em>',
      sub:     'Crea nuevos diagn\u00F3sticos o contin\u00FAa uno existente.',
      btnLbl:  'Nuevo diagn\u00F3stico',
      btnAct:  () => { if (typeof window._diagNuevo === 'function') window._diagNuevo(); },
      kpis:    false,
    },
    recepcion: {
      titulo:  'Recepci\u00F3n <em>documental</em>',
      sub:     'Checklist Anexo N\u00BA1 \u2014 antecedentes al tomar una comunidad.',
      btnLbl:  'Nueva recepci\u00F3n',
      btnAct:  () => { if (typeof window._rxNuevo === 'function') window._rxNuevo(); },
      kpis:    false,
    },
  };

  async function api(path, method, body) {
    method = method || 'GET';
    const opts = { method, headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(WORKER_URL + path, opts);
    return res.json();
  }

  async function init() {
    try {
      const [respCRM, respLeads] = await Promise.all([
        api('/crm'),
        api('/leads')
      ]);
      if (!respCRM.ok || !respCRM.data || !respCRM.data.ok) {
        mostrarError(respCRM.data && respCRM.data.error ? respCRM.data.error : (respCRM.error || 'Error desconocido'));
        return;
      }
      prospectos = (respCRM.data.data || []).map(function(p) { return Object.assign({}, p, { etapa: normalizarEtapa(p.etapa) }); });
      leads = (respLeads.ok && respLeads.data && respLeads.data.ok) ? (respLeads.data.data || []) : [];
      renderCRM();
    } catch (err) {
      mostrarError('Error de conexi\u00F3n: ' + err.message);
    }
  }

  function renderCRM() {
    const root = document.getElementById('crm-root');
    const activos  = prospectos.filter(function(p) { return p.etapa !== 'Ganado' && p.etapa !== 'Perdido'; });
    const ganados  = prospectos.filter(function(p) { return p.etapa === 'Ganado'; }).length;
    const urgentes = activos.filter(function(p) { return p.semaforo === 'rojo'; }).length;
    const leadsActivos = leads.filter(function(l) { return !l.archivado && l.archivado !== 'TRUE'; }).length;

    window._crmKpis = { activos: activos.length, urgentes: urgentes, ganados: ganados };
    if (typeof actualizarKpisCRM === 'function') actualizarKpisCRM();

    window._crmAccionNuevo = function() {
      if (_tabActiva === 'leads')       abrirModalNuevoLead();
      else if (_tabActiva === 'pipeline')    abrirModalNuevo();
      else if (_tabActiva === 'diagnostico' && typeof cargarModulo === 'function') cargarModulo('diagnostico');
      else if (_tabActiva === 'recepcion'   && typeof cargarModulo === 'function') cargarModulo('recepcion');
    };

    const cfg = TAB_CONFIG[_tabActiva];

    root.innerHTML =
      '<div class="page-header" id="crm-page-header">' +
        '<div>' +
          '<div class="page-eyebrow">CRM</div>' +
          '<h1 class="page-title" id="crm-header-title">' + cfg.titulo + '</h1>' +
          '<p class="page-sub" id="crm-header-sub">' + cfg.sub + '</p>' +
        '</div>' +
        '<button class="btn-nuevo" id="crm-btn-accion">' +
          '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>' +
          '<span id="crm-btn-lbl">' + cfg.btnLbl + '</span>' +
        '</button>' +
      '</div>' +
      '<div class="crm-tabs-bar" id="crm-tabs-bar">' +
        '<button class="crm-tab-btn ' + (_tabActiva === 'leads' ? 'act' : '') + '" data-tab="leads">' +
          '<i class="ti ti-user-search" aria-hidden="true"></i> Leads' +
          '<span class="crm-tab-badge">' + leadsActivos + '</span>' +
        '</button>' +
        '<button class="crm-tab-btn ' + (_tabActiva === 'pipeline' ? 'act' : '') + '" data-tab="pipeline">' +
          '<i class="ti ti-layout-kanban" aria-hidden="true"></i> Pipeline' +
          '<span class="crm-tab-badge">' + activos.length + '</span>' +
        '</button>' +
        '<button class="crm-tab-btn ' + (_tabActiva === 'diagnostico' ? 'act' : '') + '" data-tab="diagnostico">' +
          '<i class="ti ti-stethoscope" aria-hidden="true"></i> Diagn\u00F3stico' +
        '</button>' +
        '<button class="crm-tab-btn ' + (_tabActiva === 'recepcion' ? 'act' : '') + '" data-tab="recepcion">' +
          '<i class="ti ti-clipboard-list" aria-hidden="true"></i> Recepci\u00F3n' +
        '</button>' +
      '</div>' +
      '<div id="crm-tab-content"></div>';

    document.getElementById('crm-tabs-bar').addEventListener('click', function(e) {
      const btn = e.target.closest('.crm-tab-btn');
      if (!btn) return;
      cambiarTab(btn.dataset.tab);
    });
    document.getElementById('crm-btn-accion').addEventListener('click', function() {
      TAB_CONFIG[_tabActiva].btnAct();
    });

    _renderTabContent(_tabActiva);
  }

  function _actualizarHeader(tab) {
    const cfg = TAB_CONFIG[tab];
    const title = document.getElementById('crm-header-title');
    const sub   = document.getElementById('crm-header-sub');
    const lbl   = document.getElementById('crm-btn-lbl');
    if (title) title.innerHTML = cfg.titulo;
    if (sub)   sub.textContent = cfg.sub;
    if (lbl)   lbl.textContent = cfg.btnLbl;
  }

  function _renderTabContent(tab) {
    const container = document.getElementById('crm-tab-content');
    if (!container) return;

    if (tab === 'leads') {
      renderLeads(container);
      return;
    }

    if (tab === 'pipeline') {
      container.innerHTML =
        '<div class="crm-kpis">' +
          '<div class="kpi-card activos"><div class="kpi-num">' + prospectos.filter(function(p){return p.etapa!=='Ganado'&&p.etapa!=='Perdido';}).length + '</div><div class="kpi-label">Activos</div></div>' +
          '<div class="kpi-card urgente"><div class="kpi-num urgente">' + prospectos.filter(function(p){return p.semaforo==='rojo'&&p.etapa!=='Ganado'&&p.etapa!=='Perdido';}).length + '</div><div class="kpi-label">Urgentes</div></div>' +
          '<div class="kpi-card ganado"><div class="kpi-num ganado">' + prospectos.filter(function(p){return p.etapa==='Ganado';}).length + '</div><div class="kpi-label">Ganados</div></div>' +
          '<div class="kpi-card perdido"><div class="kpi-num perdido">' + prospectos.filter(function(p){return p.etapa==='Perdido';}).length + '</div><div class="kpi-label">Perdidos</div></div>' +
        '</div>' +
        '<div class="vista-desktop"><div class="pipeline-scroll"><div class="pipeline" id="pipeline-desktop"></div></div></div>' +
        '<div class="vista-mobile" id="accordion-mobile"></div>';
      renderKanban();
      renderAccordion();
      return;
    }

    // Si ya existe un wrapper cacheado para este tab, mostrarlo sin recargar
    if (_tabCache[tab]) {
      _tabCache[tab].style.display = 'block';
      return;
    }

    // Primera carga — mostrar loading mientras fetch
    container.innerHTML = '<div class="module-loading"><div class="ml-iso-wrap"><div class="ml-iso"></div></div><div class="ml-text"><div class="ml-brand"><b>co</b>proactiva</div><div class="ml-status"><span class="ml-status-dot"></span>Cargando...</div></div></div>';
    const base = window.location.origin + window.location.pathname.replace('index.html','').replace(/\/$/, '') + '/';
    const modFile = tab === 'diagnostico' ? 'modules/diagnostico.html' : 'modules/' + tab + '.html';

    fetch(base + modFile)
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status + (tab === 'diagnostico' ? ' — ' + r.url : '')); return r.text(); })
      .then(function(html) {
        container.innerHTML = '';
        const wrapper = document.createElement('div');
        wrapper.setAttribute('data-tab-cache', tab);
        wrapper.style.width = '100%';
        wrapper.classList.add('crm-sub-modulo');
        const temp = document.createElement('div');
        temp.innerHTML = html;
        const scripts = Array.from(temp.querySelectorAll('script'));
        scripts.forEach(function(s) { s.remove(); });
        wrapper.innerHTML = temp.innerHTML;
        container.appendChild(wrapper);
        _tabCache[tab] = wrapper;
        scripts.forEach(function(old) {
          const s = document.createElement('script');
          s.textContent = old.textContent;
          document.body.appendChild(s);
          document.body.removeChild(s);
        });
      })
      .catch(function(err) {
        container.innerHTML = '<div style="padding:32px;text-align:center;color:var(--co-red);font-size:13px;font-weight:600">Error al cargar ' + tab + ': ' + err.message + '</div>';
      });
  }

  function cambiarTab(tab) {
    if (tab === _tabActiva) return;
    // Limpiar sticky de leads al salir
    if (_stickyScrollHandler) {
      window.removeEventListener('scroll', _stickyScrollHandler);
      _stickyScrollHandler = null;
    }
    // Ocultar wrapper cacheado del tab anterior si existe
    if (_tabCache[_tabActiva]) {
      _tabCache[_tabActiva].style.display = 'none';
    }
    _tabActiva = tab;
    document.querySelectorAll('.crm-tab-btn').forEach(function(b) {
      b.classList.toggle('act', b.dataset.tab === tab);
    });
    _actualizarHeader(tab);
    _renderTabContent(tab);
  }

  // ── LEADS: render principal ───────────────────────────────
  function renderLeads(container) {
    const activos = leads.filter(function(l) {
      return !l.archivado && l.archivado !== 'TRUE' && l.archivado !== 'true';
    });
    const contar = function(est) { return activos.filter(function(l){ return (l.estado||'nuevo') === est; }).length; };
    const total = activos.length;
    const convertidos = contar('convertido');
    const tasa = total > 0 ? Math.round((convertidos/total)*100) : 0;

    container.innerHTML =
      '<div class="leads-kpis">' +
        '<div class="lead-kpi"><div class="lead-kpi-num">' + total + '</div><div class="lead-kpi-label">Total leads</div></div>' +
        '<div class="lead-kpi"><div class="lead-kpi-num">' + contar('nuevo') + '</div><div class="lead-kpi-label">Nuevos</div></div>' +
        '<div class="lead-kpi"><div class="lead-kpi-num">' + contar('contactado') + '</div><div class="lead-kpi-label">Contactados</div></div>' +
        '<div class="lead-kpi"><div class="lead-kpi-num conv">' + convertidos + '</div><div class="lead-kpi-label">Convertidos ' + tasa + '%</div>' +
          '<div class="lead-kpi-bar"><div class="lead-kpi-bar-fill" style="width:' + tasa + '%"></div></div>' +
        '</div>' +
        '<div class="lead-kpi leads-kpi-archivados"><div class="lead-kpi-num">' + (leads.length - total) + '</div><div class="lead-kpi-label">Archivados</div></div>' +
      '</div>' +
      '<div class="leads-sticky-placeholder" id="leads-sticky-ph"></div>' +
      '<div class="leads-sticky" id="leads-sticky-bar">' +
        '<div class="leads-toolbar">' +
          '<input class="leads-search" id="lead-search" placeholder="Buscar condominio, contacto\u2026" value="' + _esc(_leadBusqueda) + '">' +
          '<select class="leads-filter" id="lead-fil-estado">' +
            '<option value="">Todos los estados</option>' +
            '<option value="nuevo"' + (_leadFiltroEstado==='nuevo'?' selected':'') + '>Nuevo</option>' +
            '<option value="contactado"' + (_leadFiltroEstado==='contactado'?' selected':'') + '>Contactado</option>' +
            '<option value="convertido"' + (_leadFiltroEstado==='convertido'?' selected':'') + '>Convertido</option>' +
            '<option value="descartado"' + (_leadFiltroEstado==='descartado'?' selected':'') + '>Descartado</option>' +
          '</select>' +
          '<select class="leads-filter" id="lead-fil-tipo">' +
            '<option value="">Todos los tipos</option>' +
            '<option value="comunidad"' + (_leadFiltroTipo==='comunidad'?' selected':'') + '>Comunidad</option>' +
            '<option value="inmobiliaria"' + (_leadFiltroTipo==='inmobiliaria'?' selected':'') + '>Inmobiliaria</option>' +
          '</select>' +
          '<button class="leads-btn-sec leads-btn-desktop" id="lead-btn-archivados">' +
            (_leadArchivados ? '\u25A0 Ocultar archivados' : '\u25A1 Ver archivados') +
          '</button>' +
          '<button class="leads-btn-sec leads-btn-importar-destac leads-btn-desktop" id="lead-btn-importar">' +
            '<i class="ti ti-upload"></i> Importar Excel' +
          '</button>' +
          '<button class="leads-btn-sec leads-btn-desktop" id="lead-btn-plantillas">' +
            '<i class="ti ti-mail"></i> Plantillas' +
          '</button>' +
          '<div style="position:relative">' +
            '<button class="leads-btn-sec leads-btn-mas-opciones" id="lead-btn-mas">' +
              '<i class="ti ti-dots"></i> Opciones' +
            '</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div id="lead-masiva-bar" style="display:none;align-items:center;gap:8px;background:var(--co-cream-deep);border:1px solid var(--co-line);border-radius:var(--co-r-md);padding:8px 14px;margin-bottom:12px;flex-wrap:wrap">' +
        '<i class="ti ti-check" style="font-size:14px;color:var(--co-orange)"></i>' +
        '<span id="lead-masiva-lbl" style="font-size:12px;font-weight:600;color:var(--co-ink);flex:1">0 seleccionados</span>' +
        '<button class="leads-btn-sec" id="lead-btn-masiva-correo"><i class="ti ti-mail"></i> Enviar correo</button>' +
        '<button class="leads-btn-sec" id="lead-btn-masiva-estado"><i class="ti ti-tag"></i> Cambiar estado</button>' +
        '<button class="leads-btn-sec" id="lead-btn-masiva-archivar" style="color:var(--co-red)"><i class="ti ti-archive"></i> Archivar</button>' +
      '</div>' +
      '<div class="leads-table-wrap"><table class="leads-table"><thead><tr>' +
        '<th style="width:36px"><input type="checkbox" id="lead-chk-all" style="width:14px;height:14px;accent-color:var(--co-orange);cursor:pointer"></th>' +
        '<th>Condominio</th><th>Tipo</th><th>Contacto</th><th>Estado</th><th>\u00DAltimo contacto</th><th></th>' +
      '</tr></thead><tbody id="leads-tbody"></tbody></table></div>' +
      '<div class="leads-cards" id="leads-cards"></div>';

    // eventos toolbar
    container.querySelector('#lead-search').addEventListener('input', function(e) {
      _leadBusqueda = e.target.value;
      _renderLeadsFiltered();
    });
    container.querySelector('#lead-fil-estado').addEventListener('change', function(e) {
      _leadFiltroEstado = e.target.value;
      _renderLeadsFiltered();
    });
    container.querySelector('#lead-fil-tipo').addEventListener('change', function(e) {
      _leadFiltroTipo = e.target.value;
      _renderLeadsFiltered();
    });
    container.querySelector('#lead-btn-archivados').addEventListener('click', function() {
      _leadArchivados = !_leadArchivados;
      renderLeads(container);
    });
    container.querySelector('#lead-btn-importar').addEventListener('click', function() {
      abrirModalImportarLeads();
    });
    container.querySelector('#lead-btn-plantillas').addEventListener('click', function() {
      abrirModalPlantillas();
    });

    // Menú más opciones (móvil)
    var btnMas = container.querySelector('#lead-btn-mas');
    if (btnMas) {
      btnMas.addEventListener('click', function(e) {
        e.stopPropagation();
        // Si ya hay un menú abierto, cerrarlo y salir
        var menuExistente = document.querySelector('.leads-mas-menu');
        if (menuExistente) { menuExistente.remove(); return; }
        document.querySelectorAll('.leads-mas-menu').forEach(function(m){ m.remove(); });
        var menu = document.createElement('div');
        menu.className = 'leads-mas-menu';
        var items = [
          { ico: 'ti-upload',   lbl: 'Importar Excel', fn: abrirModalImportarLeads },
          { ico: 'ti-mail',     lbl: 'Plantillas',     fn: abrirModalPlantillas },
          { ico: _leadArchivados ? 'ti-eye-off' : 'ti-eye', lbl: _leadArchivados ? 'Ocultar archivados' : 'Ver archivados', fn: function() { _leadArchivados = !_leadArchivados; renderLeads(container); } }
        ];
        items.forEach(function(it) {
          var btn2 = document.createElement('button');
          btn2.className = 'leads-mas-item';
          btn2.innerHTML = '<i class="ti ' + it.ico + '"></i> ' + it.lbl;
          btn2.addEventListener('click', function() { menu.remove(); it.fn(); });
          menu.appendChild(btn2);
        });
        btnMas.parentElement.appendChild(menu);
        setTimeout(function() {
          document.addEventListener('click', function cerrarMenu() {
            menu.remove(); document.removeEventListener('click', cerrarMenu);
          });
        }, 50);
      });
    }

    // Iniciar sticky toolbar
    setTimeout(_initStickyLeads, 50);

    // Listeners barra masiva - se conectan despues de renderizar filas
    container.addEventListener('click', function(e) {
      var btnCorreo  = e.target.closest('#lead-btn-masiva-correo');
      var btnEstado  = e.target.closest('#lead-btn-masiva-estado');
      var btnArch    = e.target.closest('#lead-btn-masiva-archivar');
      if (btnCorreo)  { e.stopPropagation(); abrirModalCorreoMasivo(); }
      if (btnEstado)  { e.stopPropagation(); abrirModalEstadoMasivo(); }
      if (btnArch)    { e.stopPropagation(); _archivarMasivo(); }
    });

    _renderLeadsFiltered();
  }

  function _leadsFiltrados() {
    let lista = _leadArchivados ? leads : leads.filter(function(l) {
      return !l.archivado && l.archivado !== 'TRUE' && l.archivado !== 'true';
    });
    if (_leadFiltroEstado) lista = lista.filter(function(l){ return (l.estado||'nuevo') === _leadFiltroEstado; });
    if (_leadFiltroTipo)   lista = lista.filter(function(l){ return l.tipoLead === _leadFiltroTipo; });
    if (_leadBusqueda) {
      const q = _leadBusqueda.toLowerCase();
      lista = lista.filter(function(l) {
        return (l.nombreCondominio||'').toLowerCase().includes(q) ||
               (l.nombreContacto||'').toLowerCase().includes(q) ||
               (l.email||'').toLowerCase().includes(q) ||
               (l.comuna||'').toLowerCase().includes(q);
      });
    }
    return lista;
  }

  function _pillEstado(est) {
    const map = { nuevo:'pill-nuevo', contactado:'pill-contactado', convertido:'pill-convertido', descartado:'pill-descartado' };
    return '<span class="pill ' + (map[est]||'pill-nuevo') + '">' + _esc(est||'nuevo') + '</span>';
  }

  function _pillTipo(tipo) {
    if (tipo === 'comunidad') return '<span class="pill pill-comunidad">Comunidad</span>';
    return '<span class="pill pill-proyecto">Nuevo</span>';
  }

  function _renderLeadsFiltered() {
    const lista = _leadsFiltrados();
    const tbody = document.getElementById('leads-tbody');
    const cards = document.getElementById('leads-cards');
    if (!tbody) return;

    if (!lista.length) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="leads-empty">No hay leads que mostrar.</div></td></tr>';
      if (cards) cards.innerHTML = '<div class="leads-empty">No hay leads que mostrar.</div>';
      return;
    }

    tbody.innerHTML = lista.map(function(l) {
      var seleccionado = _leadSelIds.indexOf(l.id) !== -1;
      return '<tr data-id="' + _esc(l.id) + '"' + (seleccionado ? ' class="lead-row-sel"' : '') + '>' +
        '<td style="width:36px"><input type="checkbox" class="lead-chk" data-id="' + _esc(l.id) + '" style="width:14px;height:14px;accent-color:var(--co-orange);cursor:pointer"' + (seleccionado ? ' checked' : '') + '></td>' +
        '<td><div class="lead-nombre-cell">' + _esc(l.nombreCondominio) + '</div>' +
             '<div class="lead-sub-cell">' + _esc(l.comuna||'') + '</div></td>' +
        '<td>' + _pillTipo(l.tipoLead) + '</td>' +
        '<td class="lead-contacto-cell">' + _esc(l.nombreContacto||'—') + '</td>' +
        '<td>' + _pillEstado(l.estado) + '</td>' +
        '<td class="lead-fecha-cell">' + _fechaCorta(l.fechaUltimoContacto) + '</td>' +
        '<td><div class="lead-acciones">' +
          '<button class="lead-acc-btn" data-accion="correo" data-id="' + _esc(l.id) + '" title="Enviar correo"><i class="ti ti-mail"></i></button>' +
          '<button class="lead-acc-btn" data-accion="llamar" data-id="' + _esc(l.id) + '" title="Llamar"><i class="ti ti-phone"></i></button>' +
        '</div></td>' +
      '</tr>';
    }).join('');

    // Barra masiva móvil — solo crear si no existe
    if (cards) {
      var barraMob = document.getElementById('lead-masiva-mob');
      if (!barraMob) {
        barraMob = document.createElement('div');
        barraMob.id = 'lead-masiva-mob';
        barraMob.className = 'lead-masiva-mobile';
        barraMob.innerHTML =
          '<span id="lead-masiva-mob-lbl" style="flex:1;font-size:12px;font-weight:700">0 seleccionados</span>' +
          '<button class="btn-masiva-mob" id="mob-btn-correo"><i class="ti ti-mail"></i> Correo</button>' +
          '<button class="btn-masiva-mob" id="mob-btn-estado"><i class="ti ti-tag"></i> Estado</button>' +
          '<button class="btn-masiva-mob" id="mob-btn-archivar"><i class="ti ti-archive"></i></button>' +
          '<button class="btn-masiva-mob" id="mob-btn-todos" style="width:100%"><i class="ti ti-checkbox"></i> Seleccionar todos</button>' +
          '<button class="btn-masiva-mob cancel" id="mob-btn-cancelar">Cancelar</button>';
        cards.parentElement.insertBefore(barraMob, cards);
        // Listeners solo al crear por primera vez
        barraMob.querySelector('#mob-btn-correo').addEventListener('click', function() { abrirModalCorreoMasivo(); });
        barraMob.querySelector('#mob-btn-estado').addEventListener('click', function() { abrirModalEstadoMasivo(); });
        barraMob.querySelector('#mob-btn-archivar').addEventListener('click', function() { _archivarMasivo(); });
        barraMob.querySelector('#mob-btn-todos').addEventListener('click', function() {
          var todos = _leadsFiltrados();
          _leadSelIds = todos.map(function(l){ return l.id; });
          var cardsActual = document.getElementById('leads-cards');
          if (cardsActual) {
            cardsActual.querySelectorAll('.lead-card').forEach(function(c){
              c.classList.toggle('selected', _leadSelIds.indexOf(c.dataset.id) !== -1);
            });
          }
          var barActual = document.getElementById('lead-masiva-mob');
          if (barActual) {
            barActual.classList.add('visible');
            var lbl = barActual.querySelector('#lead-masiva-mob-lbl');
            if (lbl) lbl.textContent = _leadSelIds.length + ' seleccionado' + (_leadSelIds.length !== 1 ? 's' : '');
          }
          _actualizarBarraMasiva();
        });

        barraMob.querySelector('#mob-btn-cancelar').addEventListener('click', function() {
          _leadSelIds = [];
          var barActual = document.getElementById('lead-masiva-mob');
          var cardsActual = document.getElementById('leads-cards');
          if (cardsActual) cardsActual.querySelectorAll('.lead-card').forEach(function(c){ c.classList.remove('selected'); });
          if (barActual) {
            barActual.classList.remove('visible');
            var lbl = barActual.querySelector('#lead-masiva-mob-lbl');
            if (lbl) lbl.textContent = '0 seleccionados';
          }
          _actualizarBarraMasiva();
        });
      } else {
        // Ya existe — solo actualizar visibilidad
        barraMob.classList.toggle('visible', _leadSelIds.length > 0);
        var lblMobEx = barraMob.querySelector('#lead-masiva-mob-lbl');
        if (lblMobEx) lblMobEx.textContent = _leadSelIds.length + ' seleccionado' + (_leadSelIds.length !== 1 ? 's' : '');
      }
    }

    if (cards) {
      cards.innerHTML = lista.map(function(l) {
        const ini = ((l.nombreCondominio||'?').charAt(0)).toUpperCase();
        const cls = l.tipoLead === 'comunidad' ? 'comunidad' : 'proyecto';
        var selMob = _leadSelIds.indexOf(l.id) !== -1;
        return '<div class="lead-card' + (selMob ? ' selected' : '') + '" data-id="' + _esc(l.id) + '">' +
          '<div class="lead-card-top">' +
            '<div class="lead-avatar ' + cls + '">' + ini + '</div>' +
            '<div class="lead-card-info">' +
              '<div class="lead-card-nombre">' + _esc(l.nombreCondominio) + '</div>' +
              '<div class="lead-card-meta">' + _esc(l.nombreContacto||'') + (l.comuna ? ' · ' + _esc(l.comuna) : '') + '</div>' +
            '</div>' +
            _pillEstado(l.estado) +
          '</div>' +
          '<div class="lead-card-footer">' +
            '<div class="lead-card-fecha">' + _fechaCorta(l.fechaUltimoContacto) + '</div>' +
            '<div class="lead-card-btns">' +
              '<button class="lead-acc-btn" data-accion="correo" data-id="' + _esc(l.id) + '"><i class="ti ti-mail"></i></button>' +
              '<button class="lead-acc-btn" data-accion="llamar" data-id="' + _esc(l.id) + '"><i class="ti ti-phone"></i></button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    // Checkbox select-all
    var chkAll = document.getElementById('lead-chk-all');
    if (chkAll) {
      chkAll.addEventListener('change', function() {
        var checked = chkAll.checked;
        _leadSelIds = checked ? lista.map(function(l){ return l.id; }) : [];
        document.querySelectorAll('.lead-chk').forEach(function(c){ c.checked = checked; });
        document.querySelectorAll('tr[data-id]').forEach(function(tr){ tr.classList.toggle('lead-row-sel', checked); });
        _actualizarBarraMasiva();
      });
    }

    // Eventos filas tabla
    tbody.querySelectorAll('tr[data-id]').forEach(function(tr) {
      tr.addEventListener('click', function(e) {
        if (e.target.closest('.lead-acc-btn') || e.target.closest('.lead-chk')) return;
        const l = leads.find(function(x){ return x.id === tr.dataset.id; });
        if (l) abrirModalDetalleLead(l);
      });
    });

    // Eventos checkboxes individuales
    tbody.querySelectorAll('.lead-chk').forEach(function(chk) {
      chk.addEventListener('change', function(e) {
        e.stopPropagation();
        var id = chk.dataset.id;
        var tr = chk.closest('tr');
        if (chk.checked) {
          if (_leadSelIds.indexOf(id) === -1) _leadSelIds.push(id);
          if (tr) tr.classList.add('lead-row-sel');
        } else {
          _leadSelIds = _leadSelIds.filter(function(x){ return x !== id; });
          if (tr) tr.classList.remove('lead-row-sel');
        }
        _actualizarBarraMasiva();
      });
    });
    // Eventos cards móvil + long press para selección
    if (cards) {
      cards.querySelectorAll('.lead-card').forEach(function(card) {
        var longPressTimer = null;
        var longPressFired = false;

        card.addEventListener('touchstart', function(e) {
          longPressFired = false;
          longPressTimer = setTimeout(function() {
            longPressFired = true;
            _toggleSelMob(card.dataset.id, cards);
          }, 500);
        }, { passive: true });

        card.addEventListener('touchend', function() {
          clearTimeout(longPressTimer);
        });

        card.addEventListener('touchmove', function() {
          clearTimeout(longPressTimer);
        });

        card.addEventListener('click', function(e) {
          if (longPressFired) { e.preventDefault(); return; }
          if (e.target.closest('.lead-acc-btn')) return;
          // Si hay seleccionados activos, toggle en lugar de abrir modal
          if (_leadSelIds.length > 0) { _toggleSelMob(card.dataset.id, cards); return; }
          const l = leads.find(function(x){ return x.id === card.dataset.id; });
          if (l) abrirModalDetalleLead(l);
        });
      });
    }
    // Botones acción
    document.querySelectorAll('.lead-acc-btn').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const l = leads.find(function(x){ return x.id === btn.dataset.id; });
        if (!l) return;
        if (btn.dataset.accion === 'correo') abrirModalCorreoLead(l);
        if (btn.dataset.accion === 'llamar') {
          const tel = String(l.telefono||'').replace(/[^0-9]/g,'');
          if (tel) window.open('tel:+' + (tel.startsWith('56') ? tel : '56'+tel));
          else alert('Sin teléfono registrado.');
        }
      });
    });
  }

  // ── Modal detalle lead ────────────────────────────────────
  function abrirModalDetalleLead(l) {
    var hist = [];
    try { hist = JSON.parse(l.historial || '[]'); } catch(e) { hist = []; }
    const ultimos = hist.slice(-8).reverse();

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const histHTML = ultimos.length ? ultimos.map(function(ev) {
      return '<div class="lead-hist-item">' +
        '<div class="lead-hist-tipo">' + _histLabel(ev.tipo) + '</div>' +
        '<div class="lead-hist-texto">' + _esc(_histTexto(ev)) + '</div>' +
        '<div class="lead-hist-fecha">' + _fechaCorta(ev.fecha) + '</div>' +
      '</div>';
    }).join('') : '<div style="font-size:12px;color:var(--co-mute);padding:8px 0">Sin historial.</div>';

    overlay.innerHTML =
      '<div class="modal-box" style="max-width:620px">' +
        '<div class="modal-handle"></div>' +
        '<button class="modal-close" id="mc-lead">\u00D7</button>' +
        '<div style="background:var(--co-ink);margin:-32px -32px 24px;padding:24px 32px;border-radius:var(--co-r-lg) var(--co-r-lg) 0 0">' +
          '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">' +
            _pillTipo(l.tipoLead) +
            _pillEstado(l.estado) +
          '</div>' +
          '<div style="font-size:20px;font-weight:800;color:#fff;letter-spacing:-0.025em">' + _esc(l.nombreCondominio) + '</div>' +
          '<div style="font-size:12px;color:rgba(255,255,255,0.55);margin-top:4px">' + _esc(l.nombreContacto||'') + (l.comuna ? ' · ' + _esc(l.comuna) : '') + '</div>' +
        '</div>' +
        '<div class="modal-grid">' +
          '<div class="modal-campo"><label>Contacto</label><span>' + _esc(l.nombreContacto||'—') + '</span></div>' +
          '<div class="modal-campo"><label>Cargo</label><span>' + _esc(l.cargoContacto||'—') + '</span></div>' +
          '<div class="modal-campo"><label>Tel\u00E9fono</label><span>' + _esc(l.telefono||'—') + '</span></div>' +
          '<div class="modal-campo"><label>Email</label><span>' + _esc(l.email||'—') + '</span></div>' +
          '<div class="modal-campo"><label>Fuente</label><span>' + _esc(l.fuenteLead||'—') + '</span></div>' +
          '<div class="modal-campo"><label>Ingreso</label><span>' + _fechaCorta(l.fechaIngreso) + '</span></div>' +
          (l.constructora ? '<div class="modal-campo"><label>Constructora</label><span>' + _esc(l.constructora) + '</span></div>' : '') +
          (l.etapaObra    ? '<div class="modal-campo"><label>Etapa obra</label><span>' + _esc(l.etapaObra) + '</span></div>' : '') +
          (l.observaciones ? '<div class="modal-campo" style="grid-column:1/-1"><label>Observaciones</label><span>' + _esc(l.observaciones) + '</span></div>' : '') +
        '</div>' +
        '<div class="modal-seccion">' +
          '<div class="modal-seccion-titulo">Historial reciente</div>' +
          '<div style="max-height:200px;overflow-y:auto">' + histHTML + '</div>' +
        '</div>' +
        '<div class="modal-seccion">' +
          '<div class="modal-seccion-titulo">Agregar observaci\u00F3n</div>' +
          '<textarea id="lead-obs-txt" rows="3" placeholder="Escribe una nota\u2026" style="width:100%;padding:11px 14px;border:1.5px solid var(--co-line);border-radius:var(--co-r-md);font-family:var(--co-font);font-size:13px;color:var(--co-ink);background:var(--co-surface);box-sizing:border-box;resize:vertical"></textarea>' +
          '<button class="btn-cambiar" id="btn-obs-guardar" style="margin-top:10px">Guardar observaci\u00F3n</button>' +
        '</div>' +
        '<div class="modal-seccion">' +
          '<div class="modal-seccion-titulo">Cambiar estado</div>' +
          '<select class="etapa-select" id="lead-sel-estado">' +
            ['nuevo','contactado','convertido','descartado'].map(function(est) {
              return '<option value="' + est + '"' + ((l.estado||'nuevo')===est?' selected':'') + '>' + est.charAt(0).toUpperCase()+est.slice(1) + '</option>';
            }).join('') +
          '</select>' +
          '<button class="btn-cambiar" id="btn-lead-estado">Guardar estado</button>' +
          '<div class="msg-ok" id="lead-msg-ok">\u2713 Actualizado</div>' +
        '</div>' +
        '<div class="modal-seccion" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
          '<button class="btn-contactar btn-mail" id="btn-lead-correo" style="font-size:12px;padding:11px 14px">' +
            '<i class="ti ti-mail"></i> Correo' +
          '</button>' +
          '<button class="btn-contactar btn-wsp" id="btn-lead-wsp" style="font-size:12px;padding:11px 14px">' +
            '<i class="ti ti-phone"></i> Llamar' +
          '</button>' +
          (l.convertidoAProspectoId ? '' :
            '<button class="btn-guardar" id="btn-lead-convertir" style="grid-column:1/-1;margin-top:0;background:var(--co-green)">Convertir a prospecto</button>'
          ) +
          '<button class="btn-editar-datos" id="btn-lead-editar" style="grid-column:1/-1">' +
            '<i class="ti ti-pencil"></i> Editar datos' +
          '</button>' +
          (l.archivado ?
            '<button class="btn-editar-datos" id="btn-lead-reactivar" style="grid-column:1/-1">Reactivar lead</button>' :
            '<button class="btn-editar-datos" id="btn-lead-archivar" style="grid-column:1/-1;color:var(--co-red)">Archivar lead</button>'
          ) +
        '</div>' +
      '</div>';

    document.body.appendChild(overlay);
    const cerrar = function() { overlay.remove(); };
    overlay.querySelector('#mc-lead').addEventListener('click', cerrar);
    overlay.addEventListener('click', function(e) { if (e.target === overlay) cerrar(); });

    // Guardar observación
    overlay.querySelector('#btn-obs-guardar').addEventListener('click', async function() {
      const txt = overlay.querySelector('#lead-obs-txt').value.trim();
      if (!txt) return;
      const btn = overlay.querySelector('#btn-obs-guardar');
      btn.disabled = true; btn.textContent = 'Guardando\u2026';
      const resp = await api('/leads', 'POST', { action: 'agregarObservacionLead', id: l.id, texto: txt });
      if (resp.ok && resp.data && resp.data.ok) {
        // actualizar local
        var ev = { tipo:'observacion', fecha: new Date().toISOString(), datos:{ texto: txt } };
        var h = []; try { h = JSON.parse(l.historial||'[]'); } catch(e2){h=[];}
        h.push(ev); l.historial = JSON.stringify(h);
        cerrar(); abrirModalDetalleLead(l);
      } else { btn.disabled = false; btn.textContent = 'Guardar observaci\u00F3n'; alert('Error al guardar.'); }
    });

    // Cambiar estado
    overlay.querySelector('#btn-lead-estado').addEventListener('click', async function() {
      const est = overlay.querySelector('#lead-sel-estado').value;
      if (est === (l.estado||'nuevo')) return;
      const btn = overlay.querySelector('#btn-lead-estado');
      btn.disabled = true; btn.textContent = 'Guardando\u2026';
      const resp = await api('/leads', 'POST', { action: 'cambiarEstadoLead', id: l.id, estadoNuevo: est });
      if (resp.ok && resp.data && resp.data.ok) {
        l.estado = est;
        overlay.querySelector('#lead-msg-ok').style.display = 'block';
        btn.textContent = 'Guardar estado'; btn.disabled = false;
        _renderLeadsFiltered();
      } else { btn.disabled = false; btn.textContent = 'Guardar estado'; alert('Error.'); }
    });

    // Correo
    overlay.querySelector('#btn-lead-correo').addEventListener('click', function() { cerrar(); abrirModalCorreoLead(l); });

    // Llamar
    overlay.querySelector('#btn-lead-wsp').addEventListener('click', function() {
      const tel = String(l.telefono||'').replace(/[^0-9]/g,'');
      if (tel) window.open('tel:+' + (tel.startsWith('56') ? tel : '56'+tel));
      else alert('Sin teléfono registrado.');
    });

    // Convertir
    const btnConv = overlay.querySelector('#btn-lead-convertir');
    if (btnConv) {
      btnConv.addEventListener('click', async function() {
        if (!confirm('¿Convertir este lead a prospecto en el Pipeline?')) return;
        btnConv.disabled = true; btnConv.textContent = 'Convirtiendo\u2026';
        const resp = await api('/leads', 'POST', { action: 'convertirLead', id: l.id });
        if (resp.ok && resp.data && resp.data.ok) {
          l.estado = 'convertido';
          l.convertidoAProspectoId = resp.data.prospectoId;
          // recargar prospectos
          api('/crm').then(function(r) {
            if (r.ok && r.data && r.data.ok) prospectos = (r.data.data||[]).map(function(p){ return Object.assign({},p,{etapa:normalizarEtapa(p.etapa)}); });
          });
          cerrar();
          alert('\u2713 Convertido. Ya aparece en el Pipeline como "Nuevo prospecto".');
          _renderLeadsFiltered();
        } else { btnConv.disabled = false; btnConv.textContent = 'Convertir a prospecto'; alert('Error al convertir.'); }
      });
    }

    // Editar
    overlay.querySelector('#btn-lead-editar').addEventListener('click', function() { cerrar(); abrirModalEditarLead(l); });

    // Archivar
    const btnArch = overlay.querySelector('#btn-lead-archivar');
    if (btnArch) {
      btnArch.addEventListener('click', async function() {
        if (!confirm('¿Archivar este lead?')) return;
        await api('/leads', 'POST', { action: 'archivarLead', id: l.id });
        l.archivado = true; l.estado = 'descartado';
        cerrar(); _renderLeadsFiltered();
      });
    }

    // Reactivar
    const btnReact = overlay.querySelector('#btn-lead-reactivar');
    if (btnReact) {
      btnReact.addEventListener('click', async function() {
        await api('/leads', 'POST', { action: 'reactivarLead', id: l.id });
        l.archivado = false; l.estado = 'nuevo';
        cerrar(); _renderLeadsFiltered();
      });
    }
  }

    overlay.querySelector('#mc-nlead').addEventListener('click', cerrar);
    overlay.addEventListener('click', function(e) { if (e.target === overlay) cerrar(); });

    overlay.querySelector('#btn-guardar-nlead').addEventListener('click', async function() {
      const nombre = overlay.querySelector('#nl-nombre').value.trim();
      const contacto = overlay.querySelector('#nl-contacto').value.trim();
      const errDiv = overlay.querySelector('#nl-error');
      const btn = overlay.querySelector('#btn-guardar-nlead');
      if (!nombre || !contacto) { errDiv.textContent = 'Nombre y contacto son obligatorios.'; errDiv.style.display = 'block'; return; }
      btn.disabled = true; btn.textContent = 'Guardando\u2026'; errDiv.style.display = 'none';
      const datos = {
        action: 'crearLead',
        tipoLead: overlay.querySelector('#nl-tipo').value,
        nombreCondominio: nombre,
        comuna: overlay.querySelector('#nl-comuna').value.trim(),

        nombreContacto: contacto,
        cargoContacto: overlay.querySelector('#nl-cargo').value.trim(),

        email: overlay.querySelector('#nl-email').value.trim(),

        constructora: overlay.querySelector('#nl-constructora').value.trim(),
        observaciones: overlay.querySelector('#nl-obs').value.trim(),
      };

        cerrar();
        const cont = document.getElementById('crm-tab-content');
        if (cont) renderLeads(cont);
      } else {
        errDiv.textContent = (resp.data && resp.data.error) || resp.error || 'Error al guardar';
        errDiv.style.display = 'block'; btn.disabled = false; btn.textContent = 'Guardar lead';
      }
    });
  }

    async function _enviar(accion) {
      const para   = box.querySelector('#lmail-para').value.trim();
      const asunto = box.querySelector('#lmail-asunto').value.trim();
      const cuerpo = box.querySelector('#lmail-cuerpo').value.trim();

      errDiv.style.display = 'none';
      const btn = accion === 'enviar' ? box.querySelector('#btn-lmail-enviar') : box.querySelector('#btn-lmail-borrador');
      btn.disabled = true; btn.textContent = accion === 'enviar' ? 'Enviando\u2026' : 'Creando borrador\u2026';

      // Registrar correo en historial del lead
      const respLead = await api('/leads', 'POST', { action: 'registrarCorreoLead', id: l.id, para: para, asunto: asunto });
      if (respLead.ok && respLead.data && respLead.data.ok && respLead.data.estadoNuevo) {
        l.estado = respLead.data.estadoNuevo;
      }

      // Enviar / borrador via CRM correos
      const resp = await api('/correo', 'POST', {
        action: accion === 'borrador' ? 'crearBorrador' : undefined,
        prospectoId: l.id, etapa: 'lead', para: para, asunto: asunto, cuerpo: cuerpo
      });

        btn.style.background = 'var(--co-green)';
        window.open('https://mail.google.com/mail/#drafts', '_blank');
      }
      _renderLeadsFiltered();
    }

    box.querySelector('#btn-lmail-enviar').addEventListener('click', function() { _enviar('enviar'); });
    box.querySelector('#btn-lmail-borrador').addEventListener('click', function() { _enviar('borrador'); });
  }

  // ── Pipeline ──────────────────────────────────────────────
  function renderKanban() {
    const pipeline = document.getElementById('pipeline-desktop');
    if (!pipeline) return;
    pipeline.innerHTML = '';
    ETAPAS.forEach(function(etapa) {
      const enEtapa = prospectos.filter(function(p) { return p.etapa === etapa; });
      const col = document.createElement('div');
      col.className = 'columna';
      col.innerHTML =
        '<div class="columna-header">' +
          '<span class="columna-title">' + etapa + '</span>' +
          '<span class="columna-count ' + (enEtapa.length === 0 ? 'empty' : '') + '">' + enEtapa.length + '</span>' +
        '</div>' +
        (enEtapa.length === 0 ? '<div class="columna-vacia">Sin prospectos</div>' : enEtapa.map(tarjetaHTML).join(''));
      pipeline.appendChild(col);
    });
    pipeline.querySelectorAll('.tarjeta').forEach(function(t) {
      t.addEventListener('click', function() {
        const p = prospectos.find(function(x) { return x.id === t.getAttribute('data-id'); });
        if (p) abrirModalDetalle(p);
      });
    });
  }

  function renderAccordion() {
    const acc = document.getElementById('accordion-mobile');
    if (!acc) return;
    acc.innerHTML = '';
    const etapasConDatos = ETAPAS.filter(function(e) { return prospectos.some(function(p){ return p.etapa === e; }); });
    const etapasSinDatos = ETAPAS.filter(function(e) { return !prospectos.some(function(p){ return p.etapa === e; }); });
    etapasConDatos.concat(etapasSinDatos).forEach(function(etapa, idx) {
      const enEtapa = prospectos.filter(function(p) { return p.etapa === etapa; });
      const abierto = idx === 0 && enEtapa.length > 0;
      const bloque = document.createElement('div');
      bloque.className = 'accordion-etapa';
      bloque.innerHTML =
        '<div class="accordion-header">' +
          '<span class="accordion-titulo">' + etapa + '</span>' +
          '<div class="accordion-meta">' +
            '<span class="accordion-count ' + (enEtapa.length === 0 ? 'vacio' : '') + '">' + enEtapa.length + '</span>' +
            '<span class="accordion-chevron ' + (abierto ? 'abierto' : '') + '">\u25BC</span>' +
          '</div>' +
        '</div>' +
        '<div class="accordion-body ' + (abierto ? 'abierto' : '') + '">' +
          (enEtapa.length === 0 ? '<div class="accordion-vacia">Sin prospectos</div>' : enEtapa.map(tarjetaHTML).join('')) +
        '</div>';
      bloque.querySelector('.accordion-header').addEventListener('click', function() {
        const body    = bloque.querySelector('.accordion-body');
        const chevron = bloque.querySelector('.accordion-chevron');
        const esta    = body.classList.contains('abierto');
        body.classList.toggle('abierto', !esta);
        chevron.classList.toggle('abierto', !esta);
      });
      acc.appendChild(bloque);
    });
    acc.querySelectorAll('.tarjeta').forEach(function(t) {
      t.addEventListener('click', function() {
        const p = prospectos.find(function(x) { return x.id === t.getAttribute('data-id'); });
        if (p) abrirModalDetalle(p);
      });
    });
  }

  // ── Plantillas de correo ──────────────────────────────────
  var _plantillasCache = [];

  async function _fetchPlantillas() {
    if (_plantillasCache.length > 0) return _plantillasCache;
    try {
      var resp = await api('/plantillas');
      // Worker: { ok, data: { ok, data: [...] } }
      var lista = null;
      if (resp && resp.data && resp.data.data && Array.isArray(resp.data.data)) {
        lista = resp.data.data;
      } else if (resp && resp.data && Array.isArray(resp.data)) {
        lista = resp.data;
      } else if (resp && Array.isArray(resp)) {
        lista = resp;
      }
      if (lista) _plantillasCache = lista;
    } catch(e) { console.error('_fetchPlantillas error:', e); }
    return _plantillasCache;
  }

  function _cargarSelectorPlantillas(sel) {
    if (!sel) return;
    _fetchPlantillas().then(function(lista) {
      sel.innerHTML = '<option value="">— Sin plantilla —</option>';
      lista.forEach(function(p) {
        var opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.nombre;
        sel.appendChild(opt);
      });
    });
  }

  function _reemplazarVars(texto, datos) {
    if (!texto) return '';
    return texto
      .replace(/\{nombre\}/g,     _esc(datos.nombreContacto  || datos.nombre     || ''))
      .replace(/\{condominio\}/g, _esc(datos.nombreCondominio || datos.condominio || ''))
      .replace(/\{comuna\}/g,     _esc(datos.comuna           || ''))
      .replace(/\{cargo\}/g,      _esc(datos.cargoContacto    || datos.cargo      || ''));
  }

  // ── Modal gestión de plantillas ───────────────────────────
  function abrirModalPlantillas() {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML =
      '<div class="modal-box" style="max-width:640px">' +
        '<div class="modal-handle"></div>' +
        '<button class="modal-close" id="mc-plt">×</button>' +
        '<div class="modal-eyebrow">Correos</div>' +
        '<div class="modal-titulo">Plantillas de correo</div>' +
        '<div class="modal-subtitulo">Compartidas entre Leads y Pipeline. Variables: {nombre} {condominio} {comuna} {cargo}</div>' +
        '<div id="plt-lista" style="margin-bottom:16px"></div>' +
        '<button class="btn-guardar" id="plt-btn-nueva" style="background:var(--co-ink)">+ Nueva plantilla</button>' +
      '</div>';

    document.body.appendChild(overlay);
    const cerrar = function() { overlay.remove(); };
    overlay.querySelector('#mc-plt').addEventListener('click', cerrar);
    overlay.addEventListener('click', function(e) { if (e.target === overlay) cerrar(); });

    function _renderLista() {
      const lista = overlay.querySelector('#plt-lista');
      lista.innerHTML = '<div style="font-size:12px;color:var(--co-mute);padding:8px 0">Cargando…</div>';
      _plantillasCache = []; // forzar recarga
      _fetchPlantillas().then(function(plt) {
        if (!plt.length) {
          lista.innerHTML = '<div style="font-size:12px;color:var(--co-mute);padding:8px 0">Sin plantillas. Crea la primera.</div>';
          return;
        }
        lista.innerHTML = plt.map(function(p) {
          var tags = p.tags ? p.tags.split(',').map(function(t){ return '<span style="font-size:10px;background:var(--co-cream-deep);color:var(--co-mute);padding:2px 7px;border-radius:20px;margin-right:4px">' + _esc(t.trim()) + '</span>'; }).join('') : '';
          return '<div style="display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--co-line)" data-id="' + _esc(p.id) + '">' +
            '<div style="flex:1;min-width:0">' +
              '<div style="font-size:13px;font-weight:700;color:var(--co-ink);margin-bottom:2px">' + _esc(p.nombre) + '</div>' +
              '<div style="font-size:11px;color:var(--co-mute);margin-bottom:4px">' + _esc(p.asunto) + '</div>' +
              '<div>' + tags + '</div>' +
            '</div>' +
            '<div style="display:flex;gap:6px;flex-shrink:0">' +
              '<button class="plt-btn-edit btn-editar-datos" style="padding:6px 10px;font-size:11px" data-id="' + _esc(p.id) + '">Editar</button>' +
              '<button class="plt-btn-del" style="padding:6px 10px;font-size:11px;border:1.5px solid var(--co-red);border-radius:var(--co-r-md);background:none;color:var(--co-red);cursor:pointer;font-family:var(--co-font);font-weight:700" data-id="' + _esc(p.id) + '">Eliminar</button>' +
            '</div>' +
          '</div>';
        }).join('');

        overlay.querySelectorAll('.plt-btn-edit').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var p = _plantillasCache.find(function(x){ return x.id === btn.dataset.id; });
            if (p) _abrirFormPlantilla(p, _renderLista);
          });
        });
        overlay.querySelectorAll('.plt-btn-del').forEach(function(btn) {
          btn.addEventListener('click', async function() {
            if (!confirm('¿Eliminar esta plantilla?')) return;
            await api('/plantillas', 'POST', { action: 'eliminarPlantilla', id: btn.dataset.id });
            _plantillasCache = [];
            _renderLista();
          });
        });
      });
    }

    overlay.querySelector('#plt-btn-nueva').addEventListener('click', function() {
      _abrirFormPlantilla(null, _renderLista);
    });

    _renderLista();
  }

  function _abrirFormPlantilla(plantilla, onDone) {
    const overlay2 = document.createElement('div');
    overlay2.className = 'modal-overlay';
    overlay2.style.zIndex = '3000';
    overlay2.innerHTML =
      '<div class="modal-box" style="max-width:560px">' +
        '<div class="modal-handle"></div>' +
        '<button class="modal-close" id="mc-fplt">×</button>' +
        '<div class="modal-eyebrow">' + (plantilla ? 'Editar' : 'Nueva') + ' plantilla</div>' +
        '<div class="modal-titulo">' + (plantilla ? _esc(plantilla.nombre) : 'Nueva plantilla') + '</div>' +
        '<div class="form-grid" style="margin-top:20px">' +
          '<div class="form-group form-full"><label>Nombre *</label><input type="text" id="fplt-nombre" value="' + _esc(plantilla ? plantilla.nombre : '') + '" placeholder="Ej: Primer contacto frío"></div>' +
          '<div class="form-group form-full"><label>Tags (separados por coma)</label><input type="text" id="fplt-tags" value="' + _esc(plantilla ? plantilla.tags : '') + '" placeholder="leads, pipeline, proyecto-nuevo"></div>' +
          '<div class="form-group form-full"><label>Asunto *</label><input type="text" id="fplt-asunto" value="' + _esc(plantilla ? plantilla.asunto : '') + '" placeholder="Coproactiva — Administración para {condominio}"></div>' +
          '<div class="form-group form-full"><label>Cuerpo * <span style="font-size:10px;color:var(--co-mute);font-weight:400">(texto plano — usa {nombre}, {condominio}, {comuna}, {cargo})</span></label>' +
            '<textarea id="fplt-cuerpo" rows="10" style="width:100%;padding:11px 14px;border:1.5px solid var(--co-line);border-radius:var(--co-r-md);font-family:var(--co-font);font-size:13px;color:var(--co-ink);background:var(--co-surface);box-sizing:border-box;resize:vertical;min-height:180px">' + _esc(plantilla ? plantilla.cuerpo : '') + '</textarea>' +
          '</div>' +
        '</div>' +
        '<div class="form-error" id="fplt-error" style="display:none"></div>' +
        '<button class="btn-guardar" id="fplt-btn-guardar">' + (plantilla ? 'Guardar cambios' : 'Crear plantilla') + '</button>' +
      '</div>';

    document.body.appendChild(overlay2);
    const cerrar2 = function() { overlay2.remove(); };
    overlay2.querySelector('#mc-fplt').addEventListener('click', cerrar2);
    overlay2.addEventListener('click', function(e) { if (e.target === overlay2) cerrar2(); });

    overlay2.querySelector('#fplt-btn-guardar').addEventListener('click', async function() {
      const nombre = overlay2.querySelector('#fplt-nombre').value.trim();
      const asunto = overlay2.querySelector('#fplt-asunto').value.trim();
      const cuerpo = overlay2.querySelector('#fplt-cuerpo').value.trim();
      const tags   = overlay2.querySelector('#fplt-tags').value.trim();
      const errDiv = overlay2.querySelector('#fplt-error');
      const btn    = overlay2.querySelector('#fplt-btn-guardar');

      if (!nombre || !asunto || !cuerpo) {
        errDiv.textContent = 'Nombre, asunto y cuerpo son obligatorios.';
        errDiv.style.display = 'block';
        return;
      }

      btn.disabled = true; btn.textContent = 'Guardando…'; errDiv.style.display = 'none';

      const accion = plantilla ? 'editarPlantilla' : 'crearPlantilla';
      const payload = { action: accion, nombre: nombre, asunto: asunto, cuerpo: cuerpo, tags: tags };
      if (plantilla) payload.id = plantilla.id;

      const resp = await api('/plantillas', 'POST', payload);
      if (resp.ok && resp.data && resp.data.ok) {
        _plantillasCache = [];
        btn.textContent = '✓ Guardado'; btn.style.background = 'var(--co-green)';
        setTimeout(function() { cerrar2(); if (onDone) onDone(); }, 700);
      } else {
        errDiv.textContent = (resp.data && resp.data.error) || resp.error || 'Error al guardar';
        errDiv.style.display = 'block';
        btn.disabled = false;
        btn.textContent = plantilla ? 'Guardar cambios' : 'Crear plantilla';
      }
    });
  }

  window.abrirModalPlantillas = abrirModalPlantillas;

  // ── Helpers barra masiva ─────────────────────────────────
  function _toggleSelMob(id, cards) {
    var idx = _leadSelIds.indexOf(id);
    if (idx === -1) { _leadSelIds.push(id); }
    else { _leadSelIds.splice(idx, 1); }
    // Actualizar visual tarjetas
    if (cards) {
      cards.querySelectorAll('.lead-card').forEach(function(c) {
        c.classList.toggle('selected', _leadSelIds.indexOf(c.dataset.id) !== -1);
      });
    }
    // Actualizar barra masiva móvil
    var barMob = document.getElementById('lead-masiva-mob');
    var lblMob = document.getElementById('lead-masiva-mob-lbl');
    if (barMob) {
      barMob.classList.toggle('visible', _leadSelIds.length > 0);
      if (lblMob) lblMob.textContent = _leadSelIds.length + ' seleccionado' + (_leadSelIds.length !== 1 ? 's' : '');
    }
    _actualizarBarraMasiva();
  }

  function _actualizarBarraMasiva() {
    var bar = document.getElementById('lead-masiva-bar');
    var lbl = document.getElementById('lead-masiva-lbl');
    if (!bar) return;
    var n = _leadSelIds.length;
    bar.style.display = n > 0 ? 'flex' : 'none';
    if (lbl) lbl.textContent = n + ' lead' + (n !== 1 ? 's' : '') + ' seleccionado' + (n !== 1 ? 's' : '');
  }

  function _leadsSeleccionados() {
    return leads.filter(function(l) { return _leadSelIds.indexOf(l.id) !== -1; });
  }

  // ── Modal correo masivo ───────────────────────────────────
  function abrirModalCorreoMasivo() {

    var overlay = document.createElement('div');

    var box = document.createElement('div');

      '<div class="modal-eyebrow">Correo masivo</div>' +

            '<option value="">— Sin plantilla —</option>' +
          '</select>' +
          '<button id="mcorreo-btn-plt" style="padding:9px 14px;border:1.5px solid var(--co-line);border-radius:var(--co-r-md);font-family:var(--co-font);font-size:12px;font-weight:700;color:var(--co-ink);background:var(--co-cream);cursor:pointer">Cargar</button>' +
        '</div>' +
      '</div>' +
      '<div class="form-grid">' +
        '<div class="form-group form-full"><label>Asunto</label><input type="text" id="mcorreo-asunto" value="Coproactiva — Administración profesional para {condominio}"></div>' +
        '<div class="form-group form-full"><label>Mensaje</label><textarea id="mcorreo-cuerpo" rows="8" style="width:100%;padding:11px 14px;border:1.5px solid var(--co-line);border-radius:var(--co-r-md);font-family:var(--co-font);font-size:13px;color:var(--co-ink);background:var(--co-surface);box-sizing:border-box;resize:vertical;min-height:160px">Estimado/a {nombre},\n\nMe dirijo a usted para presentar los servicios de Coproactiva Administración.\n\n¿Tendría disponibilidad para conversar esta semana?\n\nAtentamente,\nCoproactiva Administración</textarea></div>' +
      '</div>' +
      '<div style="background:var(--co-amber-soft);border-radius:var(--co-r-md);padding:10px 14px;font-size:12px;font-weight:600;color:var(--co-amber);margin-top:12px;display:flex;align-items:center;gap:8px">' +
        '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 5v4M8 11v1"/><circle cx="8" cy="8" r="6"/></svg>' +
        'Se enviará un correo individual a cada lead seleccionado.' +
      '</div>' +
      '<div class="form-error" id="mcorreo-error" style="display:none"></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px">' +
        '<button class="btn-guardar" id="btn-mcorreo-enviar" style="background:var(--co-ink)">Enviar ' + seleccionados.length + ' correo' + (seleccionados.length !== 1 ? 's' : '') + '</button>' +
        '<button class="btn-guardar" id="btn-mcorreo-borrador" style="background:var(--co-surface);color:var(--co-ink);border:1.5px solid var(--co-line)">Crear borradores</button>' +

    box.querySelector('#mc-mcorreo').addEventListener('click', cerrar);
    overlay.addEventListener('click', function(e) { if (e.target === overlay) cerrar(); });

    _cargarSelectorPlantillas(box.querySelector('#mcorreo-sel-plt'));
    box.querySelector('#mcorreo-btn-plt').addEventListener('click', function() {
      var id = box.querySelector('#mcorreo-sel-plt').value;
      if (!id) return;
      var plt = (_plantillasCache || []).find(function(x){ return x.id === id; });
      if (!plt) return;
      box.querySelector('#mcorreo-asunto').value = plt.asunto;
      box.querySelector('#mcorreo-cuerpo').value = plt.cuerpo;
    });

    async function _enviarMasivo(borrador) {
      var asunto = box.querySelector('#mcorreo-asunto').value.trim();
      var cuerpo = box.querySelector('#mcorreo-cuerpo').value.trim();
      var errDiv = box.querySelector('#mcorreo-error');
      var btn = borrador ? box.querySelector('#btn-mcorreo-borrador') : box.querySelector('#btn-mcorreo-enviar');
      if (!asunto || !cuerpo) { errDiv.textContent = 'Asunto y mensaje son obligatorios.'; errDiv.style.display = 'block'; return; }
      btn.disabled = true; btn.textContent = borrador ? 'Creando borradores…' : 'Enviando…'; errDiv.style.display = 'none';
      var errores = 0; var enviados = 0;
      for (var i = 0; i < seleccionados.length; i++) {
        var l = seleccionados[i];
        if (!l.email) { errores++; continue; }
        var asuntoFinal = _reemplazarVars(asunto, l);
        var cuerpoFinal = _reemplazarVars(cuerpo, l);
        await api('/leads', 'POST', { action: 'registrarCorreoLead', id: l.id, para: l.email, asunto: asuntoFinal });
        await api('/correo', 'POST', { action: borrador ? 'crearBorrador' : undefined, prospectoId: l.id, etapa: 'lead', para: l.email, asunto: asuntoFinal, cuerpo: cuerpoFinal });
        enviados++;
      }
      box.querySelector('#mcorreo-ok').textContent = '✓ ' + enviados + ' correo' + (enviados !== 1 ? 's' : '') + (borrador ? ' borrador' + (enviados !== 1 ? 'es' : '') : '') + ' creado' + (enviados !== 1 ? 's' : '') + (errores > 0 ? ' (' + errores + ' sin email)' : '');
      box.querySelector('#mcorreo-ok').style.display = 'block';
      btn.textContent = '✓ Listo';
      setTimeout(cerrar, 2000);
    }

    box.querySelector('#btn-mcorreo-enviar').addEventListener('click', function() { _enviarMasivo(false); });
    box.querySelector('#btn-mcorreo-borrador').addEventListener('click', function() { _enviarMasivo(true); });
  }

  // ── Archivar masivo ───────────────────────────────────────
  async function _archivarMasivo() {
    var seleccionados = _leadsSeleccionados();
    if (!seleccionados.length) return;
    if (!confirm('\u00BFArchivar ' + seleccionados.length + ' lead' + (seleccionados.length !== 1 ? 's' : '') + '?')) return;
    for (var i = 0; i < seleccionados.length; i++) {
      var l = seleccionados[i];
      await api('/leads', 'POST', { action: 'archivarLead', id: l.id });
      l.archivado = true; l.estado = 'descartado';
    }
    _leadSelIds = [];
