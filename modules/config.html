<!-- config.html — CoproActiva · Configuración -->
<!-- Versión: 1.1 · Junio 2026 -->

<div id="cfg-root"></div>

<script>
(function() {

  var CFG = {
    usuarios: [],
    comunidades: [],
    modoEdicion: false,
    idEditando: null,
    MODULOS: [
      { id: 'crm',            label: 'CRM' },
      { id: 'comunidades',    label: 'Comunidades' },
      { id: 'finanzas',       label: 'Finanzas' },
      { id: 'remuneraciones', label: 'Remuneraciones' },
      { id: 'mantenciones',   label: 'Mantenciones' },
      { id: 'incidencias',    label: 'Incidencias' },
      { id: 'comunicaciones', label: 'Comunicaciones' },
      { id: 'documentos',     label: 'Documentos' },
    ],
    ROLES: {
      superadmin:   'Superadmin',
      admin:        'Admin',
      operador:     'Operador',
      visualizador: 'Visualizador',
    }
  };

  // ── Helpers ───────────────────────────────────────────────────────────────
  function _getUsuario() {
    try { return JSON.parse(sessionStorage.getItem('usuario') || 'null'); } catch(e) { return null; }
  }

  function _esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function _parsear(val, def) {
    try { return JSON.parse(val); } catch(e) { return def; }
  }

  function _formatFecha(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d)) return '—';
    return d.toLocaleDateString('es-CL', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function _rolPill(rol) {
    var map = {
      superadmin:   { cls: 'pill-warn',  label: 'Superadmin' },
      admin:        { cls: 'pill-blue',  label: 'Admin' },
      operador:     { cls: 'pill-pend',  label: 'Operador' },
      visualizador: { cls: 'pill-pend',  label: 'Visualizador' },
    };
    var r = map[rol] || { cls: 'pill-pend', label: rol };
    return '<span class="co-pill ' + r.cls + '">' + r.label + '</span>';
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  function init() {
    var root = document.getElementById('cfg-root');
    var usuario = _getUsuario();

    // Page header
    var pageHdr = document.createElement('div');
    pageHdr.className = 'page-header';

    var left = document.createElement('div');
    var ey = document.createElement('div');
    ey.className = 'page-eyebrow';
    ey.textContent = 'Empresa · Configuración';
    var tt = document.createElement('h1');
    tt.className = 'page-title';
    tt.innerHTML = 'Configuración del <em>sistema</em>';
    var sb = document.createElement('p');
    sb.className = 'page-sub';
    sb.textContent = 'Gestiona usuarios, roles y accesos de la plataforma.';
    left.appendChild(ey); left.appendChild(tt); left.appendChild(sb);
    pageHdr.appendChild(left);

    if (usuario && usuario.rol === 'superadmin') {
      var btnNuevo = document.createElement('button');
      btnNuevo.className = 'btn-nuevo';
      btnNuevo.innerHTML = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg> Nuevo usuario';
      btnNuevo.addEventListener('click', cfgAbrirModal);
      pageHdr.appendChild(btnNuevo);
    }

    root.appendChild(pageHdr);

    // Tabs
    var tabsDiv = document.createElement('div');
    tabsDiv.className = 'com-tabs';
    var tabBtn = document.createElement('button');
    tabBtn.className = 'com-tab act';
    tabBtn.textContent = 'Usuarios';
    tabBtn.setAttribute('data-cfg-tab', 'usuarios');
    tabBtn.addEventListener('click', function() { cfgCambiarTab('usuarios'); });
    tabsDiv.appendChild(tabBtn);
    root.appendChild(tabsDiv);

    // Panel usuarios
    var panel = document.createElement('div');
    panel.id = 'cfg-tab-usuarios';
    panel.className = 'com-tab-content act';
    root.appendChild(panel);

    if (!usuario || usuario.rol !== 'superadmin') {
      var aviso = document.createElement('div');
      aviso.className = 'com-error';
      aviso.style.margin = '20px 0';
      aviso.textContent = 'Solo el superadministrador puede gestionar usuarios.';
      panel.appendChild(aviso);
      return;
    }

    // Loading
    var loading = document.createElement('div');
    loading.id = 'cfg-loading';
    loading.className = 'module-loading';
    loading.innerHTML = '<div class="ml-iso-wrap"><div class="ml-iso" aria-hidden="true"></div></div>' +
      '<div class="ml-text"><div class="ml-brand"><b>co</b>proactiva</div>' +
      '<div class="ml-status"><span class="ml-status-dot"></span>Cargando usuarios</div></div>';
    panel.appendChild(loading);

    // Tabla wrap
    var tableWrap = document.createElement('div');
    tableWrap.id = 'cfg-table-wrap';
    tableWrap.className = 'com-dir-wrap';
    tableWrap.style.display = 'none';

    var tabla = document.createElement('table');
    tabla.className = 'com-dir-table';

    var thead = document.createElement('thead');
    var trh = document.createElement('tr');
    ['Usuario', 'Rol', 'Módulos', 'Comunidades', 'Último acceso', 'Estado', ''].forEach(function(h) {
      var th = document.createElement('th');
      th.textContent = h;
      if (h === '') th.style.textAlign = 'right';
      trh.appendChild(th);
    });
    thead.appendChild(trh);
    tabla.appendChild(thead);

    var tbody = document.createElement('tbody');
    tbody.id = 'cfg-tbody';
    tabla.appendChild(tbody);
    tableWrap.appendChild(tabla);
    panel.appendChild(tableWrap);

    // Vacío
    var empty = document.createElement('div');
    empty.id = 'cfg-empty';
    empty.className = 'com-vacio';
    empty.style.display = 'none';
    empty.textContent = 'No hay usuarios registrados. Crea el primero.';
    panel.appendChild(empty);

    cargarComunidades();
    cargarUsuarios();
  }

  // ── Tabs ──────────────────────────────────────────────────────────────────
  window.cfgCambiarTab = function(tab) {
    document.querySelectorAll('[data-cfg-tab]').forEach(function(btn) {
      btn.classList.toggle('act', btn.getAttribute('data-cfg-tab') === tab);
    });
    document.querySelectorAll('.cfg-tab-content').forEach(function(el) {
      el.classList.toggle('act', el.id === 'cfg-tab-' + tab);
    });
  };

  // ── Cargar comunidades ────────────────────────────────────────────────────
  function cargarComunidades() {
    apiCall('/comunidades', 'GET').then(function(resp) {
      var lista = (resp.data && Array.isArray(resp.data.data))
        ? resp.data.data
        : (Array.isArray(resp.data) ? resp.data : []);
      CFG.comunidades = lista.filter(function(c) { return c.estado === 'activo'; });
    }).catch(function() { CFG.comunidades = []; });
  }

  // ── Cargar usuarios ───────────────────────────────────────────────────────
  function cargarUsuarios() {
    var loading = document.getElementById('cfg-loading');
    var tableWrap = document.getElementById('cfg-table-wrap');
    var empty = document.getElementById('cfg-empty');
    if (loading) loading.style.display = 'flex';
    if (tableWrap) tableWrap.style.display = 'none';
    if (empty) empty.style.display = 'none';

    apiCall('/usuarios', 'GET')
      .then(function(resp) {
        if (loading) loading.style.display = 'none';
        var lista = (resp.data && Array.isArray(resp.data.data))
          ? resp.data.data
          : (Array.isArray(resp.data) ? resp.data : []);
        CFG.usuarios = lista;
        if (!lista.length) {
          if (empty) empty.style.display = 'block';
          return;
        }
        if (tableWrap) tableWrap.style.display = 'block';
        _renderTabla(lista);
      })
      .catch(function(e) {
        if (loading) loading.innerHTML = '<div class="com-error">Error al cargar usuarios: ' + _esc(e.message) + '</div>';
      });
  }

  // ── Render tabla ──────────────────────────────────────────────────────────
  function _renderTabla(lista) {
    var tbody = document.getElementById('cfg-tbody');
    if (!tbody) return;
    var usuarioActual = _getUsuario();
    tbody.innerHTML = '';

    lista.forEach(function(u) {
      var modulos = _parsear(u.modulos, ['*']);
      var comunidades = _parsear(u.comunidades, ['*']);
      if (!Array.isArray(modulos)) modulos = ['*'];
      if (!Array.isArray(comunidades)) comunidades = ['*'];
      var modLabel = modulos.includes('*') ? 'Todos' : (modulos.length ? modulos.length + ' módulo' + (modulos.length > 1 ? 's' : '') : 'Ninguno');
      var comLabel = comunidades.includes('*') ? 'Todas' : (comunidades.length ? comunidades.length + ' asignada' + (comunidades.length > 1 ? 's' : '') : 'Ninguna');
      var activo = String(u.activo) === 'true' || u.activo === true;
      var esYo = usuarioActual && usuarioActual.id === u.id;

      var tr = document.createElement('tr');

      // Usuario
      var tdUser = document.createElement('td');
      var nm = document.createElement('div');
      nm.style.fontWeight = '700';
      nm.style.fontSize = '13px';
      nm.textContent = u.nombre;
      if (esYo) {
        var yo = document.createElement('span');
        yo.style.cssText = 'font-size:10px;color:var(--co-orange);font-weight:700;margin-left:6px';
        yo.textContent = '(tú)';
        nm.appendChild(yo);
      }
      var em = document.createElement('div');
      em.style.cssText = 'font-size:11px;color:var(--co-mute);margin-top:2px';
      em.textContent = u.email;
      tdUser.appendChild(nm); tdUser.appendChild(em);

      // Rol
      var tdRol = document.createElement('td');
      tdRol.innerHTML = _rolPill(u.rol);

      // Módulos
      var tdMod = document.createElement('td');
      tdMod.style.cssText = 'font-size:12px;color:var(--co-mute)';
      tdMod.textContent = modLabel;

      // Comunidades
      var tdCom = document.createElement('td');
      tdCom.style.cssText = 'font-size:12px;color:var(--co-mute)';
      tdCom.textContent = comLabel;

      // Último acceso
      var tdAcc = document.createElement('td');
      tdAcc.style.cssText = 'font-size:12px;color:var(--co-mute)';
      tdAcc.textContent = _formatFecha(u.ultimoAcceso);

      // Estado
      var tdEst = document.createElement('td');
      var pill = document.createElement('span');
      pill.className = 'co-pill ' + (activo ? 'pill-ok' : 'pill-pend');
      pill.textContent = activo ? 'Activo' : 'Inactivo';
      tdEst.appendChild(pill);

      // Acciones
      var tdAct = document.createElement('td');
      tdAct.style.textAlign = 'right';
      tdAct.style.whiteSpace = 'nowrap';

      var btnEdit = document.createElement('button');
      btnEdit.className = 'btn-ghost';
      btnEdit.style.cssText = 'padding:5px 12px;font-size:12px;margin-right:6px';
      btnEdit.textContent = 'Editar';
      btnEdit.addEventListener('click', function() { cfgEditar(u.id); });
      tdAct.appendChild(btnEdit);

      if (!esYo) {
        var btnToggle = document.createElement('button');
        btnToggle.className = 'btn-ghost';
        btnToggle.style.cssText = 'padding:5px 12px;font-size:12px;color:' + (activo ? 'var(--co-red)' : 'var(--co-green)') + ';border-color:' + (activo ? 'var(--co-red)' : 'var(--co-green)');
        btnToggle.textContent = activo ? 'Desactivar' : 'Reactivar';
        btnToggle.addEventListener('click', function() {
          activo ? cfgDesactivar(u.id) : cfgReactivar(u.id);
        });
        tdAct.appendChild(btnToggle);
      }

      tr.appendChild(tdUser); tr.appendChild(tdRol); tr.appendChild(tdMod);
      tr.appendChild(tdCom); tr.appendChild(tdAcc); tr.appendChild(tdEst);
      tr.appendChild(tdAct);
      tbody.appendChild(tr);
    });
  }

  // ── Modal ─────────────────────────────────────────────────────────────────
  function _crearModal() {
    if (document.getElementById('cfg-modal-overlay')) return;

    var overlay = document.createElement('div');
    overlay.id = 'cfg-modal-overlay';
    overlay.className = 'modal-overlay';
    overlay.style.display = 'none';
    overlay.addEventListener('click', function(e) { if (e.target === overlay) cfgCerrarModal(); });

    var box = document.createElement('div');
    box.className = 'modal-box';
    box.style.maxWidth = '560px';

    var btnX = document.createElement('button');
    btnX.className = 'modal-close';
    btnX.textContent = '×';
    btnX.addEventListener('click', cfgCerrarModal);

    var ey = document.createElement('div');
    ey.className = 'modal-eyebrow';
    ey.textContent = 'Configuración · Usuarios';

    var titulo = document.createElement('div');
    titulo.id = 'cfg-modal-titulo';
    titulo.className = 'modal-titulo';

    var errDiv = document.createElement('div');
    errDiv.id = 'cfg-modal-error';
    errDiv.className = 'form-error';
    errDiv.style.display = 'none';

    // Grid campos base
    var grid = document.createElement('div');
    grid.className = 'form-grid';

    function campo(id, label, tipo, fullWidth, hint) {
      var fg = document.createElement('div');
      fg.className = 'form-group' + (fullWidth ? ' form-full' : '');
      var lbl = document.createElement('label');
      lbl.textContent = label;
      var inp = tipo === 'select' ? document.createElement('select') : document.createElement('input');
      if (tipo !== 'select') inp.type = tipo;
      inp.id = id;
      if (hint) {
        var h = document.createElement('div');
        h.id = id + '-hint';
        h.style.cssText = 'font-size:11px;color:var(--co-mute);margin-top:4px';
        fg.appendChild(lbl); fg.appendChild(inp); fg.appendChild(h);
      } else {
        fg.appendChild(lbl); fg.appendChild(inp);
      }
      if (tipo === 'select') {
        [
          ['admin',        'Admin — acceso total excepto usuarios'],
          ['operador',     'Operador — módulos asignados, lectura y escritura'],
          ['visualizador', 'Visualizador — módulos asignados, solo lectura'],
          ['superadmin',   'Superadmin — acceso total + gestión de usuarios'],
        ].forEach(function(o) {
          var opt = document.createElement('option');
          opt.value = o[0]; opt.textContent = o[1];
          inp.appendChild(opt);
        });
      }
      return fg;
    }

    grid.appendChild(campo('cfg-f-nombre', 'Nombre completo', 'text', true));
    grid.appendChild(campo('cfg-f-email',  'Correo electrónico', 'email', false));
    grid.appendChild(campo('cfg-f-clave',  'Clave', 'password', false, true));
    grid.appendChild(campo('cfg-f-rol',    'Rol', 'select', false));

    // Módulos
    var sepMod = document.createElement('hr');
    sepMod.style.cssText = 'border:none;border-top:1px solid var(--co-line);margin:18px 0 14px';
    var lblMod = document.createElement('div');
    lblMod.style.cssText = 'font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--co-mute);margin-bottom:10px';
    lblMod.textContent = 'Módulos permitidos';
    var modGrid = document.createElement('div');
    modGrid.id = 'cfg-f-modulos';
    modGrid.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px';
    CFG.MODULOS.forEach(function(m) {
      var lbl = document.createElement('label');
      lbl.style.cssText = 'display:flex;align-items:center;gap:6px;cursor:pointer;background:var(--co-cream-deep);border:1.5px solid var(--co-line);border-radius:7px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--co-ink);user-select:none;font-family:var(--co-font)';
      var cb = document.createElement('input');
      cb.type = 'checkbox'; cb.id = 'cfg-mod-' + m.id; cb.value = m.id;
      cb.style.cssText = 'accent-color:var(--co-orange);width:13px;height:13px';
      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode(m.label));
      modGrid.appendChild(lbl);
    });
    var modBtns = document.createElement('div');
    modBtns.style.cssText = 'display:flex;gap:8px;margin-top:6px';
    var btnModTodos = document.createElement('button');
    btnModTodos.type = 'button';
    btnModTodos.className = 'com-panel-ver';
    btnModTodos.textContent = 'Seleccionar todos';
    btnModTodos.addEventListener('click', function() { cfgSelTodos('modulos', true); });
    var sepModBtns = document.createElement('span');
    sepModBtns.style.color = 'var(--co-line)';
    sepModBtns.textContent = '·';
    var btnModNinguno = document.createElement('button');
    btnModNinguno.type = 'button';
    btnModNinguno.className = 'com-panel-ver';
    btnModNinguno.style.color = 'var(--co-mute)';
    btnModNinguno.textContent = 'Ninguno';
    btnModNinguno.addEventListener('click', function() { cfgSelTodos('modulos', false); });
    modBtns.appendChild(btnModTodos); modBtns.appendChild(sepModBtns); modBtns.appendChild(btnModNinguno);

    // Comunidades
    var sepCom = document.createElement('hr');
    sepCom.style.cssText = 'border:none;border-top:1px solid var(--co-line);margin:18px 0 14px';
    var lblCom = document.createElement('div');
    lblCom.style.cssText = 'font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--co-mute);margin-bottom:10px';
    lblCom.textContent = 'Comunidades permitidas';
    var comGrid = document.createElement('div');
    comGrid.id = 'cfg-f-comunidades';
    comGrid.style.cssText = 'display:flex;flex-wrap:wrap;gap:7px';
    var comBtns = document.createElement('div');
    comBtns.style.cssText = 'display:flex;gap:8px;margin-top:6px';
    var btnComTodas = document.createElement('button');
    btnComTodas.type = 'button';
    btnComTodas.className = 'com-panel-ver';
    btnComTodas.textContent = 'Todas';
    btnComTodas.addEventListener('click', function() { cfgSelTodos('comunidades', true); });
    var sepComBtns = document.createElement('span');
    sepComBtns.style.color = 'var(--co-line)';
    sepComBtns.textContent = '·';
    var btnComNinguna = document.createElement('button');
    btnComNinguna.type = 'button';
    btnComNinguna.className = 'com-panel-ver';
    btnComNinguna.style.color = 'var(--co-mute)';
    btnComNinguna.textContent = 'Ninguna';
    btnComNinguna.addEventListener('click', function() { cfgSelTodos('comunidades', false); });
    comBtns.appendChild(btnComTodas); comBtns.appendChild(sepComBtns); comBtns.appendChild(btnComNinguna);

    var btnGuardar = document.createElement('button');
    btnGuardar.id = 'cfg-modal-btn-guardar';
    btnGuardar.className = 'btn-guardar';
    btnGuardar.textContent = 'Guardar';
    btnGuardar.addEventListener('click', cfgGuardar);

    box.appendChild(btnX); box.appendChild(ey); box.appendChild(titulo);
    box.appendChild(errDiv); box.appendChild(grid);
    box.appendChild(sepMod); box.appendChild(lblMod); box.appendChild(modGrid); box.appendChild(modBtns);
    box.appendChild(sepCom); box.appendChild(lblCom); box.appendChild(comGrid); box.appendChild(comBtns);
    box.appendChild(btnGuardar);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
  }

  function _renderCheckboxesComunidades(seleccionadas) {
    var cont = document.getElementById('cfg-f-comunidades');
    if (!cont) return;
    cont.innerHTML = '';
    var todasActivas = Array.isArray(seleccionadas) && seleccionadas.includes('*');
    if (!CFG.comunidades.length) {
      var msg = document.createElement('div');
      msg.style.cssText = 'font-size:12px;color:var(--co-mute)';
      msg.textContent = 'No hay comunidades activas registradas.';
      cont.appendChild(msg);
      return;
    }
    CFG.comunidades.forEach(function(c) {
      var lbl = document.createElement('label');
      lbl.style.cssText = 'display:flex;align-items:center;gap:6px;cursor:pointer;background:var(--co-cream-deep);border:1.5px solid var(--co-line);border-radius:7px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--co-ink);user-select:none;font-family:var(--co-font)';
      var cb = document.createElement('input');
      cb.type = 'checkbox'; cb.id = 'cfg-com-' + c.id; cb.value = c.id;
      cb.checked = todasActivas || (Array.isArray(seleccionadas) && seleccionadas.includes(c.id));
      cb.style.cssText = 'accent-color:var(--co-orange);width:13px;height:13px';
      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode(c.nombre));
      cont.appendChild(lbl);
    });
  }

  window.cfgSelTodos = function(tipo, val) {
    if (tipo === 'modulos') {
      CFG.MODULOS.forEach(function(m) {
        var cb = document.getElementById('cfg-mod-' + m.id);
        if (cb) cb.checked = val;
      });
    } else {
      CFG.comunidades.forEach(function(c) {
        var cb = document.getElementById('cfg-com-' + c.id);
        if (cb) cb.checked = val;
      });
    }
  };

  window.cfgAbrirModal = function() {
    _crearModal();
    CFG.modoEdicion = false;
    CFG.idEditando  = null;
    document.getElementById('cfg-modal-titulo').textContent = 'Nuevo usuario';
    document.getElementById('cfg-f-nombre').value = '';
    document.getElementById('cfg-f-email').value  = '';
    document.getElementById('cfg-f-clave').value  = '';
    document.getElementById('cfg-f-clave').placeholder = 'Mínimo 6 caracteres';
    document.getElementById('cfg-f-clave-hint').textContent = '';
    document.getElementById('cfg-f-rol').value = 'admin';
    document.getElementById('cfg-modal-error').style.display = 'none';
    cfgSelTodos('modulos', true);
    _renderCheckboxesComunidades(['*']);
    document.getElementById('cfg-modal-overlay').style.display = 'flex';
  };

  window.cfgCerrarModal = function() {
    var overlay = document.getElementById('cfg-modal-overlay');
    if (overlay) overlay.style.display = 'none';
  };

  window.cfgEditar = function(id) {
    var u = CFG.usuarios.find(function(x) { return x.id === id; });
    if (!u) return;
    _crearModal();
    CFG.modoEdicion = true;
    CFG.idEditando  = id;
    document.getElementById('cfg-modal-titulo').textContent = 'Editar usuario';
    document.getElementById('cfg-f-nombre').value = u.nombre || '';
    document.getElementById('cfg-f-email').value  = u.email  || '';
    document.getElementById('cfg-f-clave').value  = '';
    document.getElementById('cfg-f-clave').placeholder = 'Dejar en blanco para no cambiar';
    document.getElementById('cfg-f-clave-hint').textContent = 'Solo completa si quieres cambiar la clave.';
    document.getElementById('cfg-f-rol').value = u.rol || 'admin';
    document.getElementById('cfg-modal-error').style.display = 'none';

    var modulos = _parsear(u.modulos, ['*']);
    if (!Array.isArray(modulos)) modulos = ['*'];
    CFG.MODULOS.forEach(function(m) {
      var cb = document.getElementById('cfg-mod-' + m.id);
      if (cb) cb.checked = modulos.includes('*') || modulos.includes(m.id);
    });

    var comunidades = _parsear(u.comunidades, ['*']);
    if (!Array.isArray(comunidades)) comunidades = ['*'];
    _renderCheckboxesComunidades(comunidades);

    document.getElementById('cfg-modal-overlay').style.display = 'flex';
  };

  window.cfgGuardar = function() {
    var nombre = document.getElementById('cfg-f-nombre').value.trim();
    var email  = document.getElementById('cfg-f-email').value.trim();
    var clave  = document.getElementById('cfg-f-clave').value.trim();
    var rol    = document.getElementById('cfg-f-rol').value;
    var errEl  = document.getElementById('cfg-modal-error');
    errEl.style.display = 'none';

    if (!nombre) { _err('El nombre es obligatorio'); return; }
    if (!email)  { _err('El email es obligatorio');  return; }
    if (!CFG.modoEdicion && !clave) { _err('La clave es obligatoria para nuevos usuarios'); return; }
    if (clave && clave.length < 6)  { _err('La clave debe tener al menos 6 caracteres'); return; }

    var modSel = CFG.MODULOS
      .filter(function(m) { var cb = document.getElementById('cfg-mod-' + m.id); return cb && cb.checked; })
      .map(function(m) { return m.id; });
    var modulos = modSel.length === CFG.MODULOS.length ? ['*'] : modSel;

    var comSel = CFG.comunidades
      .filter(function(c) { var cb = document.getElementById('cfg-com-' + c.id); return cb && cb.checked; })
      .map(function(c) { return c.id; });
    var comunidades = comSel.length === CFG.comunidades.length ? ['*'] : comSel;

    var btn = document.getElementById('cfg-modal-btn-guardar');
    btn.disabled = true; btn.textContent = 'Guardando…';

    var payload = CFG.modoEdicion
      ? { action: 'editarUsuario', id: CFG.idEditando, nombre: nombre, email: email, rol: rol, modulos: modulos, comunidades: comunidades }
      : { action: 'crearUsuario',  nombre: nombre, email: email, clave: clave, rol: rol, modulos: modulos, comunidades: comunidades };
    if (CFG.modoEdicion && clave) payload.clave = clave;

    apiCall('/usuarios', 'POST', payload)
      .then(function(resp) {
        var ok = resp.ok || (resp.data && resp.data.ok);
        if (!ok) { _err(resp.error || (resp.data && resp.data.error) || 'Error al guardar'); return; }
        btn.textContent = '✓ Guardado';
        btn.style.background = 'var(--co-green)';
        setTimeout(function() {
          cfgCerrarModal();
          btn.style.background = '';
          cargarUsuarios();
        }, 700);
      })
      .catch(function(e) { _err('Error de conexión: ' + e.message); })
      .finally(function() { btn.disabled = false; if (btn.textContent !== '✓ Guardado') btn.textContent = 'Guardar'; });
  };

  window.cfgDesactivar = function(id) {
    var u = CFG.usuarios.find(function(x) { return x.id === id; });
    if (!u || !confirm('¿Desactivar a ' + u.nombre + '? Podrás reactivarlo después.')) return;
    apiCall('/usuarios', 'POST', { action: 'desactivarUsuario', id: id })
      .then(function() { cargarUsuarios(); })
      .catch(function(e) { alert('Error: ' + e.message); });
  };

  window.cfgReactivar = function(id) {
    var u = CFG.usuarios.find(function(x) { return x.id === id; });
    if (!u || !confirm('¿Reactivar a ' + u.nombre + '?')) return;
    apiCall('/usuarios', 'POST', { action: 'reactivarUsuario', id: id })
      .then(function() { cargarUsuarios(); })
      .catch(function(e) { alert('Error: ' + e.message); });
  };

  function _err(msg) {
    var el = document.getElementById('cfg-modal-error');
    if (!el) return;
    el.textContent = msg;
    el.style.display = 'block';
  }

  init();

})();
</script>
