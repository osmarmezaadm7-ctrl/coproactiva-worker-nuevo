<!-- modules/diagnostico.html — CoproActiva Diagnóstico -->
<!-- Versión: 3.4 · Mayo 2026 — wrapper iframe + loading rediseñado -->
<style>
  .diag-iframe-container {
    width: 100%;
    height: calc(100vh - 180px);
    position: relative;
  }
  #diagnosticoIframe {
    width: 100%;
    height: 100%;
    min-height: 600px;
    border: none;
    display: block;
    background: var(--co-cream, #FBF7F0);
  }
  .diag-loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--co-cream, #FBF7F0);
    font-family: var(--co-font, 'Manrope'), -apple-system, sans-serif;
    font-size: 13px;
    color: var(--co-mute, #9C958A);
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .diag-loading-spin {
    width: 28px;
    height: 28px;
    border: 2.5px solid var(--co-line, #ECE5DA);
    border-top-color: var(--co-orange, #D9853B);
    border-radius: 50%;
    animation: diagSpin 0.7s linear infinite;
  }
  @keyframes diagSpin { to { transform: rotate(360deg); } }
</style>
<div class="diag-iframe-container">
  <div class="diag-loading" id="diagLoading">
    <div class="diag-loading-spin"></div>
    <div>Cargando herramienta de diagnóstico…</div>
  </div>
  <iframe
    id="diagnosticoIframe"
    title="Herramienta de Diagnóstico CoproActiva"
    style="opacity:0;transition:opacity 0.3s">
  </iframe>
</div>
<script>
(function() {
  const iframe  = document.getElementById('diagnosticoIframe');
  const loading = document.getElementById('diagLoading');
  const ACCESS_KEY = 'copro2025';

  function cargarIframe() {
    const src = 'diagnostico_standalone.html?token=' + encodeURIComponent(ACCESS_KEY) + '&t=' + Date.now();
    iframe.src = src;
    loading.style.display = 'flex';
    iframe.style.opacity = '0';
  }

  cargarIframe();

  iframe.addEventListener('load', function() {
    loading.style.display = 'none';
    iframe.style.opacity  = '1';
  });

  window.addEventListener('message', function(event) {
    const data = event.data;
    if (!data || !data.type) return;
    if (data.type === 'recargar_diagnostico') {
      cargarIframe();
    }
  });

  // Exponer para que el botón "Nuevo diagnóstico" del CRM lo llame
  window._diagNuevo = function() {
    if (iframe && iframe.contentWindow) {
      iframe.contentWindow.postMessage({ type: 'nuevo_diagnostico' }, '*');
    }
  };
})();
</script>
