<style>
:root {
  --na: #d18549; --na-lt: #fdeee0; --na-dk: #a8622e;
  --az: #304660; --az-md: #516576; --az-lt: #e8edf2;
  --vd: #6fa885; --vd-lt: #eaf4ee; --vd-dk: #1d5c38; --vd-md: #c2e0cc;
  --surf: #f2f0ed; --border: #e8e4de; --muted: #8a9ba8;
  --bg: #fafaf9; --text: #1a2a38;
  --sg-fg:#1d5c38; --sg-bg:#eaf4ee; --sg-ac:#6fa885;
  --sa-fg:#7a3e10; --sa-bg:#fdeee0; --sa-ac:#d18549;
  --sr-fg:#7a1515; --sr-bg:#fde8e8; --sr-ac:#b83232;
  --r:8px; --r-lg:12px; --r-xl:16px;
  --shadow: 0 1px 4px rgba(0,0,0,0.07);
  --shadow-md: 0 2px 10px rgba(0,0,0,0.09);
}

/* ── Reset solo dentro del módulo ── */
#diag-root * { box-sizing: border-box; }
#diag-root { font-family: Arial, Helvetica, sans-serif; color: var(--text); font-size: 15px; line-height: 1.5; }

/* ── Layout interno ── */
.diag-app { display: flex; flex-direction: column; min-height: 60vh; }

/* Topbar interna móvil */
.diag-topbar { background: var(--az); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-radius: var(--r-lg) var(--r-lg) 0 0; margin-bottom: 0; }
.dtb-logo { display: flex; align-items: center; gap: 8px; }
.dtb-mark { width: 26px; height: 26px; background: var(--na); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: white; }
.dtb-brand { font-size: 13px; color: white; }
.dtb-brand b { color: var(--na); }
.dtb-score { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 20px; background: rgba(255,255,255,0.1); color: white; display: none; }

/* Progress */
.diag-progress { height: 3px; background: rgba(48,70,96,0.15); }
.diag-prog-fill { height: 100%; background: var(--na); transition: width 0.4s; }

/* Step indicator */
.diag-step-ind { padding: 10px 16px; background: white; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.dsi-info { display: flex; align-items: center; gap: 8px; }
.dsi-num { width: 22px; height: 22px; border-radius: 50%; background: var(--na); color: white; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.dsi-name { font-size: 13px; font-weight: 700; color: var(--az); }
.dsi-of { font-size: 12px; color: var(--muted); }

/* Scroll area */
.diag-scroll { flex: 1; padding: 16px; }

@media (min-width: 768px) {
  .diag-topbar { display: none; }
  .diag-progress { display: none; }
  .diag-step-ind { display: none; }
  .diag-scroll { padding: 20px 0; }
  #diagMainContent { max-width: 680px; }
}

/* ── Componentes ── */
.ph { margin-bottom: 18px; }
.ph-title { font-size: 19px; font-weight: 700; color: var(--az); margin-bottom: 3px; }
.ph-sub { font-size: 13px; color: var(--az-md); }

.card { background: white; border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px; margin-bottom: 10px; box-shadow: var(--shadow); }
.card-ttl { font-size: 14px; font-weight: 700; color: var(--az); margin-bottom: 14px; display: flex; align-items: center; gap: 7px; }
.cdot { width: 7px; height: 7px; border-radius: 50%; background: var(--na); flex-shrink: 0; }

/* Formulario */
.fg { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media(min-width:480px){ .fg { grid-template-columns: 1fr 1fr; } }
.f { display: flex; flex-direction: column; gap: 5px; }
.f.full { grid-column: 1/-1; }
label.fl { font-size: 11.5px; color: var(--az-md); font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
#diag-root input, #diag-root select, #diag-root textarea {
  font-family: Arial, sans-serif; font-size: 14px; color: var(--text);
  border: 1.5px solid var(--border); border-radius: var(--r); padding: 10px 12px;
  background: var(--bg); width: 100%; transition: border-color 0.13s;
  -webkit-appearance: none; appearance: none;
}
#diag-root input:focus, #diag-root select:focus, #diag-root textarea:focus {
  outline: none; border-color: var(--na); background: white;
}
#diag-root textarea { resize: vertical; min-height: 56px; }
.hint { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* Tipo condominio */
.type-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
@media(min-width:400px){ .type-grid { grid-template-columns: repeat(3,1fr); } }
.type-card { border: 1.5px solid var(--border); border-radius: var(--r); padding: 12px; cursor: pointer; background: var(--bg); text-align: center; transition: all 0.13s; }
.type-card:hover { border-color: var(--na); background: var(--na-lt); }
.type-card.sel { border-color: var(--na); background: var(--na-lt); }
.type-card-icon { font-size: 22px; margin-bottom: 5px; }
.type-card-name { font-size: 13px; font-weight: 700; color: var(--az); }
.type-card-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* Saved bar */
.saved-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }

/* Checklist */
.items { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.irow { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: var(--r); background: var(--surf); cursor: pointer; border: 1.5px solid transparent; user-select: none; transition: background 0.12s; -webkit-tap-highlight-color: transparent; }
.irow.on { background: var(--vd-lt); border-color: var(--vd-md); }
.irow.na { opacity: 0.3; cursor: default; pointer-events: none; }
.chk { width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--border); flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; background: white; transition: all 0.13s; }
.irow.on .chk { background: var(--vd); border-color: var(--vd); }
.ckm { display: none; width: 5px; height: 9px; border: 2px solid white; border-top: none; border-left: none; transform: rotate(45deg) translate(-1px,-1px); }
.irow.on .ckm { display: block; }
.itxt { flex: 1; font-size: 13.5px; color: var(--text); line-height: 1.45; }
.wp { font-size: 10px; padding: 2px 7px; border-radius: 10px; flex-shrink: 0; margin-top: 3px; font-weight: 700; white-space: nowrap; }
.wc { background: var(--sr-bg); color: var(--sr-fg); }
.wi { background: var(--sa-bg); color: var(--sa-fg); }
.wb { background: var(--sg-bg); color: var(--sg-fg); }
.nap { font-size: 10px; padding: 2px 7px; border-radius: 10px; background: var(--surf); color: var(--muted); white-space: nowrap; }
.obs-lbl { font-size: 11.5px; color: var(--az-md); font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; display: block; margin-bottom: 5px; }
.area-bar-row { display: flex; align-items: center; gap: 9px; padding: 10px 0; border-top: 1px solid var(--border); margin-top: 10px; flex-wrap: wrap; }
.bar-lbl { font-size: 12px; color: var(--muted); }
.bar-track { flex: 1; min-width: 80px; height: 5px; background: var(--surf); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
.bar-pct { font-size: 13px; font-weight: 700; min-width: 36px; text-align: right; }
.bar-badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 10px; }

/* Botones */
.nav-row { display: flex; gap: 9px; justify-content: space-between; margin-top: 6px; flex-wrap: wrap; }
.nav-row-end { justify-content: flex-end; }
#diag-root button { font-family: Arial, sans-serif; font-size: 13.5px; font-weight: 700; cursor: pointer; border-radius: var(--r); padding: 10px 18px; border: 1.5px solid var(--border); background: transparent; color: var(--text); transition: all 0.13s; -webkit-tap-highlight-color: transparent; }
#diag-root button.pri { background: var(--na); color: white; border-color: var(--na); }
#diag-root button.vd { background: var(--vd); color: white; border-color: var(--vd); }
#diag-root button.ghost { color: var(--az-md); border-color: var(--border); }
#diag-root button:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-sm { padding: 7px 13px; font-size: 12px; }
.btn-danger { color: var(--sr-ac); border-color: var(--sr-bg); background: var(--sr-bg); }

/* Resultado */
.res-crit { border-radius: var(--r-lg); padding: 14px 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 14px; border: 1.5px solid; }
.res-circle { width: 54px; height: 54px; border-radius: 50%; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
.res-num { font-size: 19px; font-weight: 700; line-height: 1; }
.res-pct { font-size: 9px; color: var(--muted); }
.res-label { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.res-desc { font-size: 12px; opacity: 0.82; line-height: 1.5; }
.ag { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-bottom: 12px; }
.ac { background: white; border: 1px solid var(--border); border-radius: var(--r); padding: 10px 11px; cursor: pointer; transition: box-shadow 0.13s; }
.ac:hover { box-shadow: var(--shadow-md); }
.ac-name { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: var(--az-md); margin-bottom: 2px; }
.ac-pct { font-size: 20px; font-weight: 700; line-height: 1; margin-bottom: 2px; }
.ac-bar { height: 3px; background: var(--surf); border-radius: 2px; margin-bottom: 3px; overflow: hidden; }
.ac-fill { height: 100%; border-radius: 2px; }
.ac-lbl { font-size: 10px; font-weight: 700; }
.ci-list { display: flex; flex-direction: column; gap: 4px; }
.ci { display: flex; align-items: flex-start; gap: 9px; padding: 8px 10px; background: var(--sr-bg); border-radius: 6px; border-left: 2.5px solid var(--sr-ac); }
.ci-area { font-size: 10px; font-weight: 700; color: var(--az-md); white-space: nowrap; padding-top: 1px; min-width: 55px; }
.ci-txt { font-size: 12.5px; line-height: 1.4; }
.fac-card { padding: 10px 12px; background: var(--surf); border-radius: 6px; border-left: 2.5px solid var(--na); margin-bottom: 5px; position: relative; }
.fac-ttl { font-size: 13px; font-weight: 700; color: var(--az); margin-bottom: 2px; }
.fac-body { font-size: 12px; color: var(--az-md); line-height: 1.5; }
.fac-edit { margin-top: 6px; }
.fac-edit input { font-size: 12px !important; padding: 6px 9px !important; margin-bottom: 4px; }
.fac-edit textarea { font-size: 12px !important; padding: 6px 9px !important; min-height: 40px !important; }
.spin { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--na); border-radius: 50%; animation: dSpin 0.7s linear infinite; flex-shrink: 0; }
@keyframes dSpin { to { transform: rotate(360deg); } }
.load-row { display: flex; align-items: center; gap: 9px; padding: 12px 0; font-size: 12.5px; color: var(--muted); }
.val-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.val-row span { font-size: 13px; color: var(--muted); }
.val-in { font-size: 14px !important; font-weight: 700 !important; color: var(--vd-dk) !important; text-align: right; width: 110px !important; border-color: var(--vd-md) !important; }
.linea-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 4px; }
@media(min-width:480px){ .linea-grid { grid-template-columns: repeat(3,1fr); } }
.linea-card { border: 1.5px solid var(--border); border-radius: var(--r); padding: 11px 12px; cursor: pointer; transition: all 0.13s; background: var(--bg); }
.linea-card.sel-l1 { border-color: #0369a1; background: #e0f2fe; }
.linea-card.sel-l2 { border-color: var(--vd); background: var(--vd-lt); }
.linea-card.sel-l3 { border-color: var(--na); background: var(--na-lt); }
.lc-tag { font-size: 10px; font-weight: 700; margin-bottom: 3px; }
.lc-name { font-size: 12px; font-weight: 700; color: var(--az); margin-bottom: 2px; }
.lc-desc { font-size: 11px; color: var(--az-md); }
.suggested-badge { font-size: 10px; background: var(--az); color: white; padding: 1px 6px; border-radius: 10px; margin-left: 6px; }

/* Modal cargar */
.diag-modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 2000; align-items: flex-end; justify-content: center; }
.diag-modal-bg.show { display: flex; }
@media(min-width:500px){ .diag-modal-bg { align-items: center; } }
.diag-modal { background: white; border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 20px 16px 28px; width: 100%; max-height: 85vh; overflow-y: auto; }
@media(min-width:500px){ .diag-modal { border-radius: var(--r-xl); max-width: 420px; } }
.modal-ttl { font-size: 16px; font-weight: 700; color: var(--az); margin-bottom: 6px; }
.modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.modal-list { display: flex; flex-direction: column; gap: 6px; }
.modal-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r); cursor: pointer; }
.modal-item:hover { background: var(--surf); }
.modal-item-name { font-size: 13.5px; font-weight: 700; color: var(--az); }
.modal-item-meta { font-size: 11.5px; color: var(--muted); }
.modal-item-score { font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 10px; }
.modal-empty { text-align: center; padding: 24px; color: var(--muted); font-size: 13px; }

/* Modal área */
.area-modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 2100; align-items: center; justify-content: center; padding: 16px; }
.area-modal-bg.show { display: flex; }
.area-modal { background: white; border-radius: var(--r-xl); width: 100%; max-width: 480px; max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
.area-modal-hdr { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: white; z-index: 1; }
.area-modal-ttl { font-size: 16px; font-weight: 700; color: var(--az); display: flex; align-items: center; gap: 8px; }
.area-modal-score { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
.area-modal-close { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: var(--surf); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; color: var(--muted); flex-shrink: 0; }
.area-modal-body { padding: 14px 18px 18px; }
.area-modal-section { margin-bottom: 14px; }
.area-modal-section-ttl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.area-modal-item { display: flex; align-items: flex-start; gap: 9px; padding: 8px 10px; border-radius: 6px; margin-bottom: 5px; }
.area-modal-item.fail { background: var(--sr-bg); }
.area-modal-item.ok { background: var(--sg-bg); }
.area-modal-badge { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 8px; flex-shrink: 0; margin-top: 2px; white-space: nowrap; }
.area-modal-item-txt { font-size: 13px; line-height: 1.4; }
.area-modal-obs { font-size: 12.5px; color: var(--az-md); padding: 8px 10px; background: var(--surf); border-radius: 6px; border-left: 2.5px solid var(--na); line-height: 1.5; }

/* Modal salir */
.exit-options { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.exit-opt { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1.5px solid var(--border); border-radius: var(--r); cursor: pointer; transition: all 0.13s; background: var(--bg); }
.exit-opt:hover { border-color: var(--na); background: var(--na-lt); }
.exit-opt.danger:hover { border-color: var(--sr-ac); background: var(--sr-bg); }
.exit-opt-icon { font-size: 22px; flex-shrink: 0; }
.exit-opt-ttl { font-size: 14px; font-weight: 700; color: var(--az); }
.exit-opt-desc { font-size: 12px; color: var(--muted); }

/* Home */
.home-header { background: var(--az); border-radius: var(--r-lg); padding: 20px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
.home-logo { display: flex; align-items: center; gap: 10px; }
.home-mark { width: 36px; height: 36px; background: var(--na); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: white; }
.home-brand { font-size: 15px; font-weight: 700; color: white; }
.home-brand b { color: var(--na); }
.home-tag { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 1px; }
.hist-card { background: white; border: 1px solid var(--border); border-radius: var(--r-lg); padding: 14px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all 0.13s; box-shadow: var(--shadow); margin-bottom: 8px; }
.hist-card:hover { border-color: var(--na); box-shadow: var(--shadow-md); }
.hist-score { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
.hist-info { flex: 1; min-width: 0; }
.hist-nombre { font-size: 14px; font-weight: 700; color: var(--az); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist-meta { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.hist-linea { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty-icon { font-size: 36px; margin-bottom: 10px; }
.empty-ttl { font-size: 15px; font-weight: 700; color: var(--az-md); margin-bottom: 6px; }
.empty-desc { font-size: 13px; line-height: 1.6; }

/* Toast */
#diagToast { display: none; position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--az); color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; z-index: 3000; box-shadow: 0 4px 16px rgba(0,0,0,0.2); transition: opacity 0.3s; gap: 8px; align-items: center; }

/* Banner CRM vinculado */
.crm-banner { background: var(--az-lt); border: 1px solid var(--az); border-radius: var(--r); padding: 10px 14px; margin-bottom: 14px; font-size: 12.5px; color: var(--az); display: flex; align-items: center; gap: 8px; }
.crm-banner strong { font-weight: 700; }
</style>

<div id="diag-root">
  <!-- Topbar interna -->
  <div class="diag-topbar">
    <div class="dtb-logo">
      <div class="dtb-mark">C</div>
      <div class="dtb-brand"><b>co</b>proactiva · Diagnóstico</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="dtb-score" id="dtbScore">0%</div>
      <button id="dtbExitBtn" onclick="diagOpenExitModal()" style="display:none;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.8);padding:5px 11px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer">Salir</button>
    </div>
  </div>
  <div class="diag-progress"><div class="diag-prog-fill" id="diagProgFill" style="width:0%"></div></div>
  <div class="diag-step-ind">
    <div class="dsi-info">
      <div class="dsi-num" id="diagStepNum">1</div>
      <div class="dsi-name" id="diagStepName">Datos</div>
    </div>
    <div class="dsi-of" id="diagStepOf">Paso 1 de 9</div>
  </div>

  <div class="diag-scroll">
    <div id="diagMainContent"></div>
  </div>

  <!-- Modal cargar diagnóstico -->
  <div class="diag-modal-bg" id="diagModalBg" onclick="diagCloseModal()">
    <div class="diag-modal" onclick="event.stopPropagation()">
      <div class="modal-ttl">Diagnósticos guardados</div>
      <div class="modal-list" id="diagModalList"></div>
      <div style="margin-top:12px">
        <button class="ghost btn-sm" onclick="diagCloseModal()" style="width:100%">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="diagToast" style="display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--az);color:white;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:3000;box-shadow:0 4px 16px rgba(0,0,0,0.2);transition:opacity 0.3s;gap:8px;align-items:center">
    <span id="diagToastIcon">💾</span>
    <span id="diagToastMsg">Guardando...</span>
  </div>

  <!-- Modal área -->
  <div class="area-modal-bg" id="diagAreaModalBg" onclick="diagCloseAreaModal()">
    <div class="area-modal" onclick="event.stopPropagation()">
      <div class="area-modal-hdr">
        <div class="area-modal-ttl">
          <span id="diagAreaEmoji"></span>
          <span id="diagAreaTtl">Área</span>
          <span class="area-modal-score" id="diagAreaScore"></span>
        </div>
        <div class="area-modal-close" onclick="diagCloseAreaModal()">×</div>
      </div>
      <div class="area-modal-body" id="diagAreaBody"></div>
    </div>
  </div>

  <!-- Modal salir -->
  <div class="diag-modal-bg" id="diagExitModalBg" onclick="diagCloseExitModal()">
    <div class="diag-modal" onclick="event.stopPropagation()">
      <div class="modal-ttl">¿Qué deseas hacer?</div>
      <div class="modal-sub" id="diagExitSub">Tienes cambios sin guardar.</div>

      valMin:'300.000',valMax:'500.000'},
};

const WORKER_BASE='https://coproactiva-worker-nuevo.osmarmeza-adm7.workers.dev';

async function workerGet(path){

  return r.json();
}
async function workerPost(path,body){
  const r=await fetch(WORKER_BASE+path,{method:'POST',headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify(body)});
  return r.json();
}

// ─── STATE ────────────────────────────────────────────────────────────────────
function defaultState(){return{
  ctx:{nombre:'',tipo:'A',unidades:'',locales:'no',antiguedad:'',
       trabajadores:'',ascensores:'no',gas:'no',sistema:'',
       contactoNombre:'',contactoCorreo:'',contactoCargo:''},
  checks:Object.fromEntries(AREAS.map(a=>[a.id,new Array(a.items.length).fill(false)])),
  notes:Object.fromEntries(AREAS.map(a=>[a.id,''])),
  factores:[],valorMin:'',valorMax:'',lineaOverride:null,loadingFactores:false,
  view:'home',
  prospectoId:null,
};}
let S=defaultState();

// ─── INTEGRACIÓN CRM ──────────────────────────────────────────────────────────
// Si hay un prospecto activo en window, precargar nombre
function checkProspectoActivo(){
  if(window.prospectoActivo && window.prospectoActivo.nombreCondominio){
    S.ctx.nombre=window.prospectoActivo.nombreCondominio;
    S.prospectoId=window.prospectoActivo.id||null;
    return true;
  }
  return false;
}

// ─── SCORING ─────────────────────────────────────────────────────────────────
function itemApplies(it){
  const c=S.ctx;
  if(it.cond==='locales'&&c.locales!=='si')return false;
  if(it.cond==='gas'&&c.gas!=='si')return false;
  if(it.cond==='ascensores'&&c.ascensores!=='si')return false;
  return true;
}
function areaApplies(a){
  if(a.condArea==='trabajadores'&&(!S.ctx.trabajadores||parseInt(S.ctx.trabajadores)===0))return false;
  return true;
}
function scoreArea(a){
  if(!areaApplies(a))return null;
  const items=a.items.filter(itemApplies);
  if(!items.length)return null;
  const max=items.reduce((s,it)=>s+WP[it.w],0);
  const got=items.reduce((s,it,i)=>s+(S.checks[a.id][a.items.indexOf(it)]?WP[it.w]:0),0);
  return{pct:Math.round((got/max)*100),got,max};
}
function globalScore(){
  let t=0,n=0;
  AREAS.forEach(a=>{const s=scoreArea(a);if(s){t+=s.pct;n++;}});
  return n?Math.round(t/n):0;
}
function critFailing(){
  const r=[];
  AREAS.forEach(a=>{
    if(!areaApplies(a))return;
    a.items.forEach((it,i)=>{
      if(it.w==='c'&&itemApplies(it)&&!S.checks[a.id][i])r.push({area:a.label,text:it.t});
    });
  });
  return r;
}
function getDiagnostico(){
  const score=globalScore();
  const areasLow=AREAS.map(a=>({...a,score:scoreArea(a)})).filter(a=>a.score&&a.score.pct<60);
  const areasRed=areasLow.filter(a=>a.score.pct<40);
  const hasCritFail=critFailing().length>0;
  const crits=critFailing();
  let nivel,desc;
  if(score>=70&&areasLow.length===0&&!hasCritFail){nivel='Estable';desc='La comunidad está bien gestionada con algunos aspectos a optimizar.';}
  else if(score>=70&&(areasLow.length>0||hasCritFail)){nivel='Estable con observaciones';desc='Buen nivel general pero con áreas o ítems críticos que requieren atención.';}
  else if(score>=40){nivel='En riesgo';desc='La comunidad presenta brechas significativas que requieren intervención profesional.';}
  else{nivel='Crítico';desc='Estado crítico. Se requiere intervención prioritaria en múltiples áreas.';}
  return{score,nivel,desc,hasCritFail,crits,areasLow,areasRed,requiereIntervencion:score<40||hasCritFail};
}
function lineaSugerida(){
  const d=getDiagnostico();
  if(d.score<30)return'L3';
  if(d.score>=65&&d.areasRed.length<2)return'L1';
  return'L2';
}
function lineaActual(){return S.lineaOverride||lineaSugerida();}
function semC(pct){
  if(pct==null)return{fg:'var(--az-md)',bg:'var(--surf)',ac:'var(--muted)',lbl:'No aplica'};
  if(pct>=70)return{fg:'var(--sg-fg)',bg:'var(--sg-bg)',ac:'var(--sg-ac)',lbl:'Bien'};
  if(pct>=40)return{fg:'var(--sa-fg)',bg:'var(--sa-bg)',ac:'var(--sa-ac)',lbl:'En riesgo'};
  return{fg:'var(--sr-fg)',bg:'var(--sr-bg)',ac:'var(--sr-ac)',lbl:'Crítico'};
}
function critData(score){
  const MAP={
    'Estable':{fg:'var(--sg-fg)',bg:'var(--sg-bg)',ac:'var(--sg-ac)'},
    'Estable con observaciones':{fg:'var(--sa-fg)',bg:'var(--sa-bg)',ac:'var(--sa-ac)'},
    'En riesgo':{fg:'var(--sa-fg)',bg:'var(--sa-bg)',ac:'var(--sa-ac)'},
    'Crítico':{fg:'var(--sr-fg)',bg:'var(--sr-bg)',ac:'var(--sr-ac)'},
  };
  const d=getDiagnostico();const col=MAP[d.nivel]||MAP['En riesgo'];
  return{...col,lbl:d.nivel,desc:d.desc,requiereIntervencion:d.requiereIntervencion,diag:d};
}

// ─── STORAGE ──────────────────────────────────────────────────────────────────
let _cache=null,_cacheTime=0,_syncInProgress=false;
const CACHE_TTL=60000;

function getSavedLocal(){
  try{return JSON.parse(localStorage.getItem('ca_diag')||'[]');}catch(e){return[];}
}

async function syncWithSheets(){
  if(_syncInProgress)return;
  _syncInProgress=true;
  try{
    const res=await workerGet('/diagnosticos');
    if(!res.data||!res.data.diagnosticos)return;
    const remote=res.data.diagnosticos.map(d=>({...d.payload,id:d.id,fecha:d.fecha,nombre:d.nombre,score:d.score}));
    const remoteNames=new Set(remote.map(d=>d.nombre));
    const localOnly=getSavedLocal().filter(d=>!remoteNames.has(d.nombre));
    const merged=[...remote,...localOnly];
    localStorage.setItem('ca_diag',JSON.stringify(merged.slice(0,50)));
    _cache=merged;_cacheTime=Date.now();
    if(S.view==='home'){
      _homeData=merged;
      document.getElementById('diagMainContent').innerHTML=renderDiagHome();
      const si=document.getElementById('diagSyncInd');
      if(si){si.textContent='✓ Sincronizado';si.style.color='var(--sg-fg)';setTimeout(()=>si.remove(),2000);}
    }
  }catch(e){
    const si=document.getElementById('diagSyncInd');
    if(si){si.textContent='⚠ Sin conexión';si.style.color='var(--sa-fg)';setTimeout(()=>si.remove(),3000);}
  }finally{_syncInProgress=false;}
}

async function getSaved(){
  const now=Date.now();
  if(_cache&&(now-_cacheTime)<CACHE_TTL)return _cache;
  const local=getSavedLocal();_cache=local;return local;
}

async function diagSaveDiag(){
  const nombre=S.ctx.nombre?.trim()||'Sin nombre';
  const id='diag_'+nombre.toLowerCase().replace(/[^a-z0-9]/g,'_').substring(0,40);
  const record={id,nombre,fecha:new Date().toLocaleDateString('es-CL'),score:globalScore(),linea:lineaActual(),
    ctx:{...S.ctx},checks:JSON.parse(JSON.stringify(S.checks)),notes:{...S.notes},
    factores:[...S.factores],valorMin:S.valorMin,valorMax:S.valorMax,lineaOverride:S.lineaOverride,
    prospectoId:S.prospectoId||null,
  };
  diagShowToast('Guardando...','💾',60000);
  try{
    const res=await workerPost('/diagnosticos',{action:'guardar',id,fecha:record.fecha,nombre,score:record.score,payload:record});
    if(!res.ok&&!res.data?.ok)throw new Error(res.data?.error||res.error||'Error desconocido');
    _cache=null;
    const local=getSavedLocal().filter(d=>d.nombre!==nombre);
    local.unshift(record);localStorage.setItem('ca_diag',JSON.stringify(local.slice(0,30)));
    diagShowToast('Guardado correctamente','✅',2500);
    setTimeout(syncWithSheets,500);
  }catch(e){
    const local=getSavedLocal().filter(d=>d.nombre!==nombre);
    local.unshift(record);localStorage.setItem('ca_diag',JSON.stringify(local.slice(0,30)));
    diagShowToast('Guardado localmente (sin conexión)','⚠️',3000);
  }
  return record;
}

async function diagLoadDiag(nombre){
  const saved=await getSaved();const d=saved.find(x=>x.nombre===nombre);if(!d)return;
  S.ctx={...d.ctx};S.checks=JSON.parse(JSON.stringify(d.checks));S.notes={...d.notes};
  S.factores=d.factores||[];S.valorMin=d.valorMin||'';S.valorMax=d.valorMax||'';
  S.lineaOverride=d.lineaOverride||null;S.prospectoId=d.prospectoId||null;
  diagCloseModal();diagRender();
}

async function diagDeleteSaved(nombre){
  if(!confirm('¿Eliminar el diagnóstico "'+nombre+'"?'))return;
  try{
    const saved=await getSaved();const d=saved.find(x=>x.nombre===nombre);
    if(d&&d.id)await workerPost('/diagnosticos',{action:'eliminar',id:d.id});
    _cache=null;
  }catch(e){}
  const local=getSavedLocal().filter(d=>d.nombre!==nombre);
  localStorage.setItem('ca_diag',JSON.stringify(local));
  diagRenderModal();
}

// ─── NAV ─────────────────────────────────────────────────────────────────────
function diagRenderNav(){
  const steps=[{id:'contexto',label:'Datos de la comunidad'},...AREAS.map(a=>({id:a.id,label:a.label,emoji:a.emoji})),{id:'revision',label:'Revisión y PDF'}];
  const ai=steps.findIndex(s=>s.id===S.view);
  const score=globalScore();const crit=critData(score);
  const dtbScore=document.getElementById('dtbScore');
  const dtbExit=document.getElementById('dtbExitBtn');
  if(dtbScore){dtbScore.textContent=score+'%';dtbScore.style.display='block';}
  if(dtbExit){dtbExit.style.display='block';}
  const pct=Math.round((ai/(steps.length-1))*100);
  const pf=document.getElementById('diagProgFill');if(pf)pf.style.width=pct+'%';
  const sn=document.getElementById('diagStepNum');if(sn)sn.textContent=ai+1;
  const sname=document.getElementById('diagStepName');if(sname)sname.textContent=steps[ai]?steps[ai].label:'';
  const sof=document.getElementById('diagStepOf');if(sof)sof.textContent='Paso '+(ai+1)+' de '+steps.length;
}

function diagGoTo(v){S.view=v;diagRender();window.scrollTo(0,0);}
function diagGoNext(){const i=VIEWS.indexOf(S.view);if(i<VIEWS.length-1)diagGoTo(VIEWS[i+1]);}
function diagGoPrev(){const i=VIEWS.indexOf(S.view);if(i>0)diagGoTo(VIEWS[i-1]);}

function diagRender(){
  const isHome=S.view==='home';
  const dtbScore=document.getElementById('dtbScore');
  const dtbExit=document.getElementById('dtbExitBtn');
  if(dtbScore)dtbScore.style.display=isHome?'none':'block';
  if(dtbExit)dtbExit.style.display=isHome?'none':'block';
  if(!isHome)diagRenderNav();
  const m=document.getElementById('diagMainContent');
  if(S.view==='home'){if(_homeData!==null)m.innerHTML=renderDiagHome();else diagLoadHomeData();}
  else if(S.view==='contexto')m.innerHTML=renderDiagCtx();
  else if(S.view==='revision')m.innerHTML=renderDiagRevision();
  else{const a=AREAS.find(x=>x.id===S.view);if(a)m.innerHTML=renderDiagArea(a);}
}

let _homeData=null;

  _homeData=getSavedLocal();
  if(S.view==='home')document.getElementById('diagMainContent').innerHTML=renderDiagHome();
  syncWithSheets();

  const hist=_homeData||[];
  return`
  <div class="home-header">
    <div class="home-logo">
      <div class="home-mark">C</div>
      <div><div class="home-brand"><b>co</b>proactiva</div><div class="home-tag">Herramienta de diagnóstico</div></div>

      <span id="diagSyncInd" style="font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px">
        <span class="spin" style="width:10px;height:10px;border-width:1.5px"></span> Sincronizando...
      </span>
      <span style="font-size:12px;color:var(--muted)">${hist.length} guardado${hist.length!==1?'s':''}</span>
    </div>
  </div>
  ${hist.length===0?`
    <div class="empty-state">
      <div class="empty-icon">📋</div>
      <div class="empty-ttl">Sin diagnósticos aún</div>
      <div class="empty-desc">Crea tu primer diagnóstico para comenzar.</div>
      <br>
      <button class="pri" onclick="diagNuevoDesdeHome()" style="margin-top:8px">Comenzar diagnóstico</button>
    </div>
  `:`<div>${hist.map(d=>{
    const sem=semC(d.score);const lm2=LINEAS[d.linea]||LINEAS.L2;
    return`<div class="hist-card" onclick="diagCargarYAbrir('${encodeURIComponent(d.nombre)}')">
      <div class="hist-score" style="background:${sem.bg};color:${sem.fg}">${d.score}%</div>
      <div class="hist-info">
        <div class="hist-nombre">${d.nombre}</div>
        <div class="hist-meta">Tipo ${d.ctx?.tipo||'A'} · ${d.ctx?.unidades||'?'} unidades · ${d.fecha}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
        <span class="hist-linea" style="background:${lm2.bg||'var(--vd-lt)'};color:${lm2.color||'var(--vd-dk)'}">${d.linea}</span>
        <button class="btn-sm ghost" onclick="event.stopPropagation();diagPDFDesdeHistorial('${encodeURIComponent(d.nombre)}')" title="PDF">📄</button>
        <button class="btn-sm btn-danger" onclick="event.stopPropagation();diagDeleteSaved('${decodeURIComponent('${encodeURIComponent(d.nombre)}')}')">×</button>
      </div>
    </div>`;}).join('')}</div>`}`;
}

function diagNuevoDesdeHome(){
  const def=defaultState();
  S.ctx=def.ctx;S.checks=def.checks;S.notes=def.notes;
  S.factores=[];S.valorMin='';S.valorMax='';S.lineaOverride=null;S.prospectoId=null;
  checkProspectoActivo();
  diagGoTo('contexto');
}
async function diagCargarYAbrir(nombre){await diagLoadDiag(decodeURIComponent(nombre));diagGoTo('contexto');}

async function diagPDFDesdeHistorial(nombre){
  const sv=await getSaved();const d=sv.find(x=>x.nombre===decodeURIComponent(nombre));if(!d)return;
  const prev={ctx:{...S.ctx},checks:JSON.parse(JSON.stringify(S.checks)),notes:{...S.notes},factores:[...S.factores],valorMin:S.valorMin,valorMax:S.valorMax,lineaOverride:S.lineaOverride};
  S.ctx={...d.ctx};S.checks=JSON.parse(JSON.stringify(d.checks));S.notes={...d.notes};
  S.factores=d.factores||[];S.valorMin=d.valorMin||'';S.valorMax=d.valorMax||'';S.lineaOverride=d.lineaOverride||null;
  diagGenerarPDF();
  setTimeout(()=>{S.ctx=prev.ctx;S.checks=prev.checks;S.notes=prev.notes;S.factores=prev.factores;S.valorMin=prev.valorMin;S.valorMax=prev.valorMax;S.lineaOverride=prev.lineaOverride;},500);
}

  ${bannerCRM}

function renderDiagArea(area){

  const ai=AREAS.indexOf(area);const isLast=ai===AREAS.length-1;
  const done=S.checks[area.id].filter(Boolean).length;
  const total=area.items.filter(it=>itemApplies(it)).length;
  return`
  <div class="ph"><div class="ph-title">${area.emoji} ${area.label}</div><div class="ph-sub">${applies?`${done}/${total} marcados`:'No aplica para esta comunidad'}</div></div>
  <div class="card">
    ${!applies?`<div style="padding:16px 0;text-align:center"><div style="font-size:28px;margin-bottom:8px">👷</div><div style="font-size:14px;font-weight:700;color:var(--az-md)">Área no aplicable</div></div>`:`
    <div class="items">${area.items.map((it,i)=>{
      const na=!itemApplies(it);const on=S.checks[area.id][i];
      const wl={c:'Crítico',i:'Importante',b:'Básico'}[it.w];
      const wc={c:'wc',i:'wi',b:'wb'}[it.w];
      return`<div class="irow ${on?'on':''} ${na?'na':''}" onclick="${na?'':`diagToggleItem('${area.id}',${i})`}">
        <div class="chk"><div class="ckm"></div></div>
        <div class="itxt">${it.t}</div>
        ${na?`<span class="nap">No aplica</span>`:`<span class="wp ${wc}">${wl}</span>`}
      </div>`;}).join('')}</div>
    <label class="obs-lbl">Observaciones del área</label>
    <textarea oninput="S_DIAG.notes['${area.id}']=this.value" placeholder="Anota detalles...">${S.notes[area.id]}</textarea>
    ${s?`<div class="area-bar-row">
      <span class="bar-lbl">Cumplimiento</span>
      <div class="bar-track"><div class="bar-fill" style="width:${s.pct}%;background:${sem.ac}"></div></div>
      <span class="bar-pct" style="color:${sem.fg}">${s.pct}%</span>
      <span class="bar-badge" style="background:${sem.bg};color:${sem.fg}">${sem.lbl}</span>

    <button class="ghost" onclick="diagGoPrev()">← Anterior</button>
    <button class="pri" onclick="diagGoNext()">${isLast?'Ver revisión →':'Siguiente →'}</button>

}

// ─── FACTORES IA ──────────────────────────────────────────────────────────────
async function diagGenerarFactores(){
  S.loadingFactores=true;diagRender();
  const diag2=getDiagnostico();const c=S.ctx;const lid=lineaActual();
  const obsCtx=AREAS.map(a=>{
    const s=scoreArea(a);if(!s)return null;
    const fallidos=a.items.filter((it,i)=>itemApplies(it)&&!S.checks[a.id][i]).map(it=>`[${({c:'CRÍTICO',i:'IMPORTANTE',b:'BÁSICO'})[it.w]}] NO CUENTA CON: "${it.t}"`);
    const cumplidos=a.items.filter((it,i)=>itemApplies(it)&&S.checks[a.id][i]).map(it=>`SÍ CUENTA CON: "${it.t}"`);
    let ctx=`ÁREA ${a.label.toUpperCase()} — Cumplimiento: ${s.pct}%`;
    if(fallidos.length){ctx+=`\n  INCUMPLIMIENTOS (${fallidos.length}):`;fallidos.forEach(f=>{ctx+=`\n    • ${f}`;});}
    else ctx+=`\n  Sin incumplimientos.`;
    if(cumplidos.length){ctx+=`\n  ÍTEMS EN REGLA (${cumplidos.length}):`;cumplidos.forEach(c2=>{ctx+=`\n    • ${c2}`;});}
    return ctx;
  }).filter(Boolean).join('\n\n');

  const prompt=`Eres un experto en administración de condominios en Chile con conocimiento de la Ley 21.442.\nCoproActiva elabora propuesta comercial para comunidad aún no cliente.\nDATOS:\n- Nombre: ${c.nombre||'Sin nombre'}\n- Tipo: ${c.tipo==='A'?'Tipo A':c.tipo==='B'?'Tipo B':'Mixto'} · ${c.unidades||'?'} unidades\n- Puntaje: ${diag2.score}%\n- Servicio recomendado: ${LINEAS[lid]?.label||lid}\n- ESTADO POR ÁREA:\n${obsCtx}\n\nGenera exactamente 3 factores destacados basados en ítems NO cumplidos.\nProhibido citar números de artículos. Usa "según la Ley 21.442" o "conforme a la normativa de copropiedad vigente".\nRESPONDE SOLO JSON sin markdown:\n{"factores":[{"titulo":"...","cuerpo":"..."},{"titulo":"...","cuerpo":"..."},{"titulo":"...","cuerpo":"..."}]}\nTítulo: máximo 7 palabras. Cuerpo: exactamente 2 oraciones.`;

  try{
    const res=await fetch(WORKER_BASE+'/factores',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify({prompt})});
    if(!res.ok)throw new Error('Error '+res.status);
    const data=await res.json();
    if(data.error)throw new Error(data.error);
    const cleaned=(data.text||'').replace(/```json|```/g,'').trim();
    const parsed=JSON.parse(cleaned);
    if(!parsed.factores||!Array.isArray(parsed.factores))throw new Error('Formato inválido');
    S.factores=parsed.factores;
  }catch(e){
    S.factores=[{titulo:'Error al generar factores',cuerpo:e.message+'. Puedes ingresarlos manualmente.'}];
  }
  S.loadingFactores=false;diagRender();
}
function diagEliminarFactor(i){S.factores.splice(i,1);diagRender();}
function diagLimpiarFactores(){if(!confirm('¿Eliminar todos los factores?'))return;S.factores=[];diagRender();}

// ─── PDF ──────────────────────────────────────────────────────────────────────
function diagGenerarPDF(){
  const score=globalScore();const lid=lineaActual();const lm=LINEAS[lid];
  const crit=critData(score);const c=S.ctx;const crits=critFailing();
  const vMin=S.valorMin||lm.valMin;const vMax=S.valorMax||lm.valMax;
  const fecha=new Date().toLocaleDateString('es-CL',{year:'numeric',month:'long',day:'numeric'});
  const sorted=[...AREAS].map(a=>({...a,score:scoreArea(a)})).filter(a=>a.score).sort((a,b)=>a.score.pct-b.score.pct);
  function semHex(pct){
    if(pct==null)return['#516576','#f2f0ed','#e8e4de','No aplica'];
    if(pct>=70)return['#1d5c38','#eaf4ee','#6fa885','Bien'];
    if(pct>=40)return['#7a3e10','#fdeee0','#d18549','En riesgo'];
    return['#7a1515','#fde8e8','#b83232','Crítico'];
  }
  const[cFg,cBg,cAc,cLbl]=semHex(score);
  function hdr(pg,total){return`<div style="background:#304660;height:48mm;position:relative;padding:6mm 16mm 0"><div style="display:flex;align-items:center;gap:3mm;margin-bottom:2mm"><div style="width:8mm;height:8mm;background:#d18549;border-radius:2mm;display:flex;align-items:center;justify-content:center;font-size:10pt;font-weight:700;color:white">C</div><span style="font-size:10pt;font-weight:700;color:#d18549">co</span><span style="font-size:10pt;color:white">proactiva</span></div><div style="position:absolute;top:6mm;right:16mm;font-size:6.5pt;color:#7a9ab5">Pág. ${pg} / ${total}</div><div style="font-size:17pt;font-weight:700;color:white;margin-bottom:1.5mm">Informe de Diagnóstico Inicial</div><div style="font-size:7.5pt;color:#8fb5cc;margin-bottom:3.5mm">Diagnóstico preliminar de riesgo y propuesta de administración</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0">${[['CONDOMINIO',c.nombre||'—'],['FECHA',fecha],['TIPO / UNID.','Tipo '+c.tipo+' · '+(c.unidades||'?')+' unidades'],['ELABORADO POR','CoproActiva']].map(([l,v])=>`<div><div style="font-size:5.5pt;color:#7a9ab5;margin-bottom:1mm;text-transform:uppercase;letter-spacing:0.5px">${l}</div><div style="font-size:7.5pt;font-weight:700;color:white">${v}</div></div>`).join('')}</div><div style="position:absolute;bottom:0;left:0;right:0;height:1mm;background:#d18549"></div></div>`;}
  function ftr(){return`<div style="position:absolute;bottom:0;left:0;right:0;height:9mm;background:#f2f0ed;border-top:0.3mm solid #e8e4de;display:flex;align-items:center;padding:0 16mm;font-size:6.5pt;color:#8a9ba8"><span>coproactiva · Comunidades que funcionan.</span><span style="flex:1;text-align:center">Documento confidencial</span><span>${fecha}</span></div>`;}
  function sec(t){return`<div style="font-size:6.5pt;font-weight:700;color:#d18549;text-transform:uppercase;letter-spacing:0.8px;border-bottom:0.5mm solid #d18549;padding-bottom:1mm;margin:5mm 0 3mm">${t}</div>`;}

  const p1=`<div style="width:210mm;height:297mm;position:relative;background:#fafaf9;font-family:Arial,sans-serif;font-size:8pt;color:#1a2a38;overflow:hidden;page-break-after:always">${hdr(1,2)}<div style="padding:5mm 16mm">${sec('Resultado del diagnóstico')}<div style="background:${cBg};border:0.6mm solid ${cAc};border-radius:3mm;padding:4mm 5mm;display:flex;align-items:center;gap:5mm"><div style="width:14mm;height:14mm;border-radius:50%;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0"><div style="font-size:14pt;font-weight:700;color:${cFg};line-height:1">${score}</div><div style="font-size:6pt;color:#8a9ba8">%</div></div><div style="width:0.3mm;background:${cAc};opacity:0.3;align-self:stretch;margin:1mm 0"></div><div><div style="font-size:11pt;font-weight:700;color:${cFg};font-family:Georgia,serif;margin-bottom:1.5mm">${cLbl}</div><div style="font-size:7.5pt;color:${cFg};opacity:0.85;line-height:1.5">${crit.desc}</div></div></div>${sec('Comparativo por área')}<div style="margin-bottom:12mm">${sorted.map(a=>{const[sf,,sa,sl]=semHex(a.score.pct);const pct=a.score.pct;return`<div style="display:flex;align-items:center;gap:3mm;margin-bottom:2.5mm"><div style="width:22mm;font-size:8pt;color:#516576">${a.label}</div><div style="flex:1;height:4.5mm;background:#f2f0ed;border-radius:1mm;overflow:hidden;position:relative"><div style="height:100%;width:${pct}%;background:${sa};border-radius:1mm"></div><span style="position:absolute;top:50%;transform:translateY(-50%);${pct>20?`right:4mm;color:white`:`left:${pct}%;margin-left:2mm;color:${sf}`};font-size:7pt;font-weight:700">${pct}%</span></div><div style="width:14mm;height:4.5mm;background:${semHex(pct)[1]};border-radius:1mm;display:flex;align-items:center;justify-content:center;font-size:6.5pt;font-weight:700;color:${sf}">${sl}</div></div>`;}).join('')}</div></div>${ftr()}</div>`;

  const byArea={};crits.forEach(it=>{byArea[it.area]=byArea[it.area]||[];byArea[it.area].push(it.text);});
  const p2=`<div style="width:210mm;height:297mm;position:relative;background:#fafaf9;font-family:Arial,sans-serif;font-size:8pt;color:#1a2a38;overflow:hidden">${hdr(2,2)}<div style="padding:5mm 16mm">${crits.length?`${sec('Ítems críticos faltantes · '+crits.length+' sin resolver')}${Object.entries(byArea).map(([an,items])=>`<div style="font-size:7.5pt;font-weight:700;color:#516576;border-bottom:0.3mm solid #516576;padding-bottom:1mm;display:inline-block;margin-bottom:2mm">${an}</div>${items.map(txt=>`<div style="display:flex;align-items:flex-start;gap:3mm;padding:2mm 3mm;background:#fde8e8;border-radius:1.5mm;border-left:2mm solid #b83232;margin-bottom:1.5mm"><div style="font-size:9pt;font-weight:700;color:#b83232;line-height:1">×</div><div style="font-size:7.5pt;color:#1a2a38;line-height:1.4">${txt}</div></div>`).join('')}<div style="height:3mm"></div>`).join('')}`:''}<div style="background:#304660;border-radius:3mm;padding:4mm 5mm 4mm 8mm;position:relative;overflow:hidden;margin-top:5mm"><div style="position:absolute;left:0;top:0;bottom:0;width:2.5mm;background:#d18549"></div><div style="font-size:8.5pt;font-weight:700;color:#d18549;margin-bottom:2mm">Próximo paso</div><div style="font-size:7.5pt;color:#ccd8e0;line-height:1.6">CoproActiva los invita a una reunión de presentación con el comité para revisar este diagnóstico en detalle y confirmar el valor definitivo del servicio.</div></div></div>${ftr()}</div>`;

  const tpl=document.getElementById('diagPdfTpl');
  tpl.innerHTML=p1+p2;
  setTimeout(()=>{window.print();setTimeout(()=>{tpl.innerHTML='';},1000);},200);
}

// ─── MODAL ÁREA ────────────────────────────────────────────────────────────────
function diagOpenAreaModal(aId){
  const area=AREAS.find(a=>a.id===aId);if(!area)return;
  const s=scoreArea(area);const sem=semC(s?s.pct:null);
  document.getElementById('diagAreaEmoji').textContent=area.emoji||'';
  document.getElementById('diagAreaTtl').textContent=area.label;
  const scoreEl=document.getElementById('diagAreaScore');
  scoreEl.textContent=s?s.pct+'% — '+sem.lbl:'No aplica';
  scoreEl.style.background=sem.bg;scoreEl.style.color=sem.fg;
  const fallidos=area.items.filter((it,i)=>itemApplies(it)&&!S.checks[aId][i]);
  const cumplidos=area.items.filter((it,i)=>itemApplies(it)&&S.checks[aId][i]);
  const wLabel={c:'Crítico',i:'Importante',b:'Básico'};
  const wFg={c:'var(--sr-ac)',i:'var(--sa-ac)',b:'var(--sg-ac)'};
  const wBg={c:'var(--sr-bg)',i:'var(--sa-bg)',b:'var(--sg-bg)'};
  let html='';
  if(!s){html='<p style="color:var(--muted);font-size:13px;padding:8px 0">Área no aplicable.</p>';}
  else{
    if(fallidos.length)html+=`<div class="area-modal-section"><div class="area-modal-section-ttl" style="color:var(--sr-ac)">⚠️ Sin cumplir (${fallidos.length})</div>${fallidos.map(it=>`<div class="area-modal-item fail"><span class="area-modal-badge" style="background:${wBg[it.w]};color:${wFg[it.w]}">${wLabel[it.w]}</span><span class="area-modal-item-txt">${it.t}</span></div>`).join('')}</div>`;
    if(cumplidos.length)html+=`<div class="area-modal-section"><div class="area-modal-section-ttl" style="color:var(--sg-fg)">✓ Cumplidos (${cumplidos.length})</div>${cumplidos.map(it=>`<div class="area-modal-item ok"><span class="area-modal-badge" style="background:var(--sg-bg);color:var(--sg-fg)">✓</span><span class="area-modal-item-txt" style="color:var(--az-md)">${it.t}</span></div>`).join('')}</div>`;
  }
  document.getElementById('diagAreaBody').innerHTML=html;
  document.getElementById('diagAreaModalBg').classList.add('show');
}
function diagCloseAreaModal(){document.getElementById('diagAreaModalBg').classList.remove('show');}

// ─── MODAL SALIR ──────────────────────────────────────────────────────────────
function diagOpenExitModal(){
  const nombre=S.ctx.nombre?.trim();
  document.getElementById('diagExitSub').textContent=nombre?`Estás trabajando en "${nombre}". ¿Qué deseas hacer?`:'Tienes datos sin guardar.';
  document.getElementById('diagExitModalBg').classList.add('show');
}
function diagCloseExitModal(){document.getElementById('diagExitModalBg').classList.remove('show');}
async function diagGuardarYSalir(){
  if(!S.ctx.nombre?.trim()){diagCloseExitModal();alert('Ingresa el nombre del condominio para guardar.');diagGoTo('contexto');return;}
  diagCloseExitModal();await diagSaveDiag();_homeData=null;diagGoTo('home');
}
function diagSalirSinGuardar(){diagCloseExitModal();diagGoTo('home');}

// ─── TOAST ────────────────────────────────────────────────────────────────────
function diagShowToast(msg,icon='💾',duration=2500){
  const t=document.getElementById('diagToast');
  document.getElementById('diagToastMsg').textContent=msg;
  document.getElementById('diagToastIcon').textContent=icon;
  t.style.display='flex';t.style.opacity='1';
  clearTimeout(window._diagToastTimer);
  window._diagToastTimer=setTimeout(()=>{t.style.opacity='0';setTimeout(()=>{t.style.display='none';},300);},duration);
}
