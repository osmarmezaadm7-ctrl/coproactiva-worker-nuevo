<!-- modules/diagnostico.html — CoproActiva Diagnóstico -->
<!-- Implementado como iframe — Opción A aprobada por arquitecto -->
<!-- Versión: 3.0 · Mayo 2026 -->

<style>
  .diag-iframe-container {
    width: 100%;
    height: calc(100vh - 80px);
    position: relative;
  }
  #diagnosticoIframe {
    width: 100%;
    height: 100%;
    min-height: 80vh;
    border: none;
    display: block;
  }
  .diag-loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f2f0ed;
    font-family: Arial, sans-serif;
    font-size: 14px;
    color: #6b7280;
  }
  @media (min-width: 768px) {
    .diag-iframe-container { height: calc(100vh - 40px); }
  }
</style>

<div class="diag-iframe-container">
  <div class="diag-loading" id="diagLoading">Cargando diagnóstico…</div>
  <iframe
    id="diagnosticoIframe"
    title="Herramienta de Diagnóstico CoproActiva"
    style="opacity:0;transition:opacity 0.3s">
  </iframe>
</div>

<script>
(function() {

  const iframe = document.getElementById('diagnosticoIframe');
  const _token = sessionStorage.getItem('token') || '';
  iframe.src = 'diagnostico_standalone.html?token=' + encodeURIComponent(_token);
  const loading = document.getElementById('diagLoading');

  // Cuando el iframe termina de cargar
  iframe.addEventListener('load', function() {
    loading.style.display = 'none';
    iframe.style.opacity = '1';
  });

  // Escuchar mensajes desde el iframe
  window.addEventListener('message', function(event) {
    const data = event.data;
    if (!data || !data.type) return;
    if (data.type === 'diagnostico_guardado') {
      console.log('Diagnóstico guardado:', data.nombre);
    }
  });

  // Si hay prospecto activo desde CRM, guardarlo en sessionStorage y recargar iframe
  if (window.prospectoActivo && window.prospectoActivo.id) {
    sessionStorage.setItem('prospectoVinculado', JSON.stringify({
      id: window.prospectoActivo.id,
      nombre: window.prospectoActivo.nombre || window.prospectoActivo.nombreCondominio || ''
    }));
    window.prospectoActivo = null;
    // Forzar recarga del iframe para que lea el sessionStorage fresco
    iframe.src = 'diagnostico_standalone.html?token=' + encodeURIComponent(_token) + '&t=' + Date.now();
  }

})();
</script>
