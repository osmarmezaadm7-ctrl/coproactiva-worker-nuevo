<!-- modules/diagnostico.html — CoproActiva Diagnóstico -->
<!-- Versión: 3.3 · Mayo 2026 — con recarga forzada -->

<style>
  .diag-iframe-container {
    width: 100%;
    height: calc(100vh - 80px);
    position: relative;
  }
  #diagnosticoIframe {
    width: 100%;
    height: 100%;
    min-height: 80vh;
    border: none;
    display: block;
  }
  .diag-loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f2f0ed;
    font-family: Arial, sans-serif;
    font-size: 14px;
    color: #6b7280;
  }
  @media (min-width: 768px) {
    .diag-iframe-container { height: calc(100vh - 40px); }
  }
</style>

<div class="diag-iframe-container">
  <div class="diag-loading" id="diagLoading">Cargando diagnóstico…</div>
  <iframe
    id="diagnosticoIframe"
    title="Herramienta de Diagnóstico CoproActiva"
    style="opacity:0;transition:opacity 0.3s">
  </iframe>
</div>

<script>
(function() {
  const iframe  = document.getElementById('diagnosticoIframe');
  const loading = document.getElementById('diagLoading');
  const ACCESS_KEY = 'copro2025';

  function cargarIframe() {
    const src = 'diagnostico_standalone.html?token=' + encodeURIComponent(ACCESS_KEY) + '&t=' + Date.now();
    iframe.src = src;
    loading.style.display = 'flex';
    iframe.style.opacity = '0';
  }

  cargarIframe();

  iframe.addEventListener('load', function() {
    loading.style.display = 'none';
    iframe.style.opacity  = '1';
  });

  window.addEventListener('message', function(event) {
    const data = event.data;
    if (!data || !data.type) return;
    if (data.type === 'recargar_diagnostico') {
      cargarIframe();
    }
    if (data.type === 'diagnostico_guardado') {
      console.log('Diagnóstico guardado:', data.nombre);
    }
  });
})();
</script>
