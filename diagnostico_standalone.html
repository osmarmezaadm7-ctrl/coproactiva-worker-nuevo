<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoproActiva — Diagnóstico</title>
<style>
:root {
  --na: #d18549; --na-lt: #fdeee0; --na-dk: #a8622e;
  --az: #304660; --az-md: #516576; --az-lt: #e8edf2;
  --vd: #6fa885; --vd-lt: #eaf4ee; --vd-dk: #1d5c38; --vd-md: #c2e0cc;
  --surf: #f2f0ed; --border: #e8e4de; --muted: #8a9ba8;
  --bg: #fafaf9; --text: #1a2a38;
  --sg-fg:#1d5c38; --sg-bg:#eaf4ee; --sg-ac:#6fa885;
  --sa-fg:#7a3e10; --sa-bg:#fdeee0; --sa-ac:#d18549;
  --sr-fg:#7a1515; --sr-bg:#fde8e8; --sr-ac:#b83232;
  --r:8px; --r-lg:12px; --r-xl:16px;
  --shadow: 0 1px 4px rgba(0,0,0,0.07);
  --shadow-md: 0 2px 10px rgba(0,0,0,0.09);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;}

/* ── MOBILE LAYOUT ─────────────────────────────────────────────────── */
.app{display:flex;flex-direction:column;min-height:100vh;}

/* Top bar mobile */
.topbar{background:var(--az);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.tb-logo{display:flex;align-items:center;gap:9px;}
.tb-mark{width:28px;height:28px;background:var(--na);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:white;flex-shrink:0;}
.tb-brand{font-size:13px;color:white;} .tb-brand b{color:var(--na);}
.tb-score{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,0.1);color:white;}

/* Progress bar */
.progress-bar{height:3px;background:rgba(255,255,255,0.15);}
.progress-fill{height:100%;background:var(--na);transition:width 0.4s;}

/* Step indicator */
.step-indicator{padding:12px 16px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.step-info{display:flex;align-items:center;gap:8px;}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--na);color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-name{font-size:13px;font-weight:700;color:var(--az);}
.step-of{font-size:12px;color:var(--muted);}

/* Main scroll area */
.main-scroll{flex:1;overflow-y:auto;padding:16px;}

/* ── DESKTOP OVERRIDE ─────────────────────────────────────────────── */
@media(min-width:768px){
  .app{display:block;}
  .topbar{display:none;}
  .progress-bar{display:none;}
  .step-indicator{display:none;}
  .sidebar{display:flex !important;width:240px;position:fixed;top:0;left:0;height:100vh;z-index:50;}
  .main-scroll{margin-left:240px;padding:28px 40px;min-height:100vh;}
  #mainContent{max-width:680px;margin:0 auto;}
}

/* ── SIDEBAR (desktop only) ───────────────────────────────────────── */
.sidebar{display:none;flex-direction:column;background:var(--az);height:100vh;overflow-y:auto;}
.sb-hd{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,0.07);}
.sb-logo{display:flex;align-items:center;gap:9px;}
.sb-mark{width:30px;height:30px;background:var(--na);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:white;}
.sb-brand{font-size:13px;color:white;} .sb-brand b{color:var(--na);}
.sb-tag{font-size:10px;color:rgba(255,255,255,0.3);margin-top:1px;}
.sb-nav{padding:10px 10px;flex:1;}
.sb-lbl{font-size:9px;color:rgba(255,255,255,0.28);text-transform:uppercase;letter-spacing:1px;padding:0 6px;margin:12px 0 5px;}
.sb-step{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;transition:background 0.12s;}
.sb-step:hover{background:rgba(255,255,255,0.05);}
.sb-step.active{background:rgba(209,133,73,0.15);}
.sb-n{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;font-size:9.5px;color:rgba(255,255,255,0.3);flex-shrink:0;transition:all 0.2s;}
.sb-step.done .sb-n{background:var(--vd);border-color:var(--vd);color:white;font-size:8px;}
.sb-step.active .sb-n{background:var(--na);border-color:var(--na);color:white;}
.sb-sl{font-size:12px;color:rgba(255,255,255,0.4);transition:color 0.12s;}
.sb-step.active .sb-sl{color:white;font-weight:600;}
.sb-step.done .sb-sl{color:rgba(255,255,255,0.6);}
.sb-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,0.07);}
.sb-s-lbl{font-size:9px;color:rgba(255,255,255,0.28);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;}
.sb-s-val{font-size:24px;font-weight:700;color:white;line-height:1;}
.sb-s-sub{font-size:10px;color:rgba(255,255,255,0.3);margin-top:2px;}
.sb-bar{height:2px;background:rgba(255,255,255,0.1);border-radius:2px;margin-top:7px;overflow:hidden;}
.sb-bar-f{height:100%;border-radius:2px;background:var(--na);transition:width 0.4s;}

/* ── COMPONENTS ───────────────────────────────────────────────────── */
.ph{margin-bottom:18px;}
.ph-title{font-size:19px;font-weight:700;color:var(--az);margin-bottom:3px;}
.ph-sub{font-size:13px;color:var(--az-md);}

.card{background:white;border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:10px;box-shadow:var(--shadow);}
.card-ttl{font-size:14px;font-weight:700;color:var(--az);margin-bottom:14px;display:flex;align-items:center;gap:7px;}
.cdot{width:7px;height:7px;border-radius:50%;background:var(--na);flex-shrink:0;}

/* ── FORM ──────────────────────────────────────────────────────────── */
.fg{display:grid;grid-template-columns:1fr;gap:12px;}
@media(min-width:480px){.fg{grid-template-columns:1fr 1fr;}}
.f{display:flex;flex-direction:column;gap:5px;}
.f.full{grid-column:1/-1;}
.f.full3{grid-column:1/-1;}
@media(min-width:480px){.f.full3{grid-column:1/-1;}}
label.fl{font-size:11.5px;color:var(--az-md);font-weight:700;text-transform:uppercase;letter-spacing:0.4px;}
input,select,textarea{font-family:Arial,sans-serif;font-size:14px;color:var(--text);border:1.5px solid var(--border);border-radius:var(--r);padding:10px 12px;background:var(--bg);width:100%;transition:border-color 0.13s;-webkit-appearance:none;appearance:none;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--na);background:white;}
textarea{resize:vertical;min-height:56px;}
.hint{font-size:11px;color:var(--muted);margin-top:2px;}

/* Type cards */
.type-grid{display:grid;grid-template-columns:1fr;gap:8px;}
@media(min-width:400px){.type-grid{grid-template-columns:repeat(3,1fr);}}
.type-card{border:1.5px solid var(--border);border-radius:var(--r);padding:12px;cursor:pointer;transition:all 0.13s;background:var(--bg);text-align:center;}
.type-card:hover{border-color:var(--na);background:var(--na-lt);}
.type-card.sel{border-color:var(--na);background:var(--na-lt);}
.type-card-icon{font-size:22px;margin-bottom:5px;}
.type-card-name{font-size:13px;font-weight:700;color:var(--az);}
.type-card-desc{font-size:11px;color:var(--muted);margin-top:2px;}

/* Saved list */
.saved-bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.saved-select{flex:1;min-width:180px;}
.ctx-note{font-size:12px;color:var(--muted);padding:8px 10px;background:var(--surf);border-radius:6px;border-left:2.5px solid var(--na);margin-top:10px;}

/* ── CHECKLIST ─────────────────────────────────────────────────────── */
.items{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.irow{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--r);background:var(--surf);cursor:pointer;transition:background 0.12s;border:1.5px solid transparent;user-select:none;}
.irow:active{background:#ebe8e3;}
.irow.on{background:var(--vd-lt);border-color:var(--vd-md);}
.irow.na{opacity:0.3;cursor:default;pointer-events:none;}
.chk{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;background:white;transition:all 0.13s;}
.irow.on .chk{background:var(--vd);border-color:var(--vd);}
.ckm{display:none;width:5px;height:9px;border:2px solid white;border-top:none;border-left:none;transform:rotate(45deg) translate(-1px,-1px);}
.irow.on .ckm{display:block;}
.itxt{flex:1;font-size:13.5px;color:var(--text);line-height:1.45;}
.wp{font-size:10px;padding:2px 7px;border-radius:10px;flex-shrink:0;margin-top:3px;font-weight:700;white-space:nowrap;}
.wc{background:var(--sr-bg);color:var(--sr-fg);}
.wi{background:var(--sa-bg);color:var(--sa-fg);}
.wb{background:var(--sg-bg);color:var(--sg-fg);}
.nap{font-size:10px;padding:2px 7px;border-radius:10px;background:var(--surf);color:var(--muted);white-space:nowrap;}

.obs-lbl{font-size:11.5px;color:var(--az-md);font-weight:700;text-transform:uppercase;letter-spacing:0.4px;display:block;margin-bottom:5px;}
.area-bar-row{display:flex;align-items:center;gap:9px;padding:10px 0;border-top:1px solid var(--border);margin-top:10px;flex-wrap:wrap;}
.bar-lbl{font-size:12px;color:var(--muted);}
.bar-track{flex:1;min-width:80px;height:5px;background:var(--surf);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;transition:width 0.4s;}
.bar-pct{font-size:13px;font-weight:700;min-width:36px;text-align:right;}
.bar-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;}

/* ── BUTTONS ───────────────────────────────────────────────────────── */
.nav-row{display:flex;gap:9px;justify-content:space-between;margin-top:6px;flex-wrap:wrap;}
.nav-row-end{justify-content:flex-end;}
button{font-family:Arial,sans-serif;font-size:13.5px;font-weight:700;cursor:pointer;border-radius:var(--r);padding:10px 18px;border:1.5px solid var(--border);background:transparent;color:var(--text);transition:all 0.13s;-webkit-tap-highlight-color:transparent;}
button:active{opacity:0.8;}
button.pri{background:var(--na);color:white;border-color:var(--na);}
button.vd{background:var(--vd);color:white;border-color:var(--vd);}
button.ghost{color:var(--az-md);border-color:var(--border);}
button:disabled{opacity:0.4;cursor:not-allowed;}
.btn-sm{padding:7px 13px;font-size:12px;}
.btn-danger{color:var(--sr-ac);border-color:var(--sr-bg);background:var(--sr-bg);}

/* ── RESULT / REVISION ─────────────────────────────────────────────── */
.res-crit{border-radius:var(--r-lg);padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;border:1.5px solid;}
.res-circle{width:54px;height:54px;border-radius:50%;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 1px 6px rgba(0,0,0,0.08);}
.res-num{font-size:19px;font-weight:700;line-height:1;}
.res-pct{font-size:9px;color:var(--muted);}
.res-label{font-size:15px;font-weight:700;margin-bottom:2px;}
.res-desc{font-size:12px;opacity:0.82;line-height:1.5;}
.ag{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;}
@media(min-width:480px){.ag{grid-template-columns:repeat(3,1fr);}}
.ac{background:white;border:1px solid var(--border);border-radius:var(--r);padding:10px 11px;transition:box-shadow 0.13s;}.ac:hover{box-shadow:var(--shadow-md);}
.ac-name{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--az-md);margin-bottom:2px;}
.ac-pct{font-size:20px;font-weight:700;line-height:1;margin-bottom:2px;}
.ac-bar{height:3px;background:var(--surf);border-radius:2px;margin-bottom:3px;overflow:hidden;}
.ac-fill{height:100%;border-radius:2px;}
.ac-lbl{font-size:10px;font-weight:700;}
.ci-list{display:flex;flex-direction:column;gap:4px;}
.ci{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;background:var(--sr-bg);border-radius:6px;border-left:2.5px solid var(--sr-ac);}
.ci-area{font-size:10px;font-weight:700;color:var(--az-md);white-space:nowrap;padding-top:1px;min-width:55px;}
.ci-txt{font-size:12.5px;line-height:1.4;}
.fac-card{padding:10px 12px;background:var(--surf);border-radius:6px;border-left:2.5px solid var(--na);margin-bottom:5px;}
.fac-ttl{font-size:13px;font-weight:700;color:var(--az);margin-bottom:2px;}
.fac-body{font-size:12px;color:var(--az-md);line-height:1.5;}
.fac-edit{margin-top:6px;}
.fac-edit input{font-size:12px !important;padding:6px 9px !important;margin-bottom:4px;}
.fac-edit textarea{font-size:12px !important;padding:6px 9px !important;min-height:40px !important;}
.spin{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--na);border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}
.load-row{display:flex;align-items:center;gap:9px;padding:12px 0;font-size:12.5px;color:var(--muted);}
.val-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.val-row span{font-size:13px;color:var(--muted);}
.val-in{font-size:14px !important;font-weight:700 !important;color:var(--vd-dk) !important;text-align:right;width:110px !important;border-color:var(--vd-md) !important;}

/* Linea selector */
.linea-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:4px;}
@media(min-width:480px){.linea-grid{grid-template-columns:repeat(3,1fr);}}
.linea-card{border:1.5px solid var(--border);border-radius:var(--r);padding:11px 12px;cursor:pointer;transition:all 0.13s;background:var(--bg);}
.linea-card.sel-l1{border-color:#0369a1;background:#e0f2fe;}
.linea-card.sel-l2{border-color:var(--vd);background:var(--vd-lt);}
.linea-card.sel-l3{border-color:var(--na);background:var(--na-lt);}
.linea-card .lc-tag{font-size:10px;font-weight:700;margin-bottom:3px;}
.linea-card .lc-name{font-size:12px;font-weight:700;color:var(--az);margin-bottom:2px;}
.linea-card .lc-desc{font-size:11px;color:var(--az-md);}
.suggested-badge{font-size:10px;background:var(--az);color:white;padding:1px 6px;border-radius:10px;margin-left:6px;}

/* ── MODAL ─────────────────────────────────────────────────────────── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;align-items:flex-end;justify-content:center;}
.modal-bg.show{display:flex;}
@media(min-width:500px){.modal-bg{align-items:center;}}
.modal{background:white;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:20px 16px 28px;width:100%;max-height:85vh;overflow-y:auto;animation:slideUp 0.2s ease;}
@media(min-width:500px){.modal{border-radius:var(--r-xl);max-width:420px;}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-ttl{font-size:16px;font-weight:700;color:var(--az);margin-bottom:6px;}
.modal-sub{font-size:13px;color:var(--muted);margin-bottom:16px;}
.modal-list{display:flex;flex-direction:column;gap:6px;}
.modal-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:background 0.12s;}
.modal-item:hover{background:var(--surf);}
.modal-item-name{font-size:13.5px;font-weight:700;color:var(--az);}
.modal-item-meta{font-size:11.5px;color:var(--muted);}
.modal-item-score{font-size:13px;font-weight:700;padding:3px 9px;border-radius:10px;}
.modal-empty{text-align:center;padding:24px;color:var(--muted);font-size:13px;}
/* Pantalla de acceso */
#loginScreen{display:flex;position:fixed;inset:0;background:var(--az);z-index:999;align-items:center;justify-content:center;flex-direction:column;padding:24px;}
.login-box{background:white;border-radius:var(--r-xl);padding:32px 28px;width:100%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,0.2);}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:24px;justify-content:center;}
.login-mark{width:40px;height:40px;background:var(--na);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:white;}
.login-brand{font-size:18px;font-weight:700;color:var(--az);}
.login-brand b{color:var(--na);}
.login-title{font-size:15px;font-weight:700;color:var(--az);margin-bottom:6px;text-align:center;}
.login-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:20px;}
.login-error{font-size:12px;color:var(--sr-ac);text-align:center;margin-top:8px;min-height:18px;}
/* Modal detalle de área */
.area-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:300;align-items:center;justify-content:center;padding:16px;}
.area-modal-bg.show{display:flex;}
.area-modal{background:white;border-radius:var(--r-xl);width:100%;max-width:480px;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.18);animation:slideUp 0.2s ease;}
.area-modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:white;z-index:1;}
.area-modal-ttl{font-size:16px;font-weight:700;color:var(--az);display:flex;align-items:center;gap:8px;}
.area-modal-score{font-size:13px;font-weight:700;padding:3px 10px;border-radius:20px;}
.area-modal-close{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--surf);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--muted);flex-shrink:0;}
.area-modal-body{padding:14px 18px 18px;}
.area-modal-section{margin-bottom:14px;}
.area-modal-section-ttl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;}
.area-modal-item{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border-radius:6px;margin-bottom:5px;}
.area-modal-item.fail{background:var(--sr-bg);}
.area-modal-item.ok{background:var(--sg-bg);}
.area-modal-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:8px;flex-shrink:0;margin-top:2px;white-space:nowrap;}
.area-modal-item-txt{font-size:13px;line-height:1.4;}
.area-modal-obs{font-size:12.5px;color:var(--az-md);padding:8px 10px;background:var(--surf);border-radius:6px;border-left:2.5px solid var(--na);line-height:1.5;}
/* Exit modal */
.exit-options{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
.exit-opt{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--border);border-radius:var(--r);cursor:pointer;transition:all 0.13s;background:var(--bg);}
.exit-opt:hover{border-color:var(--na);background:var(--na-lt);}
.exit-opt.danger:hover{border-color:var(--sr-ac);background:var(--sr-bg);}
.exit-opt-icon{font-size:22px;flex-shrink:0;}
.exit-opt-ttl{font-size:14px;font-weight:700;color:var(--az);}
.exit-opt-desc{font-size:12px;color:var(--muted);}
/* Home view */
.home-header{background:var(--az);border-radius:var(--r-lg);padding:20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.home-logo{display:flex;align-items:center;gap:10px;}
.home-mark{width:36px;height:36px;background:var(--na);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:white;}
.home-brand{font-size:15px;font-weight:700;color:white;}
.home-brand b{color:var(--na);}
.home-tag{font-size:11px;color:rgba(255,255,255,0.4);margin-top:1px;}
.hist-card{background:white;border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all 0.13s;box-shadow:var(--shadow);}
.hist-card:hover{border-color:var(--na);box-shadow:var(--shadow-md);}
.hist-score{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.hist-info{flex:1;min-width:0;}
.hist-nombre{font-size:14px;font-weight:700;color:var(--az);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hist-meta{font-size:11.5px;color:var(--muted);margin-top:1px;}
.hist-linea{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;}
.hist-actions{display:flex;gap:6px;flex-shrink:0;}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-icon{font-size:36px;margin-bottom:10px;}
.empty-ttl{font-size:15px;font-weight:700;color:var(--az-md);margin-bottom:6px;}
.empty-desc{font-size:13px;line-height:1.6;}

/* Cuando está dentro de un iframe — sidebar oculto, layout ajustado */
.in-iframe .sidebar { display: none !important; }
.in-iframe .main-scroll { margin-left: 0 !important; }
.in-iframe #mainContent { max-width: 100% !important; }
