<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoproActiva — Administración</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Pantalla de login -->
<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <h2>CoproActiva</h2>
        <p>Ingresa tu clave de acceso</p>
        <input type="password" id="claveInput" placeholder="Clave">
        <button id="loginBtn">Ingresar</button>
        <div id="loginError" class="error-message"></div>
    </div>
</div>

<!-- App principal (oculta al inicio) -->
<div id="app" class="app" style="display: none;">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>CoproActiva</h2>
        </div>
        <nav>
            <button class="nav-btn active" data-modulo="crm">📋 CRM</button>
            <button class="nav-btn" data-modulo="diagnostico">🔍 Diagnóstico</button>
            <button class="nav-btn" data-modulo="flujo">📖 Flujo de trabajo</button>
        </nav>
    </aside>

    <!-- Contenido principal -->
    <main class="main-content">
        <div id="contentArea">Cargando...</div>
    </main>
</div>

<script src="app.js"></script>
</body>
</html>
